<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entities Gallery</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        color: #fff;
        font-family: sans-serif;
      }

      #viewport {
        position: fixed;
        inset: 0;
      }

      /* Overlay panels */
      #list,
      #controls {
        position: fixed;
        top: 0;
        bottom: 0;
        padding: 16px;
        overflow-y: auto;
        background: rgba(20, 20, 26, 0.85);
        backdrop-filter: blur(4px);
        z-index: 10;
      }

      /* Sidebar: card list of entities */
      #list {
        left: 0;
        width: 220px;
      }

      /* Right panel: live controls for the active entity */
      #controls {
        right: 0;
        width: 240px;
        display: none;
      }

      #list h2,
      #controls h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        opacity: 0.8;
      }

      #filter {
        margin-bottom: 12px;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 8px;
      }

      #filter a {
        display: inline-block;
        padding: 6px 10px;
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        opacity: 0.6;
        border-radius: 6px;
      }

      #filter a.active {
        opacity: 1;
        background: #4caf50;
        color: #111;
      }

      .card {
        display: block;
        width: 100%;
        text-align: left;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #fff;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .card:hover,
      .card.active {
        border-color: #4caf50;
      }

      .card:hover {
        transform: translateX(2px);
      }

      .card.active {
        background: #20202a;
      }

      .card h3 {
        margin: 0;
        font-size: 0.95rem;
      }

      .card p {
        margin: 2px 0 0;
        font-size: 0.8rem;
        opacity: 0.6;
      }

      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 0.6rem;
        vertical-align: middle;
        text-transform: uppercase;
        background: #2a2a33;
        opacity: 0.85;
      }

      .badge.primitive {
        color: #88cc55;
      }

      .badge.component {
        color: #33aaff;
      }

      .badge.ux {
        color: #ffaa33;
      }

      .badge.effect {
        color: #ff55aa;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 0.78rem;
        opacity: 0.65;
        margin-bottom: 3px;
      }

      .field input[type="number"],
      .field input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        background: #12121a;
        border: 1px solid #2a2a33;
        color: #fff;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 0.85rem;
      }

      .field input[type="color"] {
        width: 40px;
        height: 28px;
        border: 1px solid #2a2a33;
        border-radius: 6px;
        background: #12121a;
        padding: 0;
      }

      #copy-config {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 12px;
        padding: 7px 10px;
        background: #4caf50;
        border: none;
        border-radius: 6px;
        color: #111;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      #copy-config:hover {
        background: #5cbf60;
      }

      #copy-config:active {
        background: #3d9a40;
      }

      #copy-config.confirmed {
        background: #33aaff;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>

    <aside id="list">
      <h2>Entities</h2>
      <div id="filter">
        <a href="?" data-type="">All</a
        ><a href="?type=primitive" data-type="primitive">Primitives</a
        ><a href="?type=component" data-type="component">Components</a
        ><a href="?type=ux" data-type="ux">UX</a
        ><a href="?type=effect" data-type="effect">Effects</a>
      </div>
    </aside>

    <aside id="controls">
      <h2>Options</h2>
      <button id="copy-config" type="button">Copy config</button>
      <div id="controls-form"></div>
    </aside>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import * as THREE from "three";
      import { ENTRIES } from "engine/registry.js";

      // ------------------------------------------------------------------
      // Registry-driven UI. `ENTRIES` (engine/registry.js) is the single
      // source of truth: entries carry { category, key, label, desc, fn, opts }.
      // Control field types:
      //   number: <input type=number> with min/max/step
      //   color:  <input type=color>  (value hex, converts to int 0xRRGGBB)
      //   vector: <input type=text>   (comma-separated numbers -> array)
      //   text:   <input type=text>   (free-form string)
      // Filter links swap the visible card list in-place (replaceState, no
      // reload), so the simulation keeps running across filter changes.
      // ------------------------------------------------------------------

      const CATEGORIES = {
        primitive: "Primitives",
        component: "Components",
        ux: "UX",
        effect: "Effects",
      };

      // Read ?type= from the URL; empty/unknown => combined All view.
      let filterType = new URLSearchParams(location.search).get("type") ?? "";
      if (!CATEGORIES[filterType]) filterType = "";

      const sim = new Simulation({
        container: document.getElementById("viewport"),
        clearColor: 0x111116,
        enableShadows: true,
        gravity: [0, 0, 0],
      });

      // ------------------------------------------------------------------
      // Orbit camera around a target. Drag to rotate, wheel to zoom. The
      // camera is driven directly from a spherical (theta/phi/distance) state
      // so the gallery view stays stable while entities are rebuilt.
      // ------------------------------------------------------------------
      function createOrbitControls(sim, target) {
        // Initial vantage point (world space), converted to spherical coords.
        const dir = new THREE.Vector3(0, 5, 8).sub(target);
        const len = dir.length();
        const state = {
          theta: Math.atan2(dir.x, dir.z),
          phi: Math.acos(dir.y / len),
          distance: len,
        };

        const apply = () => {
          sim.camera.position.set(
            target.x +
              state.distance * Math.sin(state.phi) * Math.sin(state.theta),
            target.y + state.distance * Math.cos(state.phi),
            target.z +
              state.distance * Math.sin(state.phi) * Math.cos(state.theta),
          );
          sim.camera.lookAt(target);
        };

        const el = sim.container;
        let dragging = false;
        let lastX = 0;
        let lastY = 0;

        el.addEventListener("pointerdown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          el.setPointerCapture(e.pointerId);
        });
        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          state.theta -= dx * 0.005;
          state.phi = Math.max(
            0.05,
            Math.min(Math.PI - 0.05, state.phi - dy * 0.005),
          );
          apply();
        });
        const endDrag = (e) => {
          dragging = false;
          el.releasePointerCapture(e.pointerId);
        };
        el.addEventListener("pointerup", endDrag);
        el.addEventListener("pointercancel", endDrag);
        el.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            state.distance = Math.max(
              2,
              Math.min(40, state.distance * (e.deltaY > 0 ? 1.1 : 0.9)),
            );
            apply();
          },
          { passive: false },
        );

        apply();
      }

      createOrbitControls(sim, new THREE.Vector3(0, 1, 0));

      const listEl = document.getElementById("list");
      const controlsPanel = document.getElementById("controls");
      const controlsForm = document.getElementById("controls-form");

      const PARSERS = {
        number: (raw) => Number(raw),
        color: (raw) => parseInt(String(raw).replace(/^#/, ""), 16), // #rrggbb or 0xrrggbb -> number
        vector: (raw) =>
          String(raw)
            .split(",")
            .map((s) => Number(s.trim()))
            .filter((n) => Number.isFinite(n)),
      };
      const parseValue = (spec, raw) => PARSERS[spec.type]?.(raw) ?? raw;

      const SERIALIZERS = {
        color: (v) => "#" + Number(v).toString(16).padStart(6, "0"),
        vector: (v) => (Array.isArray(v) ? v.join(", ") : String(v)),
      };
      const serializeValue = (spec, value) => SERIALIZERS[spec.type]?.(value) ?? value;

      let active = null; // { entry, values }
      let liveEntity = null;

      const INPUT_TYPES = { color: "color", vector: "text", text: "text" };

      function buildControls() {
        controlsForm.innerHTML = "";
        if (active.entry.controls) {
          active.entry.controls(controlsForm, () => liveEntity);
          return;
        }
        for (const spec of active.entry.opts ?? []) {
          const field = document.createElement("div");
          field.className = "field";

          const label = document.createElement("label");
          label.textContent = spec.label;

          const input = document.createElement("input");
          input.type = INPUT_TYPES[spec.type] ?? "number";
          input.value = serializeValue(spec, active.values[spec.key]);
          if (input.type === "number")
            Object.assign(input, { min: spec.min, max: spec.max, step: spec.step });
          input.addEventListener("input", () => {
            active.values[spec.key] = parseValue(spec, input.value);
            rebuild();
          });

          field.appendChild(label);
          field.appendChild(input);
          controlsForm.appendChild(field);
        }
      }

      function setActive(entry) {
        if (active?.entry === entry) return;
        active = {
          entry,
          values: Object.fromEntries(
            (entry.opts ?? []).map((s) => [s.key, parseValue(s, s.default)]),
          ),
        };

        for (const card of listEl.querySelectorAll(".card")) {
          card.classList.toggle("active", card.dataset.key === entry.key);
        }

        buildControls();
        controlsPanel.classList.add("open");
        rebuild();
      }

      function rebuild() {
        if (liveEntity) sim.removeEntity(liveEntity);
        if (liveEntity?.dispose) liveEntity.dispose();
        liveEntity = null;
        if (!active) return;
        liveEntity = active.entry.fn(sim, { ...active.values });
      }

      function clearSelection() {
        active = null;
        controlsPanel.classList.remove("open");
        rebuild();
      }

      // Serialize the active entity's current control values into a concise,
      // LLM-friendly format: one key=value per line, starting with the entity.
      function serializeConfig() {
        if (!active) return "";
        const lines = [`entity=${active.entry.key}`];
        for (const spec of active.entry.opts ?? []) {
          let out = serializeValue(spec, active.values[spec.key]);
          if (spec.type === "vector") out = `[${out}]`;
          lines.push(`${spec.key}=${out}`);
        }
        return lines.join("\n");
      }

      const copyBtn = document.getElementById("copy-config");
      let copyTimer = null;
      copyBtn.addEventListener("click", () => {
        navigator.clipboard
          .writeText(serializeConfig())
          .then(() => {
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("confirmed");
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
              copyBtn.textContent = "Copy config";
              copyBtn.classList.remove("confirmed");
            }, 1500);
          })
          .catch(() => {});
      });

      function buildCard(entry, withBadge) {
        const card = document.createElement("button");
        card.className = "card";
        card.dataset.key = entry.key;

        const title = document.createElement("h3");
        title.textContent = entry.label;
        if (withBadge) {
          const badge = document.createElement("span");
          badge.className = `badge ${entry.category}`;
          badge.textContent = entry.category;
          title.appendChild(badge);
        }

        const desc = document.createElement("p");
        desc.textContent = entry.desc;

        card.append(title, desc);
        card.addEventListener("click", () => setActive(entry));
        return card;
      }

      // Populate the side list (tagged by category in the All view) and
      // auto-select the first entry so the view is never empty.
      function renderList() {
        for (const card of [...listEl.querySelectorAll(".card")]) card.remove();
        const visible =
          filterType === ""
            ? ENTRIES
            : ENTRIES.filter((e) => e.category === filterType);
        for (const entry of visible)
          listEl.appendChild(buildCard(entry, filterType === ""));
        if (visible.length) setActive(visible[0]);
        else clearSelection();
      }

      // Update the URL in-place (replaceState) so the browser back button
      // returns to index.html instead of cycling through every filter.
      function setFilter(next) {
        if (next === filterType) return;
        filterType = next;
        history.replaceState(null, "", next ? `?type=${next}` : location.pathname);
        for (const link of document.querySelectorAll("#filter a")) {
          link.classList.toggle("active", link.dataset.type === next);
        }
        renderList();
      }

      for (const link of document.querySelectorAll("#filter a")) {
        link.classList.toggle("active", link.dataset.type === filterType);
        link.addEventListener("click", (e) => {
          e.preventDefault();
          setFilter(link.dataset.type);
        });
      }

      renderList();

      sim.start();
    </script>
  </body>
</html>
