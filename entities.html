<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entities Gallery</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        color: #fff;
        font-family: sans-serif;
      }

      #viewport {
        position: fixed;
        inset: 0;
      }

      /* Sidebar: card list of entities */
      #list {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 220px;
        padding: 16px;
        overflow-y: auto;
        background: rgba(20, 20, 26, 0.85);
        backdrop-filter: blur(4px);
        z-index: 10;
      }

      #list h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        opacity: 0.8;
      }

      #filter {
        width: 100%;
        margin-bottom: 12px;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 8px;
      }

      #filter a {
        display: inline-block;
        padding: 6px 10px;
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        opacity: 0.6;
        border-radius: 6px;
      }

      #filter a.active {
        opacity: 1;
        background: #4caf50;
        color: #111;
      }

      .card {
        display: block;
        width: 100%;
        text-align: left;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #fff;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .card:hover {
        border-color: #4caf50;
        transform: translateX(2px);
      }

      .card.active {
        border-color: #4caf50;
        background: #20202a;
      }

      .card h3 {
        margin: 0;
        font-size: 0.95rem;
      }

      .card p {
        margin: 2px 0 0;
        font-size: 0.8rem;
        opacity: 0.6;
      }

      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 0.6rem;
        vertical-align: middle;
        text-transform: uppercase;
        background: #2a2a33;
        opacity: 0.85;
      }

      .badge.primitive {
        color: #88cc55;
      }

      .badge.component {
        color: #33aaff;
      }

      /* Right panel: live controls for the active entity */
      #controls {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 240px;
        padding: 16px;
        overflow-y: auto;
        background: rgba(20, 20, 26, 0.85);
        backdrop-filter: blur(4px);
        z-index: 10;
        display: none;
      }

      #controls.open {
        display: block;
      }

      #controls h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        opacity: 0.8;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 0.78rem;
        opacity: 0.65;
        margin-bottom: 3px;
      }

      .field input[type="number"],
      .field input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        background: #12121a;
        border: 1px solid #2a2a33;
        color: #fff;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 0.85rem;
      }

      .field input[type="color"] {
        width: 40px;
        height: 28px;
        border: 1px solid #2a2a33;
        border-radius: 6px;
        background: #12121a;
        padding: 0;
      }

    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>

    <aside id="list">
      <h2>Entities</h2>
      <div id="filter">
        <a href="?" data-type="">All</a
        ><a href="?type=primitive" data-type="primitive">Primitives</a
        ><a href="?type=component" data-type="component">Components</a>
      </div>
    </aside>

    <aside id="controls">
      <h2>Options</h2>
      <div id="controls-form"></div>
    </aside>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import { ENTRIES } from "engine/registry.js";

      // ------------------------------------------------------------------
      // Registry-driven UI. `ENTRIES` (engine/registry.js) is the single
      // source of truth: entries carry { category, key, label, desc, fn, opts }.
      // Control field types:
      //   number: <input type=number> with min/max/step
      //   color:  <input type=color>  (value hex, converts to int 0xRRGGBB)
      //   vector: <input type=text>   (comma-separated numbers -> array)
      // ------------------------------------------------------------------

      const CATEGORIES = { primitive: "Primitives", component: "Components" };

      // Read ?type= from the URL; empty/unknown => combined All view.
      const urlType = new URLSearchParams(location.search).get("type");
      const type = CATEGORIES[urlType] ? urlType : "";
      const entries =
        type === "" ? ENTRIES : ENTRIES.filter((e) => e.category === type);

      const sim = new Simulation({
        container: document.getElementById("viewport"),
        clearColor: 0x111116,
        enableShadows: true,
        gravity: [0, 0, 0],
      });
      sim.camera.position.set(0, 5, 8);
      sim.camera.lookAt(0, 1, 0);

      const listEl = document.getElementById("list");
      const controlsPanel = document.getElementById("controls");
      const controlsForm = document.getElementById("controls-form");

      // Highlight the active filter link. Intercept clicks so we update the
      // URL in-place (replaceState) instead of pushing a new history entry;
      // otherwise the browser back button cycles through every filter you
      // touched instead of returning to index.html.
      for (const link of document.querySelectorAll("#filter a")) {
        link.classList.toggle("active", link.dataset.type === type);
        link.addEventListener("click", (e) => {
          e.preventDefault();
          if (link.dataset.type === type) return;
          history.replaceState(null, "", link.getAttribute("href"));
          location.reload();
        });
      }

      let active = null; // { entry, values }
      let liveEntity = null;

      function parseValue(spec, raw) {
        switch (spec.type) {
          case "number":
            return Number(raw);
          case "color":
            return parseInt(raw.slice(1), 16); // "#rrggbb" -> 0xrrggbb
          case "vector":
            return String(raw)
              .split(",")
              .map((s) => Number(s.trim()))
              .filter((n) => Number.isFinite(n));
          default:
            return raw;
        }
      }

      function serializeValue(spec, value) {
        switch (spec.type) {
          case "color":
            return "#" + Number(value).toString(16).padStart(6, "0");
          case "vector":
            return Array.isArray(value) ? value.join(", ") : String(value);
          default:
            return value;
        }
      }

      function buildControls() {
        controlsForm.innerHTML = "";
        for (const spec of active.entry.opts) {
          const field = document.createElement("div");
          field.className = "field";
          const scaled = serializeValue(spec, active.values[spec.key]);

          let input;
          if (spec.type === "color") {
            input = document.createElement("input");
            input.type = "color";
            input.value = scaled;
          } else if (spec.type === "vector") {
            input = document.createElement("input");
            input.type = "text";
            input.value = scaled;
          } else {
            input = document.createElement("input");
            input.type = "number";
            input.value = scaled;
            input.min = spec.min;
            input.max = spec.max;
            input.step = spec.step;
          }

          const label = document.createElement("label");
          label.textContent = spec.label;

          input.addEventListener("input", () => {
            active.values[spec.key] = parseValue(spec, input.value);
            rebuild();
          });

          field.appendChild(label);
          field.appendChild(input);
          controlsForm.appendChild(field);
        }
      }

      function setActive(entry) {
        if (active && active.entry.key === entry.key) return;
        active = {
          entry,
          values: Object.fromEntries(entry.opts.map((s) => [s.key, s.default])),
        };

        for (const card of listEl.querySelectorAll(".card")) {
          card.classList.toggle("active", card.dataset.key === entry.key);
        }

        buildControls();
        controlsPanel.classList.add("open");
        rebuild();
      }

      function rebuild() {
        if (liveEntity) sim.removeEntity(liveEntity);
        liveEntity = null;
        if (!active) return;
        liveEntity = active.entry.fn(sim, { ...active.values });
      }

      // Populate the side list (tagged by category in the All view)
      for (const entry of entries) {
        const card = document.createElement("button");
        card.className = "card";
        card.dataset.key = entry.key;
        const tag =
          type === ""
            ? `<span class="badge ${entry.category}">${entry.category}</span>`
            : "";
        card.innerHTML =
          `<h3>${entry.label}${tag}</h3><p>${entry.desc}</p>`;
        card.addEventListener("click", () => setActive(entry));
        listEl.appendChild(card);
      }

      // Auto-select the first entry so the view is never empty on load.
      if (entries.length) setActive(entries[0]);

      sim.start();
    </script>
  </body>
</html>
