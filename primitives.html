<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primitives Gallery</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        color: #fff;
        font-family: sans-serif;
      }

      #viewport {
        position: fixed;
        inset: 0;
      }

      /* Sidebar: card list of primitives */
      #list {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 220px;
        padding: 16px;
        overflow-y: auto;
        background: rgba(20, 20, 26, 0.85);
        backdrop-filter: blur(4px);
        z-index: 10;
      }

      #list h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        opacity: 0.8;
      }

      .card {
        display: block;
        width: 100%;
        text-align: left;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #fff;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .card:hover {
        border-color: #4caf50;
        transform: translateX(2px);
      }

      .card.active {
        border-color: #4caf50;
        background: #20202a;
      }

      .card h3 {
        margin: 0;
        font-size: 0.95rem;
      }

      .card p {
        margin: 2px 0 0;
        font-size: 0.8rem;
        opacity: 0.6;
      }

      /* Right panel: live controls for the active primitive */
      #controls {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 240px;
        padding: 16px;
        overflow-y: auto;
        background: rgba(20, 20, 26, 0.85);
        backdrop-filter: blur(4px);
        z-index: 10;
        display: none;
      }

      #controls.open {
        display: block;
      }

      #controls h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        opacity: 0.8;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 0.78rem;
        opacity: 0.65;
        margin-bottom: 3px;
      }

      .field input[type="number"],
      .field input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        background: #12121a;
        border: 1px solid #2a2a33;
        color: #fff;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 0.85rem;
      }

      .field input[type="color"] {
        width: 40px;
        height: 28px;
        border: 1px solid #2a2a33;
        border-radius: 6px;
        background: #12121a;
        padding: 0;
      }

    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>

    <aside id="list">
      <h2>Primitives</h2>
    </aside>

    <aside id="controls">
      <h2>Options</h2>
      <div id="controls-form"></div>
    </aside>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createCylinder,
        createPlayer,
      } from "engine/primitives.js";

      // ------------------------------------------------------------------
      // Generic schema.
      // New primitives just add an entry here - no custom controls needed.
      // Control field types:
      //   number: <input type=number> with min/max/step
      //   color:  <input type=color>  (value hex, converts to int 0xRRGGBB)
      //   vector: <input type=text>   (comma-separated numbers -> array)
      // ------------------------------------------------------------------
      const PRIMITIVES = [
        {
          key: "ground",
          label: "Ground",
          desc: "Static planar platform",
          fn: createGround,
          opts: [
            { key: "size", label: "Size", type: "number", default: 6, min: 1, max: 30, step: 1 },
            { key: "height", label: "Height", type: "number", default: 1, min: 0.2, max: 5, step: 0.1 },
            { key: "color", label: "Color", type: "color", default: "0x222233" },
            { key: "friction", label: "Friction", type: "number", default: 0.3, min: 0, max: 1, step: 0.05 },
            { key: "position", label: "Position [x,y,z]", type: "vector", default: [0, 0, 0] },
          ],
        },
        {
          key: "box",
          label: "Box",
          desc: "Interactable cube",
          fn: createBox,
          opts: [
            { key: "size", label: "Size", type: "number", default: 1, min: 0.1, max: 5, step: 0.1 },
            { key: "color", label: "Color", type: "color", default: "0xff5533" },
            { key: "mass", label: "Mass", type: "number", default: 1, min: 0, max: 50, step: 1 },
            { key: "friction", label: "Friction", type: "number", default: 0.3, min: 0, max: 1, step: 0.05 },
            { key: "position", label: "Position [x,y,z]", type: "vector", default: [0, 0, 0] },
            { key: "rotation", label: "Rotation [x,y,z]", type: "vector", default: [0, 0, 0] },
          ],
        },
        {
          key: "sphere",
          label: "Sphere",
          desc: "Rollable ball",
          fn: createSphere,
          opts: [
            { key: "radius", label: "Radius", type: "number", default: 0.5, min: 0.1, max: 5, step: 0.1 },
            { key: "color", label: "Color", type: "color", default: "0x33aaff" },
            { key: "mass", label: "Mass", type: "number", default: 1, min: 0, max: 50, step: 1 },
            { key: "friction", label: "Friction", type: "number", default: 0.3, min: 0, max: 1, step: 0.05 },
            { key: "position", label: "Position [x,y,z]", type: "vector", default: [0, 0, 0] },
          ],
        },
        {
          key: "cylinder",
          label: "Cylinder",
          desc: "Tapered column",
          fn: createCylinder,
          opts: [
            { key: "radiusTop", label: "Radius Top", type: "number", default: 1, min: 0, max: 5, step: 0.1 },
            { key: "radiusBottom", label: "Radius Bottom", type: "number", default: 1, min: 0, max: 5, step: 0.1 },
            { key: "height", label: "Height", type: "number", default: 1, min: 0.1, max: 5, step: 0.1 },
            { key: "radialSegments", label: "Radial Segments", type: "number", default: 8, min: 3, max: 32, step: 1 },
            { key: "color", label: "Color", type: "color", default: "0x88cc55" },
            { key: "mass", label: "Mass", type: "number", default: 1, min: 0, max: 50, step: 1 },
            { key: "friction", label: "Friction", type: "number", default: 0.3, min: 0, max: 1, step: 0.05 },
            { key: "position", label: "Position [x,y,z]", type: "vector", default: [0, 0, 0] },
            { key: "rotation", label: "Rotation [x,y,z]", type: "vector", default: [0, 0, 0] },
          ],
        },
        {
          key: "player",
          label: "Player",
          desc: "Keyboard-controlled (WASD/Space)",
          fn: createPlayer,
          opts: [
            { key: "size", label: "Size", type: "number", default: 1, min: 0.1, max: 5, step: 0.1 },
            { key: "color", label: "Color", type: "color", default: "0x22ff88" },
            { key: "mass", label: "Mass", type: "number", default: 5, min: 0, max: 50, step: 1 },
            { key: "speed", label: "Speed", type: "number", default: 10, min: 1, max: 40, step: 1 },
            { key: "jumpForce", label: "Jump Force", type: "number", default: 8, min: 1, max: 30, step: 1 },
            { key: "position", label: "Position [x,y,z]", type: "vector", default: [0, 0, 0] },
          ],
        },
      ];

      // ------------------------------------------------------------------
      // Build the simulation & UI
      // ------------------------------------------------------------------
      const sim = new Simulation({
        container: document.getElementById("viewport"),
        clearColor: 0x111116,
        enableShadows: true,
        gravity: [0, 0, 0],
      });
      sim.camera.position.set(0, 5, 8);
      sim.camera.lookAt(0, 1, 0);

      const listEl = document.getElementById("list");
      const controlsPanel = document.getElementById("controls");
      const controlsForm = document.getElementById("controls-form");

      let active = null; // { entry, values }
      let liveEntity = null;

      function parseValue(spec, raw) {
        switch (spec.type) {
          case "number":
            return Number(raw);
          case "color":
            return parseInt(raw.slice(1), 16); // "#rrggbb" -> 0xrrggbb
          case "vector":
            return String(raw)
              .split(",")
              .map((s) => Number(s.trim()))
              .filter((n) => Number.isFinite(n));
          default:
            return raw;
        }
      }

      function serializeValue(spec, value) {
        switch (spec.type) {
          case "color":
            return "#" + Number(value).toString(16).padStart(6, "0");
          case "vector":
            return Array.isArray(value) ? value.join(", ") : String(value);
          default:
            return value;
        }
      }

      function buildControls() {
        controlsForm.innerHTML = "";
        for (const spec of active.entry.opts) {
          const field = document.createElement("div");
          field.className = "field";
          const scaled = serializeValue(spec, active.values[spec.key]);

          let input;
          if (spec.type === "color") {
            input = document.createElement("input");
            input.type = "color";
            input.value = scaled;
          } else if (spec.type === "vector") {
            input = document.createElement("input");
            input.type = "text";
            input.value = scaled;
          } else {
            input = document.createElement("input");
            input.type = "number";
            input.value = scaled;
            input.min = spec.min;
            input.max = spec.max;
            input.step = spec.step;
          }

          const label = document.createElement("label");
          label.textContent = spec.label;

          input.addEventListener("input", () => {
            active.values[spec.key] = parseValue(spec, input.value);
            rebuild();
          });

          field.appendChild(label);
          field.appendChild(input);
          controlsForm.appendChild(field);
        }
      }

      function setActive(entry) {
        if (active && active.entry.key === entry.key) return;
        active = {
          entry,
          values: Object.fromEntries(entry.opts.map((s) => [s.key, s.default])),
        };

        for (const card of listEl.querySelectorAll(".card")) {
          card.classList.toggle("active", card.dataset.key === entry.key);
        }

        buildControls();
        controlsPanel.classList.add("open");
        rebuild();
      }

      function rebuild() {
        if (liveEntity) sim.removeEntity(liveEntity);
        liveEntity = null;
        if (!active) return;
        liveEntity = active.entry.fn(sim, { ...active.values });
      }

      // Populate the side list
      for (const entry of PRIMITIVES) {
        const card = document.createElement("button");
        card.className = "card";
        card.dataset.key = entry.key;
        card.innerHTML =
          "<h3>" + entry.label + "</h3><p>" + entry.desc + "</p>";
        card.addEventListener("click", () => setActive(entry));
        listEl.appendChild(card);
      }

      sim.start();
    </script>
  </body>
</html>
