<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Train</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #ui p {
        margin: 4px 0 0;
      }
      #speed {
        font-size: 0.85rem;
        opacity: 0.7;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.9">Infinite Train</h1>
      <p id="speed" style="font-size: 0.85rem; opacity: 0.7">0 km/h</p>
      <p style="margin: 8px 0 0; font-size: 0.85rem; opacity: 0.5">
        W / &#8593; accelerate &#8212; S / &#8595; brake
      </p>
    </div>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createRailSegment,
        createTrain,
        InfiniteTrack,
        TrackFollower,
      } from "engine/components.js";
      import * as THREE from "three";

      // Deterministic PRNG per segment index (mulberry32).
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function curveFor(index) {
        const rng = mulberry32(index);
        const r = rng();
        return r < 0.45 ? 0 : r < 0.75 ? 60 : -60;
      }

      // TrackWorld: manages the infinite train loop via reusable InfiniteTrack and TrackFollower.
      class TrackWorld {
        constructor(sim) {
          this.sim = sim;
          this.SEG = 50;
          this.COUNT = 20;
          this.speed = 0;
          this.MAX_SPEED = 40;
          this.ACCEL = 18;
          this.BRAKE = 45;

          this.track = new InfiniteTrack(sim, {
            segmentLength: this.SEG,
            windowCount: this.COUNT,
            curveGenerator: curveFor,
            segmentFactory: createRailSegment,
          });

          this.train = createTrain(sim);
          this.follower = new TrackFollower(this.track, this.train.mesh, {
            yOffset: -0.05,
          });

          this.keys = new Set();
          this.onKeyDown = (e) => this.keys.add(e.code);
          this.onKeyUp = (e) => this.keys.delete(e.code);
          window.addEventListener("keydown", this.onKeyDown);
          window.addEventListener("keyup", this.onKeyUp);

          this.firstFrame = true;
          this.UP = new THREE.Vector3(0, 1, 0);

          sim.addEntity(null, null, (dt) => this.update(dt));
        }

        update(dt) {
          if (dt > 0.1) dt = 0.1;
          const accel = this.keys.has("KeyW") || this.keys.has("ArrowUp") ? 1 : 0;
          const brake = this.keys.has("KeyS") || this.keys.has("ArrowDown") ? 1 : 0;
          this.speed += (accel * this.ACCEL - brake * this.BRAKE) * dt;
          this.speed = Math.max(0, Math.min(this.MAX_SPEED, this.speed));

          this.follower.speed = this.speed;
          this.follower.update(dt);

          while (this.follower.s >= this.SEG) {
            this.follower.s -= this.SEG;
            this.track.advance();
            this.follower.update(0);
          }
          if (this.follower.s < 0) {
            this.follower.s = 0;
            this.speed = 0;
          }

          const pose = this.follower.currentPose;
          if (!pose) return;

          document.getElementById("speed").textContent =
            Math.round(this.speed * 3.6) + " km/h";

          // Driver's-eye camera, mounted just above the engine nose.
          const cab = pose.position
            .clone()
            .add(new THREE.Vector3(0, 3.2, 0))
            .addScaledVector(pose.forward, 4.0);
          const look = cab
            .clone()
            .addScaledVector(pose.forward, 50)
            .addScaledVector(this.UP, 0.6);

          if (this.firstFrame) {
            this.sim.camera.position.copy(cab);
            this.firstFrame = false;
          } else {
            const k = 1 - Math.exp(-dt * 3);
            this.sim.camera.position.lerp(cab, k);
          }
          this.sim.camera.lookAt(look);
        }
      }

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x87ceeb,
        enableShadows: true,
      });

      function setup(sim) {
        // Slight directional light so the rails/trees read clearly.
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(5, 12, 6);
        sim.scene.add(dir);
        new TrackWorld(sim);
      }

      setup(sim);
      sim.start();
    </script>
  </body>
</html>
