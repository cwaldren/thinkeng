<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moasis</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
        display: none;
      }
      #side {
        position: absolute;
        top: 78px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        color: #fff;
        pointer-events: auto;
        font-size: 0.9rem;
        display: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">Moasis</h1>
      <div
        id="mowed-counter"
        style="
          margin: 2px 0 0;
          font-size: 0.85rem;
          opacity: 0;
          transform: translateX(-24px);
          transition:
            opacity 0.6s ease,
            transform 0.6s ease;
        "
      >
        <span id="mowed-count">0</span> <span id="mowed-label">dandelions</span>
      </div>
      <p
        id="hint"
        style="
          display: flex;
          gap: 0.4em;
          margin: 4px 0 0;
          font-size: 0.85rem;
          opacity: 0.5;
        "
      >
        <span id="hint-move">W/A/S/D or arrow keys to move.</span>
        <span id="hint-orbit">Space toggles orbit camera.</span>
      </p>
      <div
        id="fov-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Field of View
          <span id="fov-value" style="font-weight: bold">90°</span>
        </div>
        <input
          type="range"
          id="fov-slider"
          min="30"
          max="100"
          step="1"
          value="90"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="gaze-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Gaze <span id="gaze-value">-30°</span>
        </div>
        <input
          type="range"
          id="gaze-slider"
          min="-30"
          max="30"
          step="1"
          value="-30"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="offset-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Forward Offset <span id="offset-value">-0.45</span>
        </div>
        <input
          type="range"
          id="offset-slider"
          min="-1"
          max="2"
          step="0.05"
          value="-0.45"
          style="width: 180px; vertical-align: middle"
        />
      </div>
    </div>

    <div id="side">
      <label
        id="creatures-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="creatures-checkbox" checked />
        Creatures
      </label>
      <label
        id="sandbox-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="sandbox-checkbox" />
        Sandbox
      </label>
      <div id="sandbox-panel" style="display: none">
        <div
          id="sun-control"
          style="margin-top: 8px; font-size: 0.9rem; pointer-events: auto"
        >
          <label
            id="manual-time-toggle"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 6px;
              font-size: 0.9rem;
              pointer-events: auto;
              cursor: pointer;
            "
          >
            <input type="checkbox" id="manual-time-checkbox" />
            Manual time (SPOILERS!!!)
          </label>
          <div style="opacity: 0.8; margin-bottom: 4px">
            Sun <span id="sun-clock">12:00</span>
            <span id="sun-phase" style="opacity: 0.6; margin-left: 4px"
              >noon</span
            >
          </div>
          <input
            type="range"
            id="sun-slider"
            min="0"
            max="24"
            step="0.05"
            value="12"
            style="width: 180px; vertical-align: middle"
          />
        </div>
        <div
          id="sun-angle-control"
          style="
            display: none;
            margin-top: 8px;
            font-size: 0.9rem;
            pointer-events: auto;
          "
        >
          <div
            style="
              opacity: 0.6;
              font-family: monospace;
              font-size: 0.75rem;
              margin-top: 4px;
            "
          >
            Sun pos <span id="sun-pos">—</span> · dir
            <span id="sun-dir">—</span>
          </div>
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Sun azimuth
            <span id="sun-az-value" style="font-weight: bold">90°</span>
          </div>
          <input
            type="range"
            id="sun-az-slider"
            min="0"
            max="360"
            step="1"
            value="90"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Sun elevation
            <span id="sun-el-value" style="font-weight: bold">30°</span>
          </div>
          <input
            type="range"
            id="sun-el-slider"
            min="0"
            max="89"
            step="1"
            value="30"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Earth angle above horizon
            <span id="earth-angle-value" style="font-weight: bold">6°</span>
          </div>
          <input
            type="range"
            id="earth-angle-slider"
            min="0"
            max="45"
            step="1"
            value="6"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Earth distance
            <span id="earth-dist-value" style="font-weight: bold">157</span>
          </div>
          <input
            type="range"
            id="earth-dist-slider"
            min="50"
            max="250"
            step="1"
            value="157"
            style="width: 180px; vertical-align: middle"
          />
          <button
            id="copy-config"
            style="
              margin-top: 10px;
              padding: 4px 12px;
              font-size: 0.85rem;
              cursor: pointer;
            "
          >
            Copy config
          </button>
        </div>
        <div
          id="grass-control"
          style="margin-top: 12px; font-size: 0.9rem; pointer-events: auto"
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Cut Height
            <span id="cut-height-value" style="font-weight: bold">0.20m</span>
          </div>
          <input
            type="range"
            id="cut-height-slider"
            min="0.01"
            max="0.5"
            step="0.01"
            value="0.2"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Grow Rate
            <span id="grow-rate-value" style="font-weight: bold">0.005</span>
          </div>
          <input
            type="range"
            id="grow-rate-slider"
            min="0.001"
            max="0.1"
            step="0.001"
            value="0.005"
            style="width: 180px; vertical-align: middle"
          />
        </div>
        <div
          id="density-control"
          style="margin-top: 12px; font-size: 0.9rem; pointer-events: auto"
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Grass Density <span id="density-total"></span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center">
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              Grid cols
              <input
                type="number"
                id="density-cols"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              rows
              <input
                type="number"
                id="density-rows"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              per patch
              <input
                type="number"
                id="density-n"
                min="1"
                max="10000"
                step="50"
                value="2000"
                style="width: 80px"
              />
            </label>
          </div>
          <button
            id="density-apply"
            style="
              margin-top: 8px;
              padding: 4px 12px;
              font-size: 0.85rem;
              cursor: pointer;
            "
          >
            Apply (reload)
          </button>
        </div>
      </div>
    </div>
<script type="module">
      import { Simulation } from "engine/core.js";
      import { InputManager } from "engine/inputManager.js";
      import { createContext } from "./mow/context.js";
      import { buildEnvironment } from "./mow/environment.js";
      import { buildCinematics } from "./mow/cinematics.js";
      import { buildCreatures } from "./mow/creatures.js";
      import { buildMower } from "./mow/mower.js";
      import { buildUI } from "./mow/ui.js";

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x000000,
        enableShadows: true,
      });

      // Shared context: cross-module mutable state + temps, built once.
      const ctx = createContext(sim);

      // Shared action-based input manager; the game registers named actions
      // / axes with it and queries by name (see mower.js).
      ctx.input = new InputManager();

      // --- Field-of-view slider: adjust the camera zoom live ---
      const fovSlider = document.getElementById("fov-slider");
      const fovValueEl = document.getElementById("fov-value");
      const applyFov = () => {
        sim.camera.fov = parseFloat(fovSlider.value);
        sim.camera.updateProjectionMatrix();
        fovValueEl.textContent = `${Math.round(sim.camera.fov)}°`;
      };
      fovSlider.addEventListener("input", applyFov);
      applyFov();
      ctx.fovSlider = fovSlider;

      // --- Gaze slider: first-person camera pitch (look down / look up) ---
      const gazeSlider = document.getElementById("gaze-slider");
      const gazeValueEl = document.getElementById("gaze-value");
      const applyGaze = () => {
        ctx.gazePitch = parseFloat(gazeSlider.value) * (Math.PI / 180);
        gazeValueEl.textContent = `${Math.round(gazeSlider.value)}°`;
      };
      gazeSlider.addEventListener("input", applyGaze);
      applyGaze();

      // --- Forward-offset slider: where on the local +Z axis the first-person
      // camera floats, vs the front of the mower ---
      const offsetSlider = document.getElementById("offset-slider");
      const offsetValueEl = document.getElementById("offset-value");
      const applyOffset = () => {
        ctx.fwdOffset = parseFloat(offsetSlider.value);
        offsetValueEl.textContent = ctx.fwdOffset.toFixed(2);
      };
      offsetSlider.addEventListener("input", applyOffset);
      applyOffset();

      // --- Mobile / desktop UI bootstrap ---
      if (ctx.isMobile) {
        const hint = document.getElementById("hint");
        hint.style.display = "none";
        hint.textContent = "Tap and drag to mow.";
        const ui = document.getElementById("ui");
        ui.style.display = "block";
        ui.querySelector("h1").style.display = "none";
      } else {
        document.getElementById("ui").style.display = "block";
      }

      // Build the world: environment (moon / Earth / stars / grass / lights) ->
      // cinematics (sky dome + day/night + intro) -> creatures -> mower. Order
      // matters only where a module consumes what a later module builds at call
      // time (finished below), not at definition time.
      const env = buildEnvironment(sim, ctx);
      const cin = buildCinematics(sim, ctx, env);
      buildMower(sim, ctx, env);
      buildCreatures(sim, ctx, env);
      buildUI(sim, ctx);

      // First load: start fully initialized (no boot cinematic) so a newcomer
      // sees a plain mowing sim; the intro only replays on restart after doom.
      cin.completeInit();
      // On mobile the boot hint was hidden at setup; on first load (no intro)
      // show the "Tap and drag to mow" hint ready for the player.
      if (ctx.isMobile && ctx.rearmMobileHint) ctx.rearmMobileHint();

      sim.start();
    </script>
  </body>
</html>
