<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Mow</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
        Zen Mow
      </h1>
      <p style="margin: 4px 0 0; font-size: 0.85rem; opacity: 0.5">
        W/A/S/D or arrow keys to move. Hold C for a first-person view.
      </p>
      <label
        id="creatures-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="creatures-checkbox" checked />
        Creatures
      </label>
      <label
        id="sampler-toggle"
        style="
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="sampler-checkbox" />
        Sampler box
      </label>
      <div
        id="sun-control"
        style="
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Sun <span id="sun-clock">12:00</span>
        </div>
        <input
          type="range"
          id="sun-slider"
          min="0"
          max="24"
          step="0.05"
          value="12"
          style="width: 180px; vertical-align: middle"
        />
        <span id="sun-phase" style="opacity: 0.6; margin-left: 6px">noon</span>
      </div>
      <div
        id="grass-control"
        style="
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Cut Height <span id="cut-height-value" style="font-weight: bold">0.20m</span>
        </div>
        <input
          type="range"
          id="cut-height-slider"
          min="0.01"
          max="0.5"
          step="0.01"
          value="0.2"
          style="width: 180px; vertical-align: middle"
        />
        <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
          Grow Rate <span id="grow-rate-value" style="font-weight: bold">0.005</span>
        </div>
        <input
          type="range"
          id="grow-rate-slider"
          min="0.001"
          max="0.1"
          step="0.001"
          value="0.005"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="fov-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Field of View <span id="fov-value" style="font-weight: bold">90°</span>
        </div>
        <input
          type="range"
          id="fov-slider"
          min="30"
          max="100"
          step="1"
          value="90"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="gaze-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Gaze <span id="gaze-value">-30°</span>
        </div>
        <input
          type="range"
          id="gaze-slider"
          min="-30"
          max="30"
          step="1"
          value="-30"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="offset-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Forward Offset <span id="offset-value">-0.45</span>
        </div>
        <input
          type="range"
          id="offset-slider"
          min="-1"
          max="2"
          step="0.05"
          value="-0.45"
          style="width: 180px; vertical-align: middle"
        />
      </div>
    </div>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createGnats,
      } from "engine/primitives.js";
      import {
        createLawnmower,
        createButterfly,
        createDragonfly,
        createFlies,
        createDandelion,
        createBumblebee,
        createFPSCounter,
        createGCStats,
        createEntityStats,
      } from "engine/components.js";
      import {} from "engine/materials.js";
      import * as THREE from "three";

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x87ceeb,
        enableShadows: true,
      });

      {
        const sun = sim.scene.children.find((c) => c.isDirectionalLight);
        if (sun) {
          const d = 70;
          sun.shadow.camera.left = -d;
          sun.shadow.camera.right = d;
          sun.shadow.camera.top = d;
          sun.shadow.camera.bottom = -d;
          sun.shadow.camera.near = 0.5;
          sun.shadow.camera.far = 200;
          sun.shadow.camera.updateProjectionMatrix();
        }
      }

      // --- Realistic sun position + lighting driven by a time-of-day slider ---
      // The slider runs 0-24 hours. The sun rises in the east, tops out at
      // solar noon, and sets in the west along an arc; sky color, light color,
      // and intensity follow the time so sunsets/sunrises feel warm and dim.
      const slider = document.getElementById("sun-slider");
      const clockEl = document.getElementById("sun-clock");
      const phaseEl = document.getElementById("sun-phase");
      const ambient = sim.scene.children.find((c) => c.isAmbientLight);
      const sun = sim.scene.children.find((c) => c.isDirectionalLight);

      const SUN_RISE = 6, SUN_SET = 18, TILT = 0.4;
      function updateSun(hour) {
        const hh = String(Math.floor(hour)).padStart(2, "0");
        const mm = String(Math.round((hour % 1) * 60)).padStart(2, "0");
        clockEl.textContent = `${hh}:${mm}`;
        const phase =
          hour < SUN_RISE || hour >= SUN_SET
            ? "night"
            : hour < 9
              ? "morning"
              : hour > 15
                ? "evening"
                : "noon";
        phaseEl.textContent = phase;

        // Fraction through daylight 0..1 (below 0 or >1 means it's dark).
        const t = (hour - SUN_RISE) / (SUN_SET - SUN_RISE);
        if (t < 0 || t > 1) {
          // Night: sun below the horizon, dim cool light.
          sun.position.set(0, -30, 0);
          sun.intensity = 0.05;
          sun.color.setHex(0x334466);
          ambient.intensity = 0.12;
          sim.renderer.setClearColor(0x0b1026);
          return;
        }
        // Sun arc across the sky: east (t=0) -> overhead-ish (t=0.5) -> west (t=1).
        const azimuth = Math.PI * (1 - t); // 0 at rise (east), PI at set (west)
        const elev = Math.sin(t * Math.PI); // 0 at horizon, 1 at noon
        const dist = 60;
        sun.position.set(
          Math.cos(azimuth) * Math.cos(Math.asin(elev * TILT)) * dist,
          elev * dist,
          Math.sin(azimuth) * Math.cos(Math.asin(elev * TILT)) * dist,
        );
        // Warm toward sunrise/sunset, whiter at noon; brightest mid-day.
        const warm = Math.pow(elev, 1.6);
        sun.intensity = 0.25 + elev * 1.0;
        sun.color.setRGB(1, 0.55 + 0.45 * warm, 0.4 + 0.6 * warm);
        ambient.intensity = 0.2 + 0.5 * elev;
        // Sky color: vivid sky blue when the sun is high, warming to a soft
        // peach as it sinks toward the horizon.
        const sky = new THREE.Color();
        const noonSky = new THREE.Color(0.42, 0.72, 0.95);
        const horizonSky = new THREE.Color(1.0, 0.85, 0.65);
        sky.copy(horizonSky).lerp(noonSky, warm);
        sim.renderer.setClearColor(sky);
      }
      slider.addEventListener("input", () => updateSun(parseFloat(slider.value)));
      updateSun(parseFloat(slider.value));

      // --- Field-of-view slider: adjust the camera zoom live ---
      const fovSlider = document.getElementById("fov-slider");
      const fovValueEl = document.getElementById("fov-value");
      const applyFov = () => {
        sim.camera.fov = parseFloat(fovSlider.value);
        sim.camera.updateProjectionMatrix();
        fovValueEl.textContent = `${Math.round(sim.camera.fov)}°`;
      };
      fovSlider.addEventListener("input", applyFov);
      applyFov();

      // --- Gaze slider: first-person camera pitch (look down / look up) ---
      const gazeSlider = document.getElementById("gaze-slider");
      const gazeValueEl = document.getElementById("gaze-value");
      let gazePitch = -30 * (Math.PI / 180); // default slightly down at the reel
      const applyGaze = () => {
        gazePitch = parseFloat(gazeSlider.value) * (Math.PI / 180);
        gazeValueEl.textContent = `${Math.round(gazeSlider.value)}°`;
      };
      gazeSlider.addEventListener("input", applyGaze);
      applyGaze();

      // --- Forward-offset slider: where on the local +Z (handle/behind) axis
      // the first-person camera floats, vs the front of the mower ---
      const offsetSlider = document.getElementById("offset-slider");
      const offsetValueEl = document.getElementById("offset-value");
      let fwdOffset = -0.45;
      const applyOffset = () => {
        fwdOffset = parseFloat(offsetSlider.value);
        offsetValueEl.textContent = fwdOffset.toFixed(2);
      };
      offsetSlider.addEventListener("input", applyOffset);
      applyOffset();

      function setup(sim) {
        // Ground plane.
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b180c });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        // Cast too: the plane occludes blade geometry in the shadow pass, so
        // grass sunk into the soil doesn't cast phantom full-length shadows.
        ground.castShadow = true;
        sim.scene.add(ground);

        // Grass: single instanced mesh, 3x3 patches tiled across 100x100.
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        const W = 3, D = 3, N = isMobile ? 250 : 1000;
        const COLS = 20, ROWS = 20;
        const total = COLS * ROWS * N;
        const bladeGeo = new THREE.ConeGeometry(0.08, 1.7, 4);
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x44aa55, roughness: 0.8 });
        // Gentle breeze: sway lives in the vertex shader, so it costs nothing
        // on the CPU (only the regrowing blades touch instance matrices). It
        // bends in local space before the instance transform, so each blade
        // keeps its own scale/orientation and its base stays anchored.
        const swayUniforms = { uTime: { value: 0 } };
        bladeMat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = swayUniforms.uTime;
          // Declare the uniform at global scope (#include <common> is the first
          // include); #include <begin_vertex> sits inside main().
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nuniform float uTime;")
            .replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
#ifdef USE_INSTANCING
            // h: 0 at the base, 1 at the tip (cone height 1.7, centered at 0).
            float h = clamp((transformed.y + 0.85) / 1.7, 0.0, 1.0);
            // Blade base position = instance translation (world space).
            vec3 _base = instanceMatrix[3].xyz;
            // Per-blade phase so neighboring blades don't wave in lockstep.
            float _ph = fract(sin(dot(_base.xz * 0.13, vec2(12.9898, 78.233))) * 43758.5453);
            // A shallow wave drifting across the lawn, gentler near the base.
            float _wave = sin(_base.x * 1.2 + uTime * 1.6 + _ph * 6.2831)
                        + cos(_base.z * 1.4 + uTime * 1.2 + _ph * 6.2831);
            transformed.x += _wave * h * h * 0.025;
#endif
`,
          );
        };
        const grassMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, total);
        grassMesh.castShadow = true;
        grassMesh.receiveShadow = true;
        const dummy = new THREE.Object3D();
        const bladePos = [];
        const bladeRot = [];
        const bladeScale = new Float32Array(total);
        const bladeGrowth = new Float32Array(total);
        // Distance from the cone's center to its tip. Blades are never squashed:
        // they stay full length and sink into the ground by the un-grown amount
        // (see the grow loop), so the tip just peeks out of the soil when cut.
        const BLADE_HALF = bladeGeo.parameters.height / 2;
        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const ox = (c - COLS / 2 + 0.5) * W;
            const oz = (r - ROWS / 2 + 0.5) * D;
            const hw = W / 2, hd = D / 2;
            for (let i = 0; i < N; i++) {
              const s = 0.6 + Math.random() * 0.8;
              bladeScale[idx] = s;
              bladeGrowth[idx] = 1; // start fully grown
              bladePos[idx] = new THREE.Vector3(
                ox + Math.random() * W - hw,
                0,
                oz + Math.random() * D - hd,
              );
              bladeRot[idx] = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(
                  (Math.random() - 0.5) * 0.35,
                  Math.random() * Math.PI * 2,
                  (Math.random() - 0.5) * 0.35,
                ),
              );
              dummy.position.set(
                bladePos[idx].x,
                BLADE_HALF * bladeScale[idx] * (bladeGrowth[idx] - 1),
                bladePos[idx].z,
              );
              dummy.quaternion.copy(bladeRot[idx]);
              dummy.scale.set(s, s, s);
              dummy.updateMatrix();
              grassMesh.setMatrixAt(idx++, dummy.matrix);
            }
          }
        }
        grassMesh.instanceMatrix.needsUpdate = true;
        sim.scene.add(grassMesh);

        // Spatial grid over the lawn so cut checks only test blades near the
        // mower instead of all of them every frame. Blade positions never move,
        // so the buckets are built once.
        const CELL = 1.5; // grid cell size (world units)
        const GRID_COLS = Math.ceil((COLS * W) / CELL);
        const GRID_ROWS = Math.ceil((ROWS * D) / CELL);
        const lawnMinX = -(COLS * W) / 2, lawnMinZ = -(ROWS * D) / 2;
        const gridCells = new Array(GRID_COLS * GRID_ROWS);
        const counts = new Uint32Array(GRID_COLS * GRID_ROWS);
        const cellIndex = (x, z) => {
          const cx = Math.min(GRID_COLS - 1, Math.max(0, Math.floor((x - lawnMinX) / CELL)));
          const cz = Math.min(GRID_ROWS - 1, Math.max(0, Math.floor((z - lawnMinZ) / CELL)));
          return cz * GRID_COLS + cx;
        };
        for (let i = 0; i < total; i++) counts[cellIndex(bladePos[i].x, bladePos[i].z)]++;
        // Prefix-sum so each cell's indices are a contiguous slice of one array.
        const cellStart = new Int32Array(gridCells.length + 1);
        for (let i = 0; i < gridCells.length; i++) cellStart[i + 1] = cellStart[i] + counts[i];
        const cellIndices = new Uint32Array(total);
        {
          const cursor = new Int32Array(gridCells.length);
          for (let i = 0; i < total; i++) {
            const ci = cellIndex(bladePos[i].x, bladePos[i].z);
            cellIndices[cellStart[ci] + cursor[ci]++] = i;
          }
        }
        // Iterate blades inside a footprint defined as a box in mower-local
        // space: half-width `hw` across the reel (local X), half-depth `hd`
        // along the mower (local Z), and `offZ` shifting the box forward/back
        // along the mower's local Z in front of its origin.
        const visitCutArea = (hw, hd, offZ, cb) => {
          const o = mower.mesh.position;
          const q = mower.mesh.quaternion;
          // Box center = mower origin pushed along its local Z by offZ.
          const center = _boxCenter.set(0, 0, offZ).applyQuaternion(q).add(o);
          // Orient the footprint axes into world space to bound its AABB.
          const fx = _fx.set(hw, 0, 0).applyQuaternion(q);
          const fz = _fz.set(0, 0, hd).applyQuaternion(q);
          const minX = center.x - Math.abs(fx.x) - Math.abs(fz.x);
          const maxX = center.x + Math.abs(fx.x) + Math.abs(fz.x);
          const minZ = center.z - Math.abs(fx.z) - Math.abs(fz.z);
          const maxZ = center.z + Math.abs(fx.z) + Math.abs(fz.z);
          const c0x = Math.max(0, Math.floor((minX - lawnMinX) / CELL));
          const c1x = Math.min(GRID_COLS - 1, Math.floor((maxX - lawnMinX) / CELL));
          const c0z = Math.max(0, Math.floor((minZ - lawnMinZ) / CELL));
          const c1z = Math.min(GRID_ROWS - 1, Math.floor((maxZ - lawnMinZ) / CELL));
          for (let cz = c0z; cz <= c1z; cz++) {
            for (let cx = c0x; cx <= c1x; cx++) {
              const ci = cz * GRID_COLS + cx;
              for (let k = cellStart[ci]; k < cellStart[ci + 1]; k++) {
                if (cb(cellIndices[k])) return true;
              }
            }
          }
          return false;
        };

        // Place a push lawnmower on the lawn. Keep the handle geometry params
        // here so the first-person camera can mount itself on the handle.
        const MOWER = { wheelRadius: 0.4, handleAngle: 0.75, handleLength: 1.7 };
        const mower = createLawnmower(sim, {
          wheelRadius: MOWER.wheelRadius,
          reelWidth: 1.25,
          bladeThickness: 0.01,
          blades: 4,
          handleAngle: MOWER.handleAngle,
          handleLength: MOWER.handleLength,
          bodyColor: 0x2a3d56,
          bladeColor: 0x014101,
          wheelColor: 0x1a1a1a,
          position: [0, 0, 0],
          rotation: [0, 0, 0],
        });

        // Drive the mower: W/S (or up/down arrows) move, A/D (or left/right)
        // turn. Reel spins 2x.
        const keys = new Set();
        window.addEventListener("keydown", (e) => keys.add(e.code));
        window.addEventListener("keyup", (e) => keys.delete(e.code));
        const forward = new THREE.Vector3(0, 0, 1);
        const _dir = new THREE.Vector3();       // reusable per-frame temps (no alloc)
        const _reelWorld = new THREE.Vector3();
        const _right = new THREE.Vector3();
        const _fx = new THREE.Vector3();        // cut-footprint AABB axes
        const _fz = new THREE.Vector3();
        const _boxCenter = new THREE.Vector3(); // footprint box center in world
        const _fpMount = new THREE.Vector3();   // first-person camera mount (local)
        const _fpWorld = new THREE.Vector3();   // first-person world-space temp
        const _fpQuat = new THREE.Quaternion(); // first-person camera orientation
        const _fpPitch = new THREE.Quaternion(); // downward-tilt offset
        const _fpAxis = new THREE.Vector3(1, 0, 0); // mower-local X for that tilt
        const turnDir = new THREE.Vector3(0, 1, 0);
        let mowerMoving = false;
        let mowerForward = false; // true only while cutting forward (blades turn)
        const keyF = () =>
          keys.has("KeyS") || keys.has("ArrowDown") ? 1 : keys.has("KeyW") || keys.has("ArrowUp") ? -1 : 0;
        const keyTurn = () =>
          keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : keys.has("KeyD") || keys.has("ArrowRight") ? -1 : 0;

        // Touch control (mobile): any touch drives forward; steering is by the
        // finger's position relative to screen center (drag left to turn left,
        // right to turn right). Combined with the keyboard inputs below.
        let touchActive = false;
        let touchF = 0;
        let touchTurn = 0;
        const canvas = sim.renderer.domElement;
        canvas.style.touchAction = "none";
        canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          touchActive = true;
          touchF = -1; // touching anywhere moves the mower forwards (=-Z, same as W)
          updateTouchTurn(t.clientX);
        }, { passive: false });
        const updateTouchTurn = (x) => {
          const center = window.innerWidth / 2;
          // Map finger X to steering in [-1, 1]; a small dead zone near center.
          const half = center;
          const raw = (center - x) / half;
          touchTurn = Math.abs(raw) < 0.1 ? 0 : Math.max(-1, Math.min(1, raw));
        };
        canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          updateTouchTurn(t.clientX);
        }, { passive: false });
        canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          if (e.touches.length === 0) {
            touchActive = false;
            touchF = 0;
            touchTurn = 0;
          }
        }, { passive: false });
        canvas.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          touchActive = false;
          touchF = 0;
          touchTurn = 0;
        }, { passive: false });

        // Reel cut footprint (matches the grass-cutting test below).
        const CUT_HALF_W = 1.25 / 2; // across the reel (local X)
        const CUT_HALF_D = 0.4 * 0.7; // cutting depth (local Z)
        // The single control for how much grass sticks up after a cut, in
        // world units (meters). A blade's tip height = BLADE_HALF * scale *
        // growth, so the minimum growth per blade is derived from its own
        // random scale to always leave exactly CUT_HEIGHT sticking out.
        let CUT_HEIGHT = 0.2;
        const bladeMinGrowth = new Float32Array(total);
        const recomputeMinGrowth = () => {
          for (let i = 0; i < total; i++) {
            bladeMinGrowth[i] = Math.min(1, CUT_HEIGHT / (BLADE_HALF * bladeScale[i]));
          }
        };
        recomputeMinGrowth();
        const localPos = new THREE.Vector3();
        const invMower = new THREE.Matrix4();
        // Active-growth set: only blades below full height are touched each
        // frame, instead of scanning all of them. `growIndex[i]` gives the slot
        // of blade i in `growList` (or -1 if not growing), enabling O(1) add.
        const growList = [];
        const growIndex = new Int32Array(total).fill(-1);
        const addToGrow = (i) => {
          if (growIndex[i] !== -1) return; // already in the list
          growIndex[i] = growList.length;
          growList.push(i);
        };
        // Whether any cuttable grass currently sits under the reel. Returns true if
        // there's at least one blade above its minimum height in the footprint.
        const hasCuttableGrass = () => {
          invMower.copy(mower.mesh.matrixWorld).invert();
          return visitCutArea(CUT_HALF_W, CUT_HALF_D, 0, (i) => {
            if (bladeGrowth[i] <= bladeMinGrowth[i]) return false;
            localPos.copy(bladePos[i]).applyMatrix4(invMower);
            if (Math.abs(localPos.x) < CUT_HALF_W && Math.abs(localPos.z) < CUT_HALF_D) {
              return true;
            }
            return false;
          });
        };

        // Particle-size sampler: a thin rectangular box just ahead of the reel,
        // spanning the mower's full width (matching CUT_HALF_W) with a very small
        // forward length. We average the growth of the blades in that box; that
        // average fraction (0..1 of full height) maps onto the emitted clipping
        // size, so the particles reflect the grass the mower is about to reach
        // instead of a single blade catching the sample. Forward is local -Z.
        const SAMPLE_HALF_W = CUT_HALF_W; // same width as the reel
        const SAMPLE_HALF_D = 0.12; // thin strip ahead of the reel
        const SAMPLE_OFF_Z = -(CUT_HALF_D + SAMPLE_HALF_D); // just ahead of the cut
        // Debug wireframe: draws the sampling box so we can see exactly where
        // the particle sizes are being read from. Toggle with the checkbox.
        const samplerBox = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(SAMPLE_HALF_W * 2, CUT_HEIGHT, SAMPLE_HALF_D * 2)),
          new THREE.LineBasicMaterial({ color: 0xff5555 }),
        );
        samplerBox.position.set(0, CUT_HEIGHT / 2, SAMPLE_OFF_Z);
        samplerBox.visible = false;
        mower.mesh.add(samplerBox);
        document.getElementById("sampler-checkbox").addEventListener("change", (e) => {
          samplerBox.visible = e.target.checked;
        });
        const sampleCutAmount = () => {
          invMower.copy(mower.mesh.matrixWorld).invert();
          let sum = 0, count = 0;
          visitCutArea(SAMPLE_HALF_W, SAMPLE_HALF_D, SAMPLE_OFF_Z, (i) => {
            if (bladeGrowth[i] <= bladeMinGrowth[i]) return false;
            localPos.copy(bladePos[i]).applyMatrix4(invMower);
            if (Math.abs(localPos.x) < SAMPLE_HALF_W && Math.abs(localPos.z - SAMPLE_OFF_Z) < SAMPLE_HALF_D) {
              sum += bladeGrowth[i] - bladeMinGrowth[i];
              count++;
            }
            return false;
          });
          return count ? sum / count : 0;
        };

        // --- Grass-clipping particle effect (emitted when the mower moves) ---
        const CLIP_COUNT = 120;
        // Each clipping is a real 3D blade mesh so it can carry a random 3D
        // rotation and tumble as it flies.
        // The clip cone is small (0.5 tall); this factor upscales the emitted
        // instance so a full-height cut (cutAmount=1) produces a clipping about
        // as long as the grass blade it came from (~1.7), and keeps shorter
        // re-cuts proportionally smaller.
        const CLIP_SCALE = (1.7 / 0.5) * 0.5; // full cut throws clippings half the blade height
        const clipGeo = new THREE.ConeGeometry(0.03, 0.5, 4);
        const clipMat = new THREE.MeshStandardMaterial({
          color: 0x3f8f3f,
          roughness: 0.9,
        });
        const clipMesh = new THREE.InstancedMesh(clipGeo, clipMat, CLIP_COUNT);
        clipMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        clipMesh.frustumCulled = false;
        sim.scene.add(clipMesh);
        const clipDummy = new THREE.Object3D();
        const clipQuat = new THREE.Quaternion();
        const clipEuler = new THREE.Euler();
        const clips = [];
        for (let i = 0; i < CLIP_COUNT; i++) {
          clips.push({ x: 0, y: -1000, z: 0, vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0, wrx: 0, wry: 0, wrz: 0, life: 0, scale: 1, alive: false });
          clipDummy.position.set(-1000, -1000, -1000);
          clipDummy.updateMatrix();
          clipMesh.setMatrixAt(i, clipDummy.matrix);
        }
        let clipCursor = 0;
        let clipAccum = 0;

        sim.addEntity(null, null, (dt) => {
          // Mower local +Z (handle push direction) mapped to the horizontal
          // world direction; with no roll/pitch this is the forward heading.
          const dir = _dir.copy(forward).applyQuaternion(mower.mesh.quaternion);
          const turn = keyTurn() || touchTurn;
          const v = keyF() || touchF;
          const speed = 2;
          // Shift slows the mower but tightens the turn proportionally: ratio of
          // move to turnSpeed gives a shift radius (1.5/1.5 = 1) half of the
          // normal radius (2/1 = 2).
          const shifting = keys.has("ShiftLeft") || keys.has("ShiftRight");
          const ease = shifting ? 0.75 : 1;
          const move = v * speed * ease;
          const turnSpeed = v === 0 ? 4.0 : (shifting ? 1.5 : 1.0);

          mowerMoving = v !== 0;
          mowerForward = move < 0; // forward is along the mower's -Z (toward the reel)
          mower.mesh.rotateOnWorldAxis(turnDir, turn * turnSpeed * dt);
          mower.setSpeed(move);
          mower.mesh.position.addScaledVector(dir, move * dt);
          // Reflect the fresh transform immediately so the cut-footprint check
          // (which uses matrixWorld) matches the mower's real position this frame.
          mower.mesh.updateWorldMatrix(true, false);

          // Emit clippings from the reel when moving AND actually cutting grass.
          const reelWorld = mower.mesh.localToWorld(_reelWorld.set(0, 0.1, 0));
          const right = _right.set(1, 0, 0).applyQuaternion(mower.mesh.quaternion);
          if (mowerForward && hasCuttableGrass()) {
            clipAccum += dt * 250;
            while (clipAccum >= 1) {
              clipAccum -= 1;
              const p = clips[clipCursor];
              clipCursor = (clipCursor + 1) % CLIP_COUNT; // reuse a slot each time
              const off = (Math.random() - 0.5) * 0.8; // across the reel (local X)
              p.x = reelWorld.x + off * right.x;
              p.z = reelWorld.z + off * right.z;
              p.y = reelWorld.y + Math.random() * 0.1;
              const spread = 1.6;
              p.vx = (Math.random() - 0.5) * spread;
              p.vz = (Math.random() - 0.5) * spread;
              p.vy = 1.2 + Math.random() * 1.6;
              // Size matches the grass at THIS spot (per-particle local sample):
              // full-height cuts throw big clippings, re-cuts throw tiny flecks.
              const amt = sampleCutAmount();
              p.scale = Math.max(0.08, amt * CLIP_SCALE);
              // Random starting 3D rotation and fixed tumble rates.
              p.rx = Math.random() * Math.PI * 2;
              p.ry = Math.random() * Math.PI * 2;
              p.rz = Math.random() * Math.PI * 2;
              p.wrx = (Math.random() - 0.5) * 14;
              p.wry = (Math.random() - 0.5) * 14;
              p.wrz = (Math.random() - 0.5) * 14;
              p.life = 0;
              p.alive = true;
            }
          } else {
            clipAccum = 0;
          }

          // Age clippings: tumble and arc with gravity, then despawn.
          for (let i = 0; i < CLIP_COUNT; i++) {
            const p = clips[i];
            if (!p.alive) {
              clipDummy.position.set(-1000, -1000, -1000);
              clipDummy.quaternion.identity();
              clipDummy.scale.set(1, 1, 1);
              clipDummy.updateMatrix();
              clipMesh.setMatrixAt(i, clipDummy.matrix);
              continue;
            }
            p.life += dt;
            p.vy -= 5 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.rx += p.wrx * dt;
            p.ry += p.wry * dt;
            p.rz += p.wrz * dt;
            if (p.life > 0.9 || p.y < 0.01) {
              p.alive = false;
              p.y = -1000;
            }
clipDummy.position.set(p.x, p.y, p.z);
            clipEuler.set(p.rx, p.ry, p.rz);
            clipQuat.setFromEuler(clipEuler);
            clipDummy.quaternion.copy(clipQuat);
            clipDummy.scale.set(p.scale, p.scale, p.scale);
            clipDummy.updateMatrix();
            clipMesh.setMatrixAt(i, clipDummy.matrix);
          }
          clipMesh.instanceMatrix.needsUpdate = true;
        });

        // Orbit camera.
        let theta = 0, phi = Math.PI / 6, radius = 25;
        let dragging = false, lastX = 0, lastY = 0;
        const target = new THREE.Vector3(0, 0, 0);

        canvas.addEventListener("mousedown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        });
        window.addEventListener("mouseup", () => { dragging = false; });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.005;
          phi = Math.max(0.1, Math.min(Math.PI - 0.1,
            phi - (e.clientY - lastY) * 0.005));
          lastX = e.clientX;
          lastY = e.clientY;
        });
        canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          radius = Math.max(3, Math.min(80, radius + e.deltaY * 0.03));
        }, { passive: false });

        let grassDirty = false;
        let growRate = 0.005;
        // Grass tweak sliders. Wrap in one block so it's easy to hide the whole
        // control group in the UI later (set #grass-control to display:none).
        {
          const cutSlider = document.getElementById("cut-height-slider");
          const cutValueEl = document.getElementById("cut-height-value");
          const growSlider = document.getElementById("grow-rate-slider");
          const growValueEl = document.getElementById("grow-rate-value");
          const applyCutHeight = () => {
            CUT_HEIGHT = parseFloat(cutSlider.value);
            recomputeMinGrowth();
            cutValueEl.textContent = CUT_HEIGHT.toFixed(2) + "m";
          };
          const applyGrowRate = () => {
            growRate = parseFloat(growSlider.value);
            growValueEl.textContent = growRate.toFixed(3);
          };
          cutSlider.addEventListener("input", applyCutHeight);
          growSlider.addEventListener("input", applyGrowRate);
          applyCutHeight();
          applyGrowRate();
        }
        sim.addEntity(null, null, (dt) => {
          swayUniforms.uTime.value = (swayUniforms.uTime.value + dt) % 1000;
          // Cut any blades under the mower's reel, then grow the lawn back.
          grassDirty = false;
          // Cut: only test blades in the grid cells under the reel. Trim any
          // grown above the mower's minimum height down to that minimum (a real
          // mower leaves a uniform-height lawn, it doesn't scalp to nothing).
          invMower.copy(mower.mesh.matrixWorld).invert();
          if (mowerForward) {
            visitCutArea(CUT_HALF_W, CUT_HALF_D, 0, (i) => {
              if (bladeGrowth[i] > bladeMinGrowth[i]) {
                localPos.copy(bladePos[i]).applyMatrix4(invMower);
                if (Math.abs(localPos.x) < CUT_HALF_W &&
                    Math.abs(localPos.z) < CUT_HALF_D) {
                  bladeGrowth[i] = bladeMinGrowth[i];
                  addToGrow(i);
                }
              }
              return false;
            });
          }
          // Grow only the blades that are below full height (active set), not
          // every blade. Each blade keeps its full length; it's sunk into the
          // soil by the un-grown amount, so the top `growth` fraction of a thin
          // blade emerges from the ground and rises as it regrows.
          for (let k = 0; k < growList.length; ) {
            const i = growList[k];
            bladeGrowth[i] = Math.min(bladeGrowth[i] + dt * growRate, 1);
            dummy.position.set(
              bladePos[i].x,
              BLADE_HALF * bladeScale[i] * (bladeGrowth[i] - 1),
              bladePos[i].z,
            );
            dummy.quaternion.copy(bladeRot[i]);
            dummy.scale.set(bladeScale[i], bladeScale[i], bladeScale[i]);
            dummy.updateMatrix();
            grassMesh.setMatrixAt(i, dummy.matrix);
            grassDirty = true;
            if (bladeGrowth[i] >= 1) {
              // Swap-remove: move the last growing blade into this slot.
              const last = growList.pop();
              if (last !== i) {
                growList[k] = last;
                growIndex[last] = k;
              }
              growIndex[i] = -1;
            } else {
              k++;
            }
          }
          if (grassDirty) grassMesh.instanceMatrix.needsUpdate = true;

          // Cut dandelions under the reel and regrow them after a random delay.
          invMower.copy(mower.mesh.matrixWorld).invert();
          if (mowerForward) {
            for (const d of dandelions) {
              if (d.grown) {
                localPos.set(d.x, 0, d.z).applyMatrix4(invMower);
                if (Math.abs(localPos.x) < CUT_HALF_W &&
                    Math.abs(localPos.z) < CUT_HALF_D) {
                  d.ent.mesh.visible = false; // mow it down
                  d.grown = false;
                  d.regrowT = 3 + Math.random() * 7; // random 3-10s before return
                }
              }
            }
          }
          for (const d of dandelions) {
            if (d.grown) continue;
            if (!d.flower) {
              // Seed-phase puffs regrow; flowers stay mowed once cut.
              d.regrowT -= dt;
              if (d.regrowT <= 0) {
                d.ent.mesh.visible = true;
                d.grown = true;
              }
            }
          }

          // Camera: hold C to ride the mower's handle (facing the mower's forward
          // vector, just back from the reel), otherwise drift the orbit view.
          if (keys.has("KeyC")) {
            // Hand-grip point from the same geometry as the mower itself.
            const gripY = MOWER.wheelRadius +
              MOWER.handleLength * Math.cos(MOWER.handleAngle);
            const gripZ = MOWER.handleLength * Math.sin(MOWER.handleAngle);
            // Mount above the hand grip (1.5x the handle tube length up); the
            // forward-offset slider pushes it back (behind the mower) or
            // forward along the mower's local +Z axis.
            _fpMount.set(0,
              MOWER.wheelRadius + (gripY - MOWER.wheelRadius) * 1.5,
              gripZ * 1.5 + fwdOffset);
            mower.mesh.updateWorldMatrix(true, false);
            _fpWorld.copy(mower.mesh.localToWorld(_fpMount));
            sim.camera.position.copy(_fpWorld);
            // The mower travels along local -Z (the handle leans back toward
            // +Z), so copying its orientation aims the camera straight along
            // the mower's forward vector. The gaze slider pitches the view
            // down or up from level.
            _fpQuat.copy(mower.mesh.quaternion);
            _fpQuat.multiply(_fpPitch.setFromAxisAngle(_fpAxis.set(1, 0, 0), gazePitch));
            sim.camera.quaternion.copy(_fpQuat);
          } else {
            const sp = Math.sin(phi);
            sim.camera.position.set(
              target.x + radius * sp * Math.sin(theta),
              target.y + radius * Math.cos(phi),
              target.z + radius * sp * Math.cos(theta),
            );
            sim.camera.lookAt(target);
          }
        });

        // Lawn bounds used by all creatures.
        const bx = (COLS * W) / 2 - 1, bz = (ROWS * D) / 2 - 1;
        const mowerPos = new THREE.Vector3();
        let creaturesEnabled = true;

        // --- Flying bugs: midges that hover and flit around the lawn ---
        const BUG_COUNT = isMobile ? 8 : 20;
        const SCARE_R = 4;
        const flies = createFlies(sim, {
          count: BUG_COUNT,
          color: 0x1a1a1a,
          size: 0.035,
          spread: bx * 2,
        });

        sim.addEntity(null, null, () => {
          flies.mesh.visible = creaturesEnabled;
        });

        // --- Butterflies: graceful, colorful flappers ---
        // We reuse the butterfly model/animation from the component library
        // (createButterfly) and animate the MOVEMENT here in the game: each
        // butterfly traces a gentle looping orbit around a slowly drifting
        // focus, and darts away when the mower rolls close.
        const BFLY_COUNT = isMobile ? 3 : 6;
        const pastel = new THREE.Color();
        const butterflies = [];
        for (let i = 0; i < BFLY_COUNT; i++) {
          pastel.setHSL(Math.random(), 0.75, 0.65);
          const ent = createButterfly(sim, {
            wingColor: "#" + pastel.getHexString(),
            position: [
              (Math.random() * 2 - 1) * bx,
              0.8 + Math.random() * 0.8,
              (Math.random() * 2 - 1) * bz,
            ],
          });
          butterflies.push({
            group: ent.mesh,
            ent,
            x: (Math.random() * 2 - 1) * bx,
            z: (Math.random() * 2 - 1) * bz,
            h: 0.8 + Math.random() * 0.8,
            yaw: Math.random() * Math.PI * 2,
            flapSpeed: 14 + Math.random() * 8,
            // Occasional flap bursts: picks a slight speed-up that gains a bit
            // of altitude, then slowly drifts back down to the cruise height.
            burstT: 1 + Math.random() * 3,
            flapBoost: 0,
            // Loop path: drift toward a focus while a circle orbits it.
            cx: (Math.random() * 2 - 1) * bx,
            cz: (Math.random() * 2 - 1) * bz,
            orbit: Math.random() * Math.PI * 2,
            orbitR: 0.8 + Math.random() * 1.2,
            scatterT: 0,
            scareCooldown: 0,
            rejoinT: 0, // > 0 while easing back into the orbit after a flight
          });
        }

        // Butterflies move in the same update as the grass so they track the
        // camera loop time; the component animates the wing flap, the game
        // here owns their position and heading.
        sim.addEntity(null, null, (dt) => {
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          mowerPos.copy(mower.mesh.position);
          for (const b of butterflies) {
            b.ent.setFlapSpeed(b.scatterT > 0 ? 42 : b.flapSpeed + b.flapBoost);

            if (b.scatterT > 0) {
              // Frightened: burst upward and away from the mower, then calm.
              b.scatterT -= dt;
              b.scareCooldown = Math.max(0, b.scareCooldown - dt);
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              const d = Math.hypot(dx, dz) || 1;
              b.x += (dx / d) * dt * 3;
              b.z += (dz / d) * dt * 3;
              b.h += dt * 2;
              b.yaw = Math.atan2(dx, dz);
              if (b.scatterT <= 0) {
                // Flight's over: start easing back into the orbit, and add a
                // beat of calm so it isn't re-scared the instant it lands.
                b.rejoinT = 0.6;
                b.scareCooldown = 1.2;
              }
            } else {
              // Check if the mower frightened it (only after the cooldown, so
              // a freshly scared butterfly isn't re-triggered the instant its
              // flight ends).
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              if (b.scareCooldown <= 0 && dx * dx + dz * dz < SCARE_R * SCARE_R) {
                b.scatterT = 1.4;
                continue;
              }
              // Graceful looping path: drift focus slowly, orbit around it.
              b.orbit = (b.orbit + dt * (0.8 + Math.random() * 0.4)) % (Math.PI * 2);
              b.cx += (Math.random() - 0.5) * dt * 0.5;
              b.cz += (Math.random() - 0.5) * dt * 0.5;
              let ox = b.cx + Math.cos(b.orbit) * b.orbitR;
              let oz = b.cz + Math.sin(b.orbit) * b.orbitR;
              b.h += Math.sin(b.orbit * 1.7 + 1) * dt * 0.3;
              // Flap bursts: occasionally speed the wings up to gain a touch of
              // altitude, then let it slowly settle back down to cruise height.
              if (b.flapBoost > 0) {
                // Boost active: flap harder -> rise, and start easing off.
                b.h += dt * 0.5;
                b.flapBoost = Math.max(0, b.flapBoost - dt * 5);
              } else {
                // Boost over: slowly drift back down toward cruise height.
                const sink = b.h > 0.8 ? 0.25 : 0;
                b.h -= dt * sink;
                b.burstT -= dt;
                if (b.burstT <= 0) {
                  // Trigger a new short burst, then schedule the next one.
                  b.flapBoost = 5 + Math.random() * 9;
                  b.burstT = 2 + Math.random() * 4;
                }
              }
              if (b.rejoinT > 0) {
                // Ease back from where the flight left us to the orbit point
                // (smoothstep), so there's no snap. Recenter the loop's focus
                // on the fled position so it relaxes there.
                b.rejoinT -= dt;
                const tt = Math.max(0, b.rejoinT / 0.6);
                const e = 1 - tt * tt * (3 - 2 * tt); // 0 -> 1 as we rejoin
                const fromX = b.x, fromZ = b.z;
                b.cx = fromX;
                b.cz = fromZ;
                ox = b.cx + Math.cos(b.orbit) * b.orbitR;
                oz = b.cz + Math.sin(b.orbit) * b.orbitR;
                ox = fromX + (ox - fromX) * e;
                oz = fromZ + (oz - fromZ) * e;
              }
              b.x = ox;
              b.z = oz;
              // Face the direction of motion along the orbit.
              b.yaw = -b.orbit - Math.PI / 2;
              // Keep on the lawn.
              b.cx = Math.max(-bx, Math.min(bx, b.cx));
              b.cz = Math.max(-bz, Math.min(bz, b.cz));
              b.h = Math.max(0.6, Math.min(2.2, b.h));
            }
            b.group.position.set(b.x, b.h, b.z);
            b.group.rotation.y = b.yaw;
          }
        });

        // --- Dragonflies: hover, then zoom to a new spot, hover, repeat ---
        const DRGN_COUNT = 2;
        const dragonflies = [];
        for (let i = 0; i < DRGN_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx;
          const z = (Math.random() * 2 - 1) * bz;
          const h = 0.8 + Math.random() * 0.8;
          const ent = createDragonfly(sim, {
            bodyColor: "#2a2a2a",
            wingColor: "#78dfff",
            wingSpan: 0.4,
            wingTilt: -6,
            position: [x, h, z],
          });
          dragonflies.push({
            group: ent.mesh,
            ent,
            x,
            z,
            h,
            yaw: Math.random() * Math.PI * 2,
            // Hover / fly state machine.
            state: "hover",
            hoverT: 0.8 + Math.random() * 1.4,
            hoverDur: 0,
            fx: 0, fz: 0, fh: 0, // current flight source
            flyT: 0,
            flyDur: 0,
            tx: 0, tz: 0, th: 0, // destination
          });
        }

        sim.addEntity(null, null, (dt) => {
          for (const d of dragonflies) d.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          for (const d of dragonflies) {
            if (d.state === "hover") {
              d.hoverT -= dt;
              // Gentle hovering wiggle in place.
              d.yaw += dt * 0.5;
              d.h += Math.sin(performance.now() * 0.003 + d.tx) * dt * 0.05;
              d.ent.setFlapSpeed(64); // fast flap at all times, even when hovering
              if (d.hoverT <= 0) {
                // Pick a new destination — anywhere on the lawn, near or far.
                d.fx = d.x;
                d.fz = d.z;
                d.fh = d.h;
                d.tx = (Math.random() * 2 - 1) * bx;
                d.tz = (Math.random() * 2 - 1) * bz;
                d.th = 0.8 + Math.random() * 0.8;
                const dist = Math.max(0.01, Math.hypot(d.tx - d.fx, d.tz - d.fz));
                d.flyDur = 0.1 + dist * 0.05;
                d.flyT = 0;
                d.state = "fly";
              }
            } else {
              // Flying: zoom toward the destination with an ease-out, flapping
              // fast the whole way.
              d.flyT += dt;
              const t = Math.min(1, d.flyT / d.flyDur);
              const e = 1 - (1 - t) * (1 - t); // ease-out zoom
              d.x = d.fx + (d.tx - d.fx) * e;
              d.z = d.fz + (d.tz - d.fz) * e;
              d.h = d.fh + (d.th - d.fh) * e;
              // Face the direction of travel. The dragonfly's long axis (the
              // body cylinder) is local +Z, the forward/back direction. After
              // rotation.y = yaw, local +Z maps to world (sin(yaw), cos(yaw)),
              // so aim it along the motion vector (dx, dz).
              const ddx = d.tx - d.fx;
              const ddz = d.tz - d.fz;
              if (t < 1 && (ddx || ddz)) d.yaw = Math.atan2(ddx, ddz);
              d.ent.setFlapSpeed(64); // fast flap while zooming
              if (t >= 1) {
                d.state = "hover";
                d.hoverT = 1.2 + Math.random() * 2.0;
              }
            }
            d.group.position.set(d.x, d.h, d.z);
            d.group.rotation.y = d.yaw;
          }
        });

        // --- Gnats: two clouds of tiny flies that drift slowly around ---
        // Each cloud is an instanced swarm buzzing inside a small
        // bounding sphere; we drag the whole mesh lazily around the lawn so the
        // spheres wander randomly from spot to spot rather than staying put.
        const SWARM_COUNT = 4;
        const flySwarms = [];
        for (let i = 0; i < SWARM_COUNT; i++) {
          const ent = createGnats(sim, {
            count: 20 + Math.floor(Math.random() * 21), // 20-40 flies
            size: 0.01,
            radius: 1.2,
            speed: 1.3 + Math.random() * 0.3, // 1.3-1.6
            position: [
              (Math.random() * 2 - 1) * bx * 0.8,
              0.8 + Math.random() * 1.2,
              (Math.random() * 2 - 1) * bz * 0.8,
            ],
          });
          flySwarms.push({
            mesh: ent.mesh,
            ent,
            x: ent.mesh.position.x,
            z: ent.mesh.position.z,
            h: ent.mesh.position.y,
            // Lazy wandering: pick a target and ease toward it very slowly.
            tx: 0, tz: 0, th: 0,
            wanderT: 1 + Math.random() * 2,
            wanderDur: 1,
          });
        }

        sim.addEntity(null, null, (dt) => {
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          for (const s of flySwarms) {
            s.wanderT -= dt;
            if (s.wanderT <= 0) {
              // Pick a new slow-drifting destination on the lawn.
              s.tx = (Math.random() * 2 - 1) * bx * 0.8;
              s.tz = (Math.random() * 2 - 1) * bz * 0.8;
              s.th = 0.6 + Math.random() * 1.4;
              s.wanderDur = 30 + Math.random() * 30;
              s.wanderT = s.wanderDur;
            }
            // Ease the whole swarm toward its target at a very gentle pace.
            const e = 1 - Math.exp(-dt * 0.08);
            s.x += (s.tx - s.x) * e;
            s.z += (s.tz - s.z) * e;
            s.h += (s.th - s.h) * e;
            s.mesh.position.set(s.x, s.h, s.z);
          }
        });

        // --- Bumblebees: feed on the flowers, then fly along arcs ---
        // Each bee oscillates between FEEDING (hovering near-stationary among
        // the blooms at ~75% of full grass height) and FLYING. To fly it picks
        // a new target location, then follows a smooth arc that rises above
        // the grass, crosses to the target, and curves back down to feeding
        // height there — like a bee shuttling between flowers.
        const FEED_H = 0.7; // about 75% of full grown grass height, tucked in the blades
        const BEE_SPEED = 3; // constant transport speed (world units / sec)
        const BEE_COUNT = isMobile ? 3 : 6;
        const bees = [];
        for (let i = 0; i < BEE_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx * 0.8;
          const z = (Math.random() * 2 - 1) * bz * 0.8;
          const ent = createBumblebee(sim, {
            radius: 0.05,
            wings: false,
            position: [x, FEED_H, z],
          });
          bees.push({
            group: ent.mesh,
            ent,
            x,
            z,
            h: FEED_H,
            yaw: Math.random() * Math.PI * 2,
            pitch: 0,
            roll: 0,
            // Feed/fly state machine.
            state: "feed",
            feedT: (() => { const r = Math.random(); return r < 0.33 ? 0.5 : r < 0.66 ? 1 : 3; })(),
            feedPhase: Math.random() * Math.PI * 2,
            sx: x, sz: z, sh: FEED_H, // flight start
            tx: 0, tz: 0, th: FEED_H, // flight target
            apex: 3, // apex height of the arc
            upT: 0.5, downT: 0.5,
            flyT: 0,
            flyDur: 1,
          });
        }

        sim.addEntity(null, null, (dt) => {
          for (const b of bees) b.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          for (const b of bees) {
            if (b.state === "feed") {
              // Stationary at feeding height: gentle bobbing and slow yaw drift.
              b.feedT -= dt;
              b.feedPhase += dt * 2;
              b.h = FEED_H + Math.sin(b.feedPhase) * 0.06;
              b.yaw += dt * (Math.random() - 0.5) * 0.6;
              b.pitch = Math.sin(b.feedPhase * 0.5) * 0.08;
              b.roll = 0;
              b.ent.setFlapSpeed(140);
              if (b.feedT <= 0) {
                // Loiter's over — launch. 10% of the time the bee does an "S"
                // (snake-like weave to a farther target); otherwise a shallow
                // nearby seek hop.
                b.sx = b.x;
                b.sz = b.z;
                b.sh = b.h;
                const isS = Math.random() < 0.1;
                b.mode = isS ? "S" : "seek";
                const r = isS
                  ? 5 + Math.random() * 10 // S goes farther
                  : 0.05 + Math.random() * 2.5; // seek stays close
                const ang = Math.random() * Math.PI * 2;
                b.tx = Math.max(-bx, Math.min(bx, b.sx + Math.cos(ang) * r));
                b.tz = Math.max(-bz, Math.min(bz, b.sz + Math.sin(ang) * r));
                b.th = FEED_H;
                b.apex = FEED_H + 0.6 + Math.random() * 0.5; // barely above grass
                if (isS) {
                  // Build the S-curve as an arc-length-sampled polyline so the
                  // snake moves at the same constant speed along its weave.
                  const dist = Math.max(0.01, Math.hypot(b.tx - b.sx, b.tz - b.sz));
                  const ux = (b.tx - b.sx) / dist, uz = (b.tz - b.sz) / dist;
                  const pxx = -uz, pzz = ux; // perpendicular (lateral) axis
                  const A = 0.9 + Math.random() * 1.3; // lateral amplitude
                  const waves = 2 + Math.random() * 2; // 2-4 full S-waves
                  const N = 120;
                  const pts = [];
                  const cum = [0];
                  for (let i = 0; i <= N; i++) {
                    const t = i / N;
                    const fwd = dist * t;
                    // Taper the lateral sine to zero at both ends so the S
                    // starts exactly at the launch point and ends exactly at
                    // the target — no position snap when it settles into feed.
                    const tap = Math.sin(t * Math.PI);
                    const lat = A * Math.sin(t * waves * Math.PI * 2) * tap;
                    const x = b.sx + ux * fwd + pxx * lat;
                    const z = b.sz + uz * fwd + pzz * lat;
                    pts.push({ x, z });
                    if (i > 0) {
                      const dx = pts[i].x - pts[i - 1].x;
                      const dz = pts[i].z - pts[i - 1].z;
                      cum.push(cum[i - 1] + Math.hypot(dx, dz));
                    }
                  }
                  b.spath = { pts, cum, len: cum[N] };
                  b.waves = waves;
                  b.flyDur = b.spath.len / BEE_SPEED;
                } else {
                  const dist = Math.max(0.01, Math.hypot(b.tx - b.sx, b.tz - b.sz));
                  // Constant flying speed regardless of distance OR apex height:
                  // time each climb/descent leg from its 3D path length (half the
                  // horizontal distance plus the vertical rise), so a short hop
                  // with a big vertical rise isn't faster than a long one.
                  const vert = Math.max(0, b.apex - b.sh);
                  const legLen = Math.hypot(dist / 2, vert);
                  const legT = legLen / BEE_SPEED;
                  b.upT = legT;
                  b.downT = legT;
                  b.flyDur = b.upT + b.downT;
                }
                b.flyT = 0;
                b.loopCx = (b.sx + b.tx) / 2;
                b.loopCz = (b.sz + b.tz) / 2;
                b.state = "fly";
              }
            } else {
              // Seeking has two phases along the total flight time, each with
              // its own absolute duration so the speed stays constant:
              //   flyT in [0, upT)  ARC UP   : climb to the apex, easing
              //                                horizontally to the midpoint.
              //   flyT in [upT,1)   ARC DOWN : descend from the apex down to
              //                                the target at the same speed.
              b.flyT += dt;
              b.ent.setFlapSpeed(140);
              const t = Math.min(1, b.flyT / b.flyDur);
              if (b.mode === "S") {
                // S-mode: snake along the precomputed arc-length path at a
                // constant speed. Find the point at arc-length fraction t.
                const cum = b.spath.cum;
                const target = t * b.spath.len;
                let lo = 0, hi = cum.length - 1;
                while (lo < hi) {
                  const m = (lo + hi) >> 1;
                  if (cum[m] < target) lo = m + 1;
                  else hi = m;
                }
                const i = lo;
                const seg0 = b.spath.pts[i - 1] || b.spath.pts[0];
                const seg1 = b.spath.pts[i];
                const span = cum[i] - cum[i - 1] || 1;
                const f = (target - (cum[i - 1] || 0)) / span;
                const px_ = seg0.x + (seg1.x - seg0.x) * f;
                const pz_ = seg0.z + (seg1.z - seg0.z) * f;
                // Face along the actual direction of travel (velocity delta),
                // which flows smoothly — the polyline slope awkwardly snaps at
                // the S's corners and makes the bee look like it whips around.
                const dx = px_ - (b.px === undefined ? b.sx : b.px);
                const dz = pz_ - (b.pz === undefined ? b.sz : b.pz);
                b.px = px_;
                b.pz = pz_;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.x = px_;
                b.z = pz_;
                // Rise gently over the first half, settle on the second half.
                b.h = b.sh + (b.apex - b.sh) * Math.sin(t * Math.PI);
                b.pitch = Math.cos(t * Math.PI) * 0.3;
                b.roll = Math.sin(t * b.waves * Math.PI * 2) * 0.4;
                if (t >= 1) {
                  // Already at the target (the S is tapered to end there), so
                  // settle into feed without any position snap.
                  b.spath = null;
                  const roll = Math.random();
                  b.feedT = roll < 0.33 ? 0.5 : roll < 0.66 ? 1 : 3;
                  b.state = "feed";
                  continue;
                }
                b.group.position.set(b.x, b.h, b.z);
                b.group.rotation.set(b.pitch, b.yaw, b.roll, "YXZ");
                continue;
              }
              if (b.flyT < b.upT) {
                // Climb phase, 0..1 through it.
                const lt = Math.min(1, b.flyT / b.upT);
                const e = lt * lt * (3 - 2 * lt); // smoothstep
                const bump = Math.sin(lt * Math.PI / 2); // 0 -> 1 (still rising)
                b.x = b.sx + (b.loopCx - b.sx) * e;
                b.z = b.sz + (b.loopCz - b.sz) * e;
                b.h = b.sh + (b.apex - b.sh) * bump;
                const dx = b.loopCx - b.sx;
                const dz = b.loopCz - b.sz;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.pitch = 0.35; // climbing
                b.roll = Math.sin(b.flyT * 6) * 0.1;
              } else {
                // Descend phase, 0..1 through it.
                const lt = Math.min(1, (b.flyT - b.upT) / b.downT);
                const e = lt * lt * (3 - 2 * lt); // smoothstep
                const bump = Math.cos(lt * Math.PI / 2); // 1 -> 0 (descending)
                b.x = b.loopCx + (b.tx - b.loopCx) * e;
                b.z = b.loopCz + (b.tz - b.loopCz) * e;
                b.h = b.sh + (b.apex - b.sh) * bump;
                const dx = b.tx - b.loopCx;
                const dz = b.tz - b.loopCz;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.pitch = -0.35; // diving
                b.roll = Math.sin(b.flyT * 6) * 0.1;
              }
              if (t >= 1) {
                // Arrived at the target: settle briefly, then seek again.
                b.x = b.tx;
                b.z = b.tz;
                b.h = FEED_H;
                // Loiter a random duration: ~1/3 chance each of 0.5s, 1s, 3s.
                const roll = Math.random();
                b.feedT = roll < 0.33 ? 0.5 : roll < 0.66 ? 1 : 3;
                b.state = "feed";
                continue;
              }
            }
            b.group.position.set(b.x, b.h, b.z);
            b.group.rotation.set(b.pitch, b.yaw, b.roll, "YXZ");
          }
        });

        // --- Dandelions: ~20 decorative plants scattered across the lawn. ---
        // A random mix of flower and seed phases; ~75% grow as a bunch (a
        // clump of 2-5 fanned stems), the rest are single plants. They're
        // mowed down like the grass and regrow after a random delay.
        const DANDELION_COUNT = isMobile ? 12 : 40;
        const dandelions = [];
        for (let i = 0; i < DANDELION_COUNT; i++) {
          // Pick a spot on the lawn, keeping the mower's starting patch clear.
          let x, z;
          do {
            x = (Math.random() * 2 - 1) * bx;
            z = (Math.random() * 2 - 1) * bz;
          } while (Math.hypot(x, z) < 6);
          const flower = Math.random() < 0.5; // half seed puff, half yellow bloom
          const ent = createDandelion(sim, {
            flower,
            bunch: Math.random() < 0.75, // 75% bunches, 25% single
            stemHeight: 1.1,
            stemRadius: 0.02,
            headRadius: 0.14,
            position: [x, 0, z],
            rotation: [0, Math.random() * Math.PI * 2, 0],
          });
          dandelions.push({ ent, x, z, flower, grown: true, regrowT: 0 });
        }

        // Creatures checkbox: toggle all bugs (midges, butterflies, dragonflies, swarms).
        const creaturesCheckbox = document.getElementById("creatures-checkbox");
        const applyCreatures = () => {
          creaturesEnabled = creaturesCheckbox.checked;
          flies.mesh.visible = creaturesEnabled;
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          for (const d of dragonflies) d.group.visible = creaturesEnabled;
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled;
          for (const b of bees) b.group.visible = creaturesEnabled;
        };
        creaturesCheckbox.addEventListener("change", applyCreatures);

        createFPSCounter(sim);
        createGCStats(sim);
        createEntityStats(sim);
      }

      setup(sim);
      sim.start();
    </script>
  </body>
</html>
