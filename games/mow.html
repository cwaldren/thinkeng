<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moasis</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
        display: none;
      }
      #side {
        position: absolute;
        top: 78px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        color: #fff;
        pointer-events: auto;
        font-size: 0.9rem;
        display: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">Moasis</h1>
      <div
        id="mowed-counter"
        style="
          margin: 2px 0 0;
          font-size: 0.85rem;
          opacity: 0;
          transform: translateX(-24px);
          transition:
            opacity 0.6s ease,
            transform 0.6s ease;
        "
      >
        <span id="mowed-count">0</span> <span id="mowed-label">dandelions</span>
      </div>
      <p
        id="hint"
        style="
          display: flex;
          gap: 0.4em;
          margin: 4px 0 0;
          font-size: 0.85rem;
          opacity: 0.5;
        "
      >
        <span id="hint-move">W/A/S/D or arrow keys to move.</span>
        <span id="hint-orbit">Space toggles orbit camera.</span>
      </p>
      <div
        id="fov-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Field of View
          <span id="fov-value" style="font-weight: bold">90°</span>
        </div>
        <input
          type="range"
          id="fov-slider"
          min="30"
          max="100"
          step="1"
          value="90"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="gaze-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Gaze <span id="gaze-value">-30°</span>
        </div>
        <input
          type="range"
          id="gaze-slider"
          min="-30"
          max="30"
          step="1"
          value="-30"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="offset-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Forward Offset <span id="offset-value">-0.45</span>
        </div>
        <input
          type="range"
          id="offset-slider"
          min="-1"
          max="2"
          step="0.05"
          value="-0.45"
          style="width: 180px; vertical-align: middle"
        />
      </div>
    </div>

    <div id="side">
      <label
        id="creatures-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="creatures-checkbox" checked />
        Creatures
      </label>
      <label
        id="sandbox-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="sandbox-checkbox" />
        Sandbox
      </label>
      <div id="sandbox-panel" style="display: none">
        <div
          id="sun-control"
          style="margin-top: 8px; font-size: 0.9rem; pointer-events: auto"
        >
          <label
            id="manual-time-toggle"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 6px;
              font-size: 0.9rem;
              pointer-events: auto;
              cursor: pointer;
            "
          >
            <input type="checkbox" id="manual-time-checkbox" />
            Manual time (SPOILERS!!!)
          </label>
          <div style="opacity: 0.8; margin-bottom: 4px">
            Sun <span id="sun-clock">12:00</span>
            <span id="sun-phase" style="opacity: 0.6; margin-left: 4px"
              >noon</span
            >
          </div>
          <input
            type="range"
            id="sun-slider"
            min="0"
            max="24"
            step="0.05"
            value="12"
            style="width: 180px; vertical-align: middle"
          />
        </div>
        <div
          id="sun-angle-control"
          style="
            display: none;
            margin-top: 8px;
            font-size: 0.9rem;
            pointer-events: auto;
          "
        >
          <div
            style="
              opacity: 0.6;
              font-family: monospace;
              font-size: 0.75rem;
              margin-top: 4px;
            "
          >
            Sun pos <span id="sun-pos">—</span> · dir
            <span id="sun-dir">—</span>
          </div>
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Sun azimuth
            <span id="sun-az-value" style="font-weight: bold">90°</span>
          </div>
          <input
            type="range"
            id="sun-az-slider"
            min="0"
            max="360"
            step="1"
            value="90"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Sun elevation
            <span id="sun-el-value" style="font-weight: bold">30°</span>
          </div>
          <input
            type="range"
            id="sun-el-slider"
            min="0"
            max="89"
            step="1"
            value="30"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Earth angle above horizon
            <span id="earth-angle-value" style="font-weight: bold">6°</span>
          </div>
          <input
            type="range"
            id="earth-angle-slider"
            min="0"
            max="45"
            step="1"
            value="6"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Earth distance
            <span id="earth-dist-value" style="font-weight: bold">157</span>
          </div>
          <input
            type="range"
            id="earth-dist-slider"
            min="50"
            max="250"
            step="1"
            value="157"
            style="width: 180px; vertical-align: middle"
          />
          <button
            id="copy-config"
            style="
              margin-top: 10px;
              padding: 4px 12px;

            "
          >
            Copy config
          </button>
        </div>
        <div
          id="grass-control"
          style="margin-top: 12px; font-size: 0.9rem; pointer-events: auto"
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Cut Height
            <span id="cut-height-value" style="font-weight: bold">0.20m</span>
          </div>
          <input
            type="range"
            id="cut-height-slider"
            min="0.01"
            max="0.5"
            step="0.01"
            value="0.2"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Grow Rate
            <span id="grow-rate-value" style="font-weight: bold">0.005</span>
          </div>
          <input
            type="range"
            id="grow-rate-slider"
            min="0.001"
            max="0.1"
            step="0.001"
            value="0.005"
            style="width: 180px; vertical-align: middle"
          />
        </div>
        <div
          id="density-control"
          style="margin-top: 12px; font-size: 0.9rem; pointer-events: auto"
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Grass Density <span id="density-total"></span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center">
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              Grid cols
              <input
                type="number"
                id="density-cols"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              rows
              <input
                type="number"
                id="density-rows"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label
              style="display: flex; flex-direction: column; font-size: 0.8rem"
            >
              per patch
              <input
                type="number"
                id="density-n"
                min="1"
                max="10000"
                step="50"
                value="2000"
                style="width: 80px"
              />
            </label>
          </div>
          <button
            id="density-apply"
            style="
              margin-top: 8px;
              padding: 4px 12px;
              font-size: 0.85rem;
              cursor: pointer;
            "
          >
            Apply (reload)
          </button>
        </div>
      </div>
    </div>
    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createGnats,
      } from "engine/primitives.js";
      import {
        createLawnmower,
        createButterfly,
        createDragonfly,
        createFlies,
        createDandelion,
        createBumblebee,
        createFirefly,
        createFence,
        createGrass,
        createEarth,
        createFPSCounter,
        createGCStats,
        createEntityStats,
      } from "engine/components.js";
      import {} from "engine/materials.js";
      import * as THREE from "three";

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x000000,
        enableShadows: true,
      });

      // --- Global sun: a directional source beaming straight down from directly
      // overhead, lighting BOTH the moon surface and the Earth. Parallel rays,
      // so the moon's floor (all facing up) is fully lit while the Earth's lower
      // hemisphere — the half turned away from the sun toward the moon — falls to
      // a crisp, real day/night terminator.
      const SUN_INTENSITY = 3.0;
      const sunLight = new THREE.DirectionalLight(0xfff2d9, SUN_INTENSITY);
      // Offset the sun toward the horizon so the day/night terminator cuts
      // across the globe at an angle, tilting the Earth's shadowed side rather
      // than a perfectly horizontal shade line. The sun is parked very far away
      // along that direction (aimed back at the origin) so its rays arrive
      // genuinely parallel — an effectively infinite distance like the real sun —
      // making the light's angle independent of the moon/Earth's position.
      const SUN_FLAT = 20000; // large but finite stand-in for "infinitely far"
      // The cinematic sun direction, driven by two sandbox sliders: azimuth
      // (rotation around the world Y axis) and elevation (angle above the
      // ground plane). Derived so the default matches (180, 320, 120).
      const SUN_AZ = 90 * (Math.PI / 180); // azimuth 90° (light from the side)
      const SUN_EL = 30 * (Math.PI / 180); // elevation 30° (low, grazing)
      let sunAzimuth = SUN_AZ;
      let sunElevation = SUN_EL;
      // Solar declination for the current real-world day, tilting the Earth's
      // day/night terminator. δ = 23.45° · sin(360/365 · (N − 81)), where N is
      // the day of the year. Applied as a roll of the sun's direction around
      // the camera's view axis so the crescent tilts by δ like the real sky.
      const declinationDeg = () => {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const dayOfYear = Math.floor((now - start) / 86400000); // N
        return (
          23.45 * Math.sin((360 / 365) * (dayOfYear - 81) * (Math.PI / 180))
        );
      };
      // Earth's altitude above the horizon at the reveal, in degrees (0-45).
      // Reveal parks the Earth ahead of the camera; this is the elevation of
      // that line of sight above the ground plane.
      let earthAngleDeg = 6;
      // Earth's straight-line distance from the camera at the reveal, in units.
      let earthDistance = 157;
      const _sunDir0Base = new THREE.Vector3();
      const updateSunDir = () => {
        const ce = Math.cos(sunElevation);
        _sunDir0Base
          .set(
            ce * Math.sin(sunAzimuth),
            Math.sin(sunElevation),
            ce * Math.cos(sunAzimuth),
          )
          .normalize();
      };
      updateSunDir();
      const _sunDir0 = _sunDir0Base.clone();
      sunLight.position.copy(_sunDir0).multiplyScalar(SUN_FLAT);
      sunLight.target.position.set(0, 0, 0);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = SUN_FLAT;
      sunLight.shadow.camera.left = -260;
      sunLight.shadow.camera.right = 260;
      sunLight.shadow.camera.top = 260;
      sunLight.shadow.camera.bottom = -260;
      sunLight.shadow.bias = -0.0005;
      sim.scene.add(sunLight);
      sim.scene.add(sunLight.target);

      // Drop the engine's default directional light so it isn't fighting the
      // real sun.
      const engineSun = sim.scene.children.find((c) => c.isDirectionalLight);
      if (engineSun) sim.scene.remove(engineSun);

      // Low ambient so surfaces facing away from the sun (the Earth's far
      // side) genuinely fall to shadow rather than being washed out.
      const ambient = sim.scene.children.find((c) => c.isAmbientLight);
      ambient.intensity = 0;

      // --- Field-of-view slider: adjust the camera zoom live ---
      const fovSlider = document.getElementById("fov-slider");
      const fovValueEl = document.getElementById("fov-value");
      const applyFov = () => {
        sim.camera.fov = parseFloat(fovSlider.value);
        sim.camera.updateProjectionMatrix();
        fovValueEl.textContent = `${Math.round(sim.camera.fov)}°`;
      };
      fovSlider.addEventListener("input", applyFov);
      applyFov();

      // --- Gaze slider: first-person camera pitch (look down / look up) ---
      const gazeSlider = document.getElementById("gaze-slider");
      const gazeValueEl = document.getElementById("gaze-value");
      let gazePitch = -30 * (Math.PI / 180); // default slightly down at the reel
      const applyGaze = () => {
        gazePitch = parseFloat(gazeSlider.value) * (Math.PI / 180);
        gazeValueEl.textContent = `${Math.round(gazeSlider.value)}°`;
      };
      gazeSlider.addEventListener("input", applyGaze);
      applyGaze();

      // --- Forward-offset slider: where on the local +Z (handle/behind) axis
      // the first-person camera floats, vs the front of the mower ---
      const offsetSlider = document.getElementById("offset-slider");
      const offsetValueEl = document.getElementById("offset-value");
      let fwdOffset = -0.45;
      const applyOffset = () => {
        fwdOffset = parseFloat(offsetSlider.value);
        offsetValueEl.textContent = fwdOffset.toFixed(2);
      };
      offsetSlider.addEventListener("input", applyOffset);
      applyOffset();

      function setup(sim) {
        // Grass: single instanced mesh, 3x3 patches tiled across 100x100.
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
          // Show just the mow hint on mobile (hide the title + control panels,
          // which stay display:none anyway); it fades out on the first tap. It
          // stays hidden until the boot countdown's "MOW!" clears, showing the
          // hint only once the player is free to move (see the intro driver).
          const hint = document.getElementById("hint");
          hint.style.display = "none";
          hint.textContent = "Tap and drag to mow.";
          const ui = document.getElementById("ui");
          ui.style.display = "block";
          ui.querySelector("h1").style.display = "none";
        } else {
          // Desktop: show the control panel. It stays hidden by default so it
          // never flashes for a frame on mobile before being suppressed.
          document.getElementById("ui").style.display = "block";
        }
        // Density config is editable in the UI; applied values persist and are
        // consumed here on the next load (Apply triggers a reload).
        const density = {
          COLS: Number(localStorage.getItem("mow-cols")) || 7,
          ROWS: Number(localStorage.getItem("mow-rows")) || 7,
          N: Number(localStorage.getItem("mow-n")) || (isMobile ? 500 : 5000),
        };
        const clampInt = (v, lo, hi) =>
          Math.max(lo, Math.min(hi, Math.round(v)));
        density.COLS = clampInt(density.COLS, 1, 20);
        density.ROWS = clampInt(density.ROWS, 1, 20);
        density.N = clampInt(density.N, 1, 10000);
        const { COLS, ROWS, N } = density;
        const W = 3,
          D = 3;
        const total = COLS * ROWS * N;

        // Dirt patch beneath the lawn (inside the fence): a dirt-brown rectangular
        // plane sitting just above the meadow ground, so the mowable patch reads
        // as fresh turned soil against the surrounding field.
        const dirtGeo = new THREE.PlaneGeometry(COLS * W + 0.4, ROWS * D + 0.4);
        const dirtMat = new THREE.MeshStandardMaterial({ color: 0x2b180c });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.y = -0.005;
        dirt.receiveShadow = true;
        dirt.castShadow = true;
        sim.scene.add(dirt);

        // RADIAL BAND of crater centers outside the glass territory.
        // Radial band on the moon's surface where craters live, clear of the
        // grass cube. The cube's walls sit 0.6 past the lawn edges.
        const cubeR =
          Math.hypot((COLS * W) / 2 + 0.6, (ROWS * D) / 2 + 0.6) + 4; // just outside the nearest wall, plus breathing room
        const GROUND_R = 48; // stay off the ground disc's very edge
        const craterCenters = [];
        for (let i = 0; i < 26; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rr = cubeR + Math.random() * (GROUND_R - cubeR);
          // Sieve for radius: bias toward the big impact basins but sprinkle
          // in plenty of small ones (a power-skewed spread).
          const r = 7 * Math.pow(Math.random(), 2.6) + 0.5;
          craterCenters.push({
            x: Math.cos(ang) * rr,
            z: Math.sin(ang) * rr,
            r,
            depth: r * 0.18,
            rim: r * 0.02 + 0.03,
          });
        }
        // A few enormous basin craters far from the lawn for scale.
        for (let i = 0; i < 4; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rr = cubeR + 10 + Math.random() * (GROUND_R - cubeR - 10);
          const r = 12 + Math.random() * 16;
          craterCenters.push({
            x: Math.cos(ang) * rr,
            z: Math.sin(ang) * rr,
            r,
            depth: r * 0.18,
            rim: r * 0.02 + 0.03,
          });
        }

        // MOON's surface: a displaceable heightfield (real geometry) so the
        // sinks read as actual craters — the sun casts real shadows into the
        // bowls and one basin can occlude another. Each crater is a sunken
        // floor that rises through the walls to a slightly raised rim, then
        // falls back to the ground. A canvas albedo map paints the darker
        // basin floors so the crater identity survives even in flat light.
        const groundMat = new THREE.MeshStandardMaterial({
          color: 0xffffff, // modulated by the albedo map below
          roughness: 1,
          metalness: 0,
        });
        // Radial-gradient crater albedo drawn into the ground's UV space.
        const ALB = 1024;
        const albedo = (() => {
          const cv = document.createElement("canvas");
          cv.width = cv.height = ALB;
          const g = cv.getContext("2d");
          // Baseline lunar gray (#94908D).
          g.fillStyle = "rgb(148,144,141)";
          g.fillRect(0, 0, ALB, ALB);
          const toU = (x) => ((x + GROUND_R) / (GROUND_R * 2)) * ALB;
          const toV = (z) => ((z + GROUND_R) / (GROUND_R * 2)) * ALB;
          for (const c of craterCenters) {
            // Cosmetic darkening of the bowl that fades into the surrounding
            // ground; the geometry supplies the real bump shape.
            const U = toU(c.x),
              V = toV(c.z);
            const px = c.r * (ALB / (GROUND_R * 2));
            const grad = g.createRadialGradient(U, V, 0, U, V, px * 0.62);
            grad.addColorStop(0.0, "rgba(58,55,52,0.9)");
            grad.addColorStop(1.0, "rgba(148,144,141,0)");
            g.fillStyle = grad;
            g.fillRect(U - px, V - px, px * 2, px * 2);
          }
          return new THREE.CanvasTexture(cv);
        })();
        groundMat.map = albedo;

        // Heightfield: shared bowl profile per crater.
        const craterHeight = (x, z) => {
          let y = 0;
          for (const c of craterCenters) {
            const dx = x - c.x,
              dz = z - c.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const t = d / c.r;
            const RIM_EDGE = 1.22; // outer falloff just past the crest
            if (t >= RIM_EDGE) continue;
            // Interior: flat-ish floor then walls rising to ground at t=1.
            const FLOOR_FRAC = 0.4;
            if (t < FLOOR_FRAC) {
              y += -c.depth;
            } else if (t < 1) {
              const u = (t - FLOOR_FRAC) / (1 - FLOOR_FRAC);
              y += -c.depth * (1 - u * u * (3 - 2 * u)); // smoothstep up
            }
            // Raised rim cresting just outside the radius, fading past RIM_EDGE.
            const rimPhase = (t - 1) / (RIM_EDGE - 1);
            y += c.rim * Math.sin(rimPhase * Math.PI);
          }
          return y;
        };

        // Dense ground disc; resolution scales with crater density so the rims
        // stay readable. Displaced in place, then normals recomputed.
        const groundGeo = new THREE.CircleGeometry(GROUND_R, 240, 200);
        groundGeo.rotateX(-Math.PI / 2);
        {
          const pos = groundGeo.attributes.position;
          const uv = groundGeo.attributes.uv;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i),
              z = pos.getZ(i);
            pos.setY(i, craterHeight(x, z));
            // Remap UV to the albedo canvas (disc -> square texture space).
            uv.setXY(
              i,
              (x + GROUND_R) / (GROUND_R * 2),
              (z + GROUND_R) / (GROUND_R * 2),
            );
          }
        }
        groundGeo.computeVertexNormals();
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.receiveShadow = true;
        // Cast too: the raised crater rims (and the plane generally) occlude
        // geometry in the shadow pass, so nothing casts through the moon.
        ground.castShadow = true;
        // Sink the whole lunar surface well below the dirt patch/grass so the
        // crater rims and undulations can't poke up through the lawn.
        ground.position.y = -2;
        sim.scene.add(ground);

        // Earth floating high in the moon's sky, off beyond the grass dome —
        // a small blue-green globe (#the reveal: we're mowing on the Moon).
        const earth = createEarth(sim, {
          radius: 7,
          position: [0, 16, -140],
        });
        let revealFired = false;

        // Star field: tiny points on a huge fixed-radius dome far beyond the Earth.
        // Star color follows the real stellar distribution (mostly white-blue
        // through white to yellow-orange, a few cool reds) via blackbody
        // temperature, and sizes vary (brighter/nearer stars read larger).
        const SKY_R = 260; // beyond everything in the scene
        const STAR_COUNT = 900;
        // Soft round star sprite (a bright core fading to transparent).
        const starSprite = (() => {
          const cv = document.createElement("canvas");
          const size = 64;
          cv.width = cv.height = size;
          const g = cv.getContext("2d");
          const grad = g.createRadialGradient(
            size / 2,
            size / 2,
            0,
            size / 2,
            size / 2,
            size / 2,
          );
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.35, "rgba(255,255,255,0.7)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, size, size);
          const tex = new THREE.CanvasTexture(cv);
          tex.colorSpace = THREE.SRGBColorSpace;
          return tex;
        })();

        // Blackbody temperature -> soft star tint. Hot stars are blue-white,
        // cool stars red-orange; the white ones get only a faint cast so the
        // sky leans whitish overall.
        const starColorAt = (kelvin) => {
          const t = kelvin / 100;
          let r, g, b;
          if (t <= 66) {
            r = 255;
            g = 99.47 * Math.log(t) - 161.12;
            b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04;
          } else {
            r = 329.7 * Math.pow(t - 60, -0.1332);
            g = 288.12 * Math.pow(t - 60, -0.0755);
            b = 255;
          }
          // Clamp and soften toward white so the full sky isn't oversaturated.
          return new THREE.Color(
            Math.max(0, Math.min(1, (r / 255) * 0.5 + 0.5)),
            Math.max(0, Math.min(1, (g / 255) * 0.5 + 0.5)),
            Math.max(0, Math.min(1, (b / 255) * 0.5 + 0.5)),
          );
        };

        // Assign each star a temperature (a bimodal-ish real spread, mostly
        // mid/k-hot with a tail of cool reds) and a size bucket 0..3.
        const buckets = [[], [], [], []];
        for (let i = 0; i < STAR_COUNT; i++) {
          // Random direction on the upper sky dome.
          let dx, dy, dz;
          do {
            dx = Math.random() * 2 - 1;
            dy = Math.random() * 2 - 1;
            dz = Math.random() * 2 - 1;
          } while (dx * dx + dy * dy + dz * dz > 1 || dy < 0.02);
          const len = Math.hypot(dx, dy, dz);
          // Slight pinch toward the zenith so the band near the horizon stays
          // sparse, like a real moon-sky.
          const elev = Math.pow(Math.abs(dy / len), 1.3);
          const c = starColorAt(2500 + Math.pow(Math.random(), 2) * 7800);
          const size = (Math.random() < 0.15) | 0; // most are small, some larger
          const star = {
            x: (dx / len) * SKY_R,
            y: elev * SKY_R * 0.9,
            z: (dz / len) * SKY_R,
            r: Math.round(c.r * 255),
            g: Math.round(c.g * 255),
            b: Math.round(c.b * 255),
          };
          buckets[size].push(star);
        }

        // One Points per size bucket (PointsMaterial has a single size uniform).
        const starPeel = new THREE.Group();
        const starBucketSizes = [0.9, 1.6, 2.4, 3.4];
        buckets.forEach((stars, bi) => {
          if (stars.length === 0) return;
          const pos = new Float32Array(stars.length * 3);
          const col = new Float32Array(stars.length * 3);
          stars.forEach((s, i) => {
            pos[i * 3] = s.x;
            pos[i * 3 + 1] = s.y;
            pos[i * 3 + 2] = s.z;
            col[i * 3] = s.r / 255;
            col[i * 3 + 1] = s.g / 255;
            col[i * 3 + 2] = s.b / 255;
          });
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
          const mat = new THREE.PointsMaterial({
            size: starBucketSizes[bi],
            map: starSprite,
            vertexColors: true,
            transparent: true,
            depthWrite: false,
            sizeAttenuation: false,
          });
          const pts = new THREE.Points(geo, mat);
          pts.frustumCulled = false;
          starPeel.add(pts);
        });
        sim.scene.add(starPeel);

        const bladeGeo = new THREE.ConeGeometry(0.08, 1.7, 4);
        const bladeMat = new THREE.MeshStandardMaterial({
          color: 0x44aa55,
          roughness: 0.8,
        });
        // Gentle breeze: sway lives in the vertex shader, so it costs nothing
        // on the CPU (only the regrowing blades touch instance matrices). It
        // bends in local space before the instance transform, so each blade
        // keeps its own scale/orientation and its base stays anchored.
        const swayUniforms = { uTime: { value: 0 } };
        let swaying = true; // grass wind-blows by day, freezes at the reveal
        let gravityOn = true; // clipping gravity: off after the reveal, back on at dawn
        bladeMat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = swayUniforms.uTime;
          // Declare the uniform at global scope (#include <common> is the first
          // include); #include <begin_vertex> sits inside main().
          shader.vertexShader = shader.vertexShader
            .replace(
              "#include <common>",
              "#include <common>\nuniform float uTime;\nattribute float aGrowth;",
            )
            .replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>
#ifdef USE_INSTANCING
            // h: 0 at the base, 1 at the tip (cone height 1.7, centered at 0).
            float h = clamp((transformed.y + 0.85) / 1.7, 0.0, 1.0);
            // Blade base position = instance translation (world space).
            vec3 _base = instanceMatrix[3].xyz;
            // Per-blade phase so neighboring blades don't wave in lockstep.
            float _ph = fract(sin(dot(_base.xz * 0.13, vec2(12.9898, 78.233))) * 43758.5453);
            // A shallow wave drifting across the lawn, gentler near the base.
            float _wave = sin(_base.x * 1.2 + uTime * 1.6 + _ph * 6.2831)
                        + cos(_base.z * 1.4 + uTime * 1.2 + _ph * 6.2831);
            // Sway is bound to the blade's own height: freshly-cut blades (low
            // growth) stand still, reaching full sway only at full height. An
            // exponential curve keeps it near zero until the blade is most of
            // the way grown — sway barely registers until ~max height.
            float _g = clamp(aGrowth, 0.0, 1.0);
            _g = pow(_g, 6.0);
            transformed.x += _wave * h * h * 0.025 * _g;
#endif
`,
            );
        };
        const grassMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, total);
        const growthAttr = new THREE.InstancedBufferAttribute(
          new Float32Array(total),
          1,
        );
        bladeGeo.setAttribute("aGrowth", growthAttr);
        const growthArr = growthAttr.array;
        grassMesh.castShadow = false;
        grassMesh.receiveShadow = true;
        const dummy = new THREE.Object3D();
        const bladePos = [];
        const bladeRot = [];
        const bladeScale = new Float32Array(total);
        const bladeGrowth = new Float32Array(total);
        // Distance from the cone's center to its tip. Blades are never squashed:
        // they stay full length and sink into the ground by the un-grown amount
        // (see the grow loop), so the tip just peeks out of the soil when cut.
        const BLADE_HALF = bladeGeo.parameters.height / 2;
        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const ox = (c - COLS / 2 + 0.5) * W;
            const oz = (r - ROWS / 2 + 0.5) * D;
            const hw = W / 2,
              hd = D / 2;
            for (let i = 0; i < N; i++) {
              const s = 0.6 + Math.random() * 0.8;
              bladeScale[idx] = s;
              bladeGrowth[idx] = 0; // boot cinematic: grass starts underground
              growthArr[idx] = 0; // keep sway attribute in sync
              bladePos[idx] = new THREE.Vector3(
                ox + Math.random() * W - hw,
                0,
                oz + Math.random() * D - hd,
              );
              bladeRot[idx] = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(
                  (Math.random() - 0.5) * 0.35,
                  Math.random() * Math.PI * 2,
                  (Math.random() - 0.5) * 0.35,
                ),
              );
              dummy.position.set(
                bladePos[idx].x,
                BLADE_HALF * bladeScale[idx] * (bladeGrowth[idx] - 1),
                bladePos[idx].z,
              );
              dummy.quaternion.copy(bladeRot[idx]);
              dummy.scale.set(s, s, s);
              dummy.updateMatrix();
              grassMesh.setMatrixAt(idx++, dummy.matrix);
            }
          }
        }
        grassMesh.instanceMatrix.needsUpdate = true;
        growthAttr.needsUpdate = true;
        sim.scene.add(grassMesh);

        // Spatial grid over the lawn so cut checks only test blades near the
        // mower instead of all of them every frame. Blade positions never move,
        // so the buckets are built once.
        const CELL = 1.5; // grid cell size (world units)
        const GRID_COLS = Math.ceil((COLS * W) / CELL);
        const GRID_ROWS = Math.ceil((ROWS * D) / CELL);
        const lawnMinX = -(COLS * W) / 2,
          lawnMinZ = -(ROWS * D) / 2;
        const gridCells = new Array(GRID_COLS * GRID_ROWS);
        const counts = new Uint32Array(GRID_COLS * GRID_ROWS);
        const cellIndex = (x, z) => {
          const cx = Math.min(
            GRID_COLS - 1,
            Math.max(0, Math.floor((x - lawnMinX) / CELL)),
          );
          const cz = Math.min(
            GRID_ROWS - 1,
            Math.max(0, Math.floor((z - lawnMinZ) / CELL)),
          );
          return cz * GRID_COLS + cx;
        };
        for (let i = 0; i < total; i++)
          counts[cellIndex(bladePos[i].x, bladePos[i].z)]++;
        // Prefix-sum so each cell's indices are a contiguous slice of one array.
        const cellStart = new Int32Array(gridCells.length + 1);
        for (let i = 0; i < gridCells.length; i++)
          cellStart[i + 1] = cellStart[i] + counts[i];
        const cellIndices = new Uint32Array(total);
        {
          const cursor = new Int32Array(gridCells.length);
          for (let i = 0; i < total; i++) {
            const ci = cellIndex(bladePos[i].x, bladePos[i].z);
            cellIndices[cellStart[ci] + cursor[ci]++] = i;
          }
        }
        // Iterate blades inside a footprint defined as a box in mower-local
        // space: half-width `hw` across the reel (local X), half-depth `hd`
        // along the mower (local Z), and `offZ` shifting the box forward/back
        // along the mower's local Z in front of its origin.
        const visitCutArea = (hw, hd, offZ, cb) => {
          const o = mower.mesh.position;
          const q = mower.mesh.quaternion;
          // Box center = mower origin pushed along its local Z by offZ.
          const center = _boxCenter.set(0, 0, offZ).applyQuaternion(q).add(o);
          // Orient the footprint axes into world space to bound its AABB.
          const fx = _fx.set(hw, 0, 0).applyQuaternion(q);
          const fz = _fz.set(0, 0, hd).applyQuaternion(q);
          const minX = center.x - Math.abs(fx.x) - Math.abs(fz.x);
          const maxX = center.x + Math.abs(fx.x) + Math.abs(fz.x);
          const minZ = center.z - Math.abs(fx.z) - Math.abs(fz.z);
          const maxZ = center.z + Math.abs(fx.z) + Math.abs(fz.z);
          const c0x = Math.max(0, Math.floor((minX - lawnMinX) / CELL));
          const c1x = Math.min(
            GRID_COLS - 1,
            Math.floor((maxX - lawnMinX) / CELL),
          );
          const c0z = Math.max(0, Math.floor((minZ - lawnMinZ) / CELL));
          const c1z = Math.min(
            GRID_ROWS - 1,
            Math.floor((maxZ - lawnMinZ) / CELL),
          );
          for (let cz = c0z; cz <= c1z; cz++) {
            for (let cx = c0x; cx <= c1x; cx++) {
              const ci = cz * GRID_COLS + cx;
              for (let k = cellStart[ci]; k < cellStart[ci + 1]; k++) {
                if (cb(cellIndices[k])) return true;
              }
            }
          }
          return false;
        };

        // Place a push lawnmower on the lawn. Keep the handle geometry params
        // here so the first-person camera can mount itself on the handle.
        const MOWER = {
          wheelRadius: 0.4,
          handleAngle: 0.75,
          handleLength: 1.7,
        };
        const mower = createLawnmower(sim, {
          wheelRadius: MOWER.wheelRadius,
          reelWidth: 1.25,
          bladeThickness: 0.01,
          blades: 4,
          handleAngle: MOWER.handleAngle,
          handleLength: MOWER.handleLength,
          bodyColor: 0x2a3d56,
          bladeColor: 0x014101,
          wheelColor: 0x1a1a1a,
          position: [0, 0, 0],
          rotation: [0, 0, 0],
        });

        // Fade the whole mower in/out by tuning every MeshStandardMaterial's
        // opacity across its object tree (wheels, reel, blades, handle, grip).
        // Returns the shared materials it touched so they can be restored.
        const mowerMats = new Set();
        const setMowerOpacity = (o) => {
          mower.mesh.traverse((obj) => {
            if (obj.isMesh && obj.material) {
              for (const m of Array.isArray(obj.material)
                ? obj.material
                : [obj.material]) {
                if (m.isMeshStandardMaterial) {
                  m.transparent = true;
                  m.opacity = o;
                  mowerMats.add(m);
                }
              }
            }
          });
        };
        // Boot: the mower starts transparent and fades in at the end of init.
        setMowerOpacity(0.0001);

        // Surround the grass lawn with a wooden fence. The lawn spans
        // COLS*W (x) by ROWS*D (z), centered on the origin; each side gets its
        // own fence segment sized (repeat) to span that edge, meeting at corners.
        const FENCE = {
          postHeight: 1.35,
          sectionWidth: 1.5,
          postColor: 0x922b2c,
          boardColor: 0xba9a59,
        };
        const lawnHalfW = (COLS * W) / 2;
        const lawnHalfD = (ROWS * D) / 2;
        const gap = 0.05;
        // How far in from the lawn bounds the mower is kept (mower half-width),
        // so it visually stops just short of the fence.
        const margin = 0.7;
        const sideFence = ({ length, position, rotation }) =>
          createFence(sim, {
            ...FENCE,
            repeat: Math.round(length / FENCE.sectionWidth),
            position,
            rotation,
          });
        sideFence({
          length: COLS * W,
          position: [0, 0, lawnHalfD + gap],
          rotation: [0, 0, 0],
        });
        sideFence({
          length: COLS * W,
          position: [0, 0, -lawnHalfD - gap],
          rotation: [0, Math.PI, 0],
        });
        sideFence({
          length: ROWS * D,
          position: [lawnHalfW + gap, 0, 0],
          rotation: [0, Math.PI / 2, 0],
        });
        sideFence({
          length: ROWS * D,
          position: [-lawnHalfW - gap, 0, 0],
          rotation: [0, -Math.PI / 2, 0],
        });

        // Glass cube around the patch: four walls + a lid rising 20m from the
        // ground, encasing the lawn (and the mower with it). Translucent, so
        // the scene shows through, and double-sided so it reads from inside
        // and out. depthWrite stays off so the walls' inner faces don't
        // occlude the grass/creatures behind them.
        const WALL_INSET = 0.6; // a bit beyond the fence so the boards don't poke through
        const CUBE_H = 20;
        // Fake "Earth day" sky painted on the cube's surfaces. The inside of the
        // dome reads as blue sky at noon, deepening to a red/purple sunset as
        // the sun slider drops, then turns fully transparent AT sunset so the
        // player suddenly sees out and realizes they're on the Moon.
        const skyCanvas = document.createElement("canvas");
        const skyCvS = 512;
        skyCanvas.width = skyCvS;
        skyCanvas.height = skyCvS;
        const skyCtx = skyCanvas.getContext("2d");
        const skyTex = new THREE.CanvasTexture(skyCanvas);
        skyTex.colorSpace = THREE.SRGBColorSpace;
        const _colorA = new THREE.Color();
        const _colorB = new THREE.Color();
        const lerpC = (a, b, t) => {
          _colorA.set(a);
          _colorB.set(b);
          return _colorA.lerp(_colorB, t).getStyle();
        };
        const DAY_TOP = "#3399ff",
          DAY_HOR = "#cfe8ff";
        const SET_TOP = "#5b3a6e",
          SET_HOR = "#ff7a3d";
        const DUSK_TOP = "#07070f",
          DUSK_HOR = "#140a1e"; // deep inky blue-black
        // p spans 0..~2 across the day: 0 at noon (deep blue), 1 at sunrise/
        // sunset (deep red), then fading through dusk toward a deep inky
        // black-blue as it approaches night. NIGHT_P is where it goes fully
        // transparent (the reveal).
        const NIGHT_P = 1.75;
        // Current sky phase (0 noon -> 2 night), read by paintGradient.
        let p = 0;
        // The sky DOMAINS: the 4 walls share one canvas (carrying the warning
        // text), while the ceiling gets its own text-free canvas so the message
        // never shows overhead.
        const ceilCanvas = document.createElement("canvas");
        ceilCanvas.width = ceilCanvas.height = skyCvS;
        const ceilCtx = ceilCanvas.getContext("2d");
        const ceilTex = new THREE.CanvasTexture(ceilCanvas);
        ceilTex.colorSpace = THREE.SRGBColorSpace;
        // Boot cinematic sequence state. `introActive` is true from load until
        // the intro finishes; `introT` counts seconds in; `wallsDawn` (0..1)
        // crossfades the walls from grey up to their real palette.
        let introActive = true;
        let introT = 0;
        let wallsDawn = 0;
        // Countdown phase timing (end of init: "3","2","1","MOW!", one/s).
        const COUNT_START = 10;
        const COUNT_SEC = 1;
        const INTRO_END = COUNT_START + 4;
        // "CONTAINMENT BREACH" / "LOW PRESSURE" warning: shown on the walls in
        // the 5 real-seconds leading up to the reveal, swapping every 1s.
        let breachActive = false;
        let breachT = 0;
        // Sky-paint throttling: track the last-painted phase and breach tick so
        // applySky only re-uploads the sky textures on a visible change.
        let lastPaintedP = -1;
        let lastBreachTick = -1;
        // Paint the shared gradient palette into a given context, compressing it
        // toward the bottom quarter (near the ground) where the mower's eye is.
        // Boot cinematic: the walls start a neutral GREY, crossfading to their
        // true day/dusk palette as the intro's `wallsDawn` (0..1) reaches 1.
        const INTRO_GREY_TOP = "#7c7c86",
          INTRO_GREY_HOR = "#b6b6be";
        const paintGradient = (ctx) => {
          let top, hor;
          if (p <= 1) {
            // Blue -> red as the sun approaches the horizon.
            top = lerpC(DAY_TOP, SET_TOP, p);
            hor = lerpC(DAY_HOR, SET_HOR, p);
          } else {
            // Red -> inky black-blue through dusk.
            const d = (p - 1) / (NIGHT_P - 1);
            top = lerpC(SET_TOP, DUSK_TOP, d);
            hor = lerpC(SET_HOR, DUSK_HOR, d);
          }
          // Fade from intro grey up to the real palette as wallsDawn climbs.
          if (introActive || wallsDawn < 1) {
            top = lerpC(INTRO_GREY_TOP, top, wallsDawn);
            hor = lerpC(INTRO_GREY_HOR, hor, wallsDawn);
          }
          ctx.fillStyle = top;
          ctx.fillRect(0, 0, skyCvS, skyCvS);
          // Overlay the horizon->top transition only across the bottom 25%
          // (canvas row 0 = wall top, row skyCvS = wall base) so the warm/dark
          // color hangs low near the ground where it reads.
          const startRow = skyCvS * 0.75;
          const g = ctx.createLinearGradient(0, startRow, 0, skyCvS);
          g.addColorStop(0, top);
          g.addColorStop(1, hor);
          ctx.fillStyle = g;
          ctx.fillRect(0, startRow, skyCvS, skyCvS);
        };
        // Draw the day-start message on the WALL fabric (shared by all four
        // walls; the ceiling has its own text-free canvas). Pre-mirrored to
        // cancel the BackSide flip so it reads correctly from inside the lawn.
        // Priority: intro boot messages -> countdown -> breach warning.
        const paintWallText = () => {
          let msg,
            big = false;
          if (introActive) {
            if (introT >= COUNT_START) {
              // Countdown: "3" / "2" / "1" / "MOW!", one per second.
              const i = Math.floor(introT - COUNT_START);
              const labels = ["3", "2", "1", "MOW!"];
              msg = labels[Math.min(i, labels.length - 1)];
              big = true;
            } else {
              // On mobile the walls are close, so the boot message wraps onto
              // two lines ("STARTING" / "SIMULATION.."); desktop keeps one line.
              const starting = Math.floor(introT / 2) % 2 === 0;
              msg = starting
                ? isMobile
                  ? ["STARTING", "SIMULATION.."]
                  : "STARTING SIMULATION.."
                : "PLEASE WAIT..";
              if (starting && isMobile) {
                skyCtx.save();
                skyCtx.translate(skyCvS / 2, 0);
                skyCtx.scale(-1, 1);
                skyCtx.translate(-skyCvS / 2, 0);
                skyCtx.fillStyle = "#ffffff";
                skyCtx.font = "bold 26px sans-serif";
                skyCtx.textAlign = "center";
                skyCtx.textBaseline = "middle";
                skyCtx.fillText(msg[0], skyCvS / 2, skyCvS * 0.75);
                skyCtx.fillText(msg[1], skyCvS / 2, skyCvS * 0.81);
                skyCtx.restore();
                return;
              }
            }
          } else if (breachActive) {
            msg =
              Math.floor(breachT) % 2 === 0
                ? "CONTAINMENT BREACH"
                : "LOW PRESSURE";
          } else {
            return;
          }
          skyCtx.save();
          skyCtx.translate(skyCvS / 2, 0);
          skyCtx.scale(-1, 1);
          skyCtx.translate(-skyCvS / 2, 0);
          skyCtx.fillStyle = "#ffffff";
          skyCtx.font = big ? "bold 78px sans-serif" : "bold 26px sans-serif";
          skyCtx.textAlign = "center";
          skyCtx.textBaseline = "middle";
          // Draw low on the wall (near the base) where the mower's camera looks;
          // big countdown digits sit just above the small boot text's line.
          skyCtx.fillText(msg, skyCvS / 2, big ? skyCvS * 0.82 : skyCvS * 0.78);
          skyCtx.restore();
        };
        const paintSky = (pv) => {
          p = pv;
          paintGradient(skyCtx);
          paintWallText();
          skyTex.needsUpdate = true;
          paintGradient(ceilCtx);
          ceilTex.needsUpdate = true;
        };
        const glassMat = new THREE.MeshPhysicalMaterial({
          map: skyTex,
          color: 0xffffff,
          emissive: 0xffffff, // sky walls glow from the texture, not lighting
          emissiveMap: skyTex,
          emissiveIntensity: 1.0,
          transparent: true,
          opacity: 0.85,
          roughness: 0.1,
          metalness: 0,
          // BackSide: the sky only renders on the INSIDE faces of the box.
          // Looking outward from within the lawn reads as Earth day sky;
          // from the outside the walls stay clear glass (back faces culled).
          side: THREE.BackSide,
          depthWrite: false,
        });
        // Glass sky dome: a bottomless cube (four walls + a ceiling, NO floor) so the
        // sky gradient renders on the interior faces above the lawn — there is
        // no sky plane underneath the ground for it to bleed through. Each
        // plane is a unit plane whose visible back face reads the sky from
        // inside the lawn.
        const domeW = lawnHalfW * 2 + WALL_INSET;
        const domeD = lawnHalfD * 2 + WALL_INSET;
        // The ceiling reuses the sky gradient but NOT the warning text, so it
        // gets its own (text-free) material on its own canvas.
        const ceilMat = new THREE.MeshPhysicalMaterial({
          map: ceilTex,
          color: 0xffffff,
          emissive: 0xffffff,
          emissiveMap: ceilTex,
          emissiveIntensity: 1.0,
          transparent: true,
          opacity: 0.85,
          roughness: 0.1,
          metalness: 0,
          side: THREE.BackSide,
          depthWrite: false,
        });
        const glassCube = new THREE.Group();
        const skyFaces = [];
        // Glass size of the shatter cells (world units). Each sealed face is a
        // single subdivided PlaneGeometry — one cheap draw call by day — and its
        // grid of triangles is split apart into individual shards at the reveal.
        const SHARD_CELL = 2.83;
        // PlaneGeometry lies in the XY plane (normal +Z, width along X, height
        // along Y). With a BackSide sky material we see the plane's BACK face,
        // so each wall's normal points OUTWARD (away from the lawn) and its
        // back face reads the sky from inside. Rotation is about Y to swing
        // the walls into place, never Z (which would lay them flat).
        const addFace = (
          width,
          height,
          ry,
          x,
          y,
          z,
          mat = glassMat,
          segX = 1,
          segY = 1,
        ) => {
          const p = new THREE.Mesh(
            new THREE.PlaneGeometry(width, height, segX, segY),
            mat,
          );
          p.rotation.set(0, ry, 0);
          p.position.set(x, y, z);
          glassCube.add(p);
          skyFaces.push(p);
        };
        const wallSegX = (w) => Math.max(1, Math.round(w / CELL));
        const wallSegY = Math.max(1, Math.round(CUBE_H / CELL));
        addFace(
          domeW,
          CUBE_H,
          0,
          0,
          CUBE_H / 2,
          domeD / 2,
          glassMat,
          wallSegX(domeW),
          wallSegY,
        ); // north
        addFace(
          domeW,
          CUBE_H,
          Math.PI,
          0,
          CUBE_H / 2,
          -domeD / 2,
          glassMat,
          wallSegX(domeW),
          wallSegY,
        ); // south
        addFace(
          domeD,
          CUBE_H,
          Math.PI / 2,
          domeW / 2,
          CUBE_H / 2,
          0,
          glassMat,
          wallSegX(domeD),
          wallSegY,
        ); // east
        addFace(
          domeD,
          CUBE_H,
          -Math.PI / 2,
          -domeW / 2,
          CUBE_H / 2,
          0,
          glassMat,
          wallSegX(domeD),
          wallSegY,
        ); // west
        // Ceiling: rotate about X by -90° to lie flat with its +Y normal up.
        {
          const ceilSeg = Math.max(1, Math.round(domeW / CELL));
          const ceil = new THREE.Mesh(
            new THREE.PlaneGeometry(domeW, domeD, ceilSeg, ceilSeg),
            ceilMat,
          );
          ceil.rotation.set(-Math.PI / 2, 0, 0);
          ceil.position.set(0, CUBE_H, 0);
          glassCube.add(ceil);
          skyFaces.push(ceil);
        }
        sim.scene.add(glassCube);

        // Shattering reveal. At the moment of reveal the sealed glass cube doesn't
        // slide or drift in whole — it SHATTERS: every tessellated triangle of
        // the skybox flies apart as its own shard, blasted outward on a course
        // away from the lawn with a tumble, then coasts forever through the
        // weightless void (no gravity). Daytime rebuilds the sealed box and
        // disposes the debris.
        let curtainStarted = false; // reveal act fired once per night (option B)
        const EXPLODE_SPEED = 12; // m/s outward from the cube center
        const EXPLODE_SPREAD = 6; // extra random outward fan
        const EXPLODE_TUMBLE = 2.0; // angular velocity (rad/s) per spin axis
        // Glass shards currently airborne (each carries vel/rvel on its userData).
        let debris = [];
        // Split a sealed face's tessellated geometry into one buffer per triangle
        // so each can be flung independently. UVs (and so the sky/text mapping)
        // are preserved because the shard keeps its face-local plane coordinates.
        const splitShards = (face) => {
          const flat = face.geometry.toNonIndexed();
          const pos = flat.attributes.position;
          const uv = flat.attributes.uv;
          const nrm = flat.attributes.normal;
          const nTri = pos.count / 3;
          const geos = [];
          for (let t = 0; t < nTri; t++) {
            const g = new THREE.BufferGeometry();
            const p = new THREE.BufferAttribute(new Float32Array(9), 3);
            const u = new THREE.BufferAttribute(new Float32Array(6), 2);
            const n = new THREE.BufferAttribute(new Float32Array(9), 3);
            for (let k = 0; k < 3; k++) {
              p.setXYZ(
                k,
                pos.getX(3 * t + k),
                pos.getY(3 * t + k),
                pos.getZ(3 * t + k),
              );
              u.setXY(k, uv.getX(3 * t + k), uv.getY(3 * t + k));
              n.setXYZ(
                k,
                nrm.getX(3 * t + k),
                nrm.getY(3 * t + k),
                nrm.getZ(3 * t + k),
              );
            }
            g.setAttribute("position", p);
            g.setAttribute("uv", u);
            g.setAttribute("normal", n);
            geos.push(g);
          }
          flat.dispose();
          return geos;
        };
        // Blast every triangle of every sealed face outward as an indepdent
        // shard. Direction follows each FACE's outward normal (horizontal for
        // the walls, straight up off the ceiling) so the glass blasts away from
        // the lawn rather than raining up — with a little random fan so the
        // shards spread instead of sliding as one sheet.
        const explodeSky = () => {
          const tmp = new THREE.Vector3();
          for (const face of skyFaces) {
            // Face's outward direction: ceiling (no horizontal offset) flies
            // straight up; walls fly along their outward horizontal normal.
            const px = face.position.x,
              pz = face.position.z;
            const horiz = Math.hypot(px, pz);
            const dir = new THREE.Vector3();
            if (horiz < 1e-3) {
              dir.set(0, 1, 0); // ceiling
            } else {
              dir.set(px / horiz, 0, pz / horiz); // wall outward normal
            }
            const upKick = horiz < 1e-3 ? 8 : 2; // ceiling soars, walls lift a touch
            const shardGeos = splitShards(face);
            for (const g of shardGeos) {
              const m = new THREE.Mesh(g, face.material);
              m.position.copy(face.position);
              m.rotation.copy(face.rotation);
              m.frustumCulled = false;
              glassCube.add(m);
              // Fling along the face's outward normal, plus per-shard fan so
              // the sheet shatters apart rather than staying aligned.
              const vel = tmp.copy(dir).multiplyScalar(EXPLODE_SPEED);
              vel.x += (Math.random() - 0.5) * EXPLODE_SPREAD;
              vel.y += (Math.random() - 0.5) * EXPLODE_SPREAD + upKick;
              vel.z += (Math.random() - 0.5) * EXPLODE_SPREAD;
              m.userData.vel = vel.clone();
              m.userData.rvel = new THREE.Vector3(
                (Math.random() - 0.5) * 2 * EXPLODE_TUMBLE,
                (Math.random() - 0.5) * 2 * EXPLODE_TUMBLE,
                (Math.random() - 0.5) * 2 * EXPLODE_TUMBLE,
              );
              debris.push(m);
            }
            face.visible = false; // the sealed sheet is gone; shards take over
          }
        };
        // Reseal the box: remove every airborne shard and bring the tessellated
        // sealed faces back, so closed daylight reads as a solid cube again.
        const resealSky = () => {
          for (const m of debris) {
            glassCube.remove(m);
            m.geometry.dispose();
          }
          debris = [];
          for (const face of skyFaces) face.visible = true;
        };
        // Flight driver: integrate each shard always (friction-free, constant
        // velocity + steady tumble) so the glass coasts into space.
        sim.addEntity(null, null, (dt) => {
          for (const m of debris) {
            m.position.addScaledVector(m.userData.vel, dt);
            m.rotation.x += m.userData.rvel.x * dt;
            m.rotation.y += m.userData.rvel.y * dt;
            m.rotation.z += m.userData.rvel.z * dt;
          }
          overlayUpdate(dt);
          greetingUpdate(dt);
        });

        // Doom fade: a fullscreen red wash fades IN at the blast, then fades to
        // complete black. Two stacked layers make the crossfade crisp: a black
        // layer sits permanently behind; a red layer fades in over the top,
        // then fades back out to reveal the black — ending on a solid blackout.
        const doomBlack = document.createElement("div");
        Object.assign(doomBlack.style, {
          position: "fixed",
          inset: "0",
          background: "#000",
          opacity: 0,
          pointerEvents: "none",
          zIndex: "9998",
        });
        document.body.appendChild(doomBlack);
        const doomRed = document.createElement("div");
        Object.assign(doomRed.style, {
          position: "fixed",
          inset: "0",
          background: "#f00",
          opacity: 0,
          pointerEvents: "none",
          zIndex: "9999",
        });
        document.body.appendChild(doomRed);
        const DOOM_DELAY_MS = 5000; // give the user ~5s to see the void before doom
        const DOOM_RISE_MS = 5000; // total red phase, pulsing, ending solid
        const DOOM_PULSE_FULL_MS = 4000; // the ramp reaches full red by here
        const DOOM_BLACK_MS = 4000; // red fades out to black
        let doomT = -1; // seconds since doom started; negative = idle
        // Drive the overlays each frame: a red wash that starts transparent and
        // PULSES while it fades in, locking to 100% red for its final ~2s, then
        // crosses over to a full blackout. Through the whole red phase the black
        // backdrop stays transparent so the scene stays visible under the red.
        const overlayUpdate = (dt) => {
          if (doomT < 0) return;
          doomT += dt;
          const ms = doomT * 1000;
          if (ms < DOOM_RISE_MS) {
            // Ramp 0->1 that reaches full by DOOM_PULSE_FULL_MS and holds.
            const ramp = Math.min(1, ms / DOOM_PULSE_FULL_MS);
            // Pulse riding the ramp: full pulses early, settling to a steady 1
            // as the ramp saturates, so the last ~2s are a solid red.
            const wave = 0.55 + 0.45 * Math.sin(doomT * Math.PI * 2); // oscil. between fades
            const pulse = 0.72 + 0.28 * wave;
            const red = Math.min(1, ramp * pulse);
            doomRed.style.opacity = red.toFixed(3);
          } else {
            // Crossfade to black: red falls away while the black backdrop fades
            // in to complete the blackout.
            const k = Math.min(1, (ms - DOOM_RISE_MS) / DOOM_BLACK_MS);
            doomRed.style.opacity = ((1 - k) * 1).toFixed(3);
            doomBlack.style.opacity = k.toFixed(3);
            // Once fully black, restart the simulation at a fresh day.
            if (k >= 1 && !doomRestarted) {
              doomRestarted = true;
              if (typeof simRestart === "function") simRestart();
            }
          }
        };
        // Flips true the first time the blackout completes, so the restart only
        // fires once per doom.
        let doomRestarted = false;
        // Trigger the doom after a delay so the explosion + void are seen first.
        const doomStart = () => {
          doomRestarted = false; // allow the end-of-doom restart again
          setTimeout(() => {
            doomT = 0;
          }, DOOM_DELAY_MS);
        };

        // Day-start greeting: "GOOD MORNING." plays during the first 10 seconds
        // of each new day (simulation time T = 0..10). A fresh page load boots
        // the simulation in at T = 11 — mid-story — so the very first greeting is
        // a surprise withheld until the night has passed and a new day dawns.
        // Simulation clock in real seconds; resets to 0 at each new day. The
        // day-start message ("GOOD MORNING." / "EARTH-LIKE GARDEN SIM v3") is
        // painted onto the skybox WALLS by paintSky, keyed off this timer.
        let simT = 20; // a fresh load starts past both messages (no wall text)
        // A new day dawns: reset the simulation clock (so the wall text plays)
        // and lift the doom blackout so the new day is actually visible.
        const newDay = () => {
          simT = 0;
          doomT = -1; // stop the doom idle
          doomRed.style.opacity = "0";
          doomBlack.style.opacity = "0";
        };
        // Just advance the sim clock; the wall text reads simT each repaint, so
        // no extra rendering is needed here.
        const greetingUpdate = (dt) => {
          if (simT >= 20) return;
          simT += dt;
          // Force a repaint so the walls pick up the changing message.
          paintSky(p);
        };

        // Camera "kick" at the blast: over 500ms we tilt the view up
        // (looking a bit higher once the sky shatters) and widen the FOV to
        // 120°, then settle back to the player's normal gaze/FOV.
        const KICK_RISE_MS = 500; // how long to reach the kick peak
        const KICK_HOLD_MS = 5000; // how long to HOLD at the peak
        const KICK_FALL_MS = 5000; // how long to ease back to normal
        const KICK_PITCH = 12 * (Math.PI / 180); // extra look-up (radians)
        const KICK_TARGET_FOV = 70;
        let kickElapsed = Infinity; // ms since blast; Infinity = no mask
        const kickStart = () => {
          kickElapsed = 0;
        };
        // Returns the kick envelope 0..1 (0 = normal, 1 = peak) for a given
        // elapsed time, easing in over KICK_RISE_MS, holding at peak for
        // KICK_HOLD_MS, then easing out over KICK_FALL_MS.
        const kickEnv = (el) => {
          if (el >= KICK_RISE_MS + KICK_HOLD_MS + KICK_FALL_MS) return 0;
          if (el < KICK_RISE_MS) return el / KICK_RISE_MS;
          if (el < KICK_RISE_MS + KICK_HOLD_MS) return 1;
          return 1 - (el - KICK_RISE_MS - KICK_HOLD_MS) / KICK_FALL_MS;
        };

        // Fake "sun" light inside the Earth dome: a warm point/he directional
        // light tracking the fake-sky time so the grass reads as lit by day
        // sky (bright warm stream at noon, dimming red toward sunset, off at
        // night). It's inside the cube so it lights only the lawn + mower.
        const domeSun = new THREE.DirectionalLight(0xfff6e8, 2.0);
        domeSun.position.set(0, CUBE_H, 0);
        domeSun.castShadow = false; // shadows already come from the moon sun
        sim.scene.add(domeSun);
        // Bright fill so the sealed dome reads as a beautiful day: a sky-blue
        // ambient + a downward hemisphere bounce that keeps the up-facing
        // grass/floor well-lit, only active while the dome is closed.
        const domeAmbient = new THREE.HemisphereLight(0xbfe3ff, 0x7fb04a, 1.2);
        sim.scene.add(domeAmbient);

        // Sun slider drives the fake-sky palette and the cube's opacity. Soaring at
        // noon => a solid blue sky hides everything outside (opaque, writes
        // depth so the stars/Earth behind can't bleed through). Once the sun
        // sets it becomes transparent: the reveal.
        const sunSlider = document.getElementById("sun-slider");
        const time = {
          hour: parseFloat(sunSlider.value),
          prevHour: parseFloat(sunSlider.value),
        };
        // Phase name shown next to the sun clock, quartered by 6-hour bucket.
        const parityLabels = ["dawn", "morning", "afternoon", "dusk", "night"];
        const applySky = (hour) => {
          // Phase: 0 at noon, 1 at sunrise/sunset (deep red), through dusk to
          // ~2 at midnight (ink black-blue), then the reveal.
          const p = Math.abs(hour - 12) / 6;
          // Repaint/re-upload the sky textures only when the phase visibly
          // changed OR the breach message swapped (the clock advances so slowly
          // the color is identical across most frames). This avoids re-uploading
          // two 512x512 canvases to the GPU every frame — the per-frame GC/upload
          // cost was the stutter.
          const breachTickNow = breachActive
            ? Math.floor(breachT)
            : -1;
          if (
            Math.abs(p - lastPaintedP) >= 0.001 ||
            breachTickNow !== lastBreachTick
          ) {
            paintSky(p);
            lastPaintedP = p;
            lastBreachTick = breachTickNow;
          }
          const isNight = p >= NIGHT_P;
          if (isNight) {
            // Reveal (option B): the reveal act — sun re-arms, grass freezes,
            // Earth teleports — fires IMMEDIATELY, while the walls animate up
            // like a curtain over CURTAIN_S seconds on a separate visual clock.
            if (!curtainStarted) {
              curtainStarted = true;
              // The real moon sun takes over again right away.
              if (sunLight) sunLight.intensity = SUN_INTENSITY;
              // Freeze the grass: with the dome gone there's no breeze to move it.
              swaying = false;
              // Weightless clippings drift in the vacuum of space.
              gravityOn = false;
              if (!revealFired) {
                revealFired = true;
                // Park the Earth 150m directly ahead of the CAMERA (not the
                // mower) in the ground plane, so it's always dead-center in view
                // at the reveal; its height comes from the earth-angle slider.
                positionEarth();
                // Reset the Earth's own spin so every reveal shows the same face.
                earth.globe.rotation.y = 0;
                if (earth.children) {
                  for (const c of earth.children) {
                    if (c !== earth.globe) c.rotation.y = 0;
                  }
                }
                // Lock the sun to the camera: rotate its direction with the camera
                // so the Earth is lit from the exact same relative angle every
                // reveal, keeping the crescent/terminator perfectly identical on
                // the (now camera-centered) Earth no matter how the player was
                // facing. Push it far away so its rays arrive parallel.
                const cinematicSunDir = _sunDir0
                  .clone()
                  .applyQuaternion(sim.camera.quaternion);
                // Roll the sun direction around the camera's view axis by the
                // day's solar declination, tilting the day/night terminator on the
                // Earth to its correct seasonal angle.
                cinematicSunDir.applyAxisAngle(
                  _camFwd,
                  declinationDeg() * (Math.PI / 180),
                );
                sunLight.position
                  .copy(cinematicSunDir)
                  .multiplyScalar(SUN_FLAT);
                sunLight.target.position.copy(sim.camera.position);
                sunLight.target.updateMatrixWorld(true);
              }
              // Ensure the sky is opaque so the flying faces read as a solid
              // sheet until they spread apart.
              glassMat.transparent = false;
              glassMat.opacity = 1;
              glassMat.depthWrite = true;
              for (const f of skyFaces) f.visible = true;
              // BLAST: launch every face outward into space, tumbling.
              explodeSky();
              // Punish the camera: tilt up + widen the FOV over 500ms.
              kickStart();
              // Flood the screen red, then fade to black — the doom.
              doomStart();
            }
          } else {
            // Opaque sky: fully hide the space outside the dome (survives the
            // whole day AND the dusk fade so the inky sunset still reads).
            glassMat.transparent = false;
            glassMat.opacity = 1;
            glassMat.depthWrite = true;
            // Day again: the breeze returns, so grass sway resumes.
            swaying = true;
            // Gravity returns with the day.
            gravityOn = true;
            // Re-arm the reveal so closing the dome and opening it again
            // re-snaps the Earth back into view.
            revealFired = false;
            // Fireflies return once the reveal clears (still governed by the
            // daytime/nighttime sleep-wake cycle from here on). Skipped during
            // the initial setup call before the family has been created.
            if (firefliesReady) {
              for (const f of fireflies)
                f.group.visible =
                  creaturesEnabled && !f.sleeping && !revealFired;
            }
            // Box closed: the moon sun can't reach the sealed lawn, so shut it
            // off and let only the fake in-dome day light drive the grass.
            if (sunLight) sunLight.intensity = 0;
            // Reseal the dome: faces snap back into a sealed box before the sky
            // makes them opaque, so closed daylight reads as a solid cube.
            if (curtainStarted) {
              curtainStarted = false;
              // A new day dawns: reset the simulation clock so the "GOOD
              // MORNING." greeting plays for its first 10 seconds.
              newDay();
              resealSky();
              // Make the sky opaque + visible so the closing cube shows.
              glassMat.transparent = false;
              glassMat.opacity = 1;
              glassMat.depthWrite = true;
              for (const f of skyFaces) f.visible = true;
            }
          }
          // Fake sun: bright warm light at noon, dimming & warming as the sky
          // darkens through dusk, fully off by night.
          const dayFactor = Math.max(0, 1 - p / NIGHT_P);
          domeSun.intensity = 2.0 * dayFactor;
          const heat = Math.min(1, p); // toward sunset, redden the light
          domeSun.color.setRGB(
            1,
            0.82 + 0.18 * (1 - heat),
            0.7 + 0.3 * (1 - heat),
          );
          if (isNight) domeSun.intensity = 0;
          // Interior fill follows the same curve so the dome stays bright by
          // day, dims through dusk, and goes dark at the reveal.
          domeAmbient.intensity = 1.2 * dayFactor;
          if (isNight) domeAmbient.intensity = 0;
          // Nastic: petals close as daylight fades — fully open at noon (0),
          // fully closed by dusk. Runs only once the dandelion family exists.
          if (dandelionsReady) {
            const nastic = Math.max(0, Math.min(1, Math.min(p, 1)));
            for (const d of dandelions) d.ent.setNastic?.(nastic);
          }
        };
        // Day/night lifecycle: families register here (with wake/sleep hours),
        // and dispatchDayNight sleeps/wakes them as the hour crosses their
        // thresholds. The registry is populated as each family is created.
        const dayCycle = [];
        // Set true once the firefly family exists so applySky can safely toggle
        // their visibility during the reveal/restore (it runs earlier at setup).
        let firefliesReady = false;
        // Set true once the dandelion family exists so applySky can drive
        // petal nastic closure (it runs earlier at setup too).
        let dandelionsReady = false;
        // Cross a sleep/wake boundary when the current hour straddles the
        // threshold and the previous hour was on the opposite side, handling
        // slider jumps that leap across midnight (wrap backward or forward).
        const dispatchDayNight = (hour) => {
          const prev = time.prevHour;
          time.prevHour = hour;
          for (const fam of dayCycle) {
            // Night spans [sleepHour, wakeHour) wrapping past midnight; a
            // creature is awake when the hour lies in [wakeHour, sleepHour).
            const awake = (h) => {
              if (fam.wakeHour < fam.sleepHour)
                return h >= fam.wakeHour && h < fam.sleepHour;
              return h >= fam.wakeHour || h < fam.sleepHour; // wraps past midnight
            };
            const wasAwake = awake(prev);
            const nowAwake = awake(hour);
            if (wasAwake === nowAwake) continue;
            for (const item of fam.items) nowAwake ? item.wake() : item.sleep();
          }
        };
        // Apply a new hour: recompute sky/lighting, dispatch creature sleep/wake
        // boundaries, and refresh the clock + phase readout. Shared by the sun
        // slider and the automatic time-advance loop below.
        const clockEl = document.getElementById("sun-clock");
        const phaseEl = document.getElementById("sun-phase");
        const setHour = (hour) => {
          time.hour = hour;
          applySky(hour);
          dispatchDayNight(hour);
          const hh = Math.floor(hour);
          const mm = Math.round((hour - hh) * 60);
          clockEl.textContent = `${String(hh % 24).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
          phaseEl.textContent = parityLabels[Math.min(4, Math.floor(hour / 6))];
        };
        sunSlider.addEventListener("input", () => {
          setHour(parseFloat(sunSlider.value));
        });
        applySky(parseFloat(sunSlider.value));
        time.prevHour = time.hour;
        setHour(time.hour);

        // Force a fresh day: reseal the dome, lift the doom, and snap the clock
        // to a daytime hour so the new day is bright and the "GOOD MORNING."
        // greeting plays from T=0. Called once the doom blackout completes.
        const simRestart = () => {
          if (curtainStarted) {
            curtainStarted = false;
            resealSky();
            glassMat.transparent = false;
            glassMat.opacity = 1;
            glassMat.depthWrite = true;
            for (const f of skyFaces) f.visible = true;
          }
          // Lift the doom blackout so the fresh sim is actually visible.
          doomT = -1;
          doomRed.style.opacity = "0";
          doomBlack.style.opacity = "0";
          // Reset the user's position + look direction to the default spawn.
          mower.mesh.position.set(0, 0, 0);
          mower.mesh.quaternion.set(0, 0, 0, 1);
          mower.mesh.updateMatrixWorld(true);
          // Park the first-person camera (and orbit state) back to the opener.
          sim.camera.position.copy(mower.mesh.position);
          sim.camera.quaternion.set(0, 0, 0, 1);
          sim.camera.lookAt(0, 0, -1);
          sim.camera.updateProjectionMatrix();
          theta = 0;
          phi = Math.PI / 6;
          radius = 25;
          camBlend = 0;
          camBlendTarget = 0;
          setHour(8); // snap to mid-morning so the scene is bright
          startIntro(); // replay the boot cinematic (grass up, flowers pop, creatures on)
        };

        // Global dev/dev-test trigger: jump the sim to ~1 real minute before the
        // reveal/ending. The reveal starts at NIGHT_START (22.5); the clock runs
        // 1/30 game-hour per real second by day, so 60s before = 20.5.
        window.triggerEnd = () => {
          setHour(NIGHT_START - 60 * (1 / 30)); // 1 min before the reveal
        };

        // Temporary debug readout of the global sun's world position and
        // direction (toward the light) for verifying lighting angles.
        const sunPosEl = document.getElementById("sun-pos");
        const sunDirEl = document.getElementById("sun-dir");
        sim.addEntity(null, null, () => {
          if (sunPosEl && sunDirEl) {
            const p = sunLight.position;
            sunPosEl.textContent = `${p.x.toFixed(0)}, ${p.y.toFixed(0)}, ${p.z.toFixed(0)}`;
            const d = _sunDir.copy(sunLight.target.position).sub(p).normalize();

          return visitCutArea(CUT_HALF_W, CUT_HALF_D, 0, (i) => {
