          // covers most of the display and the "back" target is small.
          const backLine = window.innerHeight * 0.66;
          // Above the line = forward, below = back. (Finger higher on screen
          // yields negative touchF, which drives the mower forward along -Z.)
          const ndy = (cy - backLine) / STICK_R;
          touchF = Math.abs(ndy) < 0.22 ? 0 : Math.max(-1, Math.min(1, ndy));
        };
        canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          if (e.touches.length > 0) {
            const t = e.changedTouches[0];
            touchActive = true;
            touchOX = t.clientX;
            touchOY = t.clientY;
            updateTouch(t.clientX, t.clientY);
          }
        }, { passive: false });
        canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          updateTouch(t.clientX, t.clientY);
        }, { passive: false });
        canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          if (e.touches.length === 0) {
            touchActive = false;
            touchF = 0;
            touchTurn = 0;
          }
        }, { passive: false });
        canvas.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          touchActive = false;
          touchF = 0;
          touchTurn = 0;
        }, { passive: false });

        // Reel cut footprint (matches the grass-cutting test below).
        const CUT_HALF_W = 1.25 / 2; // across the reel (local X)
        const CUT_HALF_D = 0.4 * 0.7; // cutting depth (local Z)
        // The single control for how much grass sticks up after a cut, in
        // world units (meters). A blade's tip height = BLADE_HALF * scale *
        // growth, so the minimum growth per blade is derived from its own
        // random scale to always leave exactly CUT_HEIGHT sticking out.
        let CUT_HEIGHT = 0.2;
        const bladeMinGrowth = new Float32Array(total);
        const recomputeMinGrowth = () => {
          for (let i = 0; i < total; i++) {
            bladeMinGrowth[i] = Math.min(1, CUT_HEIGHT / (BLADE_HALF * bladeScale[i]));
          }
        };
        recomputeMinGrowth();
        const localPos = new THREE.Vector3();
        const invMower = new THREE.Matrix4();
        // Active-growth set: only blades below full height are touched each
        // frame, instead of scanning all of them. `growIndex[i]` gives the slot
        // of blade i in `growList` (or -1 if not growing), enabling O(1) add.
        const growList = [];
        const growIndex = new Int32Array(total).fill(-1);
        const addToGrow = (i) => {
          if (growIndex[i] !== -1) return; // already in the list
          growIndex[i] = growList.length;
          growList.push(i);
        };
        // Whether any cuttable grass currently sits under the reel. Returns true if
        // there's at least one blade above its minimum height in the footprint.
        const hasCuttableGrass = () => {
          invMower.copy(mower.mesh.matrixWorld).invert();
          return visitCutArea(CUT_HALF_W, CUT_HALF_D, 0, (i) => {
            if (bladeGrowth[i] <= bladeMinGrowth[i]) return false;
            localPos.copy(bladePos[i]).applyMatrix4(invMower);
            if (Math.abs(localPos.x) < CUT_HALF_W && Math.abs(localPos.z) < CUT_HALF_D) {
              return true;
            }
            return false;
          });
        };

        // Particle-size sampler: a thin rectangular box just ahead of the reel,
        // spanning the mower's full width (matching CUT_HALF_W) with a very small
        // forward length. We average the growth of the blades in that box; that
        // average fraction (0..1 of full height) maps onto the emitted clipping
        // size, so the particles reflect the grass the mower is about to reach
        // instead of a single blade catching the sample. Forward is local -Z.
        const SAMPLE_HALF_W = CUT_HALF_W; // same width as the reel
        const SAMPLE_HALF_D = 0.12; // thin strip ahead of the reel
        const SAMPLE_OFF_Z = -(CUT_HALF_D + SAMPLE_HALF_D); // just ahead of the cut
        const sampleCutAmount = () => {
          invMower.copy(mower.mesh.matrixWorld).invert();
          let sum = 0, count = 0;
          visitCutArea(SAMPLE_HALF_W, SAMPLE_HALF_D, SAMPLE_OFF_Z, (i) => {
            if (bladeGrowth[i] <= bladeMinGrowth[i]) return false;
            localPos.copy(bladePos[i]).applyMatrix4(invMower);
            if (Math.abs(localPos.x) < SAMPLE_HALF_W && Math.abs(localPos.z - SAMPLE_OFF_Z) < SAMPLE_HALF_D) {
              sum += bladeGrowth[i] - bladeMinGrowth[i];
              count++;
            }
            return false;
          });
          return count ? sum / count : 0;
        };

        // --- Grass-clipping particle effect (emitted when the mower moves) ---
        const CLIP_COUNT = 120;
        // Each clipping is a real 3D blade mesh so it can carry a random 3D
        // rotation and tumble as it flies.
        // Each clipping is a flat triangle (a blade sliver), kept small (0.5
        // tall); this factor upscales the emitted instance so a full-height cut
        // (cutAmount=1) produces a clipping about as long as the grass blade it
        // came from (~1.7), and keeps shorter re-cuts proportionally smaller.
        const CLIP_SCALE = (1.7 / 0.5) * 0.5; // full cut throws clippings half the blade height
        const clipGeo = new THREE.BufferGeometry();
        // A single isoceles triangle in the XY plane (a thin ~0.05-wide sliver,
        // 0.5 tall), double-sided so it reads no matter which way it tumbles.
        clipGeo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(
            [-0.025, 0, 0, 0.025, 0, 0, 0, 0.5, 0],
            3,
          ),
        );
        clipGeo.computeVertexNormals();
        const clipMat = new THREE.MeshStandardMaterial({
          color: 0x3f8f3f,
          roughness: 0.9,
          side: THREE.DoubleSide,
        });
        const clipMesh = new THREE.InstancedMesh(clipGeo, clipMat, CLIP_COUNT);
        clipMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        clipMesh.frustumCulled = false;
        sim.scene.add(clipMesh);
        const clipDummy = new THREE.Object3D();
        const clipQuat = new THREE.Quaternion();
        const clipEuler = new THREE.Euler();
        const clips = [];
        for (let i = 0; i < CLIP_COUNT; i++) {
          clips.push({ x: 0, y: -1000, z: 0, vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0, wrx: 0, wry: 0, wrz: 0, life: 0, scale: 1, alive: false, hidden: true });
          clipDummy.position.set(-1000, -1000, -1000);
          clipDummy.updateMatrix();
          clipMesh.setMatrixAt(i, clipDummy.matrix);
        }
        let clipCursor = 0;
        let clipAccum = 0;

        sim.addEntity(null, null, (dt) => {
          // Mower local +Z (handle push direction) mapped to the horizontal
          // world direction; with no roll/pitch this is the forward heading.
          const dir = _dir.copy(forward).applyQuaternion(mower.mesh.quaternion);
          const turn = keyTurn() || touchTurn;
          const v = keyF() || touchF;
          const speed = 2;
          // Shift slows the mower but tightens the turn proportionally: ratio of
          // move to turnSpeed gives a shift radius (1.5/1.5 = 1) half of the
          // normal radius (2/1 = 2).
          const shifting = keys.has("ShiftLeft") || keys.has("ShiftRight");
          const ease = shifting ? 0.75 : 1;
          const move = v * speed * ease;
          const turnSpeed = v === 0 ? 2.0 : (shifting ? 1.5 : 1.0);

          mowerMoving = v !== 0;
          mowerForward = move < 0; // forward is along the mower's -Z (toward the reel)
          // Once the player starts moving, drop the "keys to move" hint but keep
          // the orbit-camera tip visible.
          if (v !== 0 && !hintMoveHidden) {
            hintMoveHidden = true;
            freezeHint();
            const moveHint = document.getElementById("hint-move");
            const orbitHint = document.getElementById("hint-orbit");
            if (moveHint && orbitHint) {
              const gap = parseFloat(getComputedStyle(moveHint.parentElement).gap) || 0;
              const shift = moveHint.offsetWidth + gap;
              moveHint.style.transition = "opacity 0.4s ease";
              orbitHint.style.transition = "transform 0.4s ease";
              orbitHint.style.transform = `translateX(${-shift}px)`;
              requestAnimationFrame(() => {
                moveHint.style.opacity = "0";
              });
              setTimeout(() => {
                moveHint.style.display = "none";
                moveHint.style.opacity = "1";
                orbitHint.style.transition = "none";
                orbitHint.style.transform = "";
                // If the orbit tip is already gone, collapse the whole line
                // now; otherwise it will be collapsed when the orbit fade ends.
                if (hintOrbitHidden) collapseHint();
              }, 400);
            }
          }
          mower.mesh.rotateOnWorldAxis(turnDir, turn * turnSpeed * dt);
          mower.setSpeed(move);
          mower.mesh.position.addScaledVector(dir, move * dt);
          // Keep the mower inside the lawn so it can't cross the surrounding
          // fence. Clamp to the grass patch bounds (minus a small margin so we
          // never ride up over the fence boards).
          mower.mesh.position.x = Math.max(
            -lawnHalfW + margin,
            Math.min(lawnHalfW - margin, mower.mesh.position.x),
          );
          mower.mesh.position.z = Math.max(
            -lawnHalfD + margin,
            Math.min(lawnHalfD - margin, mower.mesh.position.z),
          );
          // Reflect the fresh transform immediately so the cut-footprint check
          // (which uses matrixWorld) matches the mower's real position this frame.
          mower.mesh.updateWorldMatrix(true, false);

          // Emit clippings from the reel when moving AND actually cutting grass.
          const reelWorld = mower.mesh.localToWorld(_reelWorld.set(0, 0.1, 0));
          const right = _right.set(1, 0, 0).applyQuaternion(mower.mesh.quaternion);
          if (mowerForward && hasCuttableGrass()) {
            clipAccum += dt * 250;
            // The mower and grass state are fixed for the whole frame, so the
            // cut amount is sampled ONCE here (outside the while loop) instead
            // of redundantly re-querying the spatial grid for every emitted
            // clipping. This avoids a blow-up of identical queries on laggy
            // frames (large dt) that would compound into a spiral of death.
            const amt = sampleCutAmount();
            while (clipAccum >= 1) {
              clipAccum -= 1;
              const p = clips[clipCursor];
              clipCursor = (clipCursor + 1) % CLIP_COUNT; // reuse a slot each time
              const off = (Math.random() - 0.5) * 0.8; // across the reel (local X)
              p.x = reelWorld.x + off * right.x;
              p.z = reelWorld.z + off * right.z;
              p.y = reelWorld.y + Math.random() * 0.1;
              const spread = 1.6;
              p.vx = (Math.random() - 0.5) * spread;
              p.vz = (Math.random() - 0.5) * spread;
              p.vy = 1.2 + Math.random() * 1.6;
              // Size matches the grass at THIS spot: full-height cuts throw big
              // clippings, re-cuts throw tiny flecks.
              p.scale = Math.max(0.08, amt * CLIP_SCALE);
              // Random starting 3D rotation and fixed tumble rates.
              p.rx = Math.random() * Math.PI * 2;
              p.ry = Math.random() * Math.PI * 2;
              p.rz = Math.random() * Math.PI * 2;
              p.wrx = (Math.random() - 0.5) * 14;
              p.wry = (Math.random() - 0.5) * 14;
              p.wrz = (Math.random() - 0.5) * 14;
              p.life = 0;
              p.alive = true;
              p.hidden = false;
            }
          } else {
            clipAccum = 0;
          }

          // Age clippings: tumble and arc with gravity, then despawn.
          for (let i = 0; i < CLIP_COUNT; i++) {
            const p = clips[i];
            if (!p.alive) {
              // Only rewrite the offscreen matrix on the exact frame a particle
              // dies; once hidden, skip it entirely so dead slots cost nothing.
              if (p.hidden) continue;
              p.hidden = true;
              clipDummy.position.set(-1000, -1000, -1000);
              clipDummy.quaternion.identity();
              clipDummy.scale.set(1, 1, 1);
              clipDummy.updateMatrix();
              clipMesh.setMatrixAt(i, clipDummy.matrix);
              continue;
            }
            p.life += dt;
            if (gravityOn) {
              p.vy -= 5 * dt;
            } else {
              // Weightless: no gravity, and damp the initial upward toss so
              // clippings hover/drift instead of shooting straight up.
              p.vy *= Math.max(0, 1 - 6 * dt);
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.rx += p.wrx * dt;
            p.ry += p.wry * dt;
            p.rz += p.wrz * dt;
            if (p.life > (gravityOn ? 0.9 : 20) || p.y < 0.01) {
              p.alive = false;
              p.y = -1000;
            }
clipDummy.position.set(p.x, p.y, p.z);
            clipEuler.set(p.rx, p.ry, p.rz);
            clipQuat.setFromEuler(clipEuler);
            clipDummy.quaternion.copy(clipQuat);
            clipDummy.scale.set(p.scale, p.scale, p.scale);
            clipDummy.updateMatrix();
            clipMesh.setMatrixAt(i, clipDummy.matrix);
          }
          clipMesh.instanceMatrix.needsUpdate = true;
        });

        // Orbit camera.
        let theta = 0, phi = Math.PI / 6, radius = 25;
        let dragging = false, lastX = 0, lastY = 0;
        const target = new THREE.Vector3(0, 0, 0);
        // Camera mode blend, 0 = first-person (on the mower), 1 = orbit. Eased
        // each frame toward the target so pressing/releasing C glides between
        // the two views instead of snapping.
        let camBlend = 0;
        let camBlendTarget = 0; // 0 = first-person, 1 = orbit (Space toggles)
        const CAM_BLEND_K = 5.3; // higher = faster transition

        canvas.addEventListener("mousedown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        });
        window.addEventListener("mouseup", () => { dragging = false; });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.005;
          // Clamp the camera so it can never dip below 5° above the horizon
          // (elevation = 90° - phi; keep elevation >= 5° => phi <= 85°).
          const MAX_PHI = Math.PI / 2 - THREE.MathUtils.degToRad(5);
          phi = Math.max(0.05, Math.min(MAX_PHI,
            phi - (e.clientY - lastY) * 0.005));
          lastX = e.clientX;
          lastY = e.clientY;
        });
        // Max orbit zoom keeps the camera inside the skybox: the orbit radius is the
        // camera's distance from the lawn center, so it must stay below where
        // it would reach the walls. Derived from the dome's smaller half-extent.
        const MAX_ZOOM = Math.min(domeW, domeD) / 2 - 1.0;
        canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          radius = Math.max(3, Math.min(MAX_ZOOM, radius + e.deltaY * 0.03));
        }, { passive: false });

        let grassDirty = false;
        let growRate = 0.005;
        // Grass tweak sliders. Wrap in one block so it's easy to hide the whole
        // control group in the UI later (set #grass-control to display:none).
        {
          const cutSlider = document.getElementById("cut-height-slider");
          const cutValueEl = document.getElementById("cut-height-value");
          const growSlider = document.getElementById("grow-rate-slider");
          const growValueEl = document.getElementById("grow-rate-value");
          const applyCutHeight = () => {
            CUT_HEIGHT = parseFloat(cutSlider.value);
            recomputeMinGrowth();
            cutValueEl.textContent = CUT_HEIGHT.toFixed(2) + "m";
          };
          const applyGrowRate = () => {
            growRate = parseFloat(growSlider.value);
            growValueEl.textContent = growRate.toFixed(3);
          };
          cutSlider.addEventListener("input", applyCutHeight);
          growSlider.addEventListener("input", applyGrowRate);
          applyCutHeight();
          applyGrowRate();
        }
        // Grass density config. Populate the inputs from the current build, show
        // the live total, and Apply persists to localStorage then reloads so the
        // next page load rebuilds the lawn with the new density.
        {
          const el = (id) => document.getElementById(id);
          const colsEl = el("density-cols");
          const rowsEl = el("density-rows");
          const nEl = el("density-n");
          const totalEl = el("density-total");
          colsEl.value = COLS;
          rowsEl.value = ROWS;
          nEl.value = N;
          const upd = () => {
            const c = clampInt(Number(colsEl.value), 1, 20);
            const r = clampInt(Number(rowsEl.value), 1, 20);
            const n = clampInt(Number(nEl.value), 1, 10000);
            totalEl.textContent = `${(c * r * n).toLocaleString()} blades`;
          };
          [colsEl, rowsEl, nEl].forEach((i) => i.addEventListener("input", upd));
          upd();
          el("density-apply").addEventListener("click", () => {
            localStorage.setItem("mow-cols", String(clampInt(Number(colsEl.value), 1, 20)));
            localStorage.setItem("mow-rows", String(clampInt(Number(rowsEl.value), 1, 20)));
            localStorage.setItem("mow-n", String(clampInt(Number(nEl.value), 1, 10000)));
            location.reload();
          });
        }
        sim.addEntity(null, null, (dt) => {
          if (swaying) swayUniforms.uTime.value = (swayUniforms.uTime.value + dt) % 1000;
          // Cut any blades under the mower's reel, then grow the lawn back.
          grassDirty = false;
          // Cut: only test blades in the grid cells under the reel. Trim any
          // grown above the mower's minimum height down to that minimum (a real
          // mower leaves a uniform-height lawn, it doesn't scalp to nothing).
          invMower.copy(mower.mesh.matrixWorld).invert();
          if (mowerForward) {
            visitCutArea(CUT_HALF_W, CUT_HALF_D, 0, (i) => {
              if (bladeGrowth[i] > bladeMinGrowth[i]) {
                localPos.copy(bladePos[i]).applyMatrix4(invMower);
                if (Math.abs(localPos.x) < CUT_HALF_W &&
                    Math.abs(localPos.z) < CUT_HALF_D) {
                  bladeGrowth[i] = bladeMinGrowth[i];
                  addToGrow(i);
                }
              }
              return false;
            });
          }
          // Grow only the blades that are below full height (active set), not
          // every blade. Each blade keeps its full length; it's sunk into the
          // soil by the un-grown amount, so the top `growth` fraction of a thin
          // blade emerges from the ground and rises as it regrows.
          for (let k = 0; k < growList.length; ) {
            const i = growList[k];
            bladeGrowth[i] = Math.min(bladeGrowth[i] + dt * growRate, 1);
            dummy.position.set(
              bladePos[i].x,
              BLADE_HALF * bladeScale[i] * (bladeGrowth[i] - 1),
              bladePos[i].z,
            );
            dummy.quaternion.copy(bladeRot[i]);
            dummy.scale.set(bladeScale[i], bladeScale[i], bladeScale[i]);
            dummy.updateMatrix();
            grassMesh.setMatrixAt(i, dummy.matrix);
            grassDirty = true;
            if (bladeGrowth[i] >= 1) {
              // Swap-remove: move the last growing blade into this slot.
              const last = growList.pop();
              if (last !== i) {
                growList[k] = last;
                growIndex[last] = k;
              }
              growIndex[i] = -1;
            } else {
              k++;
            }
          }
          if (grassDirty) grassMesh.instanceMatrix.needsUpdate = true;

          // Cut dandelions under the reel and regrow them after a random delay.
          invMower.copy(mower.mesh.matrixWorld).invert();
          if (mowerForward) {
            for (const d of dandelions) {
              if (d.grown) {
                localPos.set(d.x, 0, d.z).applyMatrix4(invMower);
                if (Math.abs(localPos.x) < CUT_HALF_W &&
                    Math.abs(localPos.z) < CUT_HALF_D) {
                  d.ent.mesh.visible = false; // mow it down
                  d.grown = false;
                  d.regrowT = 3 + Math.random() * 7; // random 3-10s before return
                }
              }
            }
          }
          for (const d of dandelions) {
            if (d.grown) continue;
            if (!d.flower) {
              // Seed-phase puffs regrow; flowers stay mowed once cut.
              d.regrowT -= dt;
              if (d.regrowT <= 0) {
                d.ent.mesh.visible = true;
                d.grown = true;
              }
            }
          }

          // Camera: first-person by default, riding the mower's handle (facing
          // the mower's forward vector, just back from the reel); hold C to
          // switch to the drifting orbit view. On mobile it's always
          // first-person (touch steering turns the view). The two views are
          // computed each frame and blended together so the camera eases
          // smoothly between first-person and orbit rather than snapping.
          camBlend += (camBlendTarget - camBlend) *
            Math.min(1, dt * CAM_BLEND_K);
          const blend = camBlend;

          // First-person pose on the mower's handle.
          const gripY = MOWER.wheelRadius +
            MOWER.handleLength * Math.cos(MOWER.handleAngle);
          const gripZ = MOWER.handleLength * Math.sin(MOWER.handleAngle);
          _fpMount.set(0,
            MOWER.wheelRadius + (gripY - MOWER.wheelRadius) * 1.5,
            gripZ * 1.5 + fwdOffset);
          mower.mesh.updateWorldMatrix(true, false);
          _fpWorld.copy(mower.mesh.localToWorld(_fpMount));
          _fpQuat.copy(mower.mesh.quaternion);
          _fpQuat.multiply(_fpPitch.setFromAxisAngle(_fpAxis.set(1, 0, 0), gazePitch));

          // Orbit pose around the lawn target.
          radius = Math.max(3, Math.min(MAX_ZOOM, radius));
          const sp = Math.sin(phi);
          _tmpOrb.set(
            target.x + radius * sp * Math.sin(theta),
            target.y + radius * Math.cos(phi),
            target.z + radius * sp * Math.cos(theta),
          );
          _orbQuat.setFromRotationMatrix(
            _lookAtM.lookAt(_tmpOrb, target, _fpAxis.set(0, 1, 0)),
          );

          if (blend <= 0.001) {
            sim.camera.position.copy(_fpWorld);
            sim.camera.quaternion.copy(_fpQuat);
          } else if (blend >= 0.999) {
            sim.camera.position.copy(_tmpOrb);
            sim.camera.quaternion.copy(_orbQuat);
          } else {
            sim.camera.position.lerpVectors(_fpWorld, _tmpOrb, blend);
            sim.camera.quaternion.slerpQuaternions(_fpQuat, _orbQuat, blend);
          }
        });

        // Lawn bounds used by all creatures.
        const bx = (COLS * W) / 2 - 1, bz = (ROWS * D) / 2 - 1;
        const mowerPos = new THREE.Vector3();
        let creaturesEnabled = true;

        // --- Flying bugs: midges that hover and flit around the lawn ---
        const BUG_COUNT = isMobile ? 8 : 20;
        const SCARE_R = 4;
        const flies = createFlies(sim, {
          count: BUG_COUNT,
          color: 0x1a1a1a,
          size: 0.035,
          spread: bx * 2,
        });
        const fliesSleeping = { value: false };
        const fliesLife = {
          sleep() { fliesSleeping.value = true; flies.mesh.visible = false; },
          wake() { fliesSleeping.value = false; flies.mesh.visible = creaturesEnabled; },
        };

        sim.addEntity(null, null, () => {
          flies.mesh.visible = creaturesEnabled && !fliesSleeping.value;
        });

        // Diurnal: midges sleep through the night (20h-6h).
        dayCycle.push({ items: [fliesLife], wakeHour: 6, sleepHour: 20 });

        // --- Butterflies: graceful, colorful flappers ---
        // We reuse the butterfly model/animation from the component library
        // (createButterfly) and animate the MOVEMENT here in the game: each
        // butterfly traces a gentle looping orbit around a slowly drifting
        // focus, and darts away when the mower rolls close.
        const BFLY_COUNT = isMobile ? 3 : 6;
        const pastel = new THREE.Color();
        const butterflies = [];
        for (let i = 0; i < BFLY_COUNT; i++) {
          pastel.setHSL(Math.random(), 0.75, 0.65);
          const ent = createButterfly(sim, {
            wingColor: "#" + pastel.getHexString(),
            position: [
              (Math.random() * 2 - 1) * bx,
              0.8 + Math.random() * 0.8,
              (Math.random() * 2 - 1) * bz,
            ],
          });
          butterflies.push({
            group: ent.mesh,
            ent,
            x: (Math.random() * 2 - 1) * bx,
            z: (Math.random() * 2 - 1) * bz,
            h: 0.8 + Math.random() * 0.8,
            yaw: Math.random() * Math.PI * 2,
            flapSpeed: 14 + Math.random() * 8,
            // Occasional flap bursts: picks a slight speed-up that gains a bit
            // of altitude, then slowly drifts back down to the cruise height.
            burstT: 1 + Math.random() * 3,
            flapBoost: 0,
            // Loop path: drift toward a focus while a circle orbits it.
            cx: (Math.random() * 2 - 1) * bx,
            cz: (Math.random() * 2 - 1) * bz,
            orbit: Math.random() * Math.PI * 2,
            orbitR: 0.8 + Math.random() * 1.2,
            scatterT: 0,
            scareCooldown: 0,
            rejoinT: 0, // > 0 while easing back into the orbit after a flight
          });
        }

        // Butterflies move in the same update as the grass so they track the
        // camera loop time; the component animates the wing flap, the game
        // here owns their position and heading.
        sim.addEntity(null, null, (dt) => {
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          mowerPos.copy(mower.mesh.position);
          for (const b of butterflies) {
            b.ent.setFlapSpeed(b.scatterT > 0 ? 42 : b.flapSpeed + b.flapBoost);

            if (b.scatterT > 0) {
              // Frightened: burst upward and away from the mower, then calm.
              b.scatterT -= dt;
              b.scareCooldown = Math.max(0, b.scareCooldown - dt);
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              const d = Math.hypot(dx, dz) || 1;
              b.x += (dx / d) * dt * 3;
              b.z += (dz / d) * dt * 3;
              b.h += dt * 2;
              b.yaw = Math.atan2(dx, dz);
              if (b.scatterT <= 0) {
                // Flight's over: start easing back into the orbit, and add a
                // beat of calm so it isn't re-scared the instant it lands.
                b.rejoinT = 0.6;
                b.scareCooldown = 1.2;
              }
            } else {
              // Check if the mower frightened it (only after the cooldown, so
              // a freshly scared butterfly isn't re-triggered the instant its
              // flight ends).
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              if (b.scareCooldown <= 0 && dx * dx + dz * dz < SCARE_R * SCARE_R) {
                b.scatterT = 1.4;
                continue;
              }
              // Graceful looping path: drift focus slowly, orbit around it.
              b.orbit = (b.orbit + dt * (0.8 + Math.random() * 0.4)) % (Math.PI * 2);
              b.cx += (Math.random() - 0.5) * dt * 0.5;
              b.cz += (Math.random() - 0.5) * dt * 0.5;
              let ox = b.cx + Math.cos(b.orbit) * b.orbitR;
              let oz = b.cz + Math.sin(b.orbit) * b.orbitR;
              b.h += Math.sin(b.orbit * 1.7 + 1) * dt * 0.3;
              // Flap bursts: occasionally speed the wings up to gain a touch of
              // altitude, then let it slowly settle back down to cruise height.
              if (b.flapBoost > 0) {
                // Boost active: flap harder -> rise, and start easing off.
                b.h += dt * 0.5;
                b.flapBoost = Math.max(0, b.flapBoost - dt * 5);
              } else {
                // Boost over: slowly drift back down toward cruise height.
                const sink = b.h > 0.8 ? 0.25 : 0;
                b.h -= dt * sink;
                b.burstT -= dt;
                if (b.burstT <= 0) {
                  // Trigger a new short burst, then schedule the next one.
                  b.flapBoost = 5 + Math.random() * 9;
                  b.burstT = 2 + Math.random() * 4;
                }
              }
              if (b.rejoinT > 0) {
                // Ease back from where the flight left us to the orbit point
                // (smoothstep), so there's no snap. Recenter the loop's focus
                // on the fled position so it relaxes there.
                b.rejoinT -= dt;
                const tt = Math.max(0, b.rejoinT / 0.6);
                const e = 1 - tt * tt * (3 - 2 * tt); // 0 -> 1 as we rejoin
                const fromX = b.x, fromZ = b.z;
                b.cx = fromX;
                b.cz = fromZ;
                ox = b.cx + Math.cos(b.orbit) * b.orbitR;
                oz = b.cz + Math.sin(b.orbit) * b.orbitR;
                ox = fromX + (ox - fromX) * e;
                oz = fromZ + (oz - fromZ) * e;
              }
              b.x = ox;
              b.z = oz;
              // Face the direction of motion along the orbit.
              b.yaw = -b.orbit - Math.PI / 2;
              // Keep on the lawn.
              b.cx = Math.max(-bx, Math.min(bx, b.cx));
              b.cz = Math.max(-bz, Math.min(bz, b.cz));
              b.h = Math.max(0.6, Math.min(2.2, b.h));
            }
            b.group.position.set(b.x, b.h, b.z);
            b.group.rotation.y = b.yaw;
          }
        });

        // --- Dragonflies: hover, then zoom to a new spot, hover, repeat ---
        const DRGN_COUNT = 2;
        const dragonflies = [];
        for (let i = 0; i < DRGN_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx;
          const z = (Math.random() * 2 - 1) * bz;
          const h = 0.8 + Math.random() * 0.8;
          const ent = createDragonfly(sim, {
            bodyColor: "#2a2a2a",
            wingColor: "#78dfff",
            wingSpan: 0.4,
            wingTilt: -6,
            position: [x, h, z],
          });
          dragonflies.push({
            group: ent.mesh,
            ent,
            sleeping: false,
            sleep() { this.sleeping = true; this.group.visible = false; },
            wake() { this.sleeping = false; this.group.visible = creaturesEnabled; },
            x,
            z,
            h,
            yaw: Math.random() * Math.PI * 2,
            // Hover / fly state machine.
            state: "hover",
            hoverT: 0.8 + Math.random() * 1.4,
            hoverDur: 0,
            fx: 0, fz: 0, fh: 0, // current flight source
            flyT: 0,
            flyDur: 0,
            tx: 0, tz: 0, th: 0, // destination
          });
        }
        // Diurnal: dragonflies sleep through the night too (20h-6h).
        dayCycle.push({ items: dragonflies, wakeHour: 6, sleepHour: 20 });

        sim.addEntity(null, null, (dt) => {
          for (const d of dragonflies) d.group.visible = creaturesEnabled && !d.sleeping;
          if (!creaturesEnabled) return;
          for (const d of dragonflies) {
            if (d.sleeping) continue;
            if (d.state === "hover") {
              d.hoverT -= dt;
              // Gentle hovering wiggle in place.
              d.yaw += dt * 0.5;
              d.h += Math.sin(performance.now() * 0.003 + d.tx) * dt * 0.05;
              d.ent.setFlapSpeed(64); // fast flap at all times, even when hovering
              if (d.hoverT <= 0) {
                // Pick a new destination — anywhere on the lawn, near or far.
                d.fx = d.x;
                d.fz = d.z;
                d.fh = d.h;
                d.tx = (Math.random() * 2 - 1) * bx;
                d.tz = (Math.random() * 2 - 1) * bz;
                d.th = 0.8 + Math.random() * 0.8;
                const dist = Math.max(0.01, Math.hypot(d.tx - d.fx, d.tz - d.fz));
                d.flyDur = 0.1 + dist * 0.05;
                d.flyT = 0;
                d.state = "fly";
              }
            } else {
              // Flying: zoom toward the destination with an ease-out, flapping
              // fast the whole way.
              d.flyT += dt;
              const t = Math.min(1, d.flyT / d.flyDur);
              const e = 1 - (1 - t) * (1 - t); // ease-out zoom
              d.x = d.fx + (d.tx - d.fx) * e;
              d.z = d.fz + (d.tz - d.fz) * e;
              d.h = d.fh + (d.th - d.fh) * e;
              // Face the direction of travel. The dragonfly's long axis (the
              // body cylinder) is local +Z, the forward/back direction. After
              // rotation.y = yaw, local +Z maps to world (sin(yaw), cos(yaw)),
              // so aim it along the motion vector (dx, dz).
              const ddx = d.tx - d.fx;
              const ddz = d.tz - d.fz;
              if (t < 1 && (ddx || ddz)) d.yaw = Math.atan2(ddx, ddz);
              d.ent.setFlapSpeed(64); // fast flap while zooming
              if (t >= 1) {
                d.state = "hover";
                d.hoverT = 1.2 + Math.random() * 2.0;
              }
            }
            d.group.position.set(d.x, d.h, d.z);
            d.group.rotation.y = d.yaw;
          }
        });

        // --- Gnats: two clouds of tiny flies that drift slowly around ---
        // Each cloud is an instanced swarm buzzing inside a small
        // bounding sphere; we drag the whole mesh lazily around the lawn so the
        // spheres wander randomly from spot to spot rather than staying put.
        const SWARM_COUNT = 2;
        const flySwarms = [];
        for (let i = 0; i < SWARM_COUNT; i++) {
          const ent = createGnats(sim, {
            count: 20 + Math.floor(Math.random() * 21), // 20-40 flies
            size: 0.01,
            radius: 1.2,
            speed: 1.3 + Math.random() * 0.3, // 1.3-1.6
            position: [
              (Math.random() * 2 - 1) * bx * 0.8,
              0.8 + Math.random() * 1.2,
              (Math.random() * 2 - 1) * bz * 0.8,
            ],
          });
          flySwarms.push({
            mesh: ent.mesh,
            ent,
            sleeping: false,
            sleep() { this.sleeping = true; this.mesh.visible = false; },
            wake() { this.sleeping = false; this.mesh.visible = creaturesEnabled; },
            x: ent.mesh.position.x,
            z: ent.mesh.position.z,
            h: ent.mesh.position.y,
            // Lazy wandering: pick a target and ease toward it very slowly.
            tx: 0, tz: 0, th: 0,
            wanderT: 1 + Math.random() * 2,
            wanderDur: 1,
          });
        }
        // Diurnal: gnat swarms sleep through the night too (20h-6h).
        dayCycle.push({ items: flySwarms, wakeHour: 6, sleepHour: 20 });

        sim.addEntity(null, null, (dt) => {
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled && !s.sleeping;
          if (!creaturesEnabled) return;
          for (const s of flySwarms) {
            if (s.sleeping) continue;
            s.wanderT -= dt;
            if (s.wanderT <= 0) {
              // Pick a new slow-drifting destination on the lawn.
              s.tx = (Math.random() * 2 - 1) * bx * 0.8;
              s.tz = (Math.random() * 2 - 1) * bz * 0.8;
              s.th = 0.6 + Math.random() * 1.4;
              s.wanderDur = 30 + Math.random() * 30;
              s.wanderT = s.wanderDur;
            }
            // Ease the whole swarm toward its target at a very gentle pace.
            const e = 1 - Math.exp(-dt * 0.08);
            s.x += (s.tx - s.x) * e;
            s.z += (s.tz - s.z) * e;
            s.h += (s.th - s.h) * e;
            s.mesh.position.set(s.x, s.h, s.z);
          }
        });

        // --- Bumblebees: feed on the flowers, then fly along arcs ---
        // Each bee oscillates between FEEDING (hovering near-stationary among
        // the blooms at ~75% of full grass height) and FLYING. To fly it picks
        // a new target location, then follows a smooth arc that rises above
        // the grass, crosses to the target, and curves back down to feeding
        // height there — like a bee shuttling between flowers.
        const FEED_H = 0.7; // about 75% of full grown grass height, tucked in the blades
        const BEE_SPEED = 3; // constant transport speed (world units / sec)
        const BEE_COUNT = isMobile ? 3 : 6;
        const bees = [];
        for (let i = 0; i < BEE_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx * 0.8;
          const z = (Math.random() * 2 - 1) * bz * 0.8;
          const ent = createBumblebee(sim, {
            radius: 0.05,
            wings: false,
            position: [x, FEED_H, z],
          });
          bees.push({
            group: ent.mesh,
            ent,
            sleeping: false,
            sleep() { this.sleeping = true; this.group.visible = false; },
            wake() { this.sleeping = false; this.group.visible = creaturesEnabled; },
            x,
            z,
            h: FEED_H,
            yaw: Math.random() * Math.PI * 2,
            pitch: 0,
            roll: 0,
            // Feed/fly state machine.
            state: "feed",
            feedT: (() => { const r = Math.random(); return r < 0.33 ? 0.5 : r < 0.66 ? 1 : 3; })(),
            feedPhase: Math.random() * Math.PI * 2,
            sx: x, sz: z, sh: FEED_H, // flight start
            tx: 0, tz: 0, th: FEED_H, // flight target
            apex: 3, // apex height of the arc
            upT: 0.5, downT: 0.5,
            flyT: 0,
            flyDur: 1,
          });
        }
        // Diurnal: bees sleep through the night too (20h-6h).
        dayCycle.push({ items: bees, wakeHour: 6, sleepHour: 20 });

        // --- Fireflies: nocturnal — they emerge at dusk, blink through the night,
        // and fade away at dawn, the inverse of the diurnal insects (which are
        // awake 6h-20h). They lazily drift around the lawn's dark patches while
        // their component drives each blink.
        const FIREFLY_COUNT = isMobile ? 8 : 16;
        const fireflies = [];
        for (let i = 0; i < FIREFLY_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx;
          const z = (Math.random() * 2 - 1) * bz;
          const h = 0.4 + Math.random() * 0.6;
          const ent = createFirefly(sim, {
            position: [x, h, z],
            size: 0.035,
          });
          fireflies.push({
            group: ent.mesh,
            ent,
            sleeping: false,
            sleep() { this.sleeping = true; this.group.visible = false; },
            wake() { this.sleeping = false; this.group.visible = creaturesEnabled; },
            x, z, h,
            tx: 0, tz: 0, th: 0,
            wanderT: 1 + Math.random() * 2,
          });
        }
        // Nocturnal: awake over the night window [20h, 6h) — emerges at dusk.
        dayCycle.push({ items: fireflies, wakeHour: 20, sleepHour: 6 });

        sim.addEntity(null, null, (dt) => {
          for (const f of fireflies) f.group.visible = creaturesEnabled && !f.sleeping;
          if (!creaturesEnabled) return;
          for (const f of fireflies) {
            if (f.sleeping) continue;
            // Slow lazy drift between dark patches; eases toward a new target
            // every few seconds so the swarm reads as wandering, not frozen.
            f.wanderT -= dt;
            if (f.wanderT <= 0) {
              f.tx = (Math.random() * 2 - 1) * bx * 0.9;
              f.tz = (Math.random() * 2 - 1) * bz * 0.9;
              f.th = 0.3 + Math.random() * 0.7;
              f.wanderT = 6 + Math.random() * 8;
            }
            const e = 1 - Math.exp(-dt * 0.5);
            f.x += (f.tx - f.x) * e;
            f.z += (f.tz - f.z) * e;
            f.h += (f.th - f.h) * e;
            f.group.position.set(f.x, f.h, f.z);
          }
        });

        // Sync initial sleep/wake state to the current hour (so a page loaded
        // at night starts the diurnal families already asleep). dispatch lets
        // prevHour == hour on init, so no boundary "crosses" and sleep()/wake()
        // would never fire; instead we set each family's state directly.
        for (const fam of dayCycle) {
          const w = fam.wakeHour, s = fam.sleepHour;
          const awake = w < s ? time.hour >= w && time.hour < s : time.hour >= w || time.hour < s;
          for (const item of fam.items) (awake ? item.wake() : item.sleep());
        }

        sim.addEntity(null, null, (dt) => {
          for (const b of bees) b.group.visible = creaturesEnabled && !b.sleeping;
          if (!creaturesEnabled) return;
          for (const b of bees) {
            if (b.sleeping) continue;
            if (b.state === "feed") {
              // Stationary at feeding height: gentle bobbing and slow yaw drift.
              b.feedT -= dt;
              b.feedPhase += dt * 2;
              b.h = FEED_H + Math.sin(b.feedPhase) * 0.06;
              b.yaw += dt * (Math.random() - 0.5) * 0.6;
              b.pitch = Math.sin(b.feedPhase * 0.5) * 0.08;
              b.roll = 0;
              b.ent.setFlapSpeed(140);
              if (b.feedT <= 0) {
                // Loiter's over — launch. 10% of the time the bee does an "S"
                // (snake-like weave to a farther target); otherwise a shallow
                // nearby seek hop.
                b.sx = b.x;
                b.sz = b.z;
                b.sh = b.h;
                const isS = Math.random() < 0.1;
                b.mode = isS ? "S" : "seek";
                const r = isS
                  ? 5 + Math.random() * 10 // S goes farther
                  : 0.05 + Math.random() * 2.5; // seek stays close
                const ang = Math.random() * Math.PI * 2;
                b.tx = Math.max(-bx, Math.min(bx, b.sx + Math.cos(ang) * r));
                b.tz = Math.max(-bz, Math.min(bz, b.sz + Math.sin(ang) * r));
                b.th = FEED_H;
                b.apex = FEED_H + 0.6 + Math.random() * 0.5; // barely above grass
                if (isS) {
                  // Build the S-curve as an arc-length-sampled polyline so the
                  // snake moves at the same constant speed along its weave.
                  const dist = Math.max(0.01, Math.hypot(b.tx - b.sx, b.tz - b.sz));
                  const ux = (b.tx - b.sx) / dist, uz = (b.tz - b.sz) / dist;
                  const pxx = -uz, pzz = ux; // perpendicular (lateral) axis
                  const A = 0.9 + Math.random() * 1.3; // lateral amplitude
                  const waves = 2 + Math.random() * 2; // 2-4 full S-waves
                  const N = 120;
                  const pts = [];
                  const cum = [0];
                  for (let i = 0; i <= N; i++) {
                    const t = i / N;
                    const fwd = dist * t;
                    // Taper the lateral sine to zero at both ends so the S
                    // starts exactly at the launch point and ends exactly at
                    // the target — no position snap when it settles into feed.
                    const tap = Math.sin(t * Math.PI);
                    const lat = A * Math.sin(t * waves * Math.PI * 2) * tap;
                    const x = b.sx + ux * fwd + pxx * lat;
                    const z = b.sz + uz * fwd + pzz * lat;
                    pts.push({ x, z });
                    if (i > 0) {
                      const dx = pts[i].x - pts[i - 1].x;
                      const dz = pts[i].z - pts[i - 1].z;
                      cum.push(cum[i - 1] + Math.hypot(dx, dz));
                    }
                  }
                  b.spath = { pts, cum, len: cum[N] };
                  b.waves = waves;
                  b.flyDur = b.spath.len / BEE_SPEED;
                } else {
                  const dist = Math.max(0.01, Math.hypot(b.tx - b.sx, b.tz - b.sz));
                  // Constant flying speed regardless of distance OR apex height:
                  // time each climb/descent leg from its 3D path length (half the
                  // horizontal distance plus the vertical rise), so a short hop
                  // with a big vertical rise isn't faster than a long one.
                  const vert = Math.max(0, b.apex - b.sh);
                  const legLen = Math.hypot(dist / 2, vert);
                  const legT = legLen / BEE_SPEED;
                  b.upT = legT;
                  b.downT = legT;
                  b.flyDur = b.upT + b.downT;
                }
                b.flyT = 0;
                b.loopCx = (b.sx + b.tx) / 2;
                b.loopCz = (b.sz + b.tz) / 2;
                b.state = "fly";
              }
            } else {
              // Seeking has two phases along the total flight time, each with
              // its own absolute duration so the speed stays constant:
              //   flyT in [0, upT)  ARC UP   : climb to the apex, easing
              //                                horizontally to the midpoint.
              //   flyT in [upT,1)   ARC DOWN : descend from the apex down to
              //                                the target at the same speed.
              b.flyT += dt;
              b.ent.setFlapSpeed(140);
              const t = Math.min(1, b.flyT / b.flyDur);
              if (b.mode === "S") {
                // S-mode: snake along the precomputed arc-length path at a
                // constant speed. Find the point at arc-length fraction t.
                const cum = b.spath.cum;
                const target = t * b.spath.len;
                let lo = 0, hi = cum.length - 1;
                while (lo < hi) {
                  const m = (lo + hi) >> 1;
                  if (cum[m] < target) lo = m + 1;
                  else hi = m;
                }
                const i = lo;
                const seg0 = b.spath.pts[i - 1] || b.spath.pts[0];
                const seg1 = b.spath.pts[i];
                const span = cum[i] - cum[i - 1] || 1;
                const f = (target - (cum[i - 1] || 0)) / span;
                const px_ = seg0.x + (seg1.x - seg0.x) * f;
                const pz_ = seg0.z + (seg1.z - seg0.z) * f;
                // Face along the actual direction of travel (velocity delta),
                // which flows smoothly — the polyline slope awkwardly snaps at
                // the S's corners and makes the bee look like it whips around.
                const dx = px_ - (b.px === undefined ? b.sx : b.px);
                const dz = pz_ - (b.pz === undefined ? b.sz : b.pz);
                b.px = px_;
                b.pz = pz_;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.x = px_;
                b.z = pz_;
                // Rise gently over the first half, settle on the second half.
                b.h = b.sh + (b.apex - b.sh) * Math.sin(t * Math.PI);
                b.pitch = Math.cos(t * Math.PI) * 0.3;
                b.roll = Math.sin(t * b.waves * Math.PI * 2) * 0.4;
                if (t >= 1) {
                  // Already at the target (the S is tapered to end there), so
                  // settle into feed without any position snap.
                  b.spath = null;
                  const roll = Math.random();
                  b.feedT = roll < 0.33 ? 0.5 : roll < 0.66 ? 1 : 3;
                  b.state = "feed";
                  continue;
                }
                b.group.position.set(b.x, b.h, b.z);
                b.group.rotation.set(b.pitch, b.yaw, b.roll, "YXZ");
                continue;
              }
              if (b.flyT < b.upT) {
                // Climb phase, 0..1 through it.
                const lt = Math.min(1, b.flyT / b.upT);
                const e = lt * lt * (3 - 2 * lt); // smoothstep
                const bump = Math.sin(lt * Math.PI / 2); // 0 -> 1 (still rising)
                b.x = b.sx + (b.loopCx - b.sx) * e;
                b.z = b.sz + (b.loopCz - b.sz) * e;
                b.h = b.sh + (b.apex - b.sh) * bump;
                const dx = b.loopCx - b.sx;
                const dz = b.loopCz - b.sz;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.pitch = 0.35; // climbing
                b.roll = Math.sin(b.flyT * 6) * 0.1;
              } else {
                // Descend phase, 0..1 through it.
                const lt = Math.min(1, (b.flyT - b.upT) / b.downT);
                const e = lt * lt * (3 - 2 * lt); // smoothstep
                const bump = Math.cos(lt * Math.PI / 2); // 1 -> 0 (descending)
                b.x = b.loopCx + (b.tx - b.loopCx) * e;
                b.z = b.loopCz + (b.tz - b.loopCz) * e;
                b.h = b.sh + (b.apex - b.sh) * bump;
                const dx = b.tx - b.loopCx;
                const dz = b.tz - b.loopCz;
                if (dx || dz) b.yaw = Math.atan2(dx, dz) - Math.PI / 2;
                b.pitch = -0.35; // diving
                b.roll = Math.sin(b.flyT * 6) * 0.1;
              }
              if (t >= 1) {
                // Arrived at the target: settle briefly, then seek again.
                b.x = b.tx;
                b.z = b.tz;
                b.h = FEED_H;
                // Loiter a random duration: ~1/3 chance each of 0.5s, 1s, 3s.
                const roll = Math.random();
                b.feedT = roll < 0.33 ? 0.5 : roll < 0.66 ? 1 : 3;
                b.state = "feed";
                continue;
              }
            }
            b.group.position.set(b.x, b.h, b.z);
            b.group.rotation.set(b.pitch, b.yaw, b.roll, "YXZ");
          }
        });

        // --- Dandelions: ~20 decorative plants scattered across the lawn. ---
        // A random mix of flower and seed phases; ~75% grow as a bunch (a
        // clump of 2-5 fanned stems), the rest are single plants. They're
        // mowed down like the grass and regrow after a random delay.
        const DANDELION_COUNT = isMobile ? 12 : 40;
        const dandelions = [];
        for (let i = 0; i < DANDELION_COUNT; i++) {
          // Pick a spot on the lawn, keeping the mower's starting patch clear.
          // (clear radius scales with the lawn so small grids stay full.)
          let x, z;
          do {
            x = (Math.random() * 2 - 1) * bx;
            z = (Math.random() * 2 - 1) * bz;
          } while (Math.hypot(x, z) < Math.min(bx, bz) * 0.35);
          const flower = Math.random() < 0.5; // half seed puff, half yellow bloom
          const ent = createDandelion(sim, {
            flower,
            bunch: Math.random() < 0.75, // 75% bunches, 25% single
            stemHeight: 1.1,
            stemRadius: 0.02,
            headRadius: 0.14,
            position: [x, 0, z],
            rotation: [0, Math.random() * Math.PI * 2, 0],
          });
          dandelions.push({ ent, x, z, flower, grown: true, regrowT: 0 });
        }

        // Creatures checkbox: toggle all bugs (midges, butterflies, dragonflies, swarms).
        const creaturesCheckbox = document.getElementById("creatures-checkbox");
        const sandboxCheckbox = document.getElementById("sandbox-checkbox");
        const sandboxPanel = document.getElementById("sandbox-panel");
        sandboxCheckbox.addEventListener("change", () => {
          sandboxPanel.style.display = sandboxCheckbox.checked ? "" : "none";
        });
        const applyCreatures = () => {
          creaturesEnabled = creaturesCheckbox.checked;
          flies.mesh.visible = creaturesEnabled && !fliesSleeping.value;
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          for (const d of dragonflies) d.group.visible = creaturesEnabled && !d.sleeping;
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled && !s.sleeping;
          for (const b of bees) b.group.visible = creaturesEnabled && !b.sleeping;
          for (const f of fireflies) f.group.visible = creaturesEnabled && !f.sleeping;
        };
        creaturesCheckbox.addEventListener("change", applyCreatures);

        const fpsEnt = createFPSCounter(sim);
        const gcEnt = createGCStats(sim, { color: "rgba(20,20,20,0.75)" });
        const entityEnt = createEntityStats(sim, {
          color: "rgba(20,20,20,0.8)",
        });

        // Toggle button tucked directly below the FPS counter; hides/shows the
        // extended stats (GC + entity). FPS always stays visible. GC may be
        // null when the heap API is unavailable.
        const statEls = [gcEnt, entityEnt.element].filter(Boolean).map((e) =>
          e.element ? e.element : e,
        );
        statEls.forEach((el) => (el.style.display = "none"));
        const statsBtn = document.createElement("button");
        statsBtn.textContent = "[stats]";
        statsBtn.style.position = "absolute";
        statsBtn.style.top = "32px";
        statsBtn.style.right = "14px";
        statsBtn.style.fontFamily = "monospace, sans-serif";
        statsBtn.style.fontSize = "0.7rem";
        statsBtn.style.color = "rgba(255,255,255,0.6)";
        statsBtn.style.background = "transparent";
        statsBtn.style.border = "none";
        statsBtn.style.cursor = "pointer";
        statsBtn.style.padding = "0";
        statsBtn.style.zIndex = "1000";
        let statsVisible = false;
        // Each stat line has a fixed base top offset set by its component.
        const statBaseTops = statEls.map((el) => parseInt(el.style.top) || 0);
        statsBtn.addEventListener("click", () => {
          statsVisible = !statsVisible;
          statEls.forEach((el, i) => {
            el.style.display = statsVisible ? "" : "none";
            // Push the lines below the [stats] button only while visible.
            el.style.top = statsVisible ? `${statBaseTops[i] + 22}px` : "";
          });
          // Place the [options] button below the lowest open stat line's real
          // bottom edge (the entity list is multiline), so nothing overlaps.
          let bottom = 54;
          if (statsVisible) {
            // Force immediate layout so the displayed lines report real size.
            void statEls[0].offsetHeight;
            for (const el of statEls) {
              bottom = Math.max(bottom, el.getBoundingClientRect().bottom);
            }
          }
          const optionsTop = `${bottom + 6}px`;
          optionsBtn.style.top = optionsTop;
          sidePanel.style.top = `${bottom + 30}px`;
        });
        document.body.appendChild(statsBtn);
        // Mobile: show only the FPS counter — hide the toggleable stats button.
        if (isMobile) statsBtn.style.display = "none";

        // [options] button tucked below [stats]; toggles the Creatures/Sandbox
        // controls in the #side panel.
        const optionsBtn = document.createElement("button");
        optionsBtn.textContent = "[options]";
        optionsBtn.style.position = "absolute";
        optionsBtn.style.top = "54px";
        optionsBtn.style.right = "14px";
        optionsBtn.style.fontFamily = "monospace, sans-serif";
        optionsBtn.style.fontSize = "0.7rem";
        optionsBtn.style.color = "rgba(255,255,255,0.6)";
        optionsBtn.style.background = "transparent";
        optionsBtn.style.border = "none";
        optionsBtn.style.cursor = "pointer";
        optionsBtn.style.padding = "0";
        optionsBtn.style.zIndex = "1000";
        const sidePanel = document.getElementById("side");
        optionsBtn.addEventListener("click", () => {
          const shown = sidePanel.style.display !== "none";
          sidePanel.style.display = shown ? "none" : "flex";
        });
        document.body.appendChild(optionsBtn);
        if (isMobile) optionsBtn.style.display = "none";
      }

      setup(sim);
      sim.start();
    </script>
  </body>
</html>
