<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Mow</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
        Zen Mow
      </h1>
      <p style="margin: 4px 0 0; font-size: 0.85rem; opacity: 0.5">
        W/A/S/D or arrow keys to move.
      </p>
      <label
        id="creatures-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="creatures-checkbox" checked />
        Creatures
      </label>
    </div>

    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createFlySwarm,
      } from "engine/primitives.js";
      import {
        createLawnmower,
        createButterfly,
        createDragonfly,
        createFPSCounter,
        createGCStats,
        createEntityStats,
      } from "engine/components.js";
      import {} from "engine/materials.js";
      import * as THREE from "three";

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x87ceeb,
        enableShadows: true,
      });

      {
        const sun = sim.scene.children.find((c) => c.isDirectionalLight);
        if (sun) {
          const d = 70;
          sun.shadow.camera.left = -d;
          sun.shadow.camera.right = d;
          sun.shadow.camera.top = d;
          sun.shadow.camera.bottom = -d;
          sun.shadow.camera.near = 0.5;
          sun.shadow.camera.far = 200;
          sun.shadow.camera.updateProjectionMatrix();
        }
      }

      function setup(sim) {
        // Ground plane.
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b180c });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        // Cast too: the plane occludes blade geometry in the shadow pass, so
        // grass sunk into the soil doesn't cast phantom full-length shadows.
        ground.castShadow = true;
        sim.scene.add(ground);

        // Grass: single instanced mesh, 3x3 patches tiled across 100x100.
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        const W = 3, D = 3, N = isMobile ? 250 : 1000;
        const COLS = 20, ROWS = 20;
        const total = COLS * ROWS * N;
        const bladeGeo = new THREE.ConeGeometry(0.08, 1.7, 4);
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x44aa55, roughness: 0.8 });
        // Gentle breeze: sway lives in the vertex shader, so it costs nothing
        // on the CPU (only the regrowing blades touch instance matrices). It
        // bends in local space before the instance transform, so each blade
        // keeps its own scale/orientation and its base stays anchored.
        const swayUniforms = { uTime: { value: 0 } };
        bladeMat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = swayUniforms.uTime;
          // Declare the uniform at global scope (#include <common> is the first
          // include); #include <begin_vertex> sits inside main().
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nuniform float uTime;")
            .replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
#ifdef USE_INSTANCING
            // h: 0 at the base, 1 at the tip (cone height 1.7, centered at 0).
            float h = clamp((transformed.y + 0.85) / 1.7, 0.0, 1.0);
            // Blade base position = instance translation (world space).
            vec3 _base = instanceMatrix[3].xyz;
            // Per-blade phase so neighboring blades don't wave in lockstep.
            float _ph = fract(sin(dot(_base.xz * 0.13, vec2(12.9898, 78.233))) * 43758.5453);
            // A shallow wave drifting across the lawn, gentler near the base.
            float _wave = sin(_base.x * 1.2 + uTime * 1.6 + _ph * 6.2831)
                        + cos(_base.z * 1.4 + uTime * 1.2 + _ph * 6.2831);
            transformed.x += _wave * h * h * 0.015;
#endif
`,
          );
        };
        const grassMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, total);
        grassMesh.castShadow = true;
        grassMesh.receiveShadow = true;
        const dummy = new THREE.Object3D();
        const bladePos = [];
        const bladeRot = [];
        const bladeScale = new Float32Array(total);
        const bladeGrowth = new Float32Array(total);
        // Distance from the cone's center to its tip. Blades are never squashed:
        // they stay full length and sink into the ground by the un-grown amount
        // (see the grow loop), so the tip just peeks out of the soil when cut.
        const BLADE_HALF = bladeGeo.parameters.height / 2;
        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const ox = (c - COLS / 2 + 0.5) * W;
            const oz = (r - ROWS / 2 + 0.5) * D;
            const hw = W / 2, hd = D / 2;
            for (let i = 0; i < N; i++) {
              const s = 0.6 + Math.random() * 0.8;
              bladeScale[idx] = s;
              bladeGrowth[idx] = 1; // start fully grown
              bladePos[idx] = new THREE.Vector3(
                ox + Math.random() * W - hw,
                0,
                oz + Math.random() * D - hd,
              );
              bladeRot[idx] = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(
                  (Math.random() - 0.5) * 0.35,
                  Math.random() * Math.PI * 2,
                  (Math.random() - 0.5) * 0.35,
                ),
              );
              dummy.position.set(
                bladePos[idx].x,
                BLADE_HALF * bladeScale[idx] * (bladeGrowth[idx] - 1),
                bladePos[idx].z,
              );
              dummy.quaternion.copy(bladeRot[idx]);
              dummy.scale.set(s, s, s);
              dummy.updateMatrix();
              grassMesh.setMatrixAt(idx++, dummy.matrix);
            }
          }
        }
        grassMesh.instanceMatrix.needsUpdate = true;
        sim.scene.add(grassMesh);

        // Spatial grid over the lawn so cut checks only test blades near the
        // mower instead of all of them every frame. Blade positions never move,
        // so the buckets are built once.
        const CELL = 1.5; // grid cell size (world units)
        const GRID_COLS = Math.ceil((COLS * W) / CELL);
        const GRID_ROWS = Math.ceil((ROWS * D) / CELL);
        const lawnMinX = -(COLS * W) / 2, lawnMinZ = -(ROWS * D) / 2;
        const gridCells = new Array(GRID_COLS * GRID_ROWS);
        const counts = new Uint32Array(GRID_COLS * GRID_ROWS);
        const cellIndex = (x, z) => {
          const cx = Math.min(GRID_COLS - 1, Math.max(0, Math.floor((x - lawnMinX) / CELL)));
          const cz = Math.min(GRID_ROWS - 1, Math.max(0, Math.floor((z - lawnMinZ) / CELL)));
          return cz * GRID_COLS + cx;
        };
        for (let i = 0; i < total; i++) counts[cellIndex(bladePos[i].x, bladePos[i].z)]++;
        // Prefix-sum so each cell's indices are a contiguous slice of one array.
        const cellStart = new Int32Array(gridCells.length + 1);
        for (let i = 0; i < gridCells.length; i++) cellStart[i + 1] = cellStart[i] + counts[i];
        const cellIndices = new Uint32Array(total);
        {
          const cursor = new Int32Array(gridCells.length);
          for (let i = 0; i < total; i++) {
            const ci = cellIndex(bladePos[i].x, bladePos[i].z);
            cellIndices[cellStart[ci] + cursor[ci]++] = i;
          }
        }
        // Iterate blades inside the mower's (world-space) cut footprint.
        const visitCutArea = (cb) => {
          const o = mower.mesh.position;
          const q = mower.mesh.quaternion;
          const hw = CUT_HALF_W, hd = CUT_HALF_D;
          // Orient the footprint axes into world space to bound its AABB.
          const fx = _fx.set(hw, 0, 0).applyQuaternion(q);
          const fz = _fz.set(0, 0, hd).applyQuaternion(q);
          const minX = o.x - Math.abs(fx.x) - Math.abs(fz.x);
          const maxX = o.x + Math.abs(fx.x) + Math.abs(fz.x);
          const minZ = o.z - Math.abs(fx.z) - Math.abs(fz.z);
          const maxZ = o.z + Math.abs(fx.z) + Math.abs(fz.z);
          const c0x = Math.max(0, Math.floor((minX - lawnMinX) / CELL));
          const c1x = Math.min(GRID_COLS - 1, Math.floor((maxX - lawnMinX) / CELL));
          const c0z = Math.max(0, Math.floor((minZ - lawnMinZ) / CELL));
          const c1z = Math.min(GRID_ROWS - 1, Math.floor((maxZ - lawnMinZ) / CELL));
          for (let cz = c0z; cz <= c1z; cz++) {
            for (let cx = c0x; cx <= c1x; cx++) {
              const ci = cz * GRID_COLS + cx;
              for (let k = cellStart[ci]; k < cellStart[ci + 1]; k++) {
                if (cb(cellIndices[k])) return true;
              }
            }
          }
          return false;
        };

        // Place a push lawnmower on the lawn.
        const mower = createLawnmower(sim, {
          wheelRadius: 0.4,
          reelWidth: 1.25,
          bladeThickness: 0.01,
          blades: 4,
          handleAngle: 0.75,
          handleLength: 1.7,
          bodyColor: 0x2a3d56,
          bladeColor: 0x014101,
          wheelColor: 0x1a1a1a,
          position: [0, 0, 0],
          rotation: [0, 0, 0],
        });

        // Drive the mower: W/S (or up/down arrows) move, A/D (or left/right)
        // turn. Reel spins 2x.
        const keys = new Set();
        window.addEventListener("keydown", (e) => keys.add(e.code));
        window.addEventListener("keyup", (e) => keys.delete(e.code));
        const forward = new THREE.Vector3(0, 0, 1);
        const _dir = new THREE.Vector3();       // reusable per-frame temps (no alloc)
        const _reelWorld = new THREE.Vector3();
        const _right = new THREE.Vector3();
        const _fx = new THREE.Vector3();        // cut-footprint AABB axes
        const _fz = new THREE.Vector3();
        const turnDir = new THREE.Vector3(0, 1, 0);
        let mowerMoving = false;
        const keyF = () =>
          keys.has("KeyS") || keys.has("ArrowDown") ? 1 : keys.has("KeyW") || keys.has("ArrowUp") ? -1 : 0;
        const keyTurn = () =>
          keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : keys.has("KeyD") || keys.has("ArrowRight") ? -1 : 0;

        // Touch control (mobile): any touch drives forward; steering is by the
        // finger's position relative to screen center (drag left to turn left,
        // right to turn right). Combined with the keyboard inputs below.
        let touchActive = false;
        let touchF = 0;
        let touchTurn = 0;
        const canvas = sim.renderer.domElement;
        canvas.style.touchAction = "none";
        canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          touchActive = true;
          touchF = -1; // touching anywhere moves the mower forwards (=-Z, same as W)
          updateTouchTurn(t.clientX);
        }, { passive: false });
        const updateTouchTurn = (x) => {
          const center = window.innerWidth / 2;
          // Map finger X to steering in [-1, 1]; a small dead zone near center.
          const half = center;
          const raw = (center - x) / half;
          touchTurn = Math.abs(raw) < 0.1 ? 0 : Math.max(-1, Math.min(1, raw));
        };
        canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          updateTouchTurn(t.clientX);
        }, { passive: false });
        canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          if (e.touches.length === 0) {
            touchActive = false;
            touchF = 0;
            touchTurn = 0;
          }
        }, { passive: false });
        canvas.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          touchActive = false;
          touchF = 0;
          touchTurn = 0;
        }, { passive: false });

        // Reel cut footprint (matches the grass-cutting test below).
        const CUT_HALF_W = 1.25 / 2; // across the reel (local X)
        const CUT_HALF_D = 0.4 * 0.7; // cutting depth (local Z)
        const CUT_MIN_GROWTH = 0.02; // cut grass down to 2% of full height
        const localPos = new THREE.Vector3();
        const invMower = new THREE.Matrix4();
        // Active-growth set: only blades below full height are touched each
        // frame, instead of scanning all of them. `growIndex[i]` gives the slot
        // of blade i in `growList` (or -1 if not growing), enabling O(1) add.
        const growList = [];
        const growIndex = new Int32Array(total).fill(-1);
        const addToGrow = (i) => {
          if (growIndex[i] !== -1) return; // already in the list
          growIndex[i] = growList.length;
          growList.push(i);
        };
        // Whether cuttable grass (strictly above the mower's minimum height)
        // currently sits under the reel. Only tests blades in the grid cells
        // overlapping the cut footprint.
        const hasGrassToCut = () => {
          invMower.copy(mower.mesh.matrixWorld).invert();
          return visitCutArea((i) => {
            if (bladeGrowth[i] <= CUT_MIN_GROWTH) return false;
            localPos.copy(bladePos[i]).applyMatrix4(invMower);
            if (Math.abs(localPos.x) < CUT_HALF_W && Math.abs(localPos.z) < CUT_HALF_D) {
              return true;
            }
            return false;
          });
        };

        // --- Grass-clipping particle effect (emitted when the mower moves) ---
        const CLIP_COUNT = 120;
        // Each clipping is a real 3D blade mesh so it can carry a random 3D
        // rotation and tumble as it flies.
        const clipGeo = new THREE.ConeGeometry(0.03, 0.5, 4);
        const clipMat = new THREE.MeshStandardMaterial({
          color: 0x3f8f3f,
          roughness: 0.9,
        });
        const clipMesh = new THREE.InstancedMesh(clipGeo, clipMat, CLIP_COUNT);
        clipMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        clipMesh.frustumCulled = false;
        sim.scene.add(clipMesh);
        const clipDummy = new THREE.Object3D();
        const clipQuat = new THREE.Quaternion();
        const clipEuler = new THREE.Euler();
        const clips = [];
        for (let i = 0; i < CLIP_COUNT; i++) {
          clips.push({ x: 0, y: -1000, z: 0, vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0, wrx: 0, wry: 0, wrz: 0, life: 0, alive: false });
          clipDummy.position.set(-1000, -1000, -1000);
          clipDummy.updateMatrix();
          clipMesh.setMatrixAt(i, clipDummy.matrix);
        }
        let clipCursor = 0;
        let clipAccum = 0;

        sim.addEntity(null, null, (dt) => {
          // Mower local +Z (handle push direction) mapped to the horizontal
          // world direction; with no roll/pitch this is the forward heading.
          const dir = _dir.copy(forward).applyQuaternion(mower.mesh.quaternion);
          const turn = keyTurn() || touchTurn;
          const v = keyF() || touchF;
          const speed = 2;
          // Shift sharpens steering while moving. Scale both the turn rate and
          // the forward speed down together, so the corner stays exactly as
          // tight without the mower whipping around.
          const shifting = keys.has("ShiftLeft") || keys.has("ShiftRight");
          const ease = shifting ? 0.75 : 1;
          const move = v * speed * ease;
          const turnSpeed = v === 0 ? 4.0 : shifting ? 4.0 * ease : 2.0;

          mowerMoving = v !== 0;
          mower.mesh.rotateOnWorldAxis(turnDir, turn * turnSpeed * dt);
          mower.setSpeed(move);
          mower.mesh.position.addScaledVector(dir, move * dt);
          // Reflect the fresh transform immediately so the cut-footprint check
          // (which uses matrixWorld) matches the mower's real position this frame.
          mower.mesh.updateWorldMatrix(true, false);

          // Emit clippings from the reel when moving AND actually cutting grass.
          const cutting = hasGrassToCut();
          const reelWorld = mower.mesh.localToWorld(_reelWorld.set(0, 0.1, 0));
          const right = _right.set(1, 0, 0).applyQuaternion(mower.mesh.quaternion);
          if (mowerMoving && cutting) {
            clipAccum += dt * 250;
            while (clipAccum >= 1) {
              clipAccum -= 1;
              const p = clips[clipCursor];
              clipCursor = (clipCursor + 1) % CLIP_COUNT; // reuse a slot each time
              const off = (Math.random() - 0.5) * 0.8; // across the reel (local X)
              p.x = reelWorld.x + off * right.x;
              p.z = reelWorld.z + off * right.z;
              p.y = reelWorld.y + Math.random() * 0.1;
              const spread = 1.6;
              p.vx = (Math.random() - 0.5) * spread;
              p.vz = (Math.random() - 0.5) * spread;
              p.vy = 1.2 + Math.random() * 1.6;
              // Random starting 3D rotation and fixed tumble rates.
              p.rx = Math.random() * Math.PI * 2;
              p.ry = Math.random() * Math.PI * 2;
              p.rz = Math.random() * Math.PI * 2;
              p.wrx = (Math.random() - 0.5) * 14;
              p.wry = (Math.random() - 0.5) * 14;
              p.wrz = (Math.random() - 0.5) * 14;
              p.life = 0;
              p.alive = true;
            }
          } else {
            clipAccum = 0;
          }

          // Age clippings: tumble and arc with gravity, then despawn.
          for (let i = 0; i < CLIP_COUNT; i++) {
            const p = clips[i];
            if (!p.alive) {
              clipDummy.position.set(-1000, -1000, -1000);
              clipDummy.quaternion.identity();
              clipDummy.scale.set(1, 1, 1);
              clipDummy.updateMatrix();
              clipMesh.setMatrixAt(i, clipDummy.matrix);
              continue;
            }
            p.life += dt;
            p.vy -= 5 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.rx += p.wrx * dt;
            p.ry += p.wry * dt;
            p.rz += p.wrz * dt;
            if (p.life > 0.9 || p.y < 0.01) {
              p.alive = false;
              p.y = -1000;
            }
            clipDummy.position.set(p.x, p.y, p.z);
            clipEuler.set(p.rx, p.ry, p.rz);
            clipQuat.setFromEuler(clipEuler);
            clipDummy.quaternion.copy(clipQuat);
            clipDummy.updateMatrix();
            clipMesh.setMatrixAt(i, clipDummy.matrix);
          }
          clipMesh.instanceMatrix.needsUpdate = true;
        });

        // Orbit camera.
        let theta = 0, phi = Math.PI / 6, radius = 25;
        let dragging = false, lastX = 0, lastY = 0;
        const target = new THREE.Vector3(0, 0, 0);

        canvas.addEventListener("mousedown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        });
        window.addEventListener("mouseup", () => { dragging = false; });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.005;
          phi = Math.max(0.1, Math.min(Math.PI - 0.1,
            phi - (e.clientY - lastY) * 0.005));
          lastX = e.clientX;
          lastY = e.clientY;
        });
        canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          radius = Math.max(3, Math.min(80, radius + e.deltaY * 0.03));
        }, { passive: false });

        let grassDirty = false;
        const growRate = 0.0375;
        sim.addEntity(null, null, (dt) => {
          swayUniforms.uTime.value = (swayUniforms.uTime.value + dt) % 1000;
          // Cut any blades under the mower's reel, then grow the lawn back.
          grassDirty = false;
          // Cut: only test blades in the grid cells under the reel. Trim any
          // grown above the mower's minimum height down to that minimum (a real
          // mower leaves a uniform-height lawn, it doesn't scalp to nothing).
          invMower.copy(mower.mesh.matrixWorld).invert();
          visitCutArea((i) => {
            if (bladeGrowth[i] > CUT_MIN_GROWTH) {
              localPos.copy(bladePos[i]).applyMatrix4(invMower);
              if (Math.abs(localPos.x) < CUT_HALF_W &&
                  Math.abs(localPos.z) < CUT_HALF_D) {
                bladeGrowth[i] = CUT_MIN_GROWTH;
                addToGrow(i);
              }
            }
            return false;
          });
          // Grow only the blades that are below full height (active set), not
          // every blade. Each blade keeps its full length; it's sunk into the
          // soil by the un-grown amount, so the top `growth` fraction of a thin
          // blade emerges from the ground and rises as it regrows.
          for (let k = 0; k < growList.length; ) {
            const i = growList[k];
            bladeGrowth[i] = Math.min(bladeGrowth[i] + dt * growRate, 1);
            dummy.position.set(
              bladePos[i].x,
              BLADE_HALF * bladeScale[i] * (bladeGrowth[i] - 1),
              bladePos[i].z,
            );
            dummy.quaternion.copy(bladeRot[i]);
            dummy.scale.set(bladeScale[i], bladeScale[i], bladeScale[i]);
            dummy.updateMatrix();
            grassMesh.setMatrixAt(i, dummy.matrix);
            grassDirty = true;
            if (bladeGrowth[i] >= 1) {
              // Swap-remove: move the last growing blade into this slot.
              const last = growList.pop();
              if (last !== i) {
                growList[k] = last;
                growIndex[last] = k;
              }
              growIndex[i] = -1;
            } else {
              k++;
            }
          }
          if (grassDirty) grassMesh.instanceMatrix.needsUpdate = true;

          // Orbit camera.
          const sp = Math.sin(phi);
          sim.camera.position.set(
            target.x + radius * sp * Math.sin(theta),
            target.y + radius * Math.cos(phi),
            target.z + radius * sp * Math.cos(theta),
          );
          sim.camera.lookAt(target);
        });

        // --- Songbirds: little flying bugs that drift around the lawn ---
        // Each bug is a tiny dark sphere with a lighter point that gently
        // bobs in place, then picks a new spot and flits over to it.
        // All creatures (midges, butterflies, dragonflies) share this flag so
        // the "Creatures" checkbox toggles them all together.
        let creaturesEnabled = true;
        const BUG_COUNT = isMobile ? 8 : 20;
        const bugGeo = new THREE.SphereGeometry(0.035, 6, 4);
        const bugMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
        const bugMesh = new THREE.InstancedMesh(bugGeo, bugMat, BUG_COUNT);
        bugMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        bugMesh.frustumCulled = false;
        bugMesh.castShadow = false;
        sim.scene.add(bugMesh);

        const bugDummy = new THREE.Object3D();
        const bugs = [];
        // Spread over the lawn (inside the grass tiles) so they look at home.
        const bx = (COLS * W) / 2 - 1, bz = (ROWS * D) / 2 - 1;
        for (let i = 0; i < BUG_COUNT; i++) {
          bugs.push({
            x: (Math.random() * 2 - 1) * bx,
            z: (Math.random() * 2 - 1) * bz,
            h: 0.5 + Math.random() * 0.8,   // cruise height
            phase: Math.random() * Math.PI * 2,
            targetX: 0, targetZ: 0, targetH: 0,
            // state: 0 = dwelling, 1 = flying to target
            moving: false,
            moveT: 0, moveDur: 0,
            scared: false,
            scareT: 0,
          });
          // immediate dwelling pose (no fly-in on load)
          const b = bugs[i];
          b.targetX = b.x; b.targetZ = b.z; b.targetH = b.h;
        }

        // Scare radius: bugs within this distance of the mower buzz off.
        const SCARE_R = 4;
        const mowerPos = new THREE.Vector3();
        sim.addEntity(null, null, (dt) => {
          bugMesh.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          mowerPos.copy(mower.mesh.position);
          for (let i = 0; i < BUG_COUNT; i++) {
            const b = bugs[i];
            // A bug that is frightened jitters erratically away from the mower.
            if (b.scared) {
              b.scareT += dt;
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              const d = Math.hypot(dx, dz) || 1;
              // Flee outward and upward with a burst of erratic hopping.
              const push = d < SCARE_R ? (1 - d / SCARE_R) * 6 : 1;
              b.x += (dx / d) * push * dt * 4 + (Math.random() - 0.5) * 8 * dt;
              b.z += (dz / d) * push * dt * 4 + (Math.random() - 0.5) * 8 * dt;
              b.h += (Math.random() - 0.3) * 6 * dt;
              b.h = Math.max(0.8, Math.min(4, b.h));
              // Keep them on the lawn.
              b.x = Math.max(-bx, Math.min(bx, b.x));
              b.z = Math.max(-bz, Math.min(bz, b.z));
              // Once safely far and calm for a moment, go back to wandering.
              if (d > SCARE_R + 2 && b.scareT > 1.5) {
                b.scared = false;
                b.moving = false;
                b.moveT = Math.random() * 2; // short break before wandering again
              }
              b.phase = (b.phase + dt * 12) % (Math.PI * 2);
            } else {
              // Check if the mower has come close enough to frighten it.
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              if (dx * dx + dz * dz < SCARE_R * SCARE_R) {
                b.scared = true;
                b.scareT = 0;
              }
              if (!b.moving) {
                // Dwelling: hover with a slow bob. Occasionally dart to a new leaf.
                b.moveT += dt;
                if (b.moveT > 2 + Math.random() * 3) {
                  b.targetX = (Math.random() * 2 - 1) * bx;
                  b.targetZ = (Math.random() * 2 - 1) * bz;
                  b.targetH = 0.5 + Math.random() * 1.2;
                  b.moveDur = 0.6 + Math.random() * 0.8;
                  b.moveT = 0;
                  b.moving = true;
                }
              } else {
                // Flying: ease toward the chosen leaf, then settle back down.
                const t = Math.min(1, b.moveT / b.moveDur);
                const e = t * t * (3 - 2 * t); // smoothstep
                b.x = b.x + (b.targetX - b.x) * e;
                b.z = b.z + (b.targetZ - b.z) * e;
                b.h = b.h + (b.targetH - b.h) * e;
                b.moveT += dt;
                if (t >= 1) {
                  b.moving = false;
                  b.moveT = 0;
                }
              }
              b.phase = (b.phase + dt * 2) % (Math.PI * 2);
            }
            // Gentle bob while dwelling or flying lower/smoother.
            const bob = Math.sin(b.phase) * 0.06;
            bugDummy.position.set(b.x, b.h + bob, b.z);
            bugDummy.scale.set(1, 1, 1);
            bugDummy.rotation.y = b.phase;
            bugDummy.updateMatrix();
            bugMesh.setMatrixAt(i, bugDummy.matrix);
          }
          bugMesh.instanceMatrix.needsUpdate = true;
        });

        // --- Butterflies: graceful, colorful flappers ---
        // We reuse the butterfly model/animation from the component library
        // (createButterfly) and animate the MOVEMENT here in the game: each
        // butterfly traces a gentle looping orbit around a slowly drifting
        // focus, and darts away when the mower rolls close.
        const BFLY_COUNT = isMobile ? 5 : 12;
        const pastel = new THREE.Color();
        const butterflies = [];
        for (let i = 0; i < BFLY_COUNT; i++) {
          pastel.setHSL(Math.random(), 0.75, 0.65);
          const ent = createButterfly(sim, {
            wingColor: "#" + pastel.getHexString(),
            position: [
              (Math.random() * 2 - 1) * bx,
              0.8 + Math.random() * 0.8,
              (Math.random() * 2 - 1) * bz,
            ],
          });
          butterflies.push({
            group: ent.mesh,
            ent,
            x: (Math.random() * 2 - 1) * bx,
            z: (Math.random() * 2 - 1) * bz,
            h: 0.8 + Math.random() * 0.8,
            yaw: Math.random() * Math.PI * 2,
            flapSpeed: 14 + Math.random() * 8,
            // Occasional flap bursts: picks a slight speed-up that gains a bit
            // of altitude, then slowly drifts back down to the cruise height.
            burstT: 1 + Math.random() * 3,
            flapBoost: 0,
            // Loop path: drift toward a focus while a circle orbits it.
            cx: (Math.random() * 2 - 1) * bx,
            cz: (Math.random() * 2 - 1) * bz,
            orbit: Math.random() * Math.PI * 2,
            orbitR: 0.8 + Math.random() * 1.2,
            scatterT: 0,
            scareCooldown: 0,
            rejoinT: 0, // > 0 while easing back into the orbit after a flight
          });
        }

        // Butterflies move in the same update as the grass so they track the
        // camera loop time; the component animates the wing flap, the game
        // here owns their position and heading.
        sim.addEntity(null, null, (dt) => {
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          mowerPos.copy(mower.mesh.position);
          for (const b of butterflies) {
            b.ent.setFlapSpeed(b.scatterT > 0 ? 42 : b.flapSpeed + b.flapBoost);

            if (b.scatterT > 0) {
              // Frightened: burst upward and away from the mower, then calm.
              b.scatterT -= dt;
              b.scareCooldown = Math.max(0, b.scareCooldown - dt);
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              const d = Math.hypot(dx, dz) || 1;
              b.x += (dx / d) * dt * 3;
              b.z += (dz / d) * dt * 3;
              b.h += dt * 2;
              b.yaw = Math.atan2(dx, dz);
              if (b.scatterT <= 0) {
                // Flight's over: start easing back into the orbit, and add a
                // beat of calm so it isn't re-scared the instant it lands.
                b.rejoinT = 0.6;
                b.scareCooldown = 1.2;
              }
            } else {
              // Check if the mower frightened it (only after the cooldown, so
              // a freshly scared butterfly isn't re-triggered the instant its
              // flight ends).
              const dx = b.x - mowerPos.x;
              const dz = b.z - mowerPos.z;
              if (b.scareCooldown <= 0 && dx * dx + dz * dz < SCARE_R * SCARE_R) {
                b.scatterT = 1.4;
                continue;
              }
              // Graceful looping path: drift focus slowly, orbit around it.
              b.orbit = (b.orbit + dt * (0.8 + Math.random() * 0.4)) % (Math.PI * 2);
              b.cx += (Math.random() - 0.5) * dt * 0.5;
              b.cz += (Math.random() - 0.5) * dt * 0.5;
              let ox = b.cx + Math.cos(b.orbit) * b.orbitR;
              let oz = b.cz + Math.sin(b.orbit) * b.orbitR;
              b.h += Math.sin(b.orbit * 1.7 + 1) * dt * 0.3;
              // Flap bursts: occasionally speed the wings up to gain a touch of
              // altitude, then let it slowly settle back down to cruise height.
              if (b.flapBoost > 0) {
                // Boost active: flap harder -> rise, and start easing off.
                b.h += dt * 0.5;
                b.flapBoost = Math.max(0, b.flapBoost - dt * 5);
              } else {
                // Boost over: slowly drift back down toward cruise height.
                const sink = b.h > 0.8 ? 0.25 : 0;
                b.h -= dt * sink;
                b.burstT -= dt;
                if (b.burstT <= 0) {
                  // Trigger a new short burst, then schedule the next one.
                  b.flapBoost = 5 + Math.random() * 9;
                  b.burstT = 2 + Math.random() * 4;
                }
              }
              if (b.rejoinT > 0) {
                // Ease back from where the flight left us to the orbit point
                // (smoothstep), so there's no snap. Recenter the loop's focus
                // on the fled position so it relaxes there.
                b.rejoinT -= dt;
                const tt = Math.max(0, b.rejoinT / 0.6);
                const e = 1 - tt * tt * (3 - 2 * tt); // 0 -> 1 as we rejoin
                const fromX = b.x, fromZ = b.z;
                b.cx = fromX;
                b.cz = fromZ;
                ox = b.cx + Math.cos(b.orbit) * b.orbitR;
                oz = b.cz + Math.sin(b.orbit) * b.orbitR;
                ox = fromX + (ox - fromX) * e;
                oz = fromZ + (oz - fromZ) * e;
              }
              b.x = ox;
              b.z = oz;
              // Face the direction of motion along the orbit.
              b.yaw = -b.orbit - Math.PI / 2;
              // Keep on the lawn.
              b.cx = Math.max(-bx, Math.min(bx, b.cx));
              b.cz = Math.max(-bz, Math.min(bz, b.cz));
              b.h = Math.max(0.6, Math.min(2.2, b.h));
            }
            b.group.position.set(b.x, b.h, b.z);
            b.group.rotation.y = b.yaw;
          }
        });

        // --- Dragonflies: hover, then zoom to a new spot, hover, repeat ---
        const DRGN_COUNT = 2;
        const dragonflies = [];
        for (let i = 0; i < DRGN_COUNT; i++) {
          const x = (Math.random() * 2 - 1) * bx;
          const z = (Math.random() * 2 - 1) * bz;
          const h = 0.8 + Math.random() * 0.8;
          const ent = createDragonfly(sim, {
            bodyColor: "#2a2a2a",
            wingColor: "#78dfff",
            wingSpan: 0.4,
            wingTilt: -6,
            position: [x, h, z],
          });
          dragonflies.push({
            group: ent.mesh,
            ent,
            x,
            z,
            h,
            yaw: Math.random() * Math.PI * 2,
            // Hover / fly state machine.
            state: "hover",
            hoverT: 0.8 + Math.random() * 1.4,
            hoverDur: 0,
            fx: 0, fz: 0, fh: 0, // current flight source
            flyT: 0,
            flyDur: 0,
            tx: 0, tz: 0, th: 0, // destination
          });
        }

        sim.addEntity(null, null, (dt) => {
          for (const d of dragonflies) d.group.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          for (const d of dragonflies) {
            if (d.state === "hover") {
              d.hoverT -= dt;
              // Gentle hovering wiggle in place.
              d.yaw += dt * 0.5;
              d.h += Math.sin(performance.now() * 0.003 + d.tx) * dt * 0.05;
              d.ent.setFlapSpeed(64); // fast flap at all times, even when hovering
              if (d.hoverT <= 0) {
                // Pick a new destination — anywhere on the lawn, near or far.
                d.fx = d.x;
                d.fz = d.z;
                d.fh = d.h;
                d.tx = (Math.random() * 2 - 1) * bx;
                d.tz = (Math.random() * 2 - 1) * bz;
                d.th = 0.8 + Math.random() * 0.8;
                const dist = Math.max(0.01, Math.hypot(d.tx - d.fx, d.tz - d.fz));
                d.flyDur = 0.1 + dist * 0.05;
                d.flyT = 0;
                d.state = "fly";
              }
            } else {
              // Flying: zoom toward the destination with an ease-out, flapping
              // fast the whole way.
              d.flyT += dt;
              const t = Math.min(1, d.flyT / d.flyDur);
              const e = 1 - (1 - t) * (1 - t); // ease-out zoom
              d.x = d.fx + (d.tx - d.fx) * e;
              d.z = d.fz + (d.tz - d.fz) * e;
              d.h = d.fh + (d.th - d.fh) * e;
              // Face the direction of travel. The dragonfly's long axis (the
              // body cylinder) is local +Z, the forward/back direction. After
              // rotation.y = yaw, local +Z maps to world (sin(yaw), cos(yaw)),
              // so aim it along the motion vector (dx, dz).
              const ddx = d.tx - d.fx;
              const ddz = d.tz - d.fz;
              if (t < 1 && (ddx || ddz)) d.yaw = Math.atan2(ddx, ddz);
              d.ent.setFlapSpeed(64); // fast flap while zooming
              if (t >= 1) {
                d.state = "hover";
                d.hoverT = 1.2 + Math.random() * 2.0;
              }
            }
            d.group.position.set(d.x, d.h, d.z);
            d.group.rotation.y = d.yaw;
          }
        });

        // --- Fly swarms: two clouds of tiny flies that drift slowly around ---
        // Each swarm is an instanced cloud of flies buzzing inside a small
        // bounding sphere; we drag the whole mesh lazily around the lawn so the
        // spheres wander randomly from spot to spot rather than staying put.
        const SWARM_COUNT = 2;
        const flySwarms = [];
        for (let i = 0; i < SWARM_COUNT; i++) {
          const ent = createFlySwarm(sim, {
            count: 10,
            radius: 1.2,
            speed: 2,
            position: [
              (Math.random() * 2 - 1) * bx * 0.8,
              0.8 + Math.random() * 1.2,
              (Math.random() * 2 - 1) * bz * 0.8,
            ],
          });
          flySwarms.push({
            mesh: ent.mesh,
            ent,
            x: ent.mesh.position.x,
            z: ent.mesh.position.z,
            h: ent.mesh.position.y,
            // Lazy wandering: pick a target and ease toward it very slowly.
            tx: 0, tz: 0, th: 0,
            wanderT: 1 + Math.random() * 2,
            wanderDur: 1,
          });
        }

        sim.addEntity(null, null, (dt) => {
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled;
          if (!creaturesEnabled) return;
          for (const s of flySwarms) {
            s.wanderT -= dt;
            if (s.wanderT <= 0) {
              // Pick a new slow-drifting destination on the lawn.
              s.tx = (Math.random() * 2 - 1) * bx * 0.8;
              s.tz = (Math.random() * 2 - 1) * bz * 0.8;
              s.th = 0.6 + Math.random() * 1.4;
              s.wanderDur = 30 + Math.random() * 30;
              s.wanderT = s.wanderDur;
            }
            // Ease the whole swarm toward its target at a very gentle pace.
            const e = 1 - Math.exp(-dt * 0.08);
            s.x += (s.tx - s.x) * e;
            s.z += (s.tz - s.z) * e;
            s.h += (s.th - s.h) * e;
            s.mesh.position.set(s.x, s.h, s.z);
          }
        });

        // Creatures checkbox: toggle all bugs (midges, butterflies, dragonflies, swarms).
        const creaturesCheckbox = document.getElementById("creatures-checkbox");
        const applyCreatures = () => {
          creaturesEnabled = creaturesCheckbox.checked;
          bugMesh.visible = creaturesEnabled;
          for (const b of butterflies) b.group.visible = creaturesEnabled;
          for (const d of dragonflies) d.group.visible = creaturesEnabled;
          for (const s of flySwarms) s.mesh.visible = creaturesEnabled;
        };
        creaturesCheckbox.addEventListener("change", applyCreatures);

        createFPSCounter(sim);
        createGCStats(sim);
        createEntityStats(sim);
      }

      setup(sim);
      sim.start();
    </script>
  </body>
</html>
