<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moasis</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
        display: none;
      }
      #side {
        position: absolute;
        top: 78px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        color: #fff;
        pointer-events: auto;
        font-size: 0.9rem;
        display: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
        Moasis
      </h1>
      <p
        id="hint"
        style="
          display: flex;
          gap: 0.4em;
          margin: 4px 0 0;
          font-size: 0.85rem;
          opacity: 0.5;
        "
      >
        <span id="hint-move">W/A/S/D or arrow keys to move.</span>
        <span id="hint-orbit">Space toggles orbit camera.</span>
      </p>
      <div
        id="fov-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Field of View <span id="fov-value" style="font-weight: bold">90°</span>
        </div>
        <input
          type="range"
          id="fov-slider"
          min="30"
          max="100"
          step="1"
          value="90"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="gaze-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Gaze <span id="gaze-value">-30°</span>
        </div>
        <input
          type="range"
          id="gaze-slider"
          min="-30"
          max="30"
          step="1"
          value="-30"
          style="width: 180px; vertical-align: middle"
        />
      </div>
      <div
        id="offset-control"
        style="
          display: none;
          margin-top: 12px;
          font-size: 0.9rem;
          pointer-events: auto;
        "
      >
        <div style="opacity: 0.8; margin-bottom: 4px">
          Forward Offset <span id="offset-value">-0.45</span>
        </div>
        <input
          type="range"
          id="offset-slider"
          min="-1"
          max="2"
          step="0.05"
          value="-0.45"
          style="width: 180px; vertical-align: middle"
        />
      </div>
    </div>

    <div id="side">
      <label
        id="creatures-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="creatures-checkbox" checked />
        Creatures
      </label>
      <label
        id="sandbox-toggle"
        style="
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
          font-size: 0.9rem;
          pointer-events: auto;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="sandbox-checkbox" />
        Sandbox
      </label>
      <div id="sandbox-panel" style="display: none">
        <div
          id="sun-control"
          style="
            margin-top: 8px;
            font-size: 0.9rem;
            pointer-events: auto;
          "
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Sun <span id="sun-clock">12:00</span>
          </div>
          <input
            type="range"
            id="sun-slider"
            min="0"
            max="24"
            step="0.05"
            value="12"
            style="width: 180px; vertical-align: middle"
          />
          <span id="sun-phase" style="opacity: 0.6; margin-left: 6px">noon</span>
        </div>
        <div
          id="grass-control"
          style="
            margin-top: 12px;
            font-size: 0.9rem;
            pointer-events: auto;
          "
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Cut Height <span id="cut-height-value" style="font-weight: bold">0.20m</span>
          </div>
          <input
            type="range"
            id="cut-height-slider"
            min="0.01"
            max="0.5"
            step="0.01"
            value="0.2"
            style="width: 180px; vertical-align: middle"
          />
          <div style="opacity: 0.8; margin-bottom: 4px; margin-top: 8px">
            Grow Rate <span id="grow-rate-value" style="font-weight: bold">0.005</span>
          </div>
          <input
            type="range"
            id="grow-rate-slider"
            min="0.001"
            max="0.1"
            step="0.001"
            value="0.005"
            style="width: 180px; vertical-align: middle"
          />
        </div>
        <div
          id="density-control"
          style="
            margin-top: 12px;
            font-size: 0.9rem;
            pointer-events: auto;
          "
        >
          <div style="opacity: 0.8; margin-bottom: 4px">
            Grass Density <span id="density-total"></span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center">
            <label style="display: flex; flex-direction: column; font-size: 0.8rem">
              Grid cols
              <input
                type="number"
                id="density-cols"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label style="display: flex; flex-direction: column; font-size: 0.8rem">
              rows
              <input
                type="number"
                id="density-rows"
                min="1"
                max="20"
                step="1"
                value="10"
                style="width: 64px"
              />
            </label>
            <label style="display: flex; flex-direction: column; font-size: 0.8rem">
              per patch
              <input
                type="number"
                id="density-n"
                min="1"
                max="10000"
                step="50"
                value="2000"
                style="width: 80px"
              />
            </label>
          </div>
          <button
            id="density-apply"
            style="
              margin-top: 8px;
              padding: 4px 12px;
              font-size: 0.85rem;
              cursor: pointer;
            "
          >
            Apply (reload)
          </button>
        </div>
      </div>
    </div>
    <script type="module">
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createGnats,
      } from "engine/primitives.js";
      import {
        createLawnmower,
        createButterfly,
        createDragonfly,
        createFlies,
        createDandelion,
        createBumblebee,
        createFirefly,
        createFence,
        createGrass,
        createEarth,
        createFPSCounter,
        createGCStats,
        createEntityStats,
      } from "engine/components.js";
      import {} from "engine/materials.js";
      import * as THREE from "three";

      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x000000,
        enableShadows: true,
      });

      // --- Global sun: a directional source beaming straight down from directly
      // overhead, lighting BOTH the moon surface and the Earth. Parallel rays,
      // so the moon's floor (all facing up) is fully lit while the Earth's lower
      // hemisphere — the half turned away from the sun toward the moon — falls to
      // a crisp, real day/night terminator.
      const SUN_INTENSITY = 3.0;
      const sunLight = new THREE.DirectionalLight(0xfff2d9, SUN_INTENSITY);
      // Offset the sun toward the horizon so the day/night terminator cuts
      // across the globe at an angle, tilting the Earth's shadowed side rather
      // than a perfectly horizontal shade line.
      sunLight.position.set(180, 320, 120);
      sunLight.target.position.set(0, 0, 0);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 700;
      sunLight.shadow.camera.left = -260;
      sunLight.shadow.camera.right = 260;
      sunLight.shadow.camera.top = 260;
      sunLight.shadow.camera.bottom = -260;
      sunLight.shadow.bias = -0.0005;
      sim.scene.add(sunLight);
      sim.scene.add(sunLight.target);

      // Drop the engine's default directional light so it isn't fighting the
      // real sun.
      const engineSun = sim.scene.children.find((c) => c.isDirectionalLight);
      if (engineSun) sim.scene.remove(engineSun);

      // Low ambient so surfaces facing away from the sun (the Earth's far
      // side) genuinely fall to shadow rather than being washed out.
      const ambient = sim.scene.children.find((c) => c.isAmbientLight);
      ambient.intensity = 0;

      // --- Field-of-view slider: adjust the camera zoom live ---
      const fovSlider = document.getElementById("fov-slider");
      const fovValueEl = document.getElementById("fov-value");
      const applyFov = () => {
        sim.camera.fov = parseFloat(fovSlider.value);
        sim.camera.updateProjectionMatrix();
        fovValueEl.textContent = `${Math.round(sim.camera.fov)}°`;
      };
      fovSlider.addEventListener("input", applyFov);
      applyFov();

      // --- Gaze slider: first-person camera pitch (look down / look up) ---
      const gazeSlider = document.getElementById("gaze-slider");
      const gazeValueEl = document.getElementById("gaze-value");
      let gazePitch = -30 * (Math.PI / 180); // default slightly down at the reel
      const applyGaze = () => {
        gazePitch = parseFloat(gazeSlider.value) * (Math.PI / 180);
        gazeValueEl.textContent = `${Math.round(gazeSlider.value)}°`;
      };
      gazeSlider.addEventListener("input", applyGaze);
      applyGaze();

      // --- Forward-offset slider: where on the local +Z (handle/behind) axis
      // the first-person camera floats, vs the front of the mower ---
      const offsetSlider = document.getElementById("offset-slider");
      const offsetValueEl = document.getElementById("offset-value");
      let fwdOffset = -0.45;
      const applyOffset = () => {
        fwdOffset = parseFloat(offsetSlider.value);
        offsetValueEl.textContent = fwdOffset.toFixed(2);
      };
      offsetSlider.addEventListener("input", applyOffset);
      applyOffset();

      function setup(sim) {
        // Grass: single instanced mesh, 3x3 patches tiled across 100x100.
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
          document.getElementById("hint").textContent =
            "Tap screen to mow, drag left/right to turn.";
          const ui = document.getElementById("ui");
          ui.style.display = "none";
        } else {
          // Desktop: show the control panel. It stays hidden by default so it
          // never flashes for a frame on mobile before being suppressed.
          document.getElementById("ui").style.display = "block";
        }
        // Density config is editable in the UI; applied values persist and are
        // consumed here on the next load (Apply triggers a reload).
        const density = {
          COLS: Number(localStorage.getItem("mow-cols")) || 7,
          ROWS: Number(localStorage.getItem("mow-rows")) || 7,
          N: Number(localStorage.getItem("mow-n")) || (isMobile ? 500 : 5000),
        };
        const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
        density.COLS = clampInt(density.COLS, 1, 20);
        density.ROWS = clampInt(density.ROWS, 1, 20);
        density.N = clampInt(density.N, 1, 10000);
        const { COLS, ROWS, N } = density;
        const W = 3, D = 3;
        const total = COLS * ROWS * N;

        // Dirt patch beneath the lawn (inside the fence): a dirt-brown rectangular
        // plane sitting just above the meadow ground, so the mowable patch reads
        // as fresh turned soil against the surrounding field.
        const dirtGeo = new THREE.PlaneGeometry(COLS * W + 0.4, ROWS * D + 0.4);
        const dirtMat = new THREE.MeshStandardMaterial({ color: 0x2b180c });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.y = -0.005;
        dirt.receiveShadow = true;
        dirt.castShadow = true;
        sim.scene.add(dirt);

        // RADIAL BAND of crater centers outside the glass territory.
        // Radial band on the moon's surface where craters live, clear of the
        // grass cube. The cube's walls sit 0.6 past the lawn edges.
        const cubeR = Math.hypot(
          (COLS * W) / 2 + 0.6,
          (ROWS * D) / 2 + 0.6,
        ) + 4; // just outside the nearest wall, plus breathing room
        const GROUND_R = 48; // stay off the ground disc's very edge
        const craterCenters = [];
        for (let i = 0; i < 26; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rr = cubeR + Math.random() * (GROUND_R - cubeR);
          // Sieve for radius: bias toward the big impact basins but sprinkle
          // in plenty of small ones (a power-skewed spread).
          const r = 7 * Math.pow(Math.random(), 2.6) + 0.5;
          craterCenters.push({
            x: Math.cos(ang) * rr,
            z: Math.sin(ang) * rr,
            r,
            depth: r * 0.18,
            rim: r * 0.02 + 0.03,
          });
        }
        // A few enormous basin craters far from the lawn for scale.
        for (let i = 0; i < 4; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rr = cubeR + 10 + Math.random() * (GROUND_R - cubeR - 10);
          const r = 12 + Math.random() * 16;
          craterCenters.push({
            x: Math.cos(ang) * rr,
            z: Math.sin(ang) * rr,
            r,
            depth: r * 0.18,
            rim: r * 0.02 + 0.03,
          });
        }

        // MOON's surface: a displaceable heightfield (real geometry) so the
        // sinks read as actual craters — the sun casts real shadows into the
        // bowls and one basin can occlude another. Each crater is a sunken
        // floor that rises through the walls to a slightly raised rim, then
        // falls back to the ground. A canvas albedo map paints the darker
        // basin floors so the crater identity survives even in flat light.
        const groundMat = new THREE.MeshStandardMaterial({
          color: 0xffffff, // modulated by the albedo map below
          roughness: 1,
          metalness: 0,
        });
        // Radial-gradient crater albedo drawn into the ground's UV space.
        const ALB = 1024;
        const albedo = (() => {
          const cv = document.createElement("canvas");
          cv.width = cv.height = ALB;
          const g = cv.getContext("2d");
          // Baseline lunar gray (#94908D).
          g.fillStyle = "rgb(148,144,141)";
          g.fillRect(0, 0, ALB, ALB);
          const toU = (x) => ((x + GROUND_R) / (GROUND_R * 2)) * ALB;
          const toV = (z) => ((z + GROUND_R) / (GROUND_R * 2)) * ALB;
          for (const c of craterCenters) {
            // Cosmetic darkening of the bowl that fades into the surrounding
            // ground; the geometry supplies the real bump shape.
            const U = toU(c.x), V = toV(c.z);
            const px = c.r * (ALB / (GROUND_R * 2));
            const grad = g.createRadialGradient(U, V, 0, U, V, px * 0.62);
            grad.addColorStop(0.0, "rgba(58,55,52,0.9)");
            grad.addColorStop(1.0, "rgba(148,144,141,0)");
            g.fillStyle = grad;
            g.fillRect(U - px, V - px, px * 2, px * 2);
          }
          return new THREE.CanvasTexture(cv);
        })();
        groundMat.map = albedo;

        // Heightfield: shared bowl profile per crater.
        const craterHeight = (x, z) => {
          let y = 0;
          for (const c of craterCenters) {
            const dx = x - c.x, dz = z - c.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const t = d / c.r;
            const RIM_EDGE = 1.22; // outer falloff just past the crest
            if (t >= RIM_EDGE) continue;
            // Interior: flat-ish floor then walls rising to ground at t=1.
            const FLOOR_FRAC = 0.4;
            if (t < FLOOR_FRAC) {
              y += -c.depth;
            } else if (t < 1) {
              const u = (t - FLOOR_FRAC) / (1 - FLOOR_FRAC);
              y += -c.depth * (1 - u * u * (3 - 2 * u)); // smoothstep up
            }
            // Raised rim cresting just outside the radius, fading past RIM_EDGE.
            const rimPhase = (t - 1) / (RIM_EDGE - 1);
            y += c.rim * Math.sin(rimPhase * Math.PI);
          }
          return y;
        };

        // Dense ground disc; resolution scales with crater density so the rims
        // stay readable. Displaced in place, then normals recomputed.
        const groundGeo = new THREE.CircleGeometry(GROUND_R, 240, 200);
        groundGeo.rotateX(-Math.PI / 2);
        {
          const pos = groundGeo.attributes.position;
          const uv = groundGeo.attributes.uv;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            pos.setY(i, craterHeight(x, z));
            // Remap UV to the albedo canvas (disc -> square texture space).
            uv.setXY(i, (x + GROUND_R) / (GROUND_R * 2), (z + GROUND_R) / (GROUND_R * 2));
          }
        }
        groundGeo.computeVertexNormals();
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.receiveShadow = true;
        // Cast too: the raised crater rims (and the plane generally) occlude
        // geometry in the shadow pass, so nothing casts through the moon.
        ground.castShadow = true;
        // Sink the whole lunar surface well below the dirt patch/grass so the
        // crater rims and undulations can't poke up through the lawn.
        ground.position.y = -2;
        sim.scene.add(ground);

        // Earth floating high in the moon's sky, off beyond the grass dome —
        // a small blue-green globe (#the reveal: we're mowing on the Moon).
        const earth = createEarth(sim, {
          radius: 7,
          position: [0, 16, -140],
        });
        let revealFired = false;

        // Star field: tiny points on a huge fixed-radius dome far beyond the Earth.
        // Star color follows the real stellar distribution (mostly white-blue
        // through white to yellow-orange, a few cool reds) via blackbody
        // temperature, and sizes vary (brighter/nearer stars read larger).
        const SKY_R = 260; // beyond everything in the scene
        const STAR_COUNT = 900;
        // Soft round star sprite (a bright core fading to transparent).
        const starSprite = (() => {
          const cv = document.createElement("canvas");
          const size = 64;
          cv.width = cv.height = size;
          const g = cv.getContext("2d");
          const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.35, "rgba(255,255,255,0.7)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, size, size);
          const tex = new THREE.CanvasTexture(cv);
          tex.colorSpace = THREE.SRGBColorSpace;
          return tex;
        })();

        // Blackbody temperature -> soft star tint. Hot stars are blue-white,
        // cool stars red-orange; the white ones get only a faint cast so the
        // sky leans whitish overall.
        const starColorAt = (kelvin) => {
          const t = kelvin / 100;
          let r, g, b;
          if (t <= 66) {
            r = 255;
            g = 99.47 * Math.log(t) - 161.12;
            b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04;
          } else {
            r = 329.70 * Math.pow(t - 60, -0.1332);
            g = 288.12 * Math.pow(t - 60, -0.0755);
            b = 255;
          }
          // Clamp and soften toward white so the full sky isn't oversaturated.
          return new THREE.Color(
            Math.max(0, Math.min(1, (r / 255) * 0.5 + 0.5)),
            Math.max(0, Math.min(1, (g / 255) * 0.5 + 0.5)),
            Math.max(0, Math.min(1, (b / 255) * 0.5 + 0.5)),
          );
        };

        // Assign each star a temperature (a bimodal-ish real spread, mostly
        // mid/k-hot with a tail of cool reds) and a size bucket 0..3.
        const buckets = [[], [], [], []];
        for (let i = 0; i < STAR_COUNT; i++) {
          // Random direction on the upper sky dome.
          let dx, dy, dz;
          do {
            dx = Math.random() * 2 - 1;
            dy = Math.random() * 2 - 1;
            dz = Math.random() * 2 - 1;
          } while (dx * dx + dy * dy + dz * dz > 1 || dy < 0.02);
          const len = Math.hypot(dx, dy, dz);
          // Slight pinch toward the zenith so the band near the horizon stays
          // sparse, like a real moon-sky.
          const elev = Math.pow(Math.abs(dy / len), 1.3);
          const c = starColorAt(2500 + Math.pow(Math.random(), 2) * 7800);
          const size = (Math.random() < 0.15) | 0; // most are small, some larger
          const star = {
            x: (dx / len) * SKY_R,
            y: elev * SKY_R * 0.9,
            z: (dz / len) * SKY_R,
            r: Math.round(c.r * 255),
            g: Math.round(c.g * 255),
            b: Math.round(c.b * 255),
          };
          buckets[size].push(star);
        }

        // One Points per size bucket (PointsMaterial has a single size uniform).
        const starPeel = new THREE.Group();
        const starBucketSizes = [0.9, 1.6, 2.4, 3.4];
        buckets.forEach((stars, bi) => {
          if (stars.length === 0) return;
          const pos = new Float32Array(stars.length * 3);
          const col = new Float32Array(stars.length * 3);
          stars.forEach((s, i) => {
            pos[i * 3] = s.x;
            pos[i * 3 + 1] = s.y;
            pos[i * 3 + 2] = s.z;
            col[i * 3] = s.r / 255;
            col[i * 3 + 1] = s.g / 255;
            col[i * 3 + 2] = s.b / 255;
          });
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
          const mat = new THREE.PointsMaterial({
            size: starBucketSizes[bi],
            map: starSprite,
            vertexColors: true,
            transparent: true,
            depthWrite: false,
            sizeAttenuation: false,
          });
          const pts = new THREE.Points(geo, mat);
          pts.frustumCulled = false;
          starPeel.add(pts);
        });
        sim.scene.add(starPeel);

        const bladeGeo = new THREE.ConeGeometry(0.08, 1.7, 4);
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x44aa55, roughness: 0.8 });
        // Gentle breeze: sway lives in the vertex shader, so it costs nothing
        // on the CPU (only the regrowing blades touch instance matrices). It
        // bends in local space before the instance transform, so each blade
        // keeps its own scale/orientation and its base stays anchored.
        const swayUniforms = { uTime: { value: 0 } };
        let swaying = true; // grass wind-blows by day, freezes at the reveal
        let gravityOn = true; // clipping gravity: off after the reveal, back on at dawn
        bladeMat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = swayUniforms.uTime;
          // Declare the uniform at global scope (#include <common> is the first
          // include); #include <begin_vertex> sits inside main().
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nuniform float uTime;")
            .replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
#ifdef USE_INSTANCING
            // h: 0 at the base, 1 at the tip (cone height 1.7, centered at 0).
            float h = clamp((transformed.y + 0.85) / 1.7, 0.0, 1.0);
            // Blade base position = instance translation (world space).
            vec3 _base = instanceMatrix[3].xyz;
            // Per-blade phase so neighboring blades don't wave in lockstep.
            float _ph = fract(sin(dot(_base.xz * 0.13, vec2(12.9898, 78.233))) * 43758.5453);
            // A shallow wave drifting across the lawn, gentler near the base.

        };
        const grassMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, total);
        grassMesh.castShadow = true;
        grassMesh.receiveShadow = true;
        const dummy = new THREE.Object3D();
        const bladePos = [];
        const bladeRot = [];
        const bladeScale = new Float32Array(total);
        const bladeGrowth = new Float32Array(total);
        // Distance from the cone's center to its tip. Blades are never squashed:
        // they stay full length and sink into the ground by the un-grown amount
        // (see the grow loop), so the tip just peeks out of the soil when cut.
        const BLADE_HALF = bladeGeo.parameters.height / 2;
        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const ox = (c - COLS / 2 + 0.5) * W;
            const oz = (r - ROWS / 2 + 0.5) * D;
            const hw = W / 2, hd = D / 2;
            for (let i = 0; i < N; i++) {
              const s = 0.6 + Math.random() * 0.8;
              bladeScale[idx] = s;
              bladeGrowth[idx] = 1; // start fully grown
              bladePos[idx] = new THREE.Vector3(
                ox + Math.random() * W - hw,
                0,
                oz + Math.random() * D - hd,
              );
              bladeRot[idx] = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(
                  (Math.random() - 0.5) * 0.35,
                  Math.random() * Math.PI * 2,
                  (Math.random() - 0.5) * 0.35,
                ),
              );
              dummy.position.set(
                bladePos[idx].x,
                BLADE_HALF * bladeScale[idx] * (bladeGrowth[idx] - 1),
                bladePos[idx].z,
              );
              dummy.quaternion.copy(bladeRot[idx]);
              dummy.scale.set(s, s, s);
              dummy.updateMatrix();

        sim.scene.add(grassMesh);

        // Spatial grid over the lawn so cut checks only test blades near the
        // mower instead of all of them every frame. Blade positions never move,
        // so the buckets are built once.
        const CELL = 1.5; // grid cell size (world units)
        const GRID_COLS = Math.ceil((COLS * W) / CELL);
        const GRID_ROWS = Math.ceil((ROWS * D) / CELL);
        const lawnMinX = -(COLS * W) / 2, lawnMinZ = -(ROWS * D) / 2;
        const gridCells = new Array(GRID_COLS * GRID_ROWS);
        const counts = new Uint32Array(GRID_COLS * GRID_ROWS);
        const cellIndex = (x, z) => {
          const cx = Math.min(GRID_COLS - 1, Math.max(0, Math.floor((x - lawnMinX) / CELL)));
          const cz = Math.min(GRID_ROWS - 1, Math.max(0, Math.floor((z - lawnMinZ) / CELL)));
          return cz * GRID_COLS + cx;

        for (let i = 0; i < total; i++) counts[cellIndex(bladePos[i].x, bladePos[i].z)]++;
        // Prefix-sum so each cell's indices are a contiguous slice of one array.
        const cellStart = new Int32Array(gridCells.length + 1);
        for (let i = 0; i < gridCells.length; i++) cellStart[i + 1] = cellStart[i] + counts[i];
        const cellIndices = new Uint32Array(total);
        {
          const cursor = new Int32Array(gridCells.length);
          for (let i = 0; i < total; i++) {

        const visitCutArea = (hw, hd, offZ, cb) => {

          const minZ = center.z - Math.abs(fx.z) - Math.abs(fz.z);
          const maxZ = center.z + Math.abs(fx.z) + Math.abs(fz.z);

        const FENCE = {
          postHeight: 1.35,
          sectionWidth: 1.5,
          postColor: 0x922b2c,

        const sideFence = ({ length, position, rotation }) =>
          createFence(sim, {
            ...FENCE,
            repeat: Math.round(length / FENCE.sectionWidth),
            position,
            rotation,

        sideFence({ length: COLS * W, position: [0, 0, lawnHalfD + gap], rotation: [0, 0, 0] });
        sideFence({ length: COLS * W, position: [0, 0, -lawnHalfD - gap], rotation: [0, Math.PI, 0] });
        sideFence({ length: ROWS * D, position: [lawnHalfW + gap, 0, 0], rotation: [0, Math.PI / 2, 0] });
        sideFence({ length: ROWS * D, position: [-lawnHalfW - gap, 0, 0], rotation: [0, -Math.PI / 2, 0] });

        const skyTex = new THREE.CanvasTexture(skyCanvas);
        skyTex.colorSpace = THREE.SRGBColorSpace;

        // p spans 0..~2 across the day: 0 at noon (deep blue), 1 at sunrise/

        sim.scene.add(glassCube);

        // night). It's inside the cube so it lights only the lawn + mower.

        domeSun.position.set(0, CUBE_H, 0);

        sim.scene.add(domeSun);
        // Bright fill so the sealed dome reads as a beautiful day: a sky-blue

        // grass/floor well-lit, only active while the dome is closed.

        sim.scene.add(domeAmbient);

        // Sun slider drives the fake-sky palette and the cube's opacity. Soaring at

            swaying = true;

            revealFired = false;

          // darkens through dusk, fully off by night.

            const awake = (h) => {

              return h >= fam.wakeHour || h < fam.sleepHour; // wraps past midnight

        // Drive the mower: W/S (or up/down arrows) move, A/D (or left/right)

        const forward = new THREE.Vector3(0, 0, 1);

        const _right = new THREE.Vector3();

        const _boxCenter = new THREE.Vector3(); // footprint box center in world
        const _fpMount = new THREE.Vector3();   // first-person camera mount (local)
        const _fpWorld = new THREE.Vector3();   // first-person world-space temp

        // Touch control (mobile): a virtual stick. The finger's offset from its

        // left/right gives steering. Combined with the keyboard inputs below.
        let touchActive = false;
