<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazy Train</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
        Crazy Train
      </h1>
      <p id="controls-hint" style="margin: 4px 0 0; font-size: 0.85rem; opacity: 0.7">
        <strong>W</strong> accelerate &bull; release to decelerate &bull; <strong>Space</strong> rear camera
      </p>
    </div>

    <script type="module">
      import * as THREE from "three";
      import * as CANNON from "cannon-es";
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createRock,
      } from "engine/primitives.js";
import {
    createTrain,
    createRailSegment,
    createDynamite,
    createCowcatcher,
    InfiniteTrack,
    TrackFollower,
    getLocalSpinePose,
    createFPSCounter,
  } from "engine/components.js";
      import {} from "engine/materials.js";
      import { Input } from "engine/input.js";
      import { createCameraControls } from "engine/cameraControls.js";
      import { createGauge, createMoneyCounter } from "engine/ui.js";
      import { createPowerups } from "engine/powerups.js";

      // Speed governor: caps max speed. governor.setCap(90), getCap(), etc.
      class Governor {
        constructor(capMph = 70) {
          this.enabled = true;
          this._capMph = capMph;
          this._capMps = capMph / 2.237;
        }
        setCap(mph) {
          this._capMph = mph;
          this._capMps = mph / 2.237;
          return this;
        }
        getCap() {
          return this._capMph;
        }
        getCapMps() {
          return this._capMps;
        }
        setEnabled(on) {
          this.enabled = !!on;
          return this;
        }
        enable() {
          return this.setEnabled(true);
        }
        disable() {
          return this.setEnabled(false);
        }
        limit(speedMps) {
          if (!this.enabled) return speedMps;
          return Math.min(speedMps, this._capMps);
        }
        apply(speedMps, deltaMps) {
          return this.limit(speedMps + deltaMps);
        }
      }

      // 2. Initialize Core Engine with Options
      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x8ecae6,
        enableShadows: false,
      });

      // Active flying obstacles launched by collisions
      const activeFlyers = new Set();

      // Dynamite sticks thrown by the player (spawned in-cab, flown in an arc)
      const thrownDynamites = new Set();

      // Active explosion spheres that rapidly expand and despawn
      const activeExplosions = new Set();

      function rebaseActiveFlyers(origin, heading) {
        const ca = Math.cos(heading);
        const sa = Math.sin(heading);
        const qRebase = new CANNON.Quaternion();
        qRebase.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -heading);

        for (const flyer of activeFlyers) {
          const b = flyer.body;
          const dx = b.position.x - origin.x;
          const dz = b.position.z - origin.z;
          b.position.x = dx * ca + dz * sa;
          b.position.z = -dx * sa + dz * ca;
          b.quaternion = qRebase.mult(b.quaternion);

          const vx = b.velocity.x;
          const vz = b.velocity.z;
          b.velocity.x = vx * ca + vz * sa;
          b.velocity.z = -vx * sa + vz * ca;

          flyer.mesh.position.set(b.position.x, b.position.y, b.position.z);
          flyer.mesh.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
        }
      }

      // Rebase floating dynamite sticks the same way so they track with the train.
      function rebaseThrownDynamites(origin, heading) {
        const ca = Math.cos(heading);
        const sa = Math.sin(heading);
        const qRebase = new CANNON.Quaternion();
        qRebase.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -heading);

        for (const dyn of thrownDynamites) {
          const b = dyn.body;
          const dx = b.position.x - origin.x;
          const dz = b.position.z - origin.z;
          b.position.x = dx * ca + dz * sa;
          b.position.z = -dx * sa + dz * ca;
          b.quaternion = qRebase.mult(b.quaternion);

          const vx = b.velocity.x;
          const vz = b.velocity.z;
          b.velocity.x = vx * ca + vz * sa;
          b.velocity.z = -vx * sa + vz * ca;

          dyn.mesh.position.set(b.position.x, b.position.y, b.position.z);
          dyn.mesh.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
        }
      }

      // Rebase active explosions the same way so they track with the train.
      function rebaseActiveExplosions(origin, heading) {
        const ca = Math.cos(heading);
        const sa = Math.sin(heading);

        for (const expl of activeExplosions) {
          const dx = expl.mesh.position.x - origin.x;
          const dz = expl.mesh.position.z - origin.z;
          expl.mesh.position.x = dx * ca + dz * sa;
          expl.mesh.position.z = -dx * sa + dz * ca;
        }
      }

      // Reusable shared geometries and lightweight Lambert materials for scenery & obstacles
      const sharedTrunkGeo = new THREE.CylinderGeometry(0.3, 0.45, 3, 5);
      const sharedFoliage1Geo = new THREE.ConeGeometry(1.8, 4, 5);
      const sharedFoliage2Geo = new THREE.ConeGeometry(1.35, 3, 5);
      const sharedRockGeo = new THREE.DodecahedronGeometry(1, 0);
      const sharedTinyRockGeo = new THREE.DodecahedronGeometry(0.28, 0);
      const sharedGrassGeo = new THREE.ConeGeometry(0.1, 1.0, 3);
      const sharedBranchGeo = new THREE.ConeGeometry(0.7, 1.8, 4);
      const sharedBoulderGeo = new THREE.DodecahedronGeometry(0.95, 0);
      const sharedGiantMainGeo = new THREE.DodecahedronGeometry(2.4, 0);
      const sharedGiantSub1Geo = new THREE.DodecahedronGeometry(1.4, 0);
      const sharedGiantSub2Geo = new THREE.DodecahedronGeometry(1.3, 0);
      const sharedShardGeo = new THREE.DodecahedronGeometry(0.9, 0);

      const sharedTrunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
      const sharedRockMat = new THREE.MeshLambertMaterial({ color: 0x75787b });
      const sharedTinyMat = new THREE.MeshLambertMaterial({ color: 0x8a8e93 });
      const sharedGrassMat = new THREE.MeshLambertMaterial({ color: 0x56a442 });
      const sharedLogMat = new THREE.MeshLambertMaterial({ color: 0x4a3324 });
      const sharedBranchMat = new THREE.MeshLambertMaterial({ color: 0x2e6035 });
      const sharedBoulderMat = new THREE.MeshLambertMaterial({ color: 0x6e7278 });
      const sharedGiantMat = new THREE.MeshLambertMaterial({ color: 0x2a2d30 });

      const sharedTreePalettes = [
        { foliage1: new THREE.MeshLambertMaterial({ color: 0x1a4524 }), foliage2: new THREE.MeshLambertMaterial({ color: 0x245a30 }) },
        { foliage1: new THREE.MeshLambertMaterial({ color: 0x286337 }), foliage2: new THREE.MeshLambertMaterial({ color: 0x367e47 }) },
        { foliage1: new THREE.MeshLambertMaterial({ color: 0x3d7e32 }), foliage2: new THREE.MeshLambertMaterial({ color: 0x519e42 }) },
        { foliage1: new THREE.MeshLambertMaterial({ color: 0x4f8c3e }), foliage2: new THREE.MeshLambertMaterial({ color: 0x65ab50 }) },
        { foliage1: new THREE.MeshLambertMaterial({ color: 0x3b5930 }), foliage2: new THREE.MeshLambertMaterial({ color: 0x4c703e }) },
      ];

      function createSceneryRailSegment(simulation, opts = {}) {
        const seg = createRailSegment(simulation, opts);
        const group = seg.mesh;
        const { length = 40, radius = 0 } = opts;

        // Contact radius for the megalith, measured from the group origin. The
        // dynamite approaches at low height, so we use the horizontal footprint
        // (max |x|/|z| of the bounding box) rather than the farthest-corner
        // distance, which would be inflated by the boulder's upward offset.
        function megalithContactRadius(giantGroup) {
          giantGroup.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(giantGroup);
          const worldPos = new THREE.Vector3();
          giantGroup.getWorldPosition(worldPos);
          const min = box.min.clone().sub(worldPos);
          const max = box.max.clone().sub(worldPos);
          return Math.max(Math.abs(min.x), Math.abs(max.x), Math.abs(min.z), Math.abs(max.z));
        }

        // Place random trees, rocks, and grass along the sides of the track
        const count = 16 + Math.floor(Math.random() * 8);
        const grassTransforms = [];

        for (let i = 0; i < count; i++) {
          const s = Math.random() * length;
          const local = getLocalSpinePose(radius, length, s);
          const perp = { x: -Math.sin(local.heading), z: Math.cos(local.heading) };

          // Keep scenery safely off the rails (at least 4.5m away)
          const side = Math.random() < 0.5 ? 1 : -1;
          const offset = 4.5 + Math.random() * 26;
          const x = local.position.x + perp.x * offset * side;
          const z = local.position.z + perp.z * offset * side;

          const rand = Math.random();
          if (rand < 0.28) {
            // Pine tree with varied natural foliage hues
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);
            const scale = 0.8 + Math.random() * 0.7;
            treeGroup.scale.set(scale, scale, scale);

            const pal = sharedTreePalettes[Math.floor(Math.random() * sharedTreePalettes.length)];

            const trunk = new THREE.Mesh(sharedTrunkGeo, sharedTrunkMat);
            trunk.position.y = 1.5;
            treeGroup.add(trunk);

            const foliage1 = new THREE.Mesh(sharedFoliage1Geo, pal.foliage1);
            foliage1.position.y = 4.0;
            treeGroup.add(foliage1);

            const foliage2 = new THREE.Mesh(sharedFoliage2Geo, pal.foliage2);
            foliage2.position.y = 5.6;
            treeGroup.add(foliage2);

            group.add(treeGroup);
          } else if (rand < 0.48) {
            // Rock
            const rock = new THREE.Mesh(sharedRockGeo, sharedRockMat);
            const sX = 0.8 + Math.random() * 1.4;
            const sY = 0.6 + Math.random() * 0.9;
            const sZ = 0.8 + Math.random() * 1.4;
            rock.scale.set(sX, sY, sZ);
            rock.position.set(x, sY * 0.6, z);
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            group.add(rock);
          } else {
            // Lush grass patch - collect blade transforms for InstancedMesh
            const patchRadius = 2.0 + Math.random() * 2.0;
            const bladeCount = 20 + Math.floor(Math.random() * 12);

            for (let b = 0; b < bladeCount; b++) {
              const ang = Math.random() * Math.PI * 2;
              const dist = Math.sqrt(Math.random()) * patchRadius;
              const bx = x + Math.cos(ang) * dist;
              const bz = z + Math.sin(ang) * dist;
              const bHeight = 0.7 + Math.random() * 0.5;

              grassTransforms.push({
                x: bx,
                y: bHeight / 2,
                z: bz,
                rx: (Math.random() - 0.5) * 0.35,
                ry: Math.random() * Math.PI,
                rz: (Math.random() - 0.5) * 0.35,
                scale: bHeight,
              });
            }
          }
        }

        // Create single instanced mesh for all grass in this segment (1 draw call)
        if (grassTransforms.length > 0) {
          const instancedGrass = new THREE.InstancedMesh(sharedGrassGeo, sharedGrassMat, grassTransforms.length);
          const dummy = new THREE.Object3D();

          for (let i = 0; i < grassTransforms.length; i++) {
            const t = grassTransforms[i];
            dummy.position.set(t.x, t.y, t.z);
            dummy.rotation.set(t.rx, t.ry, t.rz);
            dummy.scale.set(1, t.scale, 1);
            dummy.updateMatrix();
            instancedGrass.setMatrixAt(i, dummy.matrix);
          }
          instancedGrass.instanceMatrix.needsUpdate = true;
          group.add(instancedGrass);
        }

        // Occasional on-track obstacles (fallen trees & track boulders)
        seg.obstacles = seg.obstacles || [];

        // Tiny rocks: low mass, littered right on the rails
        const tinyCount = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < tinyCount; i++) {
          const tS = length * (0.05 + Math.random() * 0.9);
          const tPose = getLocalSpinePose(radius, length, tS);
          const edge = (Math.random() < 0.5 ? 1 : -1) * Math.random() * 0.7;
          const tiny = new THREE.Mesh(sharedTinyRockGeo, sharedTinyMat);
          tiny.scale.set(
            0.6 + Math.random() * 0.9,
            0.55 + Math.random() * 0.7,
            0.6 + Math.random() * 0.9,
          );
          tiny.position.set(tPose.position.x, 0.28, tPose.position.z + edge);
          tiny.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          group.add(tiny);
          seg.obstacles.push({
            mesh: tiny,
            type: "tiny-rock",
            s: tS,
            hit: false,
          });
        }

        if (Math.random() < 0.65) {
          const obsS = length * (0.3 + Math.random() * 0.4);
          const localPose = getLocalSpinePose(radius, length, obsS);
          const randObs = Math.random();

          if (randObs < 0.33) {
            // Fallen Tree across the rails
            const logLen = 3.8 + Math.random() * 1.6;
            const logMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, logLen, 6), sharedLogMat);
            logMesh.rotation.z = Math.PI / 2;

            const logGroup = new THREE.Group();
            logGroup.position.set(localPose.position.x, 0.55, localPose.position.z);
            logGroup.rotation.y = -localPose.heading + Math.PI / 2 + (Math.random() - 0.5) * 0.4;
            logGroup.add(logMesh);

            const branch = new THREE.Mesh(sharedBranchGeo, sharedBranchMat);
            branch.position.set(logLen / 2 - 0.2, 0.35, 0);
            branch.rotation.z = -Math.PI / 3;
            logGroup.add(branch);

            group.add(logGroup);
            seg.obstacles.push({
              mesh: logGroup,
              type: "log",
              logLen,
              s: obsS,
              hit: false,
            });
          } else if (randObs < 0.55) {
            // Regular Track Boulder
            const boulder = new THREE.Mesh(sharedBoulderGeo, sharedBoulderMat);
            boulder.scale.set(1.1 + Math.random() * 0.3, 0.75 + Math.random() * 0.25, 1.1 + Math.random() * 0.3);
            boulder.position.set(localPose.position.x, 0.85, localPose.position.z);
            boulder.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

            group.add(boulder);
            seg.obstacles.push({
              mesh: boulder,
              type: "boulder",
              s: obsS,
              hit: false,
            });
          } else if (randObs < 0.63) {
            // Massive Giant Megalith Boulder (towering monolithic mountain rock)
            const giantGroup = new THREE.Group();
            giantGroup.position.set(localPose.position.x, 0, localPose.position.z);
            giantGroup.rotation.y = -localPose.heading + (Math.random() - 0.5) * 0.5;

            const mainRock = new THREE.Mesh(sharedGiantMainGeo, sharedGiantMat);
            mainRock.scale.set(1.4, 1.6, 1.3);
            mainRock.position.set(0, 2.6, 0);
            mainRock.rotation.set(Math.random() * 0.5, Math.random() * Math.PI, 0);
            giantGroup.add(mainRock);

            // Per-megalith material clone so its color can signal danger vs. safe.
            const giantMat = sharedGiantMat.clone();

            // Side support boulders forming a massive barrier
            const subRock1 = new THREE.Mesh(sharedGiantSub1Geo, giantMat);
            subRock1.position.set(-1.4, 1.3, 0.4);
            giantGroup.add(subRock1);

            const subRock2 = new THREE.Mesh(sharedGiantSub2Geo, giantMat);
            subRock2.position.set(1.4, 1.2, -0.3);
            giantGroup.add(subRock2);

            mainRock.material = giantMat;

            group.add(giantGroup);
            seg.obstacles.push({
              mesh: giantGroup,
              type: "giant-boulder",
              s: obsS,
              hit: false,
              mat: giantMat,
              contactRadius: megalithContactRadius(giantGroup),
            });
          }
        }

        return seg;
      }

      // Train master-controller lever (3D overlay fixed to bottom-right of screen)
      function createLever() {
        const group = new THREE.Group();

        const baseMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.6, metalness: 0.3 });
        const armMat = new THREE.MeshStandardMaterial({ color: 0xcc8833, roughness: 0.5, metalness: 0.1 });
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 });

        // Stationary mount (flat cylinder pedestal)
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.35, 12), baseMat);
        base.position.y = 0.175;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        // Rotating pivot at the top of the pedestal
        const pivot = new THREE.Group();
        pivot.position.y = 0.35;

        // Lever arm + grip
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.7, 0.16), armMat);
        arm.position.y = 0.85;
        arm.castShadow = true;
        pivot.add(arm);

        const grip = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), gripMat);
        grip.position.y = 1.7;
        grip.castShadow = true;
        pivot.add(grip);

        group.add(pivot);
        group.userData.pivot = pivot;
        return group;
      }

      // 3. Game-Specific Setup (The LLM focus area)
      function setup(sim) {
        // FPS Counter
        createFPSCounter(sim);

        // Bright daylight lighting & atmosphere
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446644, 0.8);
        sim.scene.add(hemiLight);

        // Fog of war / Atmospheric horizon blending
        const skyColor = 0x8ecae6;
        sim.scene.fog = new THREE.Fog(skyColor, 50, 220);

        // Ground plane
        const ground = createGround(sim, { size: 2000, color: 0x4e8a4a, position: [0, -0.5, 0] });

        // Track generation with winding sections & high-speed straightaways (>= 10 segments)
        let straightawayCount = 6; // Start with a straight runway
        let windingCount = 0;

        const generateTrackCurve = (index) => {
          if (index < 6) return 0;

          // Currently in a designated straightaway
          if (straightawayCount > 0) {
            straightawayCount--;
            return 0;
          }

          // Transition between winding zones and straightaways
          if (windingCount <= 0) {
            if (Math.random() < 0.38) {
              // Trigger a long straightaway: 10 to 15 consecutive straight segments
              straightawayCount = 10 + Math.floor(Math.random() * 6);
              straightawayCount--;
              return 0;
            } else {
              // Trigger a winding zone: 12 to 18 curved/winding segments
              windingCount = 12 + Math.floor(Math.random() * 7);
            }
          }

          windingCount--;
          if (Math.random() < 0.25) return 0;
          const sign = Math.random() < 0.5 ? 1 : -1;
          return sign * (60 + Math.random() * 90);
        };

        // Infinite Track with straight & curved sections + roadside scenery
        const segmentLen = 40;
        const rearSegments = 3; // Keep 3 segments of track/scenery active behind the train
        const track = new InfiniteTrack(sim, {
          segmentLength: segmentLen,
          windowCount: 11,
          segmentFactory: createSceneryRailSegment,
          camera: null, // Camera managed directly by train
          curveGenerator: generateTrackCurve,
        });

        // Train & Controls (positioned past the rear buffer segments)
        const train = createTrain(sim, { position: [0, 0, 0] });
        const follower = new TrackFollower(track, train.mesh, {
          s: rearSegments * segmentLen + 10,
          speed: 0,
        });

        // Cowcatcher kinematic physics collider mounted on front of train
        const cowcatcherBody = new CANNON.Body({
          mass: 0,
          type: CANNON.Body.KINEMATIC,
          shape: new CANNON.Box(new CANNON.Vec3(1.4, 1.2, 1.2)),
        });
        sim.world.addBody(cowcatcherBody);

        // Input: shared key state + tap-to-accelerate on mobile
        if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
          const hint = document.getElementById("controls-hint");
          if (hint) hint.innerText = "Tap to accelerate \u2022 release to decelerate";
        }
        const input = new Input();
        input.mapTouchToKey("KeyW");
        const keys = input.keys;

        let accelRate = 10; // m/s^2 acceleration (no max cap)
        const decelRate = accelRate * 2; // deceleration is twice acceleration (60 m/s^2)
        let currentSpeed = 0;
        let currentTilt = 0;
        let currentCameraLookZ = 0;
        let currentCameraOffsetZ = 0;
        let screenShake = 0;
        let leverAngle = 0;

        // Defenses: an object per equipped defense, each carrying a numeric
        // `valueMph`. Total defense = sum across all equipped defenses and is
        // used to offset any speed loss — impacts worth less than the total are
        // absorbed entirely, larger ones reduced by it.
        const defenses = [];
        function addDefense(def) {
          defenses.push(def);
        }
        function removeDefense(id) {
          for (let i = 0; i < defenses.length; i++) {
            if (defenses[i].id === id) {
              defenses.splice(i, 1);
              i--;
            }
          }
        }
        function totalDefenseMph() {
          let total = 0;
          for (const def of defenses) total += def.valueMph;
          return total;
        }
        // Apply a speed loss (mps) offset by total defense. Returns nothing; fully
        // absorbed impacts cause no speed loss and no screen shake.
        function applyImpact(speedLossMps, shakeDelta, shakeCap) {
          const effMph = Math.max(0, speedLossMps * 2.237 - totalDefenseMph());
          if (effMph <= 0) return;
          currentSpeed = Math.max(0, currentSpeed - effMph / 2.237);
          screenShake = Math.min(shakeCap, screenShake + shakeDelta);
        }

        // Governor caps max speed (default 70 mph); adjust with governor.setCap()
        const governor = new Governor(70);

        // Speed gauge (circular semicircle, full scale = governor cap)
        let gauge = createGauge({ min: 0, max: governor.getCap(), unit: "MPH" });
        // Red line marks the boulder-damage threshold; hide until a cowcatcher exists.
        gauge.setThreshold(null);
        // Rebuild the gauge so its full scale tracks a raised governor cap.
        function rebuildGauge() {
          gauge.dispose();
          gauge = createGauge({ min: 0, max: governor.getCap(), unit: "MPH" });
        }

        // Money display below the top-left controls UI
        const moneyCounter = createMoneyCounter({
          left: "calc(50% + 90px)",
          bottom: "96px",
        });
        let money = 0;

        // Powerups: each is granted when its `grantWhen` condition is met, then
        // purchased by clicking its pill. `onBuy` applies the effect; the click is
        // gated by cost so money can never go negative. A `requires` id gates a
        // later tier behind the previous one — it isn't shown (or purchasable)
        // until the prerequisite is purchased.
        const POWERUPS = [
          {
            id: "cowcatcher", label: "Cowcatcher", icon: "▴", cost: 50,
            grantWhen: () => money >= 50,
            onBuy: () => setCowcatcherTier({ defenseId: "cowcatcher", valueMph: 1, scale: 1 }),
          },
          {
            id: "big-cowcatcher", label: "Big Cowcatcher", icon: "▴", cost: 150,
            grantWhen: () => money >= 150,
            requires: "cowcatcher",
            onBuy: () => setCowcatcherTier({ defenseId: "big-cowcatcher", valueMph: 3, scale: 1.45 }),
          },
          {
            id: "wedge-plow", label: "Wedge Plow", icon: "▴", cost: 400,
            grantWhen: () => money >= 400,
            requires: "big-cowcatcher",
            onBuy: () => setCowcatcherTier({ defenseId: "wedge-plow", valueMph: 6, scale: 1.9 }),
          },
          {
            id: "sandbox-1", label: "Better Accel I", icon: "▲", cost: 5,
            grantWhen: () => money >= 5,
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "sandbox-2", label: "Better Accel II", icon: "▲", cost: 50,
            grantWhen: () => money >= 50,
            requires: "sandbox-1",
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "sandbox-3", label: "Better Accel III", icon: "▲", cost: 500,
            grantWhen: () => money >= 500,
            requires: "sandbox-2",
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "governor-1", label: "Governor I", icon: "◆", cost: 100,
            grantWhen: () => money >= 100,
            onBuy: () => setGovernorCap(85),
          },
          {
            id: "governor-2", label: "Governor II", icon: "◆", cost: 200,
            grantWhen: () => money >= 200,
            requires: "governor-1",
            onBuy: () => setGovernorCap(100),
          },
          {
            id: "governor-3", label: "Governor III", icon: "◆", cost: 300,
            grantWhen: () => money >= 300,
            requires: "governor-2",
            onBuy: () => setGovernorCap(150),
          },
{
            id: "big-bangs", label: "Big Bangs", icon: "💥", cost: 200,
            grantWhen: () => money >= 200,
            onBuy: () => { bigBangs = true; },
          },
        ];

        const powerups = createPowerups();
        powerups.setBank(() => money);
        const grantedPowerups = new Set();
        const purchasedPowerups = new Set();
        powerups.on((item) => {
          if (item.id === "dynamite") {
            money -= DYNAMITE_COST;
            moneyCounter.setValue(money);
            dynamiteCount++;
            updateDynamiteCounter();
            powerups.refresh();
            ensureDynamite();
            return;
          }
          const def = POWERUPS.find((d) => d.id === item.id);
          if (!def) return;
          money -= item.cost;
          moneyCounter.setValue(money);
          powerups.refresh();
          purchasedPowerups.add(def.id);
          if (def.onBuy) def.onBuy();
        });

        // Dynamite: a renewable consumable ($50 each, unlimited purchases).
        const DYNAMITE_COST = 50;
        let dynamiteCount = 0;
        let dynamiteUnlocked = false;

        // Big Bangs powerup: triples the explosion (3 spheres) and enlarges its
        // blast radius so Megaliths are easier to hit even on near misses.
        let bigBangs = false;

        // Renders the Buy Dynamite pill via the powerups framework so it shares
        // the uniform width, theme, and bank-driven availability. Re-added after
        // each purchase to keep the renewable shop entry available.
        function ensureDynamite() {
          if (dynamiteUnlocked && !powerups.has("dynamite")) {
            powerups.add({
              id: "dynamite",
              label: "Buy Dynamite",
              icon: "💣",
              cost: DYNAMITE_COST,
              unit: "$",
            });
          }
        }

        // Throw button pinned to the left of the throttle gauge, shows inventory.
        const dynamiteBtn = document.createElement("button");
        Object.assign(dynamiteBtn.style, {
          display: "none",
          position: "fixed",
          bottom: "96px",
          left: "calc(50% - 190px)",
          width: "81px",
          height: "81px",
          padding: "0",
          background: "#c62828",
          color: "#fff",
          border: "none",
          borderRadius: "6px",
          cursor: "pointer",
          fontFamily: 'monospace, sans-serif',
          fontSize: "0.9rem",
          fontWeight: "900",
          lineHeight: "1.1",
          userSelect: "none",
          zIndex: "100",
          touchAction: "manipulation",
          webkitTapHighlightColor: "transparent",
          transition: "background 0.15s, transform 0.05s",
        });
        dynamiteBtn.addEventListener("mousedown", () => (dynamiteBtn.style.transform = "scale(0.96)"));
        dynamiteBtn.addEventListener("mouseup", () => (dynamiteBtn.style.transform = "scale(1)"));
        dynamiteBtn.addEventListener("touchstart", (e) => {
          dynamiteBtn.style.transform = "scale(0.96)";
          throwDynamite();
          if (e.cancelable) {
            e.preventDefault();
          }
        }, { passive: false });
        dynamiteBtn.addEventListener("touchend", () => (dynamiteBtn.style.transform = "scale(1)"), { passive: true });
        dynamiteBtn.addEventListener("touchcancel", () => (dynamiteBtn.style.transform = "scale(1)"), { passive: true });
        dynamiteBtn.addEventListener("click", throwDynamite);
        document.body.appendChild(dynamiteBtn);

function updateDynamiteCounter() {
          dynamiteBtn.textContent = `THROW\nDYNAMITE\n(x${dynamiteCount})`;
          dynamiteBtn.style.opacity = dynamiteCount > 0 ? "1" : "0.4";
          dynamiteBtn.style.cursor = dynamiteCount > 0 ? "pointer" : "default";
          if (dynamiteUnlocked || dynamiteCount > 0) {
            dynamiteBtn.style.display = "block";
          } else {
            dynamiteBtn.style.display = "none";
          }
        }
        updateDynamiteCounter();

        // Spawn a dynamite in the cab and launch it forward in an arc. It flies
        // until it touches the ground, then despawns.
        function throwDynamite() {
          if (dynamiteCount <= 0) return;
          dynamiteCount--;
          updateDynamiteCounter();

          const ent = createDynamite(sim, {
            length: 2.4,
            position: [0, 0, 0],
            mass: 2,
          });
          const mesh = ent.mesh;
          const body = ent.body;

          const spawn = new THREE.Vector3(-2.6, 4.0, 0).applyMatrix4(train.mesh.matrixWorld);
          mesh.position.copy(spawn);
          body.position.copy(spawn);
          body.quaternion.setFromEuler(Math.random() * Math.PI, Math.random() * Math.PI, 0);

          const fwd = follower.forwardAxis.clone().applyQuaternion(train.mesh.quaternion);

          // Aim at the point on the track 2 segments ahead of the train
          const targetPose = track.getPoseAt(follower.s + 2 * segmentLen);
          const targetPos = targetPose
            ? targetPose.position
            : spawn.clone().addScaledVector(fwd, 2 * segmentLen);

          const aimDir = new THREE.Vector3(
            targetPos.x - spawn.x,
            0,
            targetPos.z - spawn.z,
          );
          if (aimDir.lengthSq() > 0.001) {
            aimDir.normalize();
          } else {
            aimDir.copy(fwd);
          }

          // Launch with a low, fast trajectory toward the track target ahead
          const launchSpeed = follower.speed + 35;
          body.velocity.set(
            aimDir.x * launchSpeed,
            5,
            aimDir.z * launchSpeed,
          );
          body.angularVelocity.set(
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
          );

          const dyn = { mesh, body, ent, landed: false, exploded: false, collided: false };
          body.addEventListener("collide", () => {
            dyn.collided = true;
          });
          thrownDynamites.add(dyn);
        }

        // Shatters a Giant Megalith Boulder into smaller rock fragments
                // Monetary damage dealt by destroying a megalith scales with the cowcatcher
        // tier currently installed (a better cowcatcher reduces the cost).
        function megalithDamage() {
          if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) return 60;
          if (COWCATCHER_DEFENSE_IDS.has("big-cowcatcher")) return 70;
          if (COWCATCHER_DEFENSE_IDS.has("cowcatcher")) return 80;
          return MEGALITH_DAMAGE;
        }

        // Speed (mph) below which a megalith rolls aside instead of exploding,
        // based on the equipped cowcatcher tier. A better cowcatcher lets you
        // roll megaliths out of the way at higher speeds.
        function megalithRollThreshold() {
          if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) return 90;
          if (COWCATCHER_DEFENSE_IDS.has("big-cowcatcher")) return 70;
          if (COWCATCHER_DEFENSE_IDS.has("cowcatcher")) return 50;
          return 30;
        }

        // Megaliths show which outcome your current speed would trigger: black
        // means it'll be nudged aside (no penalty), deep red means it'd explode
        // and cost money. Colors blend smoothly, but only in a tight band around
        // the threshold so the signal stays readable.
        const MEGALITH_SAFE_COLOR = new THREE.Color(0x161616);
        const MEGALITH_DANGER_COLOR = new THREE.Color(0x8b0000);
        const MEGALITH_COLOR_BAND = 3; // mph transition width around the threshold
        function updateMegalithColors() {
          const speedMph = currentSpeed * 2.237;
          const threshold = megalithRollThreshold();
          const t = Math.max(0, Math.min(1, (speedMph - (threshold - MEGALITH_COLOR_BAND)) / (2 * MEGALITH_COLOR_BAND)));
          const target = MEGALITH_SAFE_COLOR.clone().lerp(MEGALITH_DANGER_COLOR, t);
          for (const sSeg of track.segments) {
            if (!sSeg.obstacles) continue;
            for (const obs of sSeg.obstacles) {
              if (obs.type === "giant-boulder" && obs.mat && !obs.hit && obs.mesh.parent) {
                obs.mat.color.copy(target);
              }
            }
          }
        }

        // Promotes the megalith group to a physics body and knocks it sideways
        // with spin so it rolls off onto the shoulder (used for the low-speed
        // "roll out of the way" outcome). No money is charged.
        function rollMegalithAside(mesh, worldPos, worldQuat, fwdDir, speed) {
          sim.scene.add(mesh);
          mesh.position.copy(worldPos);
          mesh.quaternion.copy(worldQuat);

          const body = new CANNON.Body({
            mass: 20000,
            shape: new CANNON.Sphere(2.6),
            linearDamping: 0.6,
            angularDamping: 0.4,
          });
          body.position.set(worldPos.x, worldPos.y, worldPos.z);
          body.quaternion.set(worldQuat.x, worldQuat.y, worldQuat.z, worldQuat.w);

          // Perpendicular (lateral) direction to the forward axis, in XZ plane.
          const lateralSide = Math.random() < 0.5 ? 1 : -1;
          const latX = -fwdDir.z * lateralSide;
          const latZ = fwdDir.x * lateralSide;
          const lateralSpeed = speed * 0.9 + 12 + Math.random() * 6;
          const fwdSpeed = speed * 0.25;
          const upSpeed = speed * 0.25 + 4 + Math.random() * 3;

          body.velocity.set(
            fwdDir.x * fwdSpeed + latX * lateralSpeed,
            upSpeed,
            fwdDir.z * fwdSpeed + latZ * lateralSpeed,
          );
          body.angularVelocity.set(
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
          );

          sim.world.addBody(body);
          activeFlyers.add({
            mesh,
            body,
            lifetime: 3.2,
          });
        }

        function shatterMegalith(obsWorldPos, baseFwdDir, baseSpeed = 15) {
          const shardOffsets = [
            [-1.2, 1.0, 0.4],
            [1.2, 1.0, -0.4],
            [-0.4, 0.6, 1.2],
            [0.4, 0.6, -1.2],
          ];

          for (const offset of shardOffsets) {
            const rockMesh = new THREE.Mesh(sharedShardGeo, sharedGiantMat);
            rockMesh.scale.set(
              0.9 + Math.random() * 0.4,
              0.8 + Math.random() * 0.3,
              0.9 + Math.random() * 0.4,
            );
            rockMesh.position.set(
              obsWorldPos.x + offset[0],
              obsWorldPos.y + offset[1],
              obsWorldPos.z + offset[2],
            );
            rockMesh.rotation.set(
              Math.random() * Math.PI,
              Math.random() * Math.PI,
              Math.random() * Math.PI,
            );
            sim.scene.add(rockMesh);

            const rockBody = new CANNON.Body({
              mass: 600,
              shape: new CANNON.Sphere(0.8),
              linearDamping: 0.3,
              angularDamping: 0.4,
            });
            rockBody.position.copy(rockMesh.position);

            // Fan the shards outward and upward from the impact point
            const shardDir = new CANNON.Vec3(
              baseFwdDir.x + offset[0] * 0.4,
              2.0 + Math.random() * 2.5,
              baseFwdDir.z + offset[2] * 0.4,
            );
            shardDir.normalize();
            rockBody.velocity.set(
              shardDir.x * baseSpeed + baseFwdDir.z * (Math.random() - 0.5) * 10,
              follower.speed * 0.3 + 1.5 + Math.random() * 2,
              shardDir.z * baseSpeed - baseFwdDir.x * (Math.random() - 0.5) * 10,
            );
            rockBody.angularVelocity.set(
              (Math.random() - 0.5) * 14,
              (Math.random() - 0.5) * 14,
              (Math.random() - 0.5) * 14,
            );

            sim.world.addBody(rockBody);
            activeFlyers.add({
              mesh: rockMesh,
              body: rockBody,
              lifetime: 2.8,
            });
          }
        }

        // Spawns expanding orange explosion sphere(s) for 200ms and shatters nearby Megaliths.
        // With Big Bangs, renders 3 spheres and a larger blast radius.
        function spawnExplosion(pos) {
          const count = bigBangs ? 3 : 1;
          const maxRadius = bigBangs ? 14.0 : 9.0;
          const duration = 0.2; // 200ms
          const geo = new THREE.SphereGeometry(1, 24, 18);
          const mat = new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0xff4400,
            emissiveIntensity: 0.9,
            roughness: 0.4,
            transparent: true,
            opacity: 0.9,
          });
          const baseY = Math.max(pos.y, 0.5);

          for (let i = 0; i < count; i++) {
            const mesh = new THREE.Mesh(geo, mat);
            let px = pos.x, py = baseY, pz = pos.z;
            // Sphere size and start delay: with Big Bangs, vary each sphere's
            // radius and stagger them 100ms apart for a more interesting blast.
            const radius = bigBangs
              ? maxRadius * [1.0, 0.7, 0.85][i]
              : maxRadius;
            const delay = bigBangs ? i * 0.1 : 0;
            if (bigBangs) {
              // Spread the three spheres outward along the forward axis and up.
              const off = i - 1; // -1, 0, 1
              px = pos.x + off * 3.0;
              py = baseY + Math.abs(off) * 1.4;
            }
            mesh.position.set(px, py, pz);
            mesh.scale.setScalar(0.1);
            sim.scene.add(mesh);

            const expl = {
              mesh,
              age: 0,
              delay,
              duration,
              maxRadius: radius,
            };
            activeExplosions.add(expl);
          }

          // Check for Megaliths and boulders in blast radius
          const fwdDir = follower.forwardAxis.clone().applyQuaternion(train.mesh.quaternion);
          for (const sSeg of track.segments) {
            if (sSeg.obstacles) {
              for (const obs of sSeg.obstacles) {
                if (!obs.hit && obs.mesh.parent && (obs.type === "giant-boulder" || obs.type === "boulder")) {
                  const obsWorldPos = new THREE.Vector3();
                  obs.mesh.getWorldPosition(obsWorldPos);
                  if (pos.distanceTo(obsWorldPos) <= maxRadius + 3.0) {
                    obs.hit = true;
                    obs.mesh.parent.remove(obs.mesh);
                    if (obs.type === "giant-boulder") {
                      shatterMegalith(obsWorldPos, fwdDir, Math.max(16, follower.speed * 0.5));
                    }
                  }
                }
              }
            }
          }
        }

        // Raise the governor cap (never lowering it) and keep the gauge in step.
        function setGovernorCap(newCapMph) {
          governor.setCap(Math.max(governor.getCap(), newCapMph));
          rebuildGauge();
        }
        // Award any powerup whose grant condition is now met (each only once).
        function grantPowerups() {
          if (!dynamiteUnlocked && (money >= DYNAMITE_COST || dynamiteCount > 0)) {
            dynamiteUnlocked = true;
            ensureDynamite();
            updateDynamiteCounter();
          }
          for (const def of POWERUPS) {
            if (grantedPowerups.has(def.id)) continue;
            if (def.requires && !purchasedPowerups.has(def.requires)) continue;
            if (!def.grantWhen()) continue;
            grantedPowerups.add(def.id);
            powerups.add({
              id: def.id, label: def.label, icon: def.icon, cost: def.cost,
            });
          }
        }

        // Renders the wedge cowcatcher at the front of the train and applies its
// defense. Upgrades replace the previous one with a larger one. The sloped
// teeth tip obstacles up/away, softening collisions.
        let cowcatcherEntity = null;
        const COWCATCHER_DEFENSE_IDS = new Set();
        function setCowcatcherTier({ defenseId, valueMph, scale }) {
          // Swap in the new defense, dropping any prior cowcatcher-class one.
          for (const id of COWCATCHER_DEFENSE_IDS) removeDefense(id);
          COWCATCHER_DEFENSE_IDS.clear();
          addDefense({ id: defenseId, valueMph });
          COWCATCHER_DEFENSE_IDS.add(defenseId);

          // Replace the existing cowcatcher with a larger one.
          if (cowcatcherEntity) {
            train.mesh.remove(cowcatcherEntity.mesh);
            sim.removeEntity(cowcatcherEntity);
            cowcatcherEntity = null;
          }
          const cowcatcher = createCowcatcher(sim, {
            color: 0x222b33,
            width: 0.32 * scale,
            gap: 0.16 * scale,
            depth: 1.2 * scale,
            height: 0.75 * scale,
            position: [4.1, 0.5, 0],
            rotation: [0, -Math.PI / 2 - Math.PI, 0],
          });
          train.mesh.add(cowcatcher.mesh);
          cowcatcherEntity = cowcatcher;
        }

        // Flying "$" signs that emit from the smokestack at top speed
        const moneySigns = [];
        let moneySpawnAccum = 0;
        const MONEY_SIGN_LIFETIME = 1.0;

        const moneyCanvas = document.createElement("canvas");
        moneyCanvas.width = moneyCanvas.height = 64;
        const moneyCtx = moneyCanvas.getContext("2d");
        moneyCtx.fillStyle = "#e7d984";
        moneyCtx.font = "bold 46px sans-serif";
        moneyCtx.textAlign = "center";
        moneyCtx.textBaseline = "middle";
        moneyCtx.fillText("$", 32, 32);
        const moneyTexture = new THREE.CanvasTexture(moneyCanvas);
        moneyTexture.needsUpdate = true;

        function spawnMoneySign() {
          const sprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
              map: moneyTexture,
              transparent: true,
              depthTest: false,
              opacity: 1,
            }),
          );
          // Spawn just below the smokestack top, child of the train so it travels with it.
          sprite.position.set(
            3.55,
            2.9 + Math.random() * 0.3,
            (Math.random() - 0.5) * 0.2,
          );
          sprite.scale.set(0.5, 0.5, 0.5);
          sprite.userData.age = 0;
          train.mesh.add(sprite);
          moneySigns.push(sprite);
        }

        // Red "-$X" that flashes at dead-center screen and flies up like the
        // smokestack money, then fades. Used for monetary damage (e.g. megaliths).
        const MEGALITH_DAMAGE = 100;
        function spawnDamageSign(amount = MEGALITH_DAMAGE) {
          const el = document.createElement("div");
          el.textContent = `-$${amount}`;
          Object.assign(el.style, {
            position: "fixed",
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            color: "#ff4444",
            fontFamily: "monospace, sans-serif",
            fontSize: "2.4rem",
            fontWeight: "900",
            textShadow: "0 0 12px rgba(255,0,0,0.7)",
            pointerEvents: "none",
            zIndex: "120",
            userSelect: "none",
            willChange: "transform, opacity",
          });
          document.body.appendChild(el);
          el.animate(
            [
              { transform: "translate(-50%, -50%)", opacity: 1 },
              { transform: "translate(-50%, -90%)", opacity: 0 },
            ],
            { duration: 1000, easing: "ease-out" },
          ).onfinish = () => el.remove();
        }

        // 3D master-controller lever (bottom-right screen overlay)
        const lever = createLever();
        sim.scene.add(lever);

        // Initial train position
        const initPose = follower.getPose();
        if (initPose) {
          train.mesh.position.copy(initPose.position);
          train.mesh.quaternion.setFromUnitVectors(follower.forwardAxis, initPose.forward);
          train.mesh.updateMatrixWorld(true);
        }

        // Camera rig with draggable FOV/offset sliders (bottom-right panel)
        const camCtrl = createCameraControls(sim, {
          mesh: train.mesh,
          fov: 60,
          offset: [-3.2, 5.4, 0],
          look: [2.0, 3.2, 0],
          visible: false,
        });

        // Pre-allocated scratch objects for update loop to prevent GC pauses
        const _invMat = new THREE.Matrix4();
        const _obsWorldPos = new THREE.Vector3();
        const _obsWorldQuat = new THREE.Quaternion();
        const _rearCamPos = new THREE.Vector3();
        const _rearCamLook = new THREE.Vector3();
        const _cabCamPos = new THREE.Vector3();
        const _cabCamLook = new THREE.Vector3();
        const _cowcatcherWorldPos = new THREE.Vector3();
        const _rollQuat = new THREE.Quaternion();
        const _fwdDir = new THREE.Vector3();
        const _frontLocal = new THREE.Vector3(4.0, 0.85, 0);

        train.updateFn = (dt, entity, simulation) => {
          const isRearView = keys.has("Space");

          // Master controller lever: W (or tap) accelerates, no W decelerates.
          const throttling = keys.has("KeyW") || keys.has("ArrowUp");
          if (throttling) {
            const next = currentSpeed + accelRate * dt;
            currentSpeed = governor.limit(next);
          } else {
            currentSpeed = Math.max(0, currentSpeed - decelRate * dt);
          }
          follower.speed = currentSpeed;

          const speedMph = currentSpeed * 2.237;
          gauge.setValue(speedMph);

          // Red threshold mark follows the current boulder-damage threshold.
          gauge.setThreshold(megalithRollThreshold());

          // Money is earned flat at 1/s below top speed, and scales with speed
          // once at top speed. The smokestack emits one "$" per dollar earned.
          // When the train is stopped, no money is earned (and no smoke signs).
          const atMaxSpeed = currentSpeed >= governor.getCapMps() - 1e-6;
          gauge.setMax(atMaxSpeed);
          const moving = currentSpeed > 0.22; // ~0.5 mph
          const moneyRate = !moving ? 0 : (atMaxSpeed ? speedMph * 0.14 : 1.0);
          money += dt * moneyRate;
          moneyCounter.setValue(money);
          powerups.refresh();

          // Emit a "$" sign from the smokestack, one per dollar earned
          moneySpawnAccum += dt * moneyRate;
          while (moneySpawnAccum >= 1) {
            moneySpawnAccum -= 1;
            spawnMoneySign();
          }

          // Grant any powerup whose condition is now met
          grantPowerups();

          // Tint megaliths by whether the current speed would nudge or cost money
          updateMegalithColors();

          // Animate flying money signs upward and despawn them after 1s
          for (let i = moneySigns.length - 1; i >= 0; i--) {
            const sign = moneySigns[i];
            sign.userData.age += dt;
            const t = sign.userData.age / MONEY_SIGN_LIFETIME;
            sign.position.y += 2.5 * dt;
            sign.position.x += 0.6 * dt;
            sign.material.opacity = 1 - t;
            if (t >= 1) {
              train.mesh.remove(sign);
              sign.material.dispose();
              moneySigns.splice(i, 1);
            }
          }

          // Advance distance along track
          follower.s += follower.speed * dt;

          // Recycle segments while maintaining rear segment buffer behind train
          const advanceThreshold = (rearSegments + 1) * segmentLen;
          while (follower.s >= advanceThreshold) {
            follower.s -= segmentLen;
            const nextOrigin = track.segments[1]?.entryPose.position.clone();
            const nextHeading = track.segments[1]?.entryPose.heading || 0;

            track.advance();

            if (nextOrigin) {
              rebaseActiveFlyers(nextOrigin, nextHeading);
              rebaseThrownDynamites(nextOrigin, nextHeading);
              rebaseActiveExplosions(nextOrigin, nextHeading);
            }
          }

          // Sync & despawn thrown dynamite sticks (spawn explosion on ground contact)
          for (const dyn of thrownDynamites) {
            dyn.mesh.position.set(dyn.body.position.x, dyn.body.position.y, dyn.body.position.z);
            dyn.mesh.quaternion.set(
              dyn.body.quaternion.x,
              dyn.body.quaternion.y,
              dyn.body.quaternion.z,
              dyn.body.quaternion.w,
            );

            // Megalith collision is checked EVERY frame regardless of altitude, so
            // a fast, flat-thrown stick can't tunnel straight through a megalith
            // after merely grazing the ground. Uses horizontal distance so a low
            // stick still clips the megalith's measured footprint.
            let hitMegalith = false;
            if (!dyn.exploded) {
              for (const sSeg of track.segments) {
                if (sSeg.obstacles) {
                  for (const obs of sSeg.obstacles) {
                    if (!obs.hit && obs.mesh.parent && (obs.type === "giant-boulder" || obs.type === "boulder")) {
                      const obsWorldPos = new THREE.Vector3();
                      obs.mesh.getWorldPosition(obsWorldPos);
                      const contactRadius = obs.contactRadius ?? 3.6;
                      const dx = dyn.body.position.x - obsWorldPos.x;
                      const dz = dyn.body.position.z - obsWorldPos.z;
                      if (dx * dx + dz * dz < contactRadius * contactRadius) {
                        dyn.exploded = true;
                        spawnExplosion(dyn.body.position);
                        simulation.removeEntity(dyn.ent);
                        thrownDynamites.delete(dyn);
                        hitMegalith = true;
                        break;
                      }
                    }
                  }
                }
                if (hitMegalith) break;
              }
            }
            if (hitMegalith) continue;

            // Land on the ground: explode shortly after contact
            if (dyn.body.position.y <= 0.3) {
              dyn.landed = true;
            }
            if (dyn.collided) {
              dyn.landed = true;
            }
            if (dyn.landed) {
              spawnExplosion(dyn.body.position);
              simulation.removeEntity(dyn.ent);
              thrownDynamites.delete(dyn);
            }
          }

          // Animate & despawn explosion spheres (expand to large radius in 200ms)
          for (const expl of activeExplosions) {
            expl.age += dt;
            const progress = (expl.age - (expl.delay ?? 0)) / expl.duration;
            if (expl.age >= (expl.delay ?? 0) + expl.duration) {
              simulation.scene.remove(expl.mesh);
              expl.mesh.geometry?.dispose();
              expl.mesh.material?.dispose();
              activeExplosions.delete(expl);
            } else if (progress > 0) {
              const currentScale = 0.1 + (expl.maxRadius - 0.1) * Math.sin((progress * Math.PI) / 2);
              expl.mesh.scale.setScalar(currentScale);
              expl.mesh.material.opacity = 0.9 * (1 - progress * 0.7);
            }
          }

          // Update & sync active flying obstacles
          for (const flyer of activeFlyers) {
            flyer.mesh.position.set(flyer.body.position.x, flyer.body.position.y, flyer.body.position.z);
            flyer.mesh.quaternion.set(
              flyer.body.quaternion.x,
              flyer.body.quaternion.y,
              flyer.body.quaternion.z,
              flyer.body.quaternion.w,
            );
            flyer.lifetime -= dt;
            if (flyer.lifetime <= 0) {
              simulation.scene.remove(flyer.mesh);
              simulation.world.removeBody(flyer.body);
              flyer.mesh.traverse((child) => {
                if (child.isMesh) {
                  child.geometry?.dispose();
                  if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
                  else child.material?.dispose();
                }
              });
              activeFlyers.delete(flyer);
            }
          }

          // Sync train mesh to rebased track pose
          const pose = follower.getPose();
          if (pose) {
            entity.mesh.position.copy(pose.position);
            entity.mesh.quaternion.setFromUnitVectors(follower.forwardAxis, pose.forward);

            // Track curvature ahead/behind for train visual tilt
            const poseAhead = track.getPoseAt(follower.s + 1.6);
            const poseBehind = track.getPoseAt(Math.max(0, follower.s - 1.6));
            let dHeading = 0;
            if (poseAhead && poseBehind) {
              let dh = poseAhead.heading - poseBehind.heading;
              dh = Math.atan2(Math.sin(dh), Math.cos(dh));
              dHeading = dh / 3.2;
            }

            // Sample track curve ahead to look around upcoming bends without matrix lag
            const aheadDist = 26;
            const lookPoseAhead = track.getPoseAt(follower.s + aheadDist);
            let curveLateralAhead = 0;
            if (lookPoseAhead && !isRearView) {
              const dx = lookPoseAhead.position.x - pose.position.x;
              const dz = lookPoseAhead.position.z - pose.position.z;
              // Local +Z lateral offset in train reference frame: cross(forward, up) = (-fwd.z, 0, fwd.x)
              curveLateralAhead = -dx * pose.forward.z + dz * pose.forward.x;
            }

            // Dynamic camera look-ahead aiming and lateral lean to gently see around corners
            const targetLookZ = Math.max(-3.0, Math.min(3.0, curveLateralAhead * 0.25));
            const targetOffsetZ = -Math.max(-1.0, Math.min(1.0, curveLateralAhead * 0.08));
            currentCameraLookZ += (targetLookZ - currentCameraLookZ) * Math.min(1, dt * 4.5);
            currentCameraOffsetZ += (targetOffsetZ - currentCameraOffsetZ) * Math.min(1, dt * 4.5);

            camCtrl.state.offset.z = currentCameraOffsetZ;
            camCtrl.state.look.z = currentCameraLookZ;

            // Visual corner tilt on train: starts at 50 mph and grows sharply with
            // speed, so the train leans harder into corners the faster it goes.
            let targetTilt = 0;
            if (speedMph > 50) {
              const excessSpeed = speedMph - 50;
              targetTilt = -dHeading * (excessSpeed / 15.0);
              targetTilt = Math.max(-0.9, Math.min(0.9, targetTilt));
            }
            currentTilt += (targetTilt - currentTilt) * Math.min(1, dt * 8);

            // Apply corner tilt along train's forward axis
            _rollQuat.setFromAxisAngle(follower.forwardAxis, currentTilt);
            entity.mesh.quaternion.multiply(_rollQuat);
            entity.mesh.updateMatrixWorld(true);

            // Sync kinematic cowcatcher collider to front of locomotive
            _cowcatcherWorldPos.copy(_frontLocal).applyMatrix4(entity.mesh.matrixWorld);
            cowcatcherBody.position.set(_cowcatcherWorldPos.x, _cowcatcherWorldPos.y, _cowcatcherWorldPos.z);
            cowcatcherBody.quaternion.set(
              entity.mesh.quaternion.x,
              entity.mesh.quaternion.y,
              entity.mesh.quaternion.z,
              entity.mesh.quaternion.w,
            );

            // Give kinematic collider forward/upward impulse velocity
            _fwdDir.copy(follower.forwardAxis).applyQuaternion(entity.mesh.quaternion);
            const impulseSpeed = follower.speed * 1.6 + 10;
            cowcatcherBody.velocity.set(
              _fwdDir.x * impulseSpeed,
              follower.speed * 0.35 + 5,
              _fwdDir.z * impulseSpeed,
            );

            // Impact detection: when locomotive cowcatcher reaches an obstacle, launch it with physics
            for (const sSeg of track.segments) {
              if (sSeg.obstacles) {
                for (const obs of sSeg.obstacles) {
                  if (!obs.hit && obs.mesh.parent) {
                    obs.mesh.getWorldPosition(_obsWorldPos);
                    const dist = _cowcatcherWorldPos.distanceTo(_obsWorldPos);

                    if (dist < 3.0) {
                      obs.hit = true;

                      obs.mesh.getWorldQuaternion(_obsWorldQuat);

                      // Detach from segment and promote to world simulation
                      obs.mesh.parent.remove(obs.mesh);

                      // Giant Megalith Boulder shatters into smaller rocks on impact
                      if (obs.type === "giant-boulder") {
                        const impactMph = currentSpeed * 2.237;
                        const rollThreshold = megalithRollThreshold();

                        // Low-speed hit: roll the megalith off to the side (free of
                        // money, but a heavy 90% speed bleed) instead of exploding.
                        if (impactMph <= rollThreshold) {
                          rollMegalithAside(obs.mesh, _obsWorldPos, _obsWorldQuat, _fwdDir, follower.speed);
                          currentSpeed = Math.max(0, currentSpeed * 0.10);
                          screenShake = Math.min(1.4, screenShake + 0.5);
                          follower.speed = currentSpeed;
                          continue;
                        }

                        // Cowcatcher impacts cost money (tiered discount), shown
                        // as a red "-$X" at screen center. Dynamite blows are free.
                        const cost = megalithDamage();
                        money -= cost;
                        moneyCounter.setValue(money);
                        spawnDamageSign(cost);

                        shatterMegalith(_obsWorldPos, _fwdDir, follower.speed * 0.5);

                        // Above the threshold the megalith explodes; only 50% speed bleed.
                        currentSpeed = Math.max(0, currentSpeed * 0.50);
                        screenShake = Math.min(1.4, screenShake + 1.2);
                        follower.speed = currentSpeed;
                        continue;
                      }

                      simulation.scene.add(obs.mesh);
                      obs.mesh.position.copy(_obsWorldPos);
                      obs.mesh.quaternion.copy(_obsWorldQuat);

                      let body;
                      if (obs.type === "log") {
                        body = new CANNON.Body({
                          mass: 400,
                          shape: new CANNON.Box(new CANNON.Vec3(obs.logLen / 2, 0.4, 0.4)),
                        });
                      } else if (obs.type === "tiny-rock") {
                        body = new CANNON.Body({
                          mass: 30,
                          shape: new CANNON.Sphere(0.3),
                          linearDamping: 0.2,
                          angularDamping: 0.3,
                        });
                      } else {
                        body = new CANNON.Body({
                          mass: 1200,
                          shape: new CANNON.Sphere(0.95),
                        });
                      }
                      body.position.set(_obsWorldPos.x, _obsWorldPos.y, _obsWorldPos.z);
                      body.quaternion.set(_obsWorldQuat.x, _obsWorldQuat.y, _obsWorldQuat.z, _obsWorldQuat.w);

                      // Impulse scaled to obstacle mass & inertia
                      {
                        const lateralSide = (Math.random() < 0.5 ? 1 : -1) * (follower.speed * 0.4 + Math.random() * 8);
                        const hitSpeed = follower.speed * 0.9;
                        body.velocity.set(
                          _fwdDir.x * hitSpeed + _fwdDir.z * lateralSide,
                          follower.speed * 0.3 + 2 + Math.random() * 3,
                          _fwdDir.z * hitSpeed - _fwdDir.x * lateralSide,
                        );
                        body.angularVelocity.set(
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                        );
                      }

                      // Subtract velocity commensurate with obstacle mass & apply impact feedback
                      if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) {
                        // Wedge plow: branch, boulder, and rock are knocked aside with
                        // no speed bleed — just a light rattle for feedback.
                        screenShake = Math.min(0.15, screenShake + 0.08);
                      } else if (obs.type === "log") {
                        applyImpact(Math.max(5.0, currentSpeed * 0.22), 0.22, 0.35);
                      } else if (obs.type === "tiny-rock") {
                        // Tiny rocks: negligible impact, just a small rattle
                        applyImpact(Math.max(0.4, currentSpeed * 0.05), 0.08, 0.15);
                      } else {
                        applyImpact(Math.max(14.0, currentSpeed * 0.45), 0.55, 0.75);
                      }
                      follower.speed = currentSpeed;

          sim.world.addBody(body);
                      activeFlyers.add({
                        mesh: obs.mesh,
                        body,
                        lifetime: 2.8,
                      });
                    }
                  }
                }
              }
            }
          }

          // Center ground beneath the train
          if (ground?.mesh) {
            ground.mesh.position.x = entity.mesh.position.x;
            ground.mesh.position.z = entity.mesh.position.z;
          }

          // Update camera pose. Space swaps to the reverse rig: a camera mounted
          // in front of the train that looks back down its length to frame the
          // whole train. Holding 'C' drops the camera inside the cab looking forward.
          const isCabView = keys.has("KeyC");
          if (isCabView) {
            _cabCamPos.set(1.4, 2.7, 0.4).applyMatrix4(entity.mesh.matrixWorld);
            _cabCamLook.set(7.0, 2.1, 0).applyMatrix4(entity.mesh.matrixWorld);
            simulation.camera.position.copy(_cabCamPos);
            simulation.camera.lookAt(_cabCamLook);
          } else if (isRearView) {
            _rearCamPos.set(7.5, 4.8, 0).applyMatrix4(entity.mesh.matrixWorld);
            _rearCamLook.set(1.6, 1.9, 0).applyMatrix4(entity.mesh.matrixWorld);
            simulation.camera.position.copy(_rearCamPos);
            simulation.camera.lookAt(_rearCamLook);
          } else {
            camCtrl.update({ mirror: false });
          }

          // FOV scales exponentially with speed: 60° at rest → 80° at 250 mph
          const fovBase = camCtrl.state.fov;
          const speedRatio = Math.min(1, Math.max(0, speedMph / 250));
          simulation.camera.fov = fovBase * Math.pow(80 / fovBase, speedRatio);
          simulation.camera.updateProjectionMatrix();

          // Dynamic fog adjustment: bring fog closer in rear view to hide limited rear draw distance
          const targetFogNear = isRearView ? 15 : 50;
          const targetFogFar = isRearView ? 95 : 220;
          simulation.scene.fog.near += (targetFogNear - simulation.scene.fog.near) * Math.min(1, dt * 10);
          simulation.scene.fog.far += (targetFogFar - simulation.scene.fog.far) * Math.min(1, dt * 10);

          // Impact screen shake
          if (screenShake > 0.001) {
            simulation.camera.position.x += (Math.random() - 0.5) * screenShake;
            simulation.camera.position.y += (Math.random() - 0.5) * screenShake;
            screenShake *= Math.exp(-dt * 9.0);
          }

          // Master-controller lever: pinned to bottom-right of the screen
          const camQuat = simulation.camera.quaternion;
          const vRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camQuat);
          const vUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camQuat);
          const vFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);

          const leverDist = 7;
          const halfH = Math.tan((simulation.camera.fov * Math.PI) / 360) * leverDist;
          const halfW = halfH * simulation.camera.aspect;
          const nx = 0.73;
          const ny = -0.6;

          lever.position
            .copy(simulation.camera.position)
            .addScaledVector(vFwd, leverDist)
            .addScaledVector(vRight, nx * halfW)
            .addScaledVector(vUp, ny * halfH);
          lever.scale.setScalar(1.1);
          lever.lookAt(simulation.camera.position);
          lever.updateMatrixWorld(true);

          // Hide the accel lever in reverse and cab views
          lever.visible = !isRearView && !isCabView;
          if (lever.visible) {
            // Tilt toward/away from the user based on throttle input.
            let targetLever = 0;
            if (keys.has("KeyW") || keys.has("ArrowUp")) targetLever = -0.7; // into screen (away from user)
            else targetLever = 0.7; // toward user (decelerating)
            leverAngle += (targetLever - leverAngle) * Math.min(1, dt * 8);
            lever.userData.pivot.rotation.x = leverAngle;
          }
        };

        // Initial camera pose
        camCtrl.update({ mirror: false });
      }

      // Run
      setup(sim);
      sim.start();
    </script>
  </body>
</html>
