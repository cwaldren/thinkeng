          // Currently in a designated straightaway
          if (straightawayCount > 0) {
            straightawayCount--;
            return 0;
          }

          // Transition between winding zones and straightaways
          if (windingCount <= 0) {
            if (Math.random() < 0.38) {
              // Trigger a long straightaway: 10 to 15 consecutive straight segments
              straightawayCount = 10 + Math.floor(Math.random() * 6);
              straightawayCount--;
              return 0;
            } else {
              // Trigger a winding zone: 12 to 18 curved/winding segments
              windingCount = 12 + Math.floor(Math.random() * 7);
            }
          }

          windingCount--;
          if (Math.random() < 0.25) return 0;
          const sign = Math.random() < 0.5 ? 1 : -1;
          return sign * (60 + Math.random() * 90);
        };

        // Infinite Track with straight & curved sections + roadside scenery
        const segmentLen = 40;
        const rearSegments = 3; // Keep 3 segments of track/scenery active behind the train
        // The train starts on this segment — keep it obstacle-free (set before
        // the track spawns its initial segments).
        noObstacleSegmentIndex = rearSegments;
        const track = new InfiniteTrack(sim, {
          segmentLength: segmentLen,
          windowCount: 11,
          segmentFactory: createSceneryRailSegment,
          camera: null, // Camera managed directly by train
          curveGenerator: generateTrackCurve,
        });

        // Train & Controls (positioned past the rear buffer segments)
        const train = createTrain(sim, { position: [0, 0, 0] });
        const follower = new TrackFollower(track, train.mesh, {
          s: rearSegments * segmentLen + 10,
          speed: 0,
        });

        // Shared mutable game state read/written across systems
        const state = {
          speedMps: 0,
          accelRate: 5, // m/s^2 baseline acceleration
          money: 0,
          screenShake: 0,
          bigBangs: false,
          goldenRocks: false,
          goldenBoulders: false,
          dynamiteCount: 0,
          dynamiteUnlocked: false,
        };

        // Input: shared key state + tap-to-accelerate on mobile
        if (
          window.matchMedia &&
          window.matchMedia("(pointer: coarse)").matches
        ) {
          const hint = document.getElementById("controls-hint");
          if (hint)
            hint.innerText = "Tap to accelerate \u2022 release to decelerate";
        }
        const input = new Input();
        input.mapTouchToKey("KeyW");
        const keys = input.keys;

        // Governor caps max speed (default 70 mph); raised via setGovernorCap()
        const governor = new Governor(70);

        // Speed gauge (circular semicircle, full scale = governor cap)
        let gauge = createGauge({
          min: 0,
          max: governor.getCap(),
        });
        // Red line marks the boulder-damage threshold; hide until a cowcatcher exists.
        gauge.setThreshold(null);
        // Indirection so systems always reach the current gauge instance
        // (rebuildGauge replaces it when the governor cap rises).
        const gaugeApi = {
          setValue: (v) => gauge.setValue(v),
          setThreshold: (v) => gauge.setThreshold(v),
          setMax: (v) => gauge.setMax(v),
        };

        // Money display centered inside the speed gauge above the hub
        const moneyCounter = createMoneyCounter({
          left: "50%",
          bottom: "clamp(32px, 8vw, 52px)",
          size: "clamp(1.5rem, 5.5vw, 2.2rem)",
        });

        const powerups = createPowerups();

        // Camera rig with draggable FOV/offset sliders (bottom-right panel)
        const camCtrl = createCameraControls(sim, {
          mesh: train.mesh,
          fov: 60,
          offset: [-3.2, 5.4, 0],
          look: [2.0, 3.2, 0],
          visible: false,
        });

        // 3D master-controller lever (bottom-right screen overlay)
        const lever = createLever();
        sim.scene.add(lever);

        // Systems, constructed in dependency order. train.updateFn invokes
        // them every frame in play order:
        //   throttle -> economy -> track runner -> dynamite -> effects ->
        //   bunnies -> pose sync -> impacts -> camera rig
        // Hard ordering constraints:
        //   - runner rebases world-space sets before dyn/fx/bunnies read them
        //   - poseSync refreshes entity.matrixWorld before impacts uses it
        //   - impacts (which add screen shake) run before the rig places the
        //     camera so shake offsets land on the fresh camera pose
        const controls = createThrottle({
          keys,
          governor,
          state,
          sim,
          train,
          follower,
        });
        const fx = createEffectsSystem({ sim, train, follower, track, state });
        const dyn = createDynamiteSystem({
          sim,
          simulation: sim,
          track,
          follower,
          train,
          segmentLen,
          state,
          spawnExplosion: fx.spawnExplosion,
        });
        const bunnySys = createBunnySystem({
          sim,
          effects: fx,
          state,
          moneyCounter,
          powerups,
        });
        const impacts = createImpactSystem({
          sim,
          simulation: sim,
          entity: train,
          follower,
          track,
          state,
          effects: fx,
          bunnies: bunnySys,
          moneyCounter,
          powerups,
        });
        const econ = createEconomy({
          state,
          gauge: gaugeApi,
          governor,
          moneyCounter,
          powerups,
          grantPowerups: () => grantPowerups(),
          getRollThreshold: impacts.getRollThreshold,
          spawnMoneySign: fx.spawnMoneySign,
        });
        const runner = createTrackRunner({
          track,
          follower,
          segmentLen,
          rearSegments,
          flyers: fx.flyers,
          explosions: fx.explosions,
          dynamites: dyn.items,
          hoppers: bunnySys.hoppers,
        });
        const poseSync = createPoseSync({
          track,
          follower,
          camCtrl,
          entity: train,
          ground,
          state,
          keys,
        });
        const rig = createCameraRig({
          simulation: sim,
          camCtrl,
          keys,
          entity: train,
          lever,
          state,
        });

        // Hide title & control hints and slide powerups to top after 10s of play time
        let playStarted = false;
        function onFirstInteraction() {
          if (playStarted) return;
          playStarted = true;
          window.removeEventListener("keydown", onFirstInteraction);
          window.removeEventListener("pointerdown", onFirstInteraction);
          setTimeout(() => {
            const uiEl = document.getElementById("ui");
            if (uiEl) uiEl.style.opacity = "0";
            if (powerups?.panel) powerups.panel.style.top = "16px";
          }, 10000);
        }
        window.addEventListener("keydown", onFirstInteraction);
        window.addEventListener("pointerdown", onFirstInteraction);

        // Attach auxiliary steam sipper cylinders to the left and right sides of the boiler
        function addSteamSippers() {
          const sipperMat = new THREE.MeshStandardMaterial({
            color: 0xc23b2e,
            roughness: 0.5,
            metalness: 0.1,
          });
          const sipperGeo = new THREE.CylinderGeometry(0.26, 0.26, 2.5, 16);

          const leftSipper = new THREE.Mesh(sipperGeo, sipperMat);
          leftSipper.rotation.z = Math.PI / 2;
          leftSipper.position.set(1.8, 1.65, 0.72);
          train.mesh.add(leftSipper);

          const rightSipper = new THREE.Mesh(sipperGeo, sipperMat);
          rightSipper.rotation.z = Math.PI / 2;
          rightSipper.position.set(1.8, 1.65, -0.72);
          train.mesh.add(rightSipper);
        }

        // Attach a black cap cylinder to the top of the smokestack (front pipe)
        function addPipeCap() {
          const capMat = new THREE.MeshStandardMaterial({
            color: 0x181818,
            roughness: 0.4,
            metalness: 0.2,
          });
          const capGeo = new THREE.CylinderGeometry(0.4, 0.36, 0.24, 16);
          const pipeCap = new THREE.Mesh(capGeo, capMat);
          pipeCap.position.set(3.55, 3.34, 0);
          train.mesh.add(pipeCap);
        }

        // Attach two long thin black injector pipes above the steam sippers
        function addSteamInjectors() {
          const injectorMat = new THREE.MeshStandardMaterial({
            color: 0x181818,
            roughness: 0.35,
            metalness: 0.4,
          });
          const injectorGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.5, 12);

          const leftInjector = new THREE.Mesh(injectorGeo, injectorMat);
          leftInjector.rotation.z = Math.PI / 2;
          leftInjector.position.set(1.8, 1.95, 0.68);
          train.mesh.add(leftInjector);

          const rightInjector = new THREE.Mesh(injectorGeo, injectorMat);
          rightInjector.rotation.z = Math.PI / 2;
          rightInjector.position.set(1.8, 1.95, -0.68);
          train.mesh.add(rightInjector);
        }

        // Powerups: each is granted when its `grantWhen` condition is met, then
        // purchased by clicking its pill. `onBuy` applies the effect; the click is
        // gated by cost so money can never go negative. A `requires` id gates a
        // later tier behind the previous one — it isn't shown (or purchasable)
        // until the prerequisite is purchased.
        const POWERUPS = [
          {
            id: "cowcatcher",
            label: "Cowcatcher",
            icon: "▴",
            cost: 50,
            grantWhen: () => state.money >= 50,
            onBuy: () =>
              impacts.setCowcatcherTier({
                defenseId: "cowcatcher",
                valueMph: 1,
                scale: 1,
              }),
          },
          {
            id: "big-cowcatcher",
            label: "Big Cowcatcher",
            icon: "▴",
            cost: 150,
            grantWhen: () => state.money >= 150,
            requires: "cowcatcher",
            onBuy: () =>
              impacts.setCowcatcherTier({
                defenseId: "big-cowcatcher",
                valueMph: 3,
                scale: 1.45,
              }),
          },
          {
            id: "wedge-plow",
            label: "Wedge Plow",
            icon: "▴",
            cost: 400,
            grantWhen: () => state.money >= 400,
            requires: "big-cowcatcher",
            onBuy: () =>
              impacts.setCowcatcherTier({
                defenseId: "wedge-plow",
                valueMph: 6,
                scale: 1.9,
              }),
          },
          {
            id: "sandbox-1",
            label: "Accel I",
            icon: "▲",
            cost: 20,
            grantWhen: () => state.money >= 20,
            debug: true,
            onBuy: () => {
              state.accelRate += 5;
              controls.enableSandBlast();
            },
          },
          {
            id: "sandbox-2",
            label: "Accel II",
            icon: "▲",
            cost: 80,
            grantWhen: () => state.money >= 80,
            requires: "sandbox-1",
            onBuy: () => {
              state.accelRate += 5;
            },
          },
          {
            id: "sandbox-3",
            label: "Accel III",
            icon: "▲",
            cost: 250,
            grantWhen: () => state.money >= 250,
            requires: "sandbox-2",
            onBuy: () => {
              state.accelRate += 5;
            },
          },
          {
            id: "governor-1",
            label: "Steam Sippers",
            icon: "🔥",
            cost: 100,
            grantWhen: () => state.money >= 100,
            onBuy: () => {
              setGovernorCap(85);
              addSteamSippers();
            },
          },
          {
            id: "governor-2",
            label: "Steam Burner",
            icon: "🔥",
            cost: 200,
            grantWhen: () => state.money >= 200,
            requires: "governor-1",
            onBuy: () => {
              setGovernorCap(100);
              addPipeCap();
            },
          },
          {
            id: "governor-3",
            label: "Steam Injectors",
            icon: "🔥",
            cost: 300,
            grantWhen: () => state.money >= 300,
            requires: "governor-2",
            onBuy: () => {
              setGovernorCap(150);
              addSteamInjectors();
            },
          },
          {
            id: "big-bangs",
            label: "Big Bangs",
            icon: "💥",
            cost: 200,
            grantWhen: () => state.money >= 200,
            onBuy: () => {
              state.bigBangs = true;
            },
          },
          {
            id: "golden-rocks",
            label: "Golden Rocks",
            icon: "🪨",
            cost: 75,
            grantWhen: () => state.money >= 75,
            onBuy: () => {
              state.goldenRocks = true;
            },
          },
          {
            id: "golden-boulders",
            label: "Golden Boulders",
            icon: "🪨",
            cost: 200,
            grantWhen: () => state.money >= 200,
            onBuy: () => {
              state.goldenBoulders = true;
            },
          },
          {
            id: "bunny-xing",
            label: "BunnyXing",
            icon: "🐰",
            cost: 75,
            grantWhen: () => state.money >= 75,
            onBuy: () => {
              bunnyXing = true;
            },
          },
        ];

        const grantedPowerups = new Set();
        const purchasedPowerups = new Set();

        // Award any powerup whose grant condition is now met (each only once).
        function grantPowerups() {
          if (
            !state.dynamiteUnlocked &&
            (state.money >= DYNAMITE_COST || state.dynamiteCount > 0)
          ) {
            state.dynamiteUnlocked = true;
            dyn.unlock();
            ensureDynamite();
          }
          for (const def of POWERUPS) {
            if (grantedPowerups.has(def.id)) continue;
            if (!def.debug) {
              if (def.requires && !purchasedPowerups.has(def.requires)) continue;
              if (!def.grantWhen()) continue;
            }
            grantedPowerups.add(def.id);
            powerups.add({
              id: def.id,
              label: def.label,
              icon: def.icon,
              cost: def.debug ? 0 : def.cost,
            });
          }
        }

        // Dynamite: a renewable consumable ($50 each, unlimited purchases).
        const DYNAMITE_COST = 50;

        // Renders the Buy Dynamite pill via the powerups framework so it shares
        // the uniform width, theme, and bank-driven availability. Re-added after
        // each purchase to keep the renewable shop entry available.
        function ensureDynamite() {
          if (state.dynamiteUnlocked && !powerups.has("dynamite")) {
            powerups.add({
              id: "dynamite",
              label: "Buy Dynamite",
              icon: "💣",
              cost: DYNAMITE_COST,
              unit: "$",
            });
          }
        }

        powerups.setBank(() => state.money);
        powerups.on((item) => {
          if (item.id === "dynamite") {
            state.money -= DYNAMITE_COST;
            moneyCounter.setValue(state.money);
            dyn.buy();
            powerups.refresh();
            ensureDynamite();
            return;
          }
          const def = POWERUPS.find((d) => d.id === item.id);
          if (!def) return;
          const cost = def.debug ? 0 : item.cost;
          state.money -= cost;
          moneyCounter.setValue(state.money);
          powerups.refresh();
          purchasedPowerups.add(def.id);
          if (def.onBuy) def.onBuy();
        });

        // Initial train position
        const initPose = follower.getPose();
        if (initPose) {
          train.mesh.position.copy(initPose.position);
          train.mesh.quaternion.setFromUnitVectors(
            follower.forwardAxis,
            initPose.forward,
          );
          train.mesh.updateMatrixWorld(true);
        }

        // Top-level frame update: dispatch to each game system in order
        train.updateFn = (dt) => {
          controls.update(dt);
          econ.update(dt);
          runner.update(dt);
          dyn.update(dt);
          fx.update(dt);
          bunnySys.update(dt);
          poseSync.update(dt);
          impacts.update(dt);
          rig.update(dt);
        };

        // Initial camera pose
        camCtrl.update({ mirror: false });
      }

      // Run
      setup(sim);
      sim.start();
    </script>
  </body>
</html>
