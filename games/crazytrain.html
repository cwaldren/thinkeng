<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazy Train</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111116;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #fff;
        pointer-events: none;
      }
    </style>

    <!-- 1. Import Map (Constant Across All Games) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "cannon-es": "/vendor/cannon-es.js",
          "engine/": "/engine/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <h1 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
        Crazy Train
      </h1>
      <p style="margin: 4px 0 0; font-size: 0.85rem; opacity: 0.7">
        <strong>W</strong> accelerate &bull; <strong>S</strong> decelerate &bull; no input coasts &bull; <strong>Space</strong> rear camera
      </p>
    </div>

    <script type="module">
      import * as THREE from "three";
      import * as CANNON from "cannon-es";
      import { Simulation } from "engine/core.js";
      import {
        createGround,
        createBox,
        createSphere,
        createRock,
      } from "engine/primitives.js";
      import {
        createTrain,
        createRailSegment,
        InfiniteTrack,
        TrackFollower,
        getLocalSpinePose,
        createFPSCounter,
      } from "engine/components.js";
      import {} from "engine/materials.js";
      import { Input } from "engine/input.js";
      import { createCameraControls } from "engine/cameraControls.js";
      import { createGauge, createMoneyCounter } from "engine/ui.js";
      import { createPowerups } from "engine/powerups.js";

      // Speed governor: caps max speed. governor.setCap(90), getCap(), etc.
      class Governor {
        constructor(capMph = 70) {
          this.enabled = true;
          this._capMph = capMph;
          this._capMps = capMph / 2.237;
        }
        setCap(mph) {
          this._capMph = mph;
          this._capMps = mph / 2.237;
          return this;
        }
        getCap() {
          return this._capMph;
        }
        getCapMps() {
          return this._capMps;
        }
        setEnabled(on) {
          this.enabled = !!on;
          return this;
        }
        enable() {
          return this.setEnabled(true);
        }
        disable() {
          return this.setEnabled(false);
        }
        limit(speedMps) {
          if (!this.enabled) return speedMps;
          return Math.min(speedMps, this._capMps);
        }
        apply(speedMps, deltaMps) {
          return this.limit(speedMps + deltaMps);
        }
      }

      // 2. Initialize Core Engine with Options
      const sim = new Simulation({
        gravity: [0, -9.81, 0],
        clearColor: 0x8ecae6,
        enableShadows: false,
      });

      // Active flying obstacles launched by collisions
      const activeFlyers = new Set();

      function rebaseActiveFlyers(origin, heading) {
        const ca = Math.cos(heading);
        const sa = Math.sin(heading);
        const qRebase = new CANNON.Quaternion();
        qRebase.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -heading);

        for (const flyer of activeFlyers) {
          const b = flyer.body;
          const dx = b.position.x - origin.x;
          const dz = b.position.z - origin.z;
          b.position.x = dx * ca + dz * sa;
          b.position.z = -dx * sa + dz * ca;
          b.quaternion = qRebase.mult(b.quaternion);

          const vx = b.velocity.x;
          const vz = b.velocity.z;
          b.velocity.x = vx * ca + vz * sa;
          b.velocity.z = -vx * sa + vz * ca;

          flyer.mesh.position.set(b.position.x, b.position.y, b.position.z);
          flyer.mesh.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
        }
      }

      function createSceneryRailSegment(simulation, opts = {}) {
        const seg = createRailSegment(simulation, opts);
        const group = seg.mesh;
        const { length = 40, radius = 0 } = opts;

        // Place random trees, rocks, and grass along the sides of the track
        const count = 24 + Math.floor(Math.random() * 10);
        const grassTransforms = [];

        for (let i = 0; i < count; i++) {
          const s = Math.random() * length;
          const local = getLocalSpinePose(radius, length, s);
          const perp = { x: -Math.sin(local.heading), z: Math.cos(local.heading) };

          // Keep scenery safely off the rails (at least 4.5m away)
          const side = Math.random() < 0.5 ? 1 : -1;
          const offset = 4.5 + Math.random() * 26;
          const x = local.position.x + perp.x * offset * side;
          const z = local.position.z + perp.z * offset * side;

          const rand = Math.random();
          if (rand < 0.28) {
            // Pine tree with varied natural foliage hues (deep pines, bright spring greens, olive/moss)
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);
            const scale = 0.8 + Math.random() * 0.7;
            treeGroup.scale.set(scale, scale, scale);

            const treePalettes = [
              { base: 0x1a4524, highlight: 0x245a30 }, // Deep forest pine
              { base: 0x286337, highlight: 0x367e47 }, // Classic evergreen
              { base: 0x3d7e32, highlight: 0x519e42 }, // Vibrant green
              { base: 0x4f8c3e, highlight: 0x65ab50 }, // Light spring green
              { base: 0x3b5930, highlight: 0x4c703e }, // Olive moss
            ];
            const pal = treePalettes[Math.floor(Math.random() * treePalettes.length)];

            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
            const foliageMat1 = new THREE.MeshStandardMaterial({ color: pal.base, roughness: 0.8 });
            const foliageMat2 = new THREE.MeshStandardMaterial({ color: pal.highlight, roughness: 0.8 });

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3, 6), trunkMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4, 6), foliageMat1);
            foliage1.position.y = 4.0;
            foliage1.castShadow = true;
            treeGroup.add(foliage1);

            const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(1.35, 3, 6), foliageMat2);
            foliage2.position.y = 5.6;
            foliage2.castShadow = true;
            treeGroup.add(foliage2);

            group.add(treeGroup);
          } else if (rand < 0.48) {
            // Rock
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x75787b, roughness: 0.9 });
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), rockMat);
            const sX = 0.8 + Math.random() * 1.4;
            const sY = 0.6 + Math.random() * 0.9;
            const sZ = 0.8 + Math.random() * 1.4;
            rock.scale.set(sX, sY, sZ);
            rock.position.set(x, sY * 0.6, z);
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            rock.castShadow = true;
            rock.receiveShadow = true;
            group.add(rock);
          } else {
            // Large lush grass patch - collect blade transforms for InstancedMesh
            const patchRadius = 2.0 + Math.random() * 2.2;
            const bladeCount = 35 + Math.floor(Math.random() * 20);

            for (let b = 0; b < bladeCount; b++) {
              const ang = Math.random() * Math.PI * 2;
              const dist = Math.sqrt(Math.random()) * patchRadius;
              const bx = x + Math.cos(ang) * dist;
              const bz = z + Math.sin(ang) * dist;
              const bHeight = 0.7 + Math.random() * 0.5;

              grassTransforms.push({
                x: bx,
                y: bHeight / 2,
                z: bz,
                rx: (Math.random() - 0.5) * 0.35,
                ry: Math.random() * Math.PI,
                rz: (Math.random() - 0.5) * 0.35,
                scale: bHeight,
              });
            }
          }
        }

        // Create single instanced mesh for all grass in this segment (1 draw call)
        if (grassTransforms.length > 0) {
          const grassGeo = new THREE.ConeGeometry(0.1, 1.0, 4);
          const grassMat = new THREE.MeshStandardMaterial({ color: 0x56a442, roughness: 0.7 });
          const instancedGrass = new THREE.InstancedMesh(grassGeo, grassMat, grassTransforms.length);
          const dummy = new THREE.Object3D();

          for (let i = 0; i < grassTransforms.length; i++) {
            const t = grassTransforms[i];
            dummy.position.set(t.x, t.y, t.z);
            dummy.rotation.set(t.rx, t.ry, t.rz);
            dummy.scale.set(1, t.scale, 1);
            dummy.updateMatrix();
            instancedGrass.setMatrixAt(i, dummy.matrix);
          }
          instancedGrass.instanceMatrix.needsUpdate = true;
          instancedGrass.castShadow = true;
          instancedGrass.receiveShadow = true;
          group.add(instancedGrass);
        }

        // Occasional on-track obstacles (fallen trees & track boulders)
        seg.obstacles = seg.obstacles || [];

        // Tiny rocks: extremely common, low mass, littered right on the rails
        const tinyCount = 2 + Math.floor(Math.random() * 3);
        const tinyMat = new THREE.MeshStandardMaterial({ color: 0x8a8e93, roughness: 0.9 });
        for (let i = 0; i < tinyCount; i++) {
          const tS = length * (0.05 + Math.random() * 0.9);
          const tPose = getLocalSpinePose(radius, length, tS);
          const edge = (Math.random() < 0.5 ? 1 : -1) * Math.random() * 0.7;
          const tiny = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 0), tinyMat);
          tiny.scale.set(
            0.6 + Math.random() * 0.9,
            0.55 + Math.random() * 0.7,
            0.6 + Math.random() * 0.9,
          );
          tiny.position.set(tPose.position.x, 0.28, tPose.position.z + edge);
          tiny.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          tiny.castShadow = true;
          tiny.receiveShadow = true;
          group.add(tiny);
          seg.obstacles.push({
            mesh: tiny,
            type: "tiny-rock",
            s: tS,
            hit: false,
          });
        }

        if (Math.random() < 0.65) {
          const obsS = length * (0.3 + Math.random() * 0.4);
          const localPose = getLocalSpinePose(radius, length, obsS);
          const randObs = Math.random();

          if (randObs < 0.33) {
            // Fallen Tree across the rails
            const logLen = 3.8 + Math.random() * 1.6;
            const logMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, roughness: 0.95 });
            const logMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, logLen, 8), logMat);
            logMesh.rotation.z = Math.PI / 2;
            logMesh.castShadow = true;
            logMesh.receiveShadow = true;

            const logGroup = new THREE.Group();
            logGroup.position.set(localPose.position.x, 0.55, localPose.position.z);
            logGroup.rotation.y = -localPose.heading + Math.PI / 2 + (Math.random() - 0.5) * 0.4;
            logGroup.add(logMesh);

            const branchMat = new THREE.MeshStandardMaterial({ color: 0x2e6035, roughness: 0.8 });
            const branch = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.8, 5), branchMat);
            branch.position.set(logLen / 2 - 0.2, 0.35, 0);
            branch.rotation.z = -Math.PI / 3;
            branch.castShadow = true;
            logGroup.add(branch);

            group.add(logGroup);
            seg.obstacles.push({
              mesh: logGroup,
              type: "log",
              logLen,
              s: obsS,
              hit: false,
            });
          } else if (randObs < 0.55) {
            // Regular Track Boulder
            const boulderMat = new THREE.MeshStandardMaterial({ color: 0x6e7278, roughness: 0.9 });
            const boulder = new THREE.Mesh(new THREE.DodecahedronGeometry(0.95, 0), boulderMat);
            boulder.scale.set(1.1 + Math.random() * 0.3, 0.75 + Math.random() * 0.25, 1.1 + Math.random() * 0.3);
            boulder.position.set(localPose.position.x, 0.85, localPose.position.z);
            boulder.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            boulder.castShadow = true;
            boulder.receiveShadow = true;

            group.add(boulder);
            seg.obstacles.push({
              mesh: boulder,
              type: "boulder",
              s: obsS,
              hit: false,
            });
          } else if (randObs < 0.63) {
            // Massive Giant Megalith Boulder (towering monolithic mountain rock)
            const giantGroup = new THREE.Group();
            giantGroup.position.set(localPose.position.x, 0, localPose.position.z);
            giantGroup.rotation.y = -localPose.heading + (Math.random() - 0.5) * 0.5;

            const giantMat = new THREE.MeshStandardMaterial({ color: 0x2a2d30, roughness: 0.95 });
            const mainRock = new THREE.Mesh(new THREE.DodecahedronGeometry(2.4, 0), giantMat);
            mainRock.scale.set(1.4, 1.6, 1.3);
            mainRock.position.set(0, 2.6, 0);
            mainRock.rotation.set(Math.random() * 0.5, Math.random() * Math.PI, 0);
            mainRock.castShadow = true;
            mainRock.receiveShadow = true;
            giantGroup.add(mainRock);

            // Side support boulders forming a massive barrier
            const subRock1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4, 0), giantMat);
            subRock1.position.set(-1.4, 1.3, 0.4);
            subRock1.castShadow = true;
            giantGroup.add(subRock1);

            const subRock2 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.3, 0), giantMat);
            subRock2.position.set(1.4, 1.2, -0.3);
            subRock2.castShadow = true;
            giantGroup.add(subRock2);

            group.add(giantGroup);
            seg.obstacles.push({
              mesh: giantGroup,
              type: "giant-boulder",
              s: obsS,
              hit: false,
            });
          }
          // else (randObs >= 0.63): no on-track obstacle in this spot
        }

        return seg;
      }

      // Train master-controller lever (3D overlay fixed to bottom-right of screen)
      function createLever() {
        const group = new THREE.Group();

        const baseMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.6, metalness: 0.3 });
        const armMat = new THREE.MeshStandardMaterial({ color: 0xcc8833, roughness: 0.5, metalness: 0.1 });
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 });

        // Stationary mount (flat cylinder pedestal)
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.35, 12), baseMat);
        base.position.y = 0.175;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        // Rotating pivot at the top of the pedestal
        const pivot = new THREE.Group();
        pivot.position.y = 0.35;

        // Lever arm + grip
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.7, 0.16), armMat);
        arm.position.y = 0.85;
        arm.castShadow = true;
        pivot.add(arm);

        const grip = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), gripMat);
        grip.position.y = 1.7;
        grip.castShadow = true;
        pivot.add(grip);

        group.add(pivot);
        group.userData.pivot = pivot;
        return group;
      }

      // 3. Game-Specific Setup (The LLM focus area)
      function setup(sim) {
        // FPS Counter
        createFPSCounter(sim);

        // Bright daylight lighting & atmosphere
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446644, 0.8);
        sim.scene.add(hemiLight);

        // Fog of war / Atmospheric horizon blending
        const skyColor = 0x8ecae6;
        sim.scene.fog = new THREE.Fog(skyColor, 50, 220);

        // Ground plane
        const ground = createGround(sim, { size: 2000, color: 0x4e8a4a, position: [0, -0.5, 0] });

        // Track generation with winding sections & high-speed straightaways (>= 10 segments)
        let straightawayCount = 6; // Start with a straight runway
        let windingCount = 0;

        const generateTrackCurve = (index) => {
          if (index < 6) return 0;

          // Currently in a designated straightaway
          if (straightawayCount > 0) {
            straightawayCount--;
            return 0;
          }

          // Transition between winding zones and straightaways
          if (windingCount <= 0) {
            if (Math.random() < 0.38) {
              // Trigger a long straightaway: 10 to 15 consecutive straight segments
              straightawayCount = 10 + Math.floor(Math.random() * 6);
              straightawayCount--;
              return 0;
            } else {
              // Trigger a winding zone: 12 to 18 curved/winding segments
              windingCount = 12 + Math.floor(Math.random() * 7);
            }
          }

          windingCount--;
          if (Math.random() < 0.25) return 0;
          const sign = Math.random() < 0.5 ? 1 : -1;
          return sign * (60 + Math.random() * 90);
        };

        // Infinite Track with straight & curved sections + roadside scenery
        const segmentLen = 40;
        const rearSegments = 3; // Keep 3 segments of track/scenery active behind the train
        const track = new InfiniteTrack(sim, {
          segmentLength: segmentLen,
          windowCount: 22,
          segmentFactory: createSceneryRailSegment,
          camera: null, // Camera managed directly by train
          curveGenerator: generateTrackCurve,
        });

        // Train & Controls (positioned past the rear buffer segments)
        const train = createTrain(sim, { position: [0, 0, 0] });
        const follower = new TrackFollower(track, train.mesh, {
          s: rearSegments * segmentLen + 10,
          speed: 0,
        });

        // Cowcatcher kinematic physics collider mounted on front of train
        const cowcatcherBody = new CANNON.Body({
          mass: 0,
          type: CANNON.Body.KINEMATIC,
          shape: new CANNON.Box(new CANNON.Vec3(1.4, 1.2, 1.2)),
        });
        sim.world.addBody(cowcatcherBody);

        // Input: shared key state + tap-to-accelerate on mobile
        const input = new Input();
        input.mapTouchToKey("KeyW");
        const keys = input.keys;

        let accelRate = 10; // m/s^2 acceleration (no max cap)
        const decelRate = accelRate * 2; // deceleration is twice acceleration (60 m/s^2)
        let currentSpeed = 0;
        let currentTilt = 0;
        let screenShake = 0;
        let leverAngle = 0;

        // Defenses: an object per equipped defense, each carrying a numeric
        // `valueMph`. Total defense = sum across all equipped defenses and is
        // used to offset any speed loss — impacts worth less than the total are
        // absorbed entirely, larger ones reduced by it.
        const defenses = [];
        function addDefense(def) {
          defenses.push(def);
        }
        function totalDefenseMph() {
          let total = 0;
          for (const def of defenses) total += def.valueMph;
          return total;
        }
        // Apply a speed loss (mps) offset by total defense. Returns nothing; fully
        // absorbed impacts cause no speed loss and no screen shake.
        function applyImpact(speedLossMps, shakeDelta, shakeCap) {
          const effMph = Math.max(0, speedLossMps * 2.237 - totalDefenseMph());
          if (effMph <= 0) return;
          currentSpeed = Math.max(0, currentSpeed - effMph / 2.237);
          screenShake = Math.min(shakeCap, screenShake + shakeDelta);
        }

        // Governor cutoff: once the cap is hit, throttle is neutral until W is released
        let throttleLatched = false;

        // Governor caps max speed (default 70 mph); adjust with governor.setCap()
        const governor = new Governor(70);

        // Speed gauge (circular semicircle, full scale = governor cap)
        let gauge = createGauge({ min: 0, max: governor.getCap(), unit: "MPH" });
        // Rebuild the gauge so its full scale tracks a raised governor cap.
        function rebuildGauge() {
          gauge.dispose();
          gauge = createGauge({ min: 0, max: governor.getCap(), unit: "MPH" });
        }

        // Money display below the top-left controls UI
        const moneyCounter = createMoneyCounter({
          left: "calc(50% + 130px)",
          bottom: "96px",
        });
        let money = 0;
        let autoThrottle = false;

        // Powerups: each is granted when its `grantWhen` condition is met, then
        // purchased by clicking its pill. `onBuy` applies the effect; the click is
        // gated by cost so money can never go negative.
        const POWERUPS = [
          {
            id: "auto-throttle", label: "Auto Throttle", icon: "↑", cost: 15,
            grantWhen: () => money >= 15,
            onBuy: () => { autoThrottle = true; },
          },
          {
            id: "cowcatcher", label: "Cowcatcher", icon: "▴", cost: 50,
            grantWhen: () => autoThrottle,
            onBuy: () => addCowcatcher(),
          },
          {
            id: "sandbox-1", label: "Better Accel I", icon: "▲", cost: 5,
            grantWhen: () => money >= 5,
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "sandbox-2", label: "Better Accel II", icon: "▲", cost: 50,
            grantWhen: () => money >= 50,
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "sandbox-3", label: "Better Accel III", icon: "▲", cost: 500,
            grantWhen: () => money >= 500,
            onBuy: () => { accelRate += 5; },
          },
          {
            id: "governor-1", label: "Governor I", icon: "◆", cost: 100,
            grantWhen: () => money >= 100,
            onBuy: () => setGovernorCap(85),
          },
          {
            id: "governor-2", label: "Governor II", icon: "◆", cost: 200,
            grantWhen: () => money >= 200,
            onBuy: () => setGovernorCap(100),
          },
          {
            id: "governor-3", label: "Governor III", icon: "◆", cost: 300,
            grantWhen: () => money >= 300,
            onBuy: () => setGovernorCap(150),
          },
        ];

        const powerups = createPowerups();
        const grantedPowerups = new Set();
        powerups.on((item) => {
          const def = POWERUPS.find((d) => d.id === item.id);
          if (!def) return;
          money -= item.cost;
          moneyCounter.setValue(money);
          if (def.onBuy) def.onBuy();
        });

        // Raise the governor cap (never lowering it) and keep the gauge in step.
        function setGovernorCap(newCapMph) {
          governor.setCap(Math.max(governor.getCap(), newCapMph));
          rebuildGauge();
        }
        // Award any powerup whose grant condition is now met (each only once).
        function grantPowerups() {
          for (const def of POWERUPS) {
            if (grantedPowerups.has(def.id)) continue;
            if (!def.grantWhen()) continue;
            grantedPowerups.add(def.id);
            powerups.add({
              id: def.id, label: def.label, icon: def.icon, cost: def.cost,
              isAffordable: () => money >= def.cost,
            });
          }
        }

        // Adds the wedge cowcatcher to the front of the train. The sloped face
        // tips obstacles up/away, which softens collisions (implemented in the
        // impact handling below).
        function addCowcatcher() {
          addDefense({ id: "cowcatcher", valueMph: 1 });
          const w = 0.85, d = 0.55, h = 0.75; // half-width side, half-depth, height
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([
            -w, 0,  d,  w, 0,  d, -w, 0, -d,  w, 0, -d, -w, h, -d,  w, h, -d,
          ]), 3));
          geo.setIndex([
            1, 3, 5, // right end
            0, 2, 4, // left end
            0, 1, 3, 0, 3, 2, // bottom
            2, 3, 5, 2, 5, 4, // front vertical
            0, 1, 5, 0, 5, 4, // slanted
          ]);
          geo.computeVertexNormals();
          const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.3, roughness: 0.6 }));
          mesh.rotation.y = -Math.PI / 2;
          mesh.position.set(3.6, 0.5, 0);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          train.mesh.add(mesh);
        }

        // Flying "$" signs that emit from the smokestack at top speed
        const moneySigns = [];
        let moneySpawnAccum = 0;
        const MONEY_SIGN_LIFETIME = 1.0;

        const moneyCanvas = document.createElement("canvas");
        moneyCanvas.width = moneyCanvas.height = 64;
        const moneyCtx = moneyCanvas.getContext("2d");
        moneyCtx.fillStyle = "#e7d984";
        moneyCtx.font = "bold 46px sans-serif";
        moneyCtx.textAlign = "center";
        moneyCtx.textBaseline = "middle";
        moneyCtx.fillText("$", 32, 32);
        const moneyTexture = new THREE.CanvasTexture(moneyCanvas);
        moneyTexture.needsUpdate = true;

        function spawnMoneySign() {
          const sprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
              map: moneyTexture,
              transparent: true,
              depthTest: false,
              opacity: 1,
            }),
          );
          // Spawn just below the smokestack top, child of the train so it travels with it.
          sprite.position.set(
            3.55,
            2.9 + Math.random() * 0.3,
            (Math.random() - 0.5) * 0.2,
          );
          sprite.scale.set(0.5, 0.5, 0.5);
          sprite.userData.age = 0;
          train.mesh.add(sprite);
          moneySigns.push(sprite);
        }

        // 3D master-controller lever (bottom-right screen overlay)
        const lever = createLever();
        sim.scene.add(lever);

        // Initial train position
        const initPose = follower.getPose();
        if (initPose) {
          train.mesh.position.copy(initPose.position);
          train.mesh.quaternion.setFromUnitVectors(follower.forwardAxis, initPose.forward);
          train.mesh.updateMatrixWorld(true);
        }

        // Camera rig with draggable FOV/offset sliders (bottom-right panel)
        const camCtrl = createCameraControls(sim, {
          mesh: train.mesh,
          fov: 60,
          offset: [-3.2, 5.4, 0],
          look: [2.0, 3.2, 0],
          visible: false,
        });

        train.updateFn = (dt, entity, simulation) => {
          // Master controller lever: W/S accelerate/decelerate, no input coasts.
          // Governor cutoff: at the cap the throttle latches to neutral and stays
          // dead until the player releases W (or lifts their finger on mobile).
          if (throttleLatched) {
            if (!keys.has("KeyW") && !keys.has("ArrowUp") && !autoThrottle) {
              throttleLatched = false;
            }
          } else if (autoThrottle || keys.has("KeyW") || keys.has("ArrowUp")) {
            // Auto Throttle pushes the lever up whenever below top speed, then
            // holds at the cap — just like a player mashing W.
            const next = currentSpeed + accelRate * dt;
            currentSpeed = governor.limit(next);
            if (autoThrottle && currentSpeed >= governor.getCapMps() - 1e-6) {
              currentSpeed = governor.getCapMps(); // hold exactly at the cap
            } else if (currentSpeed >= governor.getCapMps() - 1e-6) {
              throttleLatched = true; // reached the cap: cut off
            }
          } else if (keys.has("KeyS") || keys.has("ArrowDown")) {
            currentSpeed = Math.max(0, currentSpeed - decelRate * dt);
          }
          // else: neutral — maintain current velocity (coasting)
          follower.speed = currentSpeed;

          const speedMph = currentSpeed * 2.237;
          gauge.setValue(speedMph);

          // Earn $1/second while at full governor speed; stop counting below it.
          const atMaxSpeed = currentSpeed >= governor.getCapMps() - 1e-6;
          gauge.setMax(atMaxSpeed);
          if (atMaxSpeed) {
            money += dt * 5;
            moneyCounter.setValue(money);

            // Emit a "$" sign from the smokestack at a steady cadence
            moneySpawnAccum += dt;
            while (moneySpawnAccum >= 0.12) {
              moneySpawnAccum -= 0.12;
              spawnMoneySign();
            }
          }

          // Grant any powerup whose condition is now met
          grantPowerups();

          // Animate flying money signs upward and despawn them after 1s
          for (let i = moneySigns.length - 1; i >= 0; i--) {
            const sign = moneySigns[i];
            sign.userData.age += dt;
            const t = sign.userData.age / MONEY_SIGN_LIFETIME;
            sign.position.y += 2.5 * dt;
            sign.position.x += 0.6 * dt;
            sign.material.opacity = 1 - t;
            if (t >= 1) {
              train.mesh.remove(sign);
              sign.material.dispose();
              moneySigns.splice(i, 1);
            }
          }

          // Advance distance along track
          follower.s += follower.speed * dt;

          // Recycle segments while maintaining rear segment buffer behind train
          const advanceThreshold = (rearSegments + 1) * segmentLen;
          while (follower.s >= advanceThreshold) {
            follower.s -= segmentLen;
            const nextOrigin = track.segments[1]?.entryPose.position.clone();
            const nextHeading = track.segments[1]?.entryPose.heading || 0;

            track.advance();

            if (nextOrigin) {
              rebaseActiveFlyers(nextOrigin, nextHeading);
            }
          }

          // Update & sync active flying obstacles
          for (const flyer of activeFlyers) {
            flyer.mesh.position.set(flyer.body.position.x, flyer.body.position.y, flyer.body.position.z);
            flyer.mesh.quaternion.set(
              flyer.body.quaternion.x,
              flyer.body.quaternion.y,
              flyer.body.quaternion.z,
              flyer.body.quaternion.w,
            );
            flyer.lifetime -= dt;
            if (flyer.lifetime <= 0) {
              simulation.scene.remove(flyer.mesh);
              simulation.world.removeBody(flyer.body);
              flyer.mesh.traverse((child) => {
                if (child.isMesh) {
                  child.geometry?.dispose();
                  if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
                  else child.material?.dispose();
                }
              });
              activeFlyers.delete(flyer);
            }
          }

          // Sync train mesh to rebased track pose
          const pose = follower.getPose();
          if (pose) {
            entity.mesh.position.copy(pose.position);
            entity.mesh.quaternion.setFromUnitVectors(follower.forwardAxis, pose.forward);

            // Visual corner tilt: 0 tilt below 100 mph, increasing with speed above 100 mph
            let targetTilt = 0;
            if (speedMph > 100) {
              const poseAhead = track.getPoseAt(follower.s + 1.2);
              const poseBehind = track.getPoseAt(Math.max(0, follower.s - 1.2));
              if (poseAhead && poseBehind) {
                const dHeading = (poseAhead.heading - poseBehind.heading) / 2.4;
                const excessSpeed = speedMph - 100;
                targetTilt = -dHeading * (excessSpeed / 25.0);
                targetTilt = Math.max(-0.52, Math.min(0.52, targetTilt));
              }
            }
            currentTilt += (targetTilt - currentTilt) * Math.min(1, dt * 8);

            // Apply corner tilt along train's forward axis
            const rollQuat = new THREE.Quaternion().setFromAxisAngle(
              follower.forwardAxis,
              currentTilt,
            );
            entity.mesh.quaternion.multiply(rollQuat);
            entity.mesh.updateMatrixWorld(true);

            // Sync kinematic cowcatcher collider to front of locomotive
            const cowcatcherWorldPos = new THREE.Vector3(4.0, 0.85, 0).applyMatrix4(entity.mesh.matrixWorld);
            cowcatcherBody.position.set(cowcatcherWorldPos.x, cowcatcherWorldPos.y, cowcatcherWorldPos.z);
            cowcatcherBody.quaternion.set(
              entity.mesh.quaternion.x,
              entity.mesh.quaternion.y,
              entity.mesh.quaternion.z,
              entity.mesh.quaternion.w,
            );

            // Give kinematic collider forward/upward impulse velocity
            const fwdDir = follower.forwardAxis.clone().applyQuaternion(entity.mesh.quaternion);
            const impulseSpeed = follower.speed * 1.6 + 10;
            cowcatcherBody.velocity.set(
              fwdDir.x * impulseSpeed,
              follower.speed * 0.35 + 5,
              fwdDir.z * impulseSpeed,
            );

            // Impact detection: when locomotive cowcatcher reaches an obstacle, launch it with physics
            for (const sSeg of track.segments) {
              if (sSeg.obstacles) {
                for (const obs of sSeg.obstacles) {
                  if (!obs.hit && obs.mesh.parent) {
                    const obsWorldPos = new THREE.Vector3();
                    obs.mesh.getWorldPosition(obsWorldPos);
                    const dist = cowcatcherWorldPos.distanceTo(obsWorldPos);

                    if (dist < 3.0) {
                      obs.hit = true;

                      const obsWorldQuat = new THREE.Quaternion();
                      obs.mesh.getWorldQuaternion(obsWorldQuat);

                      // Detach from segment and promote to world simulation
                      obs.mesh.parent.remove(obs.mesh);

                      // Giant Megalith Boulder shatters into 4 smaller rocks on impact
                      if (obs.type === "giant-boulder") {
                        const shatterMat = new THREE.MeshStandardMaterial({ color: 0x2a2d30, roughness: 0.95 });
                        const shardOffsets = [
                          [-1.2, 1.0, 0.4],
                          [1.2, 1.0, -0.4],
                          [-0.4, 0.6, 1.2],
                          [0.4, 0.6, -1.2],
                        ];
                        const hitSpeed = follower.speed * 0.5;

                        for (const offset of shardOffsets) {
                          const rockMesh = new THREE.Mesh(
                            new THREE.DodecahedronGeometry(0.9, 0),
                            shatterMat,
                          );
                          rockMesh.scale.set(
                            0.9 + Math.random() * 0.4,
                            0.8 + Math.random() * 0.3,
                            0.9 + Math.random() * 0.4,
                          );
                          rockMesh.position.set(
                            obsWorldPos.x + offset[0],
                            obsWorldPos.y + offset[1],
                            obsWorldPos.z + offset[2],
                          );
                          rockMesh.rotation.set(
                            Math.random() * Math.PI,
                            Math.random() * Math.PI,
                            Math.random() * Math.PI,
                          );
                          rockMesh.castShadow = true;
                          rockMesh.receiveShadow = true;
                          simulation.scene.add(rockMesh);

                          const rockBody = new CANNON.Body({
                            mass: 600,
                            shape: new CANNON.Sphere(0.8),
                            linearDamping: 0.3,
                            angularDamping: 0.4,
                          });
                          rockBody.position.copy(rockMesh.position);

                          // Fan the shards outward and upward from the impact point
                          const shardDir = new CANNON.Vec3(
                            fwdDir.x + offset[0] * 0.4,
                            2.0 + Math.random() * 2.5,
                            fwdDir.z + offset[2] * 0.4,
                          );
                          shardDir.normalize();
                          rockBody.velocity.set(
                            shardDir.x * hitSpeed + fwdDir.z * (Math.random() - 0.5) * 10,
                            follower.speed * 0.3 + 1.5 + Math.random() * 2,
                            shardDir.z * hitSpeed - fwdDir.x * (Math.random() - 0.5) * 10,
                          );
                          rockBody.angularVelocity.set(
                            (Math.random() - 0.5) * 14,
                            (Math.random() - 0.5) * 14,
                            (Math.random() - 0.5) * 14,
                          );

                          simulation.world.addBody(rockBody);
                          activeFlyers.add({
                            mesh: rockMesh,
                            body: rockBody,
                            lifetime: 2.8,
                          });
                        }

                        // Giant Megalith Boulder takes off exactly 500 mph (min 0)
                        const effGiantMph = Math.max(0, 500 - totalDefenseMph());
                        currentSpeed = Math.max(0, currentSpeed - effGiantMph / 2.237);
                        screenShake = Math.min(1.4, screenShake + 1.2);
                        follower.speed = currentSpeed;
                        continue;
                      }

                      simulation.scene.add(obs.mesh);
                      obs.mesh.position.copy(obsWorldPos);
                      obs.mesh.quaternion.copy(obsWorldQuat);

                      let body;
                      if (obs.type === "log") {
                        body = new CANNON.Body({
                          mass: 400,
                          shape: new CANNON.Box(new CANNON.Vec3(obs.logLen / 2, 0.4, 0.4)),
                        });
                      } else if (obs.type === "tiny-rock") {
                        body = new CANNON.Body({
                          mass: 30,
                          shape: new CANNON.Sphere(0.3),
                          linearDamping: 0.2,
                          angularDamping: 0.3,
                        });
                      } else {
                        body = new CANNON.Body({
                          mass: 1200,
                          shape: new CANNON.Sphere(0.95),
                        });
                      }
                      body.position.set(obsWorldPos.x, obsWorldPos.y, obsWorldPos.z);
                      body.quaternion.set(obsWorldQuat.x, obsWorldQuat.y, obsWorldQuat.z, obsWorldQuat.w);

                      // Impulse scaled to obstacle mass & inertia
                      {
                        // Standard obstacles (logs and regular boulders) tumble dynamically
                        const lateralSide = (Math.random() < 0.5 ? 1 : -1) * (follower.speed * 0.4 + Math.random() * 8);
                        const hitSpeed = follower.speed * 0.9;
                        body.velocity.set(
                          fwdDir.x * hitSpeed + fwdDir.z * lateralSide,
                          follower.speed * 0.3 + 2 + Math.random() * 3,
                          fwdDir.z * hitSpeed - fwdDir.x * lateralSide,
                        );
                        body.angularVelocity.set(
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                        );
                      }

                      // Subtract velocity commensurate with obstacle mass & apply impact feedback
                      if (obs.type === "log") {
                        applyImpact(Math.max(5.0, currentSpeed * 0.22), 0.22, 0.35);
                      } else if (obs.type === "tiny-rock") {
                        // Tiny rocks: negligible impact, just a small rattle
                        applyImpact(Math.max(0.4, currentSpeed * 0.05), 0.08, 0.15);
                      } else {
                        applyImpact(Math.max(14.0, currentSpeed * 0.45), 0.55, 0.75);
                      }
                      follower.speed = currentSpeed;

                      simulation.world.addBody(body);
                      activeFlyers.add({
                        mesh: obs.mesh,
                        body,
                        lifetime: 2.8,
                      });
                    }
                  }
                }
              }
            }
          }

          // Center ground beneath the train
          if (ground?.mesh) {
            ground.mesh.position.x = entity.mesh.position.x;
            ground.mesh.position.z = entity.mesh.position.z;
          }

          // Update camera pose (Space toggles front/rear rig)
          const isRearView = keys.has("Space");
          camCtrl.update({ mirror: isRearView });

          // FOV scales exponentially with speed: 60° at rest → 80° at 250 mph
          const fovBase = camCtrl.state.fov;
          const speedRatio = Math.min(1, Math.max(0, speedMph / 250));
          simulation.camera.fov = fovBase * Math.pow(80 / fovBase, speedRatio);
          simulation.camera.updateProjectionMatrix();

          // Dynamic fog adjustment: bring fog closer in rear view to hide limited rear draw distance
          const targetFogNear = isRearView ? 15 : 50;
          const targetFogFar = isRearView ? 95 : 220;
          simulation.scene.fog.near += (targetFogNear - simulation.scene.fog.near) * Math.min(1, dt * 10);
          simulation.scene.fog.far += (targetFogFar - simulation.scene.fog.far) * Math.min(1, dt * 10);

          // Impact screen shake
          if (screenShake > 0.001) {
            simulation.camera.position.x += (Math.random() - 0.5) * screenShake;
            simulation.camera.position.y += (Math.random() - 0.5) * screenShake;
            screenShake *= Math.exp(-dt * 9.0);
          }

          // Master-controller lever: pinned to bottom-right of the screen
          const camQuat = simulation.camera.quaternion;
          const vRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camQuat);
          const vUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camQuat);
          const vFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);

          const leverDist = 7;
          const halfH = Math.tan((simulation.camera.fov * Math.PI) / 360) * leverDist;
          const halfW = halfH * simulation.camera.aspect;
          const nx = 0.73;
          const ny = -0.6;

          lever.position
            .copy(simulation.camera.position)
            .addScaledVector(vFwd, leverDist)
            .addScaledVector(vRight, nx * halfW)
            .addScaledVector(vUp, ny * halfH);
          lever.scale.setScalar(1.1);
          lever.lookAt(simulation.camera.position);
          lever.updateMatrixWorld(true);

          // Hide the accel lever in reverse view
          lever.visible = !isRearView;
          if (lever.visible) {
            // Tilt toward/away from the user based on throttle input.
            // When governor-cut off, the lever snaps back to neutral.
            let targetLever = 0;
            if (!throttleLatched && (keys.has("KeyW") || keys.has("ArrowUp"))) targetLever = -0.7; // into screen (away from user)
            else if (!throttleLatched && (keys.has("KeyS") || keys.has("ArrowDown"))) targetLever = 0.7; // toward user
            leverAngle += (targetLever - leverAngle) * Math.min(1, dt * 8);
            lever.userData.pivot.rotation.x = leverAngle;
          }
        };

        // Initial camera pose
        camCtrl.update({ mirror: false });
      }

      // Run
      setup(sim);
      sim.start();
    </script>
  </body>
</html>
