        // Spawn a dynamite in the cab and launch it forward in an arc. It flies
        // until it touches the ground, then despawns.
        function throwDynamite() {
          if (dynamiteCount <= 0) return;
          dynamiteCount--;
          updateDynamiteCounter();

          const ent = createDynamite(sim, {
            length: 2.4,
            position: [0, 0, 0],
            mass: 2,
          });
          const mesh = ent.mesh;
          const body = ent.body;

          const spawn = new THREE.Vector3(-2.6, 4.0, 0).applyMatrix4(
            train.mesh.matrixWorld,
          );
          mesh.position.copy(spawn);
          body.position.copy(spawn);
          body.quaternion.setFromEuler(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            0,
          );

          const fwd = follower.forwardAxis
            .clone()
            .applyQuaternion(train.mesh.quaternion);

          // Aim at the point on the track 2 segments ahead of the train
          const targetPose = track.getPoseAt(follower.s + 2 * segmentLen);
          const targetPos = targetPose
            ? targetPose.position
            : spawn.clone().addScaledVector(fwd, 2 * segmentLen);

          const aimDir = new THREE.Vector3(
            targetPos.x - spawn.x,
            0,
            targetPos.z - spawn.z,
          );
          if (aimDir.lengthSq() > 0.001) {
            aimDir.normalize();
          } else {
            aimDir.copy(fwd);
          }

          // Launch with a low, fast trajectory toward the track target ahead
          const launchSpeed = follower.speed + 35;
          body.velocity.set(aimDir.x * launchSpeed, 5, aimDir.z * launchSpeed);
          body.angularVelocity.set(
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
          );

          const dyn = {
            mesh,
            body,
            ent,
            landed: false,
            exploded: false,
            collided: false,
          };
          body.addEventListener("collide", () => {
            dyn.collided = true;
          });
          thrownDynamites.add(dyn);
        }

        // Shatters a Giant Megalith Boulder into smaller rock fragments
        // Monetary damage dealt by destroying a megalith scales with the cowcatcher
        // tier currently installed (a better cowcatcher reduces the cost).
        function megalithDamage() {
          if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) return 60;
          if (COWCATCHER_DEFENSE_IDS.has("big-cowcatcher")) return 70;
          if (COWCATCHER_DEFENSE_IDS.has("cowcatcher")) return 80;
          return MEGALITH_DAMAGE;
        }

        // Speed (mph) below which a megalith rolls aside instead of exploding,
        // based on the equipped cowcatcher tier. A better cowcatcher lets you
        // roll megaliths out of the way at higher speeds.
        function megalithRollThreshold() {
          if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) return 90;
          if (COWCATCHER_DEFENSE_IDS.has("big-cowcatcher")) return 70;
          if (COWCATCHER_DEFENSE_IDS.has("cowcatcher")) return 50;
          return 30;
        }

        // Megaliths show which outcome your current speed would trigger: black
        // means it'll be nudged aside (no penalty), deep red means it'd explode
        // and cost money. Colors blend smoothly, but only in a tight band around
        // the threshold so the signal stays readable.
        const MEGALITH_SAFE_COLOR = new THREE.Color(0x161616);
        const MEGALITH_DANGER_COLOR = new THREE.Color(0x8b0000);
        const MEGALITH_COLOR_BAND = 3; // mph transition width around the threshold
        function updateMegalithColors() {
          const speedMph = currentSpeed * 2.237;
          const threshold = megalithRollThreshold();
          const t = Math.max(
            0,
            Math.min(
              1,
              (speedMph - (threshold - MEGALITH_COLOR_BAND)) /
                (2 * MEGALITH_COLOR_BAND),
            ),
          );
          const target = MEGALITH_SAFE_COLOR.clone().lerp(
            MEGALITH_DANGER_COLOR,
            t,
          );
          for (const sSeg of track.segments) {
            if (!sSeg.obstacles) continue;
            for (const obs of sSeg.obstacles) {
              if (
                obs.type === "giant-boulder" &&
                obs.mat &&
                !obs.hit &&
                obs.mesh.parent
              ) {
                obs.mat.color.copy(target);
              }
            }
          }
        }

        // Promotes the megalith group to a physics body and knocks it sideways
        // with spin so it rolls off onto the shoulder (used for the low-speed
        // "roll out of the way" outcome). No money is charged.
        function rollMegalithAside(mesh, worldPos, worldQuat, fwdDir, speed) {
          sim.scene.add(mesh);
          mesh.position.copy(worldPos);
          mesh.quaternion.copy(worldQuat);

          const body = new CANNON.Body({
            mass: 40000,
            shape: new CANNON.Sphere(2.6),
            linearDamping: 0.7,
            angularDamping: 0.45,
          });
          body.position.set(worldPos.x, worldPos.y, worldPos.z);
          body.quaternion.set(
            worldQuat.x,
            worldQuat.y,
            worldQuat.z,
            worldQuat.w,
          );

          // Perpendicular (lateral) direction to the forward axis, in XZ plane.
          const lateralSide = Math.random() < 0.5 ? 1 : -1;
          const latX = -fwdDir.z * lateralSide;
          const latZ = fwdDir.x * lateralSide;
          const lateralSpeed = speed * 0.6 + 6 + Math.random() * 4;
          const fwdSpeed = speed * 0.2;

          // Pin to the ground: no vertical launch. The megalith slides/rolls
          // horizontally along the ground instead of bouncing into the air.
          const vx = fwdDir.x * fwdSpeed + latX * lateralSpeed;
          const vz = fwdDir.z * fwdSpeed + latZ * lateralSpeed;

          body.velocity.set(vx, 0, vz);

          // Give it a true rolling spin about the horizontal axis perpendicular
          // to its direction of travel (omega = v / radius), so it rolls like a
          // huge boulder rather than tumbling wildly.
          const speedMag = Math.abs(vx) + Math.abs(vz);
          const rollMag = speedMag > 0.01 ? speedMag / 2.6 : 0;
          body.angularVelocity.set(
            (speedMag > 0.01 ? -vz / speedMag : 0) * rollMag,
            0,
            (speedMag > 0.01 ? vx / speedMag : 0) * rollMag,
          );

          sim.world.addBody(body);
          activeFlyers.add({
            mesh,
            body,
            lifetime: 3.2,
          });
        }

        // Scripted hop for a bunny that leaves the rails: it makes 5 controlled
        // hops in the direction it faces (forward) with a small lateral drift to
        // clear into the forest. Always stays level (bottom down) and never
        // somersaults or hops backward. Despawns after the last hop lands.
        // Reward the player for stopping: grant $20 and show a "$" shooting up
        // from the bunny's head (in place of the first heart) as the bunny
        // immediately hops away streaming hearts. The bunny enters the hopping
        // set at once so it stays correctly rebased with the world.
        function rewardAndHopBunny(mesh, worldPos, worldQuat) {
          money += 20;
          moneyCounter.setValue(money);
          powerups.refresh();

          // The "$" takes the place of the first heart, so skip that first one.
          spawnBunnyMoneySign(worldPos);
          beginBunnyHop(mesh, worldPos, worldQuat, true);
        }

        // Adds the bunny to the world and begins its scripted hop. Hops in the
        // direction it faces so it clears into the forest rather than back toward
        // the train. `moneyAsFirstHeart` replaces the first heart with the "$" sign.
        function beginBunnyHop(mesh, worldPos, worldQuat, moneyAsFirstHeart = false) {
          sim.scene.add(mesh);
          mesh.position.copy(worldPos);
          mesh.quaternion.copy(worldQuat);

          const yaw = new THREE.Euler().setFromQuaternion(worldQuat, "YXZ").y;
          const hopYaw = yaw;
          // The bunny faces its local +Z; rotate that by its yaw to get the true
          // world direction it's looking, and hop along that.
          const dir = new THREE.Vector3(
            Math.sin(hopYaw),
            0,
            Math.cos(hopYaw),
          ).normalize();

          hoppingBunnies.add({
            mesh,
            yaw: hopYaw,
            dir,
            start: worldPos.clone(),
            t: 0,
            hopNum: 0,
            hops: 5,
            duration: 0.45,
            hopDist: 2.4,
            hopHeight: 1.4,
            heartAccum: 0,
            suppressFirstHeart: moneyAsFirstHeart,
          });
        }

        // Launches a struck bunny into the air with the train's momentum so its
        // collision bounce is visible before the screen cuts to black. Lives long
        // enough (well past the fade) to avoid popping out mid-sequence.
        function launchStruckBunny(mesh, worldPos, worldQuat, fwdDir, speed) {
          sim.scene.add(mesh);
          mesh.position.copy(worldPos);
          mesh.quaternion.copy(worldQuat);

          const body = new CANNON.Body({
            mass: 8,
            shape: new CANNON.Box(new CANNON.Vec3(0.45, 0.95, 0.6)),
            linearDamping: 0.15,
            angularDamping: 0.35,
          });
          body.position.set(worldPos.x, worldPos.y + 0.95, worldPos.z);

          // Whipped forward and up by the impact.
          body.velocity.set(
            fwdDir.x * (speed * 1.4 + 6),
            6 + speed * 0.4,
            fwdDir.z * (speed * 1.4 + 6),
          );
          body.angularVelocity.set(
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
          );

          sim.world.addBody(body);
          activeFlyers.add({
            mesh,
            body,
            lifetime: 8.0,
          });
        }

        // "You monster." — if you fail to slow down and run a bunny over, the
        // screen fades to black, the verdict fades in, then the game resets.
        let gameOver = false;
        function triggerYouMonster() {
          if (gameOver) return;
          gameOver = true;
          currentSpeed = 0;
          follower.speed = 0;

          const overlay = document.createElement("div");
          Object.assign(overlay.style, {
            position: "fixed",
            inset: "0",
            background: "#000",
            opacity: "0",
            pointerEvents: "none",
            zIndex: "200",
            transition: "opacity 0.6s ease",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
          });
          const txt = document.createElement("div");
          txt.textContent = "You monster! There's only one rule:";
          Object.assign(txt.style, {
            color: "#fff",
            fontFamily: "serif",
            fontSize: "3rem",
            fontWeight: "700",
            letterSpacing: "0.05em",
            textAlign: "center",
            opacity: "0",
            transition: "opacity 0.6s ease",
            userSelect: "none",
          });
          overlay.appendChild(txt);
          document.body.appendChild(overlay);

          // Fade the black in a quarter second after the strike, so the impact lands
          // first before the screen cuts to the verdict.
          setTimeout(() => (overlay.style.opacity = "1"), 250);
          // Line 1 fades in on the black, then fades out...
          setTimeout(() => (txt.style.opacity = "1"), 875);
          setTimeout(() => (txt.style.opacity = "0"), 1900);
          // ...and the second line takes its place before the reset.
          setTimeout(() => {
            txt.textContent = "Always stop for bunnies.";
            txt.style.opacity = "1";
          }, 2300);
          setTimeout(() => location.reload(), 3400);
        }

        function shatterMegalith(obsWorldPos, baseFwdDir, baseSpeed = 15) {
          const shardOffsets = [
            [-1.2, 1.0, 0.4],
            [1.2, 1.0, -0.4],
            [-0.4, 0.6, 1.2],
            [0.4, 0.6, -1.2],
          ];

          for (const offset of shardOffsets) {
            const rockMesh = new THREE.Mesh(sharedShardGeo, sharedGiantMat);
            rockMesh.scale.set(
              0.9 + Math.random() * 0.4,
              0.8 + Math.random() * 0.3,
              0.9 + Math.random() * 0.4,
            );
            rockMesh.position.set(
              obsWorldPos.x + offset[0],
              obsWorldPos.y + offset[1],
              obsWorldPos.z + offset[2],
            );
            rockMesh.rotation.set(
              Math.random() * Math.PI,
              Math.random() * Math.PI,
              Math.random() * Math.PI,
            );
            sim.scene.add(rockMesh);

            const rockBody = new CANNON.Body({
              mass: 600,
              shape: new CANNON.Sphere(0.8),
              linearDamping: 0.3,
              angularDamping: 0.4,
            });
            rockBody.position.copy(rockMesh.position);

            // Fan the shards outward and upward from the impact point
            const shardDir = new CANNON.Vec3(
              baseFwdDir.x + offset[0] * 0.4,
              2.0 + Math.random() * 2.5,
              baseFwdDir.z + offset[2] * 0.4,
            );
            shardDir.normalize();
            rockBody.velocity.set(
              shardDir.x * baseSpeed +
                baseFwdDir.z * (Math.random() - 0.5) * 10,
              follower.speed * 0.3 + 1.5 + Math.random() * 2,
              shardDir.z * baseSpeed -
                baseFwdDir.x * (Math.random() - 0.5) * 10,
            );
            rockBody.angularVelocity.set(
              (Math.random() - 0.5) * 14,
              (Math.random() - 0.5) * 14,
              (Math.random() - 0.5) * 14,
            );

            sim.world.addBody(rockBody);
            activeFlyers.add({
              mesh: rockMesh,
              body: rockBody,
              lifetime: 2.8,
            });
          }
        }

        // Spawns expanding orange explosion sphere(s) for 200ms and shatters nearby Megaliths.
        // With Big Bangs, renders 3 spheres and a larger blast radius.
        function spawnExplosion(pos) {
          const count = bigBangs ? 3 : 1;
          const maxRadius = bigBangs ? 14.0 : 9.0;
          const duration = 0.2; // 200ms
          const geo = new THREE.SphereGeometry(1, 24, 18);
          const mat = new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0xff4400,
            emissiveIntensity: 0.9,
            roughness: 0.4,
            transparent: true,
            opacity: 0.9,
          });
          const baseY = Math.max(pos.y, 0.5);

          for (let i = 0; i < count; i++) {
            const mesh = new THREE.Mesh(geo, mat);
            let px = pos.x,
              py = baseY,
              pz = pos.z;
            // Sphere size and start delay: with Big Bangs, vary each sphere's
            // radius and stagger them 100ms apart for a more interesting blast.
            const radius = bigBangs
              ? maxRadius * [1.0, 0.7, 0.85][i]
              : maxRadius;
            const delay = bigBangs ? i * 0.1 : 0;
            if (bigBangs) {
              // Spread the three spheres outward along the forward axis and up.
              const off = i - 1; // -1, 0, 1
              px = pos.x + off * 3.0;
              py = baseY + Math.abs(off) * 1.4;
            }
            mesh.position.set(px, py, pz);
            mesh.scale.setScalar(0.1);
            sim.scene.add(mesh);

            const expl = {
              mesh,
              age: 0,
              delay,
              duration,
              maxRadius: radius,
            };
            activeExplosions.add(expl);
          }

          // Check for Megaliths and boulders in blast radius
          const fwdDir = follower.forwardAxis
            .clone()
            .applyQuaternion(train.mesh.quaternion);
          for (const sSeg of track.segments) {
            if (sSeg.obstacles) {
              for (const obs of sSeg.obstacles) {
                if (
                  !obs.hit &&
                  obs.mesh.parent &&
                  (obs.type === "giant-boulder" || obs.type === "boulder")
                ) {
                  const obsWorldPos = new THREE.Vector3();
                  obs.mesh.getWorldPosition(obsWorldPos);
                  if (pos.distanceTo(obsWorldPos) <= maxRadius + 3.0) {
                    obs.hit = true;
                    obs.mesh.parent.remove(obs.mesh);
                    if (obs.type === "giant-boulder") {
                      shatterMegalith(
                        obsWorldPos,
                        fwdDir,
                        Math.max(16, follower.speed * 0.5),
                      );
                    }
                  }
                }
              }
            }
          }
        }

        // Raise the governor cap (never lowering it) and keep the gauge in step.
        function setGovernorCap(newCapMph) {
          governor.setCap(Math.max(governor.getCap(), newCapMph));
          rebuildGauge();
        }
        // Award any powerup whose grant condition is now met (each only once).
        function grantPowerups() {
          if (
            !dynamiteUnlocked &&
            (money >= DYNAMITE_COST || dynamiteCount > 0)
          ) {
            dynamiteUnlocked = true;
            ensureDynamite();
            updateDynamiteCounter();
          }
          for (const def of POWERUPS) {
            if (grantedPowerups.has(def.id)) continue;
            if (def.requires && !purchasedPowerups.has(def.requires)) continue;
            if (!def.grantWhen()) continue;
            grantedPowerups.add(def.id);
            powerups.add({
              id: def.id,
              label: def.label,
              icon: def.icon,
              cost: def.cost,
            });
          }
        }

        // Renders the wedge cowcatcher at the front of the train and applies its
        // defense. Upgrades replace the previous one with a larger one. The sloped
        // teeth tip obstacles up/away, softening collisions.
        let cowcatcherEntity = null;
        const COWCATCHER_DEFENSE_IDS = new Set();
        function setCowcatcherTier({ defenseId, valueMph, scale }) {
          // Swap in the new defense, dropping any prior cowcatcher-class one.
          for (const id of COWCATCHER_DEFENSE_IDS) removeDefense(id);
          COWCATCHER_DEFENSE_IDS.clear();
          addDefense({ id: defenseId, valueMph });
          COWCATCHER_DEFENSE_IDS.add(defenseId);

          // Replace the existing cowcatcher with a larger one.
          if (cowcatcherEntity) {
            train.mesh.remove(cowcatcherEntity.mesh);
            sim.removeEntity(cowcatcherEntity);
            cowcatcherEntity = null;
          }
          const cowcatcher = createCowcatcher(sim, {
            color: 0x222b33,
            width: 0.32 * scale,
            gap: 0.16 * scale,
            depth: 1.2 * scale,
            height: 0.75 * scale,
            position: [4.1, 0.5, 0],
            rotation: [0, -Math.PI / 2 - Math.PI, 0],
          });
          train.mesh.add(cowcatcher.mesh);
          cowcatcherEntity = cowcatcher;
        }

        // Flying "$" signs that emit from the smokestack at top speed
        const moneySigns = [];
        let moneySpawnAccum = 0;
        const MONEY_SIGN_LIFETIME = 1.0;

        const moneyCanvas = document.createElement("canvas");
        moneyCanvas.width = moneyCanvas.height = 64;
        const moneyCtx = moneyCanvas.getContext("2d");
        moneyCtx.fillStyle = "#e7d984";
        moneyCtx.font = "bold 46px sans-serif";
        moneyCtx.textAlign = "center";
        moneyCtx.textBaseline = "middle";
        moneyCtx.fillText("$", 32, 32);
        const moneyTexture = new THREE.CanvasTexture(moneyCanvas);
        moneyTexture.needsUpdate = true;

        function spawnMoneySign() {
          const sprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
              map: moneyTexture,
              transparent: true,
              depthTest: false,
              opacity: 1,
            }),
          );
          // Spawn just below the smokestack top, child of the train so it travels with it.
          sprite.position.set(
            3.55,
            2.9 + Math.random() * 0.3,
            (Math.random() - 0.5) * 0.2,
          );
          sprite.scale.set(0.5, 0.5, 0.5);
          sprite.userData.age = 0;
          train.mesh.add(sprite);
          moneySigns.push(sprite);
        }

        // Red 3D hearts that emit from a hopping bunny's head and float upward,
        // matching the smokestack "$" sign style. They use the same sculpted
        // heart contour as the heart primitive, rising above the bunny and
        // gently shrinking as they fade.
        const bunnyHearts = [];
        const HEART_LIFETIME = 1.0;

        function spawnBunnyHeart(position, yaw) {
          const heartM = createHeartMaterial({
            color: 0xff3344,
            roughness: 0.3,
            metalness: 0.1,
          });
          heartM.transparent = true;
          heartM.opacity = 1;
          const heart = createHeartMesh({
            scale: [0.84, 0.84, 0.84],
            material: heartM,
          });
          heart.position.copy(position);
          heart.position.y += 1.5; // above the bunny's head
          heart.userData.age = 0;
          heart.userData.yaw = yaw;
          // The bunny hops away from the train, so face the heart's front (+Z)
          // back toward the train (the opposite of the hop direction).
          heart.rotation.y = yaw + Math.PI;
          sim.scene.add(heart);
          bunnyHearts.push(heart);
        }

        // A "$" sprite that shoots straight up from the bunny's head in world
        // space (not attached to the train), then fades. Used to flash the $20
        // reward for stopping before the bunny hops away.
        const bunnyMoneySigns = [];
        const BUNNY_MONEY_LIFETIME = 1.0;

        function spawnBunnyMoneySign(position) {
          const sprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
              map: moneyTexture,
              transparent: true,
              depthTest: false,
              opacity: 1,
            }),
          );
          sprite.position.set(position.x, position.y + 1.6, position.z);
          sprite.scale.set(2.8, 2.8, 2.8);
          sprite.userData.age = 0;
          sim.scene.add(sprite);
          bunnyMoneySigns.push(sprite);
        }

        // Red "-$X" that flashes at dead-center screen and flies up like the
        // smokestack money, then fades. Used for monetary damage (e.g. megaliths).
        const MEGALITH_DAMAGE = 100;
        function spawnDamageSign(amount = MEGALITH_DAMAGE) {
          const el = document.createElement("div");
          el.textContent = `-$${amount}`;
          Object.assign(el.style, {
            position: "fixed",
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            color: "#ff4444",
            fontFamily: "monospace, sans-serif",
            fontSize: "2.4rem",
            fontWeight: "900",
            textShadow: "0 0 12px rgba(255,0,0,0.7)",
            pointerEvents: "none",
            zIndex: "120",
            userSelect: "none",
            willChange: "transform, opacity",
          });
          document.body.appendChild(el);
          el.animate(
            [
              { transform: "translate(-50%, -50%)", opacity: 1 },
              { transform: "translate(-50%, -90%)", opacity: 0 },
            ],
            { duration: 1000, easing: "ease-out" },
          ).onfinish = () => el.remove();
        }

        // 3D master-controller lever (bottom-right screen overlay)
        const lever = createLever();
        sim.scene.add(lever);

        // Initial train position
        const initPose = follower.getPose();
        if (initPose) {
          train.mesh.position.copy(initPose.position);
          train.mesh.quaternion.setFromUnitVectors(
            follower.forwardAxis,
            initPose.forward,
          );
          train.mesh.updateMatrixWorld(true);
        }

        // Camera rig with draggable FOV/offset sliders (bottom-right panel)
        const camCtrl = createCameraControls(sim, {
          mesh: train.mesh,
          fov: 60,
          offset: [-3.2, 5.4, 0],
          look: [2.0, 3.2, 0],
          visible: false,
        });

        // Pre-allocated scratch objects for update loop to prevent GC pauses
        const _invMat = new THREE.Matrix4();
        const _obsWorldPos = new THREE.Vector3();
        const _obsWorldQuat = new THREE.Quaternion();
        const _rearCamPos = new THREE.Vector3();
        const _rearCamLook = new THREE.Vector3();
        const _cabCamPos = new THREE.Vector3();
        const _cabCamLook = new THREE.Vector3();
        const _cowcatcherWorldPos = new THREE.Vector3();
        const _rollQuat = new THREE.Quaternion();
        const _fwdDir = new THREE.Vector3();
        const _levelAxis = new THREE.Vector3(0, 1, 0);
        const _frontLocal = new THREE.Vector3(4.0, 0.85, 0);

        train.updateFn = (dt, entity, simulation) => {
          const isRearView = keys.has("Space");

          // Master controller lever: W (or tap) accelerates, no W decelerates.
          const throttling = keys.has("KeyW") || keys.has("ArrowUp");
          if (throttling) {
            const next = currentSpeed + accelRate * dt;
            currentSpeed = governor.limit(next);
          } else {
            currentSpeed = Math.max(0, currentSpeed - decelRate * dt);
          }
          follower.speed = currentSpeed;

          const speedMph = currentSpeed * 2.237;
          gauge.setValue(speedMph);

          // Red threshold mark follows the current boulder-damage threshold.
          gauge.setThreshold(megalithRollThreshold());

          // Money is earned flat at 1/s below top speed, and scales with speed
          // once at top speed. The smokestack emits one "$" per dollar earned.
          // When the train is stopped, no money is earned (and no smoke signs).
          const atMaxSpeed = currentSpeed >= governor.getCapMps() - 1e-6;
          gauge.setMax(atMaxSpeed);
          const moving = currentSpeed > 0.22; // ~0.5 mph
          const moneyRate = !moving ? 0 : atMaxSpeed ? speedMph * 0.14 : 1.0;
          money += dt * moneyRate;
          moneyCounter.setValue(money);
          powerups.refresh();

          // Emit a "$" sign from the smokestack, one per dollar earned
          moneySpawnAccum += dt * moneyRate;
          while (moneySpawnAccum >= 1) {
            moneySpawnAccum -= 1;
            spawnMoneySign();
          }

          // Grant any powerup whose condition is now met
          grantPowerups();

          // Tint megaliths by whether the current speed would nudge or cost money
          updateMegalithColors();

          // Animate flying money signs upward and despawn them after 1s
          for (let i = moneySigns.length - 1; i >= 0; i--) {
            const sign = moneySigns[i];
            sign.userData.age += dt;
            const t = sign.userData.age / MONEY_SIGN_LIFETIME;
            sign.position.y += 2.5 * dt;
            sign.position.x += 0.6 * dt;
            sign.material.opacity = 1 - t;
            if (t >= 1) {
              train.mesh.remove(sign);
              sign.material.dispose();
              moneySigns.splice(i, 1);
            }
          }

          // Advance distance along track
          follower.s += follower.speed * dt;

          // Recycle segments while maintaining rear segment buffer behind train
          const advanceThreshold = (rearSegments + 1) * segmentLen;
          while (follower.s >= advanceThreshold) {
            follower.s -= segmentLen;
            const nextOrigin = track.segments[1]?.entryPose.position.clone();
            const nextHeading = track.segments[1]?.entryPose.heading || 0;

            track.advance();

            if (nextOrigin) {
              rebaseItems(activeFlyers, nextOrigin, nextHeading);
              rebaseItems(thrownDynamites, nextOrigin, nextHeading);
              rebaseItems(activeExplosions, nextOrigin, nextHeading);

              // Rebase hopping bunnies analytically
              const ca = Math.cos(nextHeading);
              const sa = Math.sin(nextHeading);

              for (const bunny of hoppingBunnies) {
                const dx = bunny.start.x - nextOrigin.x;
                const dz = bunny.start.z - nextOrigin.z;

                // Shift the analytical start position backward
                bunny.start.x = dx * ca + dz * sa;
                bunny.start.z = -dx * sa + dz * ca;

                // Rotate the trajectory and facing yaw to match the new segment
                bunny.yaw -= nextHeading;
                bunny.dir.set(Math.sin(bunny.yaw), 0, Math.cos(bunny.yaw)).normalize();
              }
            }
          }

          // Sync & despawn thrown dynamite sticks (spawn explosion on ground contact)
          for (const dyn of thrownDynamites) {
            dyn.mesh.position.set(
              dyn.body.position.x,
              dyn.body.position.y,
              dyn.body.position.z,
            );
            dyn.mesh.quaternion.set(
              dyn.body.quaternion.x,
              dyn.body.quaternion.y,
              dyn.body.quaternion.z,
              dyn.body.quaternion.w,
            );

            // Megalith collision is checked EVERY frame regardless of altitude, so
            // a fast, flat-thrown stick can't tunnel straight through a megalith
            // after merely grazing the ground. Uses horizontal distance so a low
            // stick still clips the megalith's measured footprint.
            let hitMegalith = false;
            if (!dyn.exploded) {
              for (const sSeg of track.segments) {
                if (sSeg.obstacles) {
                  for (const obs of sSeg.obstacles) {
                    if (
                      !obs.hit &&
                      obs.mesh.parent &&
                      (obs.type === "giant-boulder" || obs.type === "boulder")
                    ) {
                      const obsWorldPos = new THREE.Vector3();
                      obs.mesh.getWorldPosition(obsWorldPos);
                      const contactRadius = obs.contactRadius ?? 3.6;
                      const dx = dyn.body.position.x - obsWorldPos.x;
                      const dz = dyn.body.position.z - obsWorldPos.z;
                      if (dx * dx + dz * dz < contactRadius * contactRadius) {
                        dyn.exploded = true;
                        spawnExplosion(dyn.body.position);
                        simulation.removeEntity(dyn.ent);
                        thrownDynamites.delete(dyn);
                        hitMegalith = true;
                        break;
                      }
                    }
                  }
                }
                if (hitMegalith) break;
              }
            }
            if (hitMegalith) continue;

            // Land on the ground: explode shortly after contact
            if (dyn.body.position.y <= 0.3) {
              dyn.landed = true;
            }
            if (dyn.collided) {
              dyn.landed = true;
            }
            if (dyn.landed) {
              spawnExplosion(dyn.body.position);
              simulation.removeEntity(dyn.ent);
              thrownDynamites.delete(dyn);
            }
          }

          // Animate & despawn explosion spheres (expand to large radius in 200ms)
          for (const expl of activeExplosions) {
            expl.age += dt;
            const progress = (expl.age - (expl.delay ?? 0)) / expl.duration;
            if (expl.age >= (expl.delay ?? 0) + expl.duration) {
              simulation.scene.remove(expl.mesh);
              expl.mesh.geometry?.dispose();
              expl.mesh.material?.dispose();
              activeExplosions.delete(expl);
            } else if (progress > 0) {
              const currentScale =
                0.1 +
                (expl.maxRadius - 0.1) * Math.sin((progress * Math.PI) / 2);
              expl.mesh.scale.setScalar(currentScale);
              expl.mesh.material.opacity = 0.9 * (1 - progress * 0.7);
            }
          }

          // Update & sync active flying obstacles
          for (const flyer of activeFlyers) {
            flyer.mesh.position.set(
              flyer.body.position.x,
              flyer.body.position.y,
              flyer.body.position.z,
            );
            if (flyer.level) {
              // Keep the bunny's feet planted toward the ground; only yaw spins.
              flyer.mesh.quaternion.setFromAxisAngle(
                _levelAxis,
                flyer.yaw,
              );
            } else {
              flyer.mesh.quaternion.set(
                flyer.body.quaternion.x,
                flyer.body.quaternion.y,
                flyer.body.quaternion.z,
                flyer.body.quaternion.w,
              );
            }
            flyer.lifetime -= dt;
            if (flyer.lifetime <= 0) {
              simulation.scene.remove(flyer.mesh);
              simulation.world.removeBody(flyer.body);
              flyer.mesh.traverse((child) => {
                if (child.isMesh) {
                  child.geometry?.dispose();
                  if (Array.isArray(child.material))
                    child.material.forEach((m) => m.dispose());
                  else child.material?.dispose();
                }
              });
              activeFlyers.delete(flyer);
            }
          }

          // Drive the hopped bunnies: each is a parabolic arc in its facing
          // direction. On landing it hops again until it has made 5 hops, then
          // it despawns.
          for (const bunny of hoppingBunnies) {
            bunny.t += dt;
            const p = Math.min(1, bunny.t / bunny.duration);
            const end = bunny.start.clone().addScaledVector(bunny.dir, bunny.hopDist);
            bunny.mesh.position.set(
              bunny.start.x + (end.x - bunny.start.x) * p,
              4 * bunny.hopHeight * p * (1 - p),
              bunny.start.z + (end.z - bunny.start.z) * p,
            );
            bunny.mesh.quaternion.setFromAxisAngle(_levelAxis, bunny.yaw);

            // Emit a red heart above the bunny's head on walk away, roughly
            // every hop-blink, floating up as the bunny hops into the forest.
            bunny.heartAccum += dt;
            while (bunny.heartAccum >= 0.22) {
              bunny.heartAccum -= 0.22;
              // The reward "$" replaces the first heart, so skip it.
              if (bunny.suppressFirstHeart) {
                bunny.suppressFirstHeart = false;
                continue;
              }
              spawnBunnyHeart(bunny.mesh.position, bunny.yaw);
            }

            if (bunny.t >= bunny.duration) {
              bunny.hopNum++;
              if (bunny.hopNum >= bunny.hops) {
                sim.scene.remove(bunny.mesh);
                hoppingBunnies.delete(bunny);
              } else {
                // Next hop: tighter and a touch lower.
                bunny.start.copy(end);
                bunny.t = 0;
                bunny.hopHeight *= 0.82;
                bunny.duration = Math.max(0.3, bunny.duration * 0.85);
              }
            }
          }

          // Animate the hopping bunny's hearts: rise straight up, gently wobble
          // in yaw, shrink, and fade before despawning.
          for (let i = bunnyHearts.length - 1; i >= 0; i--) {
            const heart = bunnyHearts[i];
            heart.userData.age += dt;
            const t = heart.userData.age / HEART_LIFETIME;
            heart.position.y += 2.2 * dt;
            heart.rotation.y = heart.userData.yaw + Math.PI + t * 0.8;
            const s = 0.84 * (1 - t * 0.55);
            heart.scale.setScalar(s);
            heart.material.opacity = 1 - t;
            if (t >= 1) {
              sim.scene.remove(heart);
              heart.material.dispose();
              bunnyHearts.splice(i, 1);
            }
          }

          // Animate the bunny's reward "$" signs: shoot straight up and fade.
          for (let i = bunnyMoneySigns.length - 1; i >= 0; i--) {
            const sign = bunnyMoneySigns[i];
            sign.userData.age += dt;
            const t = sign.userData.age / BUNNY_MONEY_LIFETIME;
            sign.position.y += 3.0 * dt;
            sign.material.opacity = 1 - t;
            if (t >= 1) {
              sim.scene.remove(sign);
              sign.material.dispose();
              bunnyMoneySigns.splice(i, 1);
            }
          }

          // Sync train mesh to rebased track pose
          const pose = follower.getPose();
          if (pose) {
            entity.mesh.position.copy(pose.position);
            entity.mesh.quaternion.setFromUnitVectors(
              follower.forwardAxis,
              pose.forward,
            );

            // Track curvature ahead/behind for train visual tilt
            const poseAhead = track.getPoseAt(follower.s + 1.6);
            const poseBehind = track.getPoseAt(Math.max(0, follower.s - 1.6));
            let dHeading = 0;
            if (poseAhead && poseBehind) {
              let dh = poseAhead.heading - poseBehind.heading;
              dh = Math.atan2(Math.sin(dh), Math.cos(dh));
              dHeading = dh / 3.2;
            }

            // Sample track curve ahead to look around upcoming bends without matrix lag
            const aheadDist = 26;
            const lookPoseAhead = track.getPoseAt(follower.s + aheadDist);
            let curveLateralAhead = 0;
            if (lookPoseAhead && !isRearView) {
              const dx = lookPoseAhead.position.x - pose.position.x;
              const dz = lookPoseAhead.position.z - pose.position.z;
              // Local +Z lateral offset in train reference frame: cross(forward, up) = (-fwd.z, 0, fwd.x)
              curveLateralAhead = -dx * pose.forward.z + dz * pose.forward.x;
            }

            // Dynamic camera look-ahead aiming and lateral lean to gently see around corners
            const targetLookZ = Math.max(
              -3.0,
              Math.min(3.0, curveLateralAhead * 0.25),
            );
            const targetOffsetZ = -Math.max(
              -1.0,
              Math.min(1.0, curveLateralAhead * 0.08),
            );
            currentCameraLookZ +=
              (targetLookZ - currentCameraLookZ) * Math.min(1, dt * 4.5);
            currentCameraOffsetZ +=
              (targetOffsetZ - currentCameraOffsetZ) * Math.min(1, dt * 4.5);

            camCtrl.state.offset.z = currentCameraOffsetZ;
            camCtrl.state.look.z = currentCameraLookZ;

            // Visual corner tilt on train: starts at 50 mph and grows sharply with
            // speed, so the train leans harder into corners the faster it goes.
            let targetTilt = 0;
            if (speedMph > 50) {
              const excessSpeed = speedMph - 50;
              targetTilt = -dHeading * (excessSpeed / 15.0);
              targetTilt = Math.max(-0.9, Math.min(0.9, targetTilt));
            }
            currentTilt += (targetTilt - currentTilt) * Math.min(1, dt * 8);

            // Apply corner tilt along train's forward axis
            _rollQuat.setFromAxisAngle(follower.forwardAxis, currentTilt);
            entity.mesh.quaternion.multiply(_rollQuat);
            entity.mesh.updateMatrixWorld(true);

            // Sync kinematic cowcatcher collider to front of locomotive
            _cowcatcherWorldPos
              .copy(_frontLocal)
              .applyMatrix4(entity.mesh.matrixWorld);
            cowcatcherBody.position.set(
              _cowcatcherWorldPos.x,
              _cowcatcherWorldPos.y,
              _cowcatcherWorldPos.z,
            );
            cowcatcherBody.quaternion.set(
              entity.mesh.quaternion.x,
              entity.mesh.quaternion.y,
              entity.mesh.quaternion.z,
              entity.mesh.quaternion.w,
            );

            // Give kinematic collider forward/upward impulse velocity
            _fwdDir
              .copy(follower.forwardAxis)
              .applyQuaternion(entity.mesh.quaternion);
            const impulseSpeed = follower.speed * 1.6 + 10;
            cowcatcherBody.velocity.set(
              _fwdDir.x * impulseSpeed,
              follower.speed * 0.35 + 5,
              _fwdDir.z * impulseSpeed,
            );

            // Impact detection: when locomotive cowcatcher reaches an obstacle, launch it with physics
            for (const sSeg of track.segments) {
              if (sSeg.obstacles) {
                for (const obs of sSeg.obstacles) {
                  if (!obs.hit && obs.mesh.parent) {
                    obs.mesh.getWorldPosition(_obsWorldPos);
                    const dist = _cowcatcherWorldPos.distanceTo(_obsWorldPos);

                    // Bunnies that are not slowing-down-able hop off into the
                    // forest while the train is still half a segment away and
                    // below 10 mph, then despawn 5s later.
                    if (obs.type === "bunny" && !obs.hopped && dist < 20) {
                      const mph = currentSpeed * 2.237;
                      if (mph < 10) {
                        obs.hopped = true;
                        obs.hit = true;
                        obs.mesh.getWorldQuaternion(_obsWorldQuat);
                        obs.mesh.parent.remove(obs.mesh);
                        rewardAndHopBunny(
                          obs.mesh,
                          _obsWorldPos,
                          _obsWorldQuat,
                        );
                        continue;
                      }
                    }

                    if (dist < 3.0) {
                      obs.hit = true;

                      // Striking a bunny that didn't hop is unforgivable: launch
                      // it with physics so the bounce is visible, then half a
                      // second later cut to the verdict.
                      if (obs.type === "bunny") {
                        obs.mesh.getWorldQuaternion(_obsWorldQuat);
                        obs.mesh.parent.remove(obs.mesh);
                        launchStruckBunny(
                          obs.mesh,
                          _obsWorldPos,
                          _obsWorldQuat,
                          _fwdDir,
                          follower.speed,
                        );
                        setTimeout(triggerYouMonster, 500);
                        continue;
                      }

                      obs.mesh.getWorldQuaternion(_obsWorldQuat);

                      // Detach from segment and promote to world simulation
                      obs.mesh.parent.remove(obs.mesh);

                      // Giant Megalith Boulder shatters into smaller rocks on impact
                      if (obs.type === "giant-boulder") {
                        const impactMph = currentSpeed * 2.237;
                        const rollThreshold = megalithRollThreshold();

                        // Low-speed hit: roll the megalith off to the side (free of
                        // money, but a heavy 90% speed bleed) instead of exploding.
                        if (impactMph <= rollThreshold) {
                          rollMegalithAside(
                            obs.mesh,
                            _obsWorldPos,
                            _obsWorldQuat,
                            _fwdDir,
                            follower.speed,
                          );
                          currentSpeed = Math.max(0, currentSpeed * 0.1);
                          screenShake = Math.min(1.4, screenShake + 0.5);
                          follower.speed = currentSpeed;
                          continue;
                        }

                        // Cowcatcher impacts cost money (tiered discount), shown
                        // as a red "-$X" at screen center. Dynamite blows are free.
                        const cost = megalithDamage();
                        money -= cost;
                        moneyCounter.setValue(money);
                        spawnDamageSign(cost);

                        shatterMegalith(
                          _obsWorldPos,
                          _fwdDir,
                          follower.speed * 0.5,
                        );

                        // Above the threshold the megalith explodes; only 50% speed bleed.
                        currentSpeed = Math.max(0, currentSpeed * 0.5);
                        screenShake = Math.min(1.4, screenShake + 1.2);
                        follower.speed = currentSpeed;
                        continue;
                      }

                      simulation.scene.add(obs.mesh);
                      obs.mesh.position.copy(_obsWorldPos);
                      obs.mesh.quaternion.copy(_obsWorldQuat);

                      // Knock a tiny rock aside with Golden Rocks active: turn it
                      // golden (clone so other rocks stay gray).
                      if (obs.type === "tiny-rock" && goldenRocks) {
                        obs.mesh.material = sharedTinyMat.clone();
                        obs.mesh.material.color.set(0xffc940);
                      } else if (obs.type === "boulder" && goldenBoulders) {
                        obs.mesh.material = sharedBoulderMat.clone();
                        obs.mesh.material.color.set(0xffc940);
                      }

                      let body;
                      if (obs.type === "log") {
                        body = new CANNON.Body({
                          mass: 400,
                          shape: new CANNON.Box(
                            new CANNON.Vec3(obs.logLen / 2, 0.4, 0.4),
                          ),
                        });
                      } else if (obs.type === "tiny-rock") {
                        body = new CANNON.Body({
                          mass: 30,
                          shape: new CANNON.Sphere(0.3),
                          linearDamping: 0.2,
                          angularDamping: 0.3,
                        });
                      } else {
                        body = new CANNON.Body({
                          mass: 1200,
                          shape: new CANNON.Sphere(0.95),
                        });
                      }
                      body.position.set(
                        _obsWorldPos.x,
                        _obsWorldPos.y,
                        _obsWorldPos.z,
                      );
                      body.quaternion.set(
                        _obsWorldQuat.x,
                        _obsWorldQuat.y,
                        _obsWorldQuat.z,
                        _obsWorldQuat.w,
                      );

                      // Impulse scaled to obstacle mass & inertia
                      {
                        const lateralSide =
                          (Math.random() < 0.5 ? 1 : -1) *
                          (follower.speed * 0.4 + Math.random() * 8);
                        const hitSpeed = follower.speed * 0.9;
                        body.velocity.set(
                          _fwdDir.x * hitSpeed + _fwdDir.z * lateralSide,
                          follower.speed * 0.3 + 2 + Math.random() * 3,
                          _fwdDir.z * hitSpeed - _fwdDir.x * lateralSide,
                        );
                        body.angularVelocity.set(
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                          (Math.random() - 0.5) * 15,
                        );
                      }

                      // Subtract velocity commensurate with obstacle mass & apply impact feedback
                      if (COWCATCHER_DEFENSE_IDS.has("wedge-plow")) {
                        // Wedge plow: branch, boulder, and rock are knocked aside with
                        // no speed bleed — just a light rattle for feedback.
                        screenShake = Math.min(0.15, screenShake + 0.08);
                      } else if (obs.type === "log") {
                        applyImpact(
                          Math.max(5.0, currentSpeed * 0.22),
                          0.22,
                          0.35,
                        );
                      } else if (obs.type === "tiny-rock") {
                        // Tiny rocks: negligible impact, just a small rattle
                        applyImpact(
                          Math.max(0.4, currentSpeed * 0.05),
                          0.08,
                          0.15,
                        );
                        // Golden Rocks: each tiny rock knocked aside is worth $1
                        if (goldenRocks) {
                          money += 1;
                          moneyCounter.setValue(money);
                          powerups.refresh();
                          spawnMoneySign();
                        }
                      } else if (obs.type === "boulder") {
                        applyImpact(
                          Math.max(14.0, currentSpeed * 0.45),
                          0.55,
                          0.75,
                        );
                        // Golden Boulders: each (non-megalith) boulder is worth $5
                        if (goldenBoulders) {
                          money += 5;
                          moneyCounter.setValue(money);
                          powerups.refresh();
                          spawnMoneySign();
                        }
                      }
                      follower.speed = currentSpeed;

                      sim.world.addBody(body);
                      activeFlyers.add({
                        mesh: obs.mesh,
                        body,
                        lifetime: 2.8,
                      });
                    }
                  }
                }
              }
            }
          }

          // Center ground beneath the train
          if (ground?.mesh) {
            ground.mesh.position.x = entity.mesh.position.x;
            ground.mesh.position.z = entity.mesh.position.z;
          }

          // Update camera pose. Space swaps to the reverse rig: a camera mounted
          // in front of the train that looks back down its length to frame the
          // whole train. Holding 'C' drops the camera inside the cab looking forward.
          const isCabView = keys.has("KeyC");
          if (isCabView) {
            _cabCamPos.set(1.4, 2.7, 0.4).applyMatrix4(entity.mesh.matrixWorld);
            _cabCamLook.set(7.0, 2.1, 0).applyMatrix4(entity.mesh.matrixWorld);
            simulation.camera.position.copy(_cabCamPos);
            simulation.camera.lookAt(_cabCamLook);
          } else if (isRearView) {
            _rearCamPos.set(7.5, 4.8, 0).applyMatrix4(entity.mesh.matrixWorld);
            _rearCamLook.set(1.6, 1.9, 0).applyMatrix4(entity.mesh.matrixWorld);
            simulation.camera.position.copy(_rearCamPos);
            simulation.camera.lookAt(_rearCamLook);
          } else {
            camCtrl.update({ mirror: false });
          }

          // FOV scales exponentially with speed: 60° at rest → 80° at 250 mph
          const fovBase = camCtrl.state.fov;
          const speedRatio = Math.min(1, Math.max(0, speedMph / 250));
          simulation.camera.fov = fovBase * Math.pow(80 / fovBase, speedRatio);
          simulation.camera.updateProjectionMatrix();

          // Dynamic fog adjustment: bring fog closer in rear view to hide limited rear draw distance
          const targetFogNear = isRearView ? 15 : 50;
          const targetFogFar = isRearView ? 95 : 220;
          simulation.scene.fog.near +=
            (targetFogNear - simulation.scene.fog.near) * Math.min(1, dt * 10);
          simulation.scene.fog.far +=
            (targetFogFar - simulation.scene.fog.far) * Math.min(1, dt * 10);

          // Impact screen shake
          if (screenShake > 0.001) {
            simulation.camera.position.x += (Math.random() - 0.5) * screenShake;
            simulation.camera.position.y += (Math.random() - 0.5) * screenShake;
            screenShake *= Math.exp(-dt * 9.0);
          }

          // Master-controller lever: pinned to bottom-right of the screen
          const camQuat = simulation.camera.quaternion;
          const vRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camQuat);
          const vUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camQuat);
          const vFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);

          const leverDist = 7;
          const halfH =
            Math.tan((simulation.camera.fov * Math.PI) / 360) * leverDist;
          const halfW = halfH * simulation.camera.aspect;
          const nx = 0.73;
          const ny = -0.6;

          lever.position
            .copy(simulation.camera.position)
            .addScaledVector(vFwd, leverDist)
            .addScaledVector(vRight, nx * halfW)
            .addScaledVector(vUp, ny * halfH);
          lever.scale.setScalar(1.1);
          lever.lookAt(simulation.camera.position);
          lever.updateMatrixWorld(true);

          // Hide the accel lever in reverse and cab views
          lever.visible = !isRearView && !isCabView;
          if (lever.visible) {
            // Tilt toward/away from the user based on throttle input.
            let targetLever = 0;
            if (keys.has("KeyW") || keys.has("ArrowUp"))
              targetLever = -0.7; // into screen (away from user)
            else targetLever = 0.7; // toward user (decelerating)
            leverAngle += (targetLever - leverAngle) * Math.min(1, dt * 8);
            lever.userData.pivot.rotation.x = leverAngle;
          }
        };

        // Initial camera pose
        camCtrl.update({ mirror: false });
      }

      // Run
      setup(sim);
      sim.start();
    </script>
  </body>
</html>
