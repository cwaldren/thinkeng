<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinkeng Games</title>
    <style>
      body {
        margin: 0;
        background: #111116;
        color: #fff;
        font-family: sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        text-align: center;
        padding: 56px 24px 32px;
      }

      header h1 {
        margin: 0;
        font-size: 2.4rem;
        letter-spacing: 0.02em;
      }

      header p {
        margin: 10px 0 0;
        font-size: 1rem;
        opacity: 0.55;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
        width: min(960px, 90vw);
        padding-bottom: 56px;
      }

      .card {
        display: block;
        text-decoration: none;
        color: #fff;
        background: #1a1a20;
        border: 1px solid #2a2a33;
        border-radius: 12px;
        padding: 24px;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: #4caf50;
        background: #20202a;
      }

      .card h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }

      .card p {
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.65;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Thinkeng Games</h1>
      <p>Pick a game to play</p>
    </header>

    <main class="grid">
      <!--
        Add new games here. Copy the card block below and update
        the href (games/<game-slug>.html), title, and description.
      -->
      <a class="card" href="primitives.html">
        <h2>Primitives Gallery</h2>
        <p>Browse and tweak the engine's primitives (box, sphere, cylinder, ground, player).</p>
      </a>
    </main>
  </body>
</html>
